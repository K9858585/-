<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OKX 多头猎手 (Top 3)</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { background: var(--panel); padding: 10px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; gap: 10px; }
        .top-controls { display: flex; gap: 8px; width: 100%; align-items: center; }
        .search-box { display: flex; flex: 1; gap: 5px; }
        .search-box input { flex: 1; background: #2a2e39; border: 1px solid #363a45; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px; text-transform: uppercase; outline: none; }
        .search-box button { background: var(--blue); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .scan-btn { background: linear-gradient(135deg, #0ecb81, #00b8d4); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; box-shadow: 0 0 10px rgba(14,203,129,0.4);}
        
        /* 做多前三名展示区 */
        #long-area { display: none; flex-direction: column; gap: 8px; padding-top: 5px; }
        .rank-row { display: flex; gap: 8px; }
        .long-card { flex: 1; padding: 8px; border-radius: 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(14,203,129,0.08); border: 1px solid var(--up); transition: 0.2s;}
        .long-card:active { background: rgba(14,203,129,0.2); }
        .long-title { font-size: 10px; color: #fff; }
        .long-coin { font-size: 15px; font-weight: 900; color: var(--up); }
        .long-score { font-size: 10px; color: var(--sub); }

        #coinList { display: none; flex-wrap: wrap; gap: 8px; max-height: 120px; overflow-y: auto; }
        .coin-tag { padding: 6px 10px; background: #2a2e39; border-radius: 4px; font-size: 13px; font-weight: bold; color: var(--sub); cursor: pointer; border: 1px solid transparent;}
        .coin-tag.active { background: rgba(41, 98, 255, 0.1); border-color: var(--blue); color: var(--blue); }

        #time-bar { display: flex; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid #2a2e39; gap: 5px; overflow-x: auto; }
        .time-btn { background: transparent; border: none; color: var(--sub); padding: 6px 12px; font-size: 13px; font-weight: bold; border-radius: 4px; }
        .time-btn.active { background: #2a2e39; color: #fff; }
        
        #price-bar { padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        #currentCoinName { font-size: 18px; font-weight: 900; color: #fff; }
        #currentPrice { font-size: 32px; font-weight: 900; color: var(--up); font-family: monospace; }
        .right-info { display: flex; flex-direction: column; align-items: flex-end; margin-left: auto; }
        #status-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #fcd535; color: #000; font-weight: bold;}
        
        #ai-panel { background: #1a1f2b; display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #2a2e39; gap: 5px; }
        .period-row { display: flex; flex-direction: column; align-items: center; background: #22262f; padding: 6px; border-radius: 6px; flex: 1; }
        .period-name { font-size: 11px; color: var(--sub); font-weight: bold; }
        .period-signal { font-size: 14px; font-weight: bold; margin-top: 4px; }
        .sig-long { color: var(--up); } .sig-short { color: var(--down); } .sig-neutral { color: var(--yellow); }

        #chart-container { flex: 1; min-height: 200px; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #analysis-panel { height: 28vh; background: var(--panel); padding: 15px; overflow-y: auto; flex-shrink: 0; border-top: 1px solid #2a2e39; }
        .analysis-header { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 8px; }
        #analysis-text { font-size: 13px; line-height: 1.6; color: #b2b5be; text-align: justify; }

        #scanner-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .scanner-box { background: var(--panel); border-radius: 12px; width: 100%; max-width: 350px; padding: 20px; border: 1px solid #363a45; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .scan-loading { color: var(--up); font-weight: bold; font-size: 14px; line-height: 1.5;}
    </style>
</head>
<body>

    <div id="scanner-modal">
        <div class="scanner-box">
            <div class="scan-loading" id="scan-status">正在全市场寻找最强多头...</div>
        </div>
    </div>

    <div id="top-bar">
        <div class="top-controls">
            <div class="search-box">
                <input type="text" id="coinInput" placeholder="如 BTC" onkeydown="if(event.key==='Enter') addCoin()">
                <button onclick="addCoin()">+</button>
            </div>
            <button class="scan-btn" onclick="runScanner()">🚀 寻找多头</button>
            <button onclick="toggleView()" style="background:#363a45; color:#fff; border:none; padding:8px; border-radius:4px;">▼</button>
        </div>
        
        <!-- 做多前三名卡片 -->
        <div id="long-area">
            <div class="rank-row">
                <div class="long-card" id="card-1" onclick="switchCoin(document.getElementById('coin-1').innerText)">
                    <div class="long-title">🥇 最佳做多</div>
                    <div class="long-coin" id="coin-1">--</div>
                    <div class="long-score" id="score-1">--</div>
                </div>
                <div class="long-card" id="card-2" onclick="switchCoin(document.getElementById('coin-2').innerText)">
                    <div class="long-title">🥈 潜力做多</div>
                    <div class="long-coin" id="coin-2">--</div>
                    <div class="long-score" id="score-2">--</div>
                </div>
                <div class="long-card" id="card-3" onclick="switchCoin(document.getElementById('coin-3').innerText)">
                    <div class="long-title">🥉 备选做多</div>
                    <div class="long-coin" id="coin-3">--</div>
                    <div class="long-score" id="score-3">--</div>
                </div>
            </div>
        </div>
        
        <div id="coinList"></div>
    </div>

    <div id="time-bar">
        <button class="time-btn" data-tf="15m" onclick="switchTimeframe('15m')">15分</button>
        <button class="time-btn active" data-tf="1H" onclick="switchTimeframe('1H')">1小时</button>
        <button class="time-btn" data-tf="4H" onclick="switchTimeframe('4H')">4小时</button>
        <button class="time-btn" data-tf="1D" onclick="switchTimeframe('1D')">日线</button>
    </div>

    <div id="price-bar">
        <span id="currentCoinName">--</span>
        <span id="currentPrice">--</span>
        <div class="right-info"><span id="status-tag">加载中...</span></div>
    </div>

    <div id="ai-panel">
        <div class="period-row"><div class="period-name">30分</div><div class="period-signal sig-neutral" id="sig-30m">观望</div></div>
        <div class="period-row"><div class="period-name">1小时</div><div class="period-signal sig-neutral" id="sig-1h">观望</div></div>
        <div class="period-row"><div class="period-name">4小时</div><div class="period-signal sig-neutral" id="sig-4h">观望</div></div>
        <div class="period-row"><div class="period-name">1日</div><div class="period-signal sig-neutral" id="sig-1d">观望</div></div>
    </div>

    <div id="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>

    <div id="analysis-panel">
        <div class="analysis-header">🎯 多头猎手解析</div>
        <div id="analysis-text">等待数据...</div>
    </div>

<script>
    // 抓取结果存储
    let scanResults = JSON.parse(localStorage.getItem('okx_long_top3')) || null; 
    let coinList = JSON.parse(localStorage.getItem('okx_coins')) || ['BTC-USDT-SWAP', 'ETH-USDT-SWAP'];
    
    // 默认选中第一名
    let currentCoin = scanResults ? scanResults[0].instId : coinList[0];
    let currentTf = '1H'; 
    let klineData = [], ema20 = [], ema50 = [], bollUp = [], bollDown = [];
    let ws = null;
    let currentSignals = { '30m': 50, '1h': 50, '4h': 50, '1d': 50 };

    window.toggleView = function() {
        let isScan = document.getElementById('long-area').style.display === 'flex';
        document.getElementById('long-area').style.display = isScan ? 'none' : 'flex';
        document.getElementById('coinList').style.display = isScan ? 'flex' : 'none';
    }

    window.addCoin = function() {
        let val = document.getElementById('coinInput').value.trim().toUpperCase();
        if(!val) return;
        val = val.replace('-USDT', '') + '-USDT-SWAP';
        if(coinList.includes(val)) return alert('已存在');
        fetch(`https://www.okx.com/api/v5/market/candles?instId=${val}&bar=1m&limit=1`).then(res=>res.json()).then(res=>{
            if(res.code === '0') {
                coinList.push(val); localStorage.setItem('okx_coins', JSON.stringify(coinList));
                document.getElementById('coinInput').value = ''; renderList(); switchCoin(val);
            } else alert('合约不存在');
        }).catch(()=>alert('网络错误'));
    }

    function renderList() {
        document.getElementById('coinList').innerHTML = coinList.map(c => `
            <div class="coin-tag ${c===currentCoin?'active':''}" onclick="switchCoin('${c}')">
                ${c.replace('-USDT-SWAP','')}
            </div>
        `).join('');
        
        if(scanResults) {
            for(let i=0; i<3; i++) {
                if(scanResults[i]) {
                    document.getElementById(`coin-${i+1}`).innerText = scanResults[i].instId.replace('-USDT-SWAP','');
                    document.getElementById(`score-${i+1}`).innerText = '得分: ' + scanResults[i].score;
                } else {
                    document.getElementById(`coin-${i+1}`).innerText = '--';
                    document.getElementById(`score-${i+1}`).innerText = '--';
                }
            }
        }
        document.getElementById('currentCoinName').innerText = currentCoin.replace('-USDT-SWAP','');
    }

    window.switchCoin = function(name) { 
        if(name === '--') return;
        let fullName = name.includes('-SWAP') ? name : name + '-USDT-SWAP';
        if(currentCoin !== fullName) { currentCoin = fullName; renderList(); loadData(); } 
    }
    
    window.switchTimeframe = function(tf) {
        currentTf = tf;
        document.querySelectorAll('.time-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tf === tf));
        loadData();
    }

    function loadData() {
        if(ws) ws.close();
        document.getElementById('status-tag').innerText = '加载中...';
        document.getElementById('status-tag').style.background = 'var(--yellow)';
        document.getElementById('analysis-text').innerText = '正在计算多周期共振数据...';
        
        let t = setTimeout(() => { document.getElementById('status-tag').innerText = '超时'; document.getElementById('status-tag').style.background = 'var(--down)'; }, 3000);

        fetch(`https://www.okx.com/api/v5/market/candles?instId=${currentCoin}&bar=${currentTf}&limit=150`)
            .then(res => res.json())
            .then(res => {
                clearTimeout(t);
                if(res.code !== '0') throw new Error('API错误');
                klineData = res.data.reverse().map(d => ({ t: parseInt(d[0])/1000, o: +d[1], h: +d[2], l: +d[3], c: +d[4] }));
                document.getElementById('status-tag').innerText = '✅ 实时';
                document.getElementById('status-tag').style.background = 'var(--up)';
                calculateAndDraw();
                connectWS();
            })
            .catch(err => {
                clearTimeout(t);
                document.getElementById('status-tag').innerText = '❌ 失败';
                document.getElementById('status-tag').style.background = 'var(--down)';
            });
    }

    function connectWS() {
        ws = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
        ws.onopen = () => ws.send(JSON.stringify({ "op": "subscribe", "args": [{ "channel": `candle${currentTf}`, "instId": currentCoin }] }));
        ws.onmessage = (e) => {
            let msg = JSON.parse(e.data);
            if(msg.data) {
                let k = msg.data[0];
                let newC = { t: parseInt(k[0])/1000, o: +k[1], h: +k[2], l: +k[3], c: +k[4] };
                let last = klineData[klineData.length-1];
                if(last.t === newC.t) klineData[klineData.length-1] = newC;
                else klineData.push(newC);
                calculateAndDraw();
            }
        }
    }

    function calculateAndDraw() {
        if(!klineData.length) return;
        let closes = klineData.map(d => d.c);
        document.getElementById('currentPrice').innerText = closes[closes.length-1];

        ema20 = calcEMA(closes, 20);
        ema50 = calcEMA(closes, 50);
        let boll = calcBOLL(closes, 20);
        bollUp = boll.up; bollDown = boll.dn;

        try { drawChart(); } catch(e) {}
        
        checkMultiSignals();
    }

    function drawChart() {
        const canvas = document.getElementById('chartCanvas'); const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        const w = canvas.clientWidth, h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);

        let validHighs = klineData.map(d => d.h).concat(bollUp.filter(v => !isNaN(v)));
        let validLows = klineData.map(d => d.l).concat(bollDown.filter(v => !isNaN(v)));
        let max = Math.max(...validHighs), min = Math.min(...validLows);
        if(isNaN(max) || isNaN(min)) return;
        
        let range = max - min || 1; let cw = w / klineData.length;

        klineData.forEach((d, i) => {
            let x = i * cw;
            let yH = h - ((d.h - min) / range) * h;
            let yL = h - ((d.l - min) / range) * h;
            let yO = h - ((d.o - min) / range) * h;
            let yC = h - ((d.c - min) / range) * h;
            ctx.strokeStyle = d.c >= d.o ? '#0ecb81' : '#f6465d';
            ctx.beginPath(); ctx.moveTo(x + cw/2, yH); ctx.lineTo(x + cw/2, yL); ctx.stroke();
            ctx.fillStyle = d.c >= d.o ? '#0ecb81' : '#f6465d';
            ctx.fillRect(x + cw*0.2, Math.min(yO, yC), cw*0.6, Math.max(Math.abs(yO-yC), 1));
        });

        const drawL = (data, color) => {
            ctx.strokeStyle = color; ctx.beginPath();
            data.forEach((val, i) => {
                if(isNaN(val)) return;
                let x = i * cw + cw/2; let y = h - ((val - min) / range) * h;
                if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }); ctx.stroke();
        }
        drawL(ema20, '#fcd535'); drawL(ema50, '#e056fd');
    }

    function checkMultiSignals() {
        let periods = [['30m','sig-30m', '30m'], ['1h','sig-1h', '1h'], ['4h','sig-4h', '4h'], ['1d','sig-1d', '1d']];
        let finishedCount = 0;
        let results = {};

        periods.forEach((p, index) => {
            setTimeout(() => {
                fetch(`https://www.okx.com/api/v5/market/candles?instId=${currentCoin}&bar=${p[0]}&limit=100`)
                    .then(r=>r.json()).then(r=>{
                        if(r.code === '0' && r.data.length > 50) {
                            let d = r.data.reverse().map(x => ({ c:+x[4], h:+x[2], l:+x[3] }));
                            let closes = d.map(x => x.c);
                            let e20 = calcEMA(closes, 20);
                            let macd = calcMACD(closes);
                            let score = 50;
                            if(closes[closes.length-1] > e20[e20.length-1]) score += 20; else score -= 20;
                            if(macd[macd.length-1] > 0) score += 20; else score -= 20;
                            
                            results[p[2]] = { score, closes, e20, macd };
                            currentSignals[p[2]] = score;
                            
                            let el = document.getElementById(p[1]);
                            if(score >= 65) { el.innerText = '做多'; el.className = 'period-signal sig-long'; }
                            else if(score <= 35) { el.innerText = '做空'; el.className = 'period-signal sig-short'; }
                            else { el.innerText = '观望'; el.className = 'period-signal sig-neutral'; }
                        }
                        finishedCount++;
                        if(finishedCount === 4) generateStrictAnalysis(results);
                    }).catch(()=>{ finishedCount++; });
            }, index * 300); 
        });
    }

    function generateStrictAnalysis(res) {
        if(!res['1h'] || !res['1d']) return;
        
        let h1 = res['1h'], d1 = res['1d'];
        let h1Price = h1.closes[h1.closes.length-1];
        let h1Ema20 = h1.e20[h1.e20.length-1];
        let h1Macd = h1.macd[h1.macd.length-1];
        let d1Price = d1.closes[d1.closes.length-1];
        let d1Ema20 = d1.e20[d1.e20.length-1];
        
        let text = "";

        if(d1Price > d1Ema20 && h1Price > h1Ema20 && h1Macd > 0) {
            text = `🟢 <b>完美多头共振：</b><br>日线与1小时级别均站上EMA20均线，MACD多头放量。这是极高胜率的<b>右侧顺势做多</b>。<br><br>💡 <b>策略：</b>可逢低买入，务必带好止损（跌破1小时EMA20或前低）。`;
        } 
        else if(d1Price < d1Ema20 && h1Price > h1Ema20) {
            text = `⚠️ <b>空头反弹（危险）：</b><br>虽然1小时在涨，但日线大趋势被死死压制。这是典型的“诱多”，<b>追高容易被套</b>。建议观望。`;
        } 
        else if(d1Price > d1Ema20 && h1Price < h1Ema20) {
            text = `⚡ <b>多头回调（洗盘）：</b><br>日线看涨，但1小时正在回调。耐心等待1小时企稳（例如收出下影线或站回EMA20）再进场做多。`;
        } 
        else {
            text = `⚖️ <b>空头主导：</b><br>日线和1小时都在均线下方，坚决不碰多单，等待底部形态。`;
        }

        document.getElementById('analysis-text').innerHTML = text;
    }

    // === 核心引擎：全市场寻找 Top 3 做多 ===
    window.runScanner = async function() {
        document.getElementById('scanner-modal').style.display = 'flex';
        let status = document.getElementById('scan-status');
        status.innerText = "正在获取全市场合约...";

        try {
            let res = await fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP');
            let data = await res.json();
            let usdt = data.data.filter(t => t.instId.endsWith('-USDT-SWAP'));
            
            // 按24小时成交额排序，过滤掉没有流动性的垃圾币
            usdt.sort((a, b) => parseFloat(b.volCcy24h) - parseFloat(a.volCcy24h));
            // 取前 120 名扫描，兼顾速度与广度
            let top120 = usdt.slice(0, 120); 

            let longCandidates = [];

            for (let i = 0; i < top120.length; i++) {
                let instId = top120[i].instId;
                status.innerText = `深度计算：${instId.replace('-USDT-SWAP','')} (${i+1}/${top120.length})`;
                
                try {
                    // 抓取 1H 和 1D
                    let k1H = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=1H&limit=100`).then(r=>r.json());
                    // 加入极小延迟，防止被封
                    await new Promise(r => setTimeout(r, 80)); 
                    let k1D = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=1D&limit=100`).then(r=>r.json());

                    if(k1H.code === '0' && k1D.code === '0' && k1H.data.length > 80 && k1D.data.length > 50) {
                        let fmtH = k1H.data.reverse().map(d => ({ o:+d[1], c:+d[4], h:+d[2], l:+d[3], v:+d[5] }));
                        let fmtD = k1D.data.reverse().map(d => ({ c:+d[4] }));
                        
                        let score = longScore(fmtH, fmtD);
                        
                        // 只要分数达到 60 分以上，就加入候选
                        if(score !== null && score >= 60) {
                            longCandidates.push({ instId, score });
                        }
                    }
                } catch(e) {}
                await new Promise(r => setTimeout(r, 120)); 
            }

            if(longCandidates.length === 0) throw new Error("全市场都在震荡或下跌，今日无做多标的。管住手！");

            // 按分数降序，取前三
            longCandidates.sort((a, b) => b.score - a.score);
            let top3 = longCandidates.slice(0, 3);

            scanResults = top3;
            localStorage.setItem('okx_long_top3', JSON.stringify(scanResults));
            
            document.getElementById('scanner-modal').style.display = 'none';
            document.getElementById('long-area').style.display = 'flex';
            document.getElementById('coinList').style.display = 'none';
            renderList();
            
            // 默认切换到第一名
            if(top3[0]) switchCoin(top3[0].instId); 

        } catch (error) {
            status.innerText = error.message;
        }
    }

    // 做多打分算法 (极其严格)
    function longScore(data1H, data1D) {
        if(data1H.length < 80 || data1D.length < 50) return null;
        
        let c1H = data1H.map(d => d.c), c1D = data1D.map(d => d.c);
        let lastPrice = c1H[c1H.length-1];
        
        let ema20_1H = calcEMA(c1H, 20), ema20_1D = calcEMA(c1D, 20);
        let lastEma20_1H = ema20_1H[ema20_1H.length-1], lastEma20_1D = ema20_1D[ema20_1D.length-1];
        
        let macd1H = calcMACD(c1H);
        let lastMacd_1H = macd1H[macd1H.length-1];
        
        let rsi1H = calcRSI(c1H, 14);
        let lastRsi = rsi1H[rsi1H.length-1];

        // 形态过滤：防长上影线
        let curr = data1H[data1H.length-1];
        let body = Math.abs(curr.c - curr.o);
        let upperWick = curr.h - Math.max(curr.c, curr.o);
        let totalLength = curr.h - curr.l;

        // 1. 必须满足双周期多头
        if(lastPrice > lastEma20_1D && lastPrice > lastEma20_1H && lastMacd_1H > 0) {
            // 2. 不追极度超买 (RSI < 75)
            if(lastRsi > 75) return null;
            // 3. 防插针：如果当前 K 线上影线太长，说明抛压大，过滤
            if(totalLength > 0 && upperWick > totalLength * 0.6) return null;

            // 打分系统
            let score = 50;
            score += 20; // 均线多头
            score += 15; // MACD多头
            if(lastRsi > 50 && lastRsi < 70) score += 15; // RSI强势但未超买
            
            // 加分项：突破放量
            let vols = data1H.map(d => d.v);
            let lastVol = vols[vols.length-1], avgVol = vols.slice(-20).reduce((a,b)=>a+b,0)/20;
            if(lastVol > avgVol * 1.3) score += 10;
            
            return Math.min(100, score);
        }

        return null; // 逆势或震荡，直接淘汰
    }

    function calcEMA(prices, p) { let k=2/(p+1), e=[prices[0]], prev=prices[0]; for(let i=1;i<prices.length;i++){prev=prices[i]*k+prev*(1-k);e.push(prev);} return e; }
    function calcBOLL(prices, p) { let up=[],dn=[]; for(let i=0;i<prices.length;i++){let s=0,sq=0,st=Math.max(0,i-p+1),ct=i-st+1;for(let j=st;j<=i;j++){s+=prices[j];sq+=prices[j]*prices[j];}let m=s/ct,v=(sq/ct)-(m*m),sd=Math.sqrt(v);up.push(m+sd*2);dn.push(m-sd*2);} return {up,dn}; }
    function calcMACD(prices) { let e12=calcEMA(prices,12),e26=calcEMA(prices,26),m=e12.map((v,i)=>v-e26[i]),s=calcEMA(m,9);return m.map((v,i)=>v-s[i]); }
    function calcRSI(prices, period) { let gains=0,losses=0,rsi=[]; for(let i=1;i<prices.length;i++){let diff=prices[i]-prices[i-1]; if(diff>=0) gains+=diff; else losses-=diff; if(i===period){let ag=gains/period, al=losses/period; rsi.push(100-(100/(1+ag/al)));} else if(i>period){let diff2=prices[i]-prices[i-1]; let g=diff2>0?diff2:0; let l=diff2<0?-diff2:0; let lastRsi=rsi[rsi.length-1]; rsi.push(lastRsi + (100-lastRsi)*g/period - lastRsi*l/period);} else { rsi.push(50); }} return rsi; }
