<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OKX 1H 趋势狙击雷达</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { background: var(--panel); padding: 10px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; gap: 10px; }
        .top-controls { display: flex; gap: 8px; width: 100%; align-items: center; }
        .search-box { display: flex; flex: 1; gap: 5px; }
        .search-box input { flex: 1; background: #2a2e39; border: 1px solid #363a45; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px; text-transform: uppercase; outline: none; }
        .search-box button { background: var(--blue); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold; }
        
        .scan-btn { background: linear-gradient(135deg, #ff8a00, #e52e71); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; white-space: nowrap; box-shadow: 0 0 10px rgba(229,46,113,0.4); }
        
        .display-area { display: none; flex-direction: column; gap: 8px; padding-top: 5px; }
        .rank-row { display: flex; align-items: center; gap: 8px; }
        .rank-label { font-size: 12px; font-weight: bold; width: 50px; text-align: right; }
        .rank-label.long { color: var(--up); }
        .rank-label.short { color: var(--down); }
        .rank-items { display: flex; flex: 1; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .rank-items::-webkit-scrollbar { display: none; }
        
        .coin-tag { padding: 6px 10px; background: #2a2e39; border-radius: 4px; font-size: 13px; font-weight: bold; color: var(--sub); cursor: pointer; white-space: nowrap; border: 1px solid transparent; display: flex; align-items: center; gap: 6px; }
        .coin-tag.active { background: rgba(41, 98, 255, 0.1); border-color: var(--blue); color: var(--blue); }
        .coin-tag.rank-1 { background: rgba(252,213,53,0.1); border-color: var(--yellow); color: var(--yellow); }
        .coin-tag.rank-2 { background: rgba(132,142,156,0.1); border-color: #848e9c; color: #eaecef; }
        .coin-tag.rank-3 { background: rgba(205,127,50,0.1); border-color: #cd7f32; color: #cd7f32; }
        
        .del-btn { color: var(--sub); font-size: 16px; font-weight: bold; line-height: 1; padding: 0 2px; border-radius: 50%; margin-left: 4px;}
        .coin-icon { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; font-weight: bold; object-fit: cover; flex-shrink: 0; }
        #coinList { display: none; flex-wrap: wrap; gap: 8px; max-height: 120px; overflow-y: auto; }

        #time-bar { display: flex; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid #2a2e39; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        #time-bar::-webkit-scrollbar { display: none; }
        .time-btn { background: transparent; border: none; color: var(--sub); padding: 6px 12px; font-size: 13px; font-weight: bold; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .time-btn.active { background: #2a2e39; color: #fff; }
        
        #price-bar { padding: 10px 15px; display: flex; align-items: center; gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        #price-bar::-webkit-scrollbar { display: none; }
        #currentCoinName { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 0.5px; margin-right: 5px;}
        #currentPrice { font-size: 36px; font-weight: 900; color: var(--up); font-family: monospace; letter-spacing: -1px; line-height: 1; }
        .currency { font-size: 14px; color: var(--sub); font-family: -apple-system, sans-serif; margin-left: -5px;}
        
        .right-info { display: flex; flex-direction: column; align-items: flex-end; margin-left: auto; gap: 4px; }
        #realtime-clock { font-family: monospace; font-size: 14px; color: var(--yellow); font-weight: bold; }
        #status-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #fcd535; color: #000; transition: all 0.3s; font-weight: bold;}
        
        #ai-panel { background: #1a1f2b; display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #2a2e39; gap: 5px; }
        .period-row { display: flex; flex-direction: column; align-items: center; background: #22262f; padding: 6px 4px; border-radius: 6px; flex: 1; }
        .period-name { font-size: 11px; color: var(--sub); font-weight: bold; margin-bottom: 4px;}
        .period-signal { font-size: 14px; font-weight: bold; padding: 2px 0; border-radius: 4px; width: 100%; text-align: center; margin-bottom: 4px; }
        .period-conf { font-size: 10px; color: #fff; background: #363a45; padding: 1px 6px; border-radius: 10px; }
        .sig-long { color: var(--up); background: rgba(14,203,129,0.1); }
        .sig-short { color: var(--down); background: rgba(246,70,93,0.1); }
        .sig-neutral { color: var(--yellow); background: rgba(252,213,53,0.1); }

        #chart-container { flex: 1; min-height: 200px; position: relative; width: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; }
        #empty-tip { position: absolute; color: var(--down); font-size: 14px; font-weight: bold; z-index: 5; display: none; text-align: center; padding: 20px;}
        #indicator-bar { position: absolute; bottom: 5px; left: 10px; background: rgba(18, 22, 31, 0.8); padding: 4px 8px; border-radius: 4px; font-size: 10px; color: var(--sub); display: flex; flex-direction: column; gap: 2px; font-family: monospace; pointer-events: none; z-index: 6;}

        #analysis-panel { height: 30vh; background: var(--panel); padding: 15px; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; border-top: 1px solid #2a2e39; }
        .analysis-header { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .analysis-header::before { content: "🤖"; }
        #analysis-text { font-size: 13px; line-height: 1.6; color: #b2b5be; text-align: justify; }
        .highlight-up { color: var(--up); font-weight: bold; }
        .highlight-down { color: var(--down); font-weight: bold; }
        .highlight-neutral { color: var(--yellow); font-weight: bold; }
        .highlight-vol { color: #ff9800; font-weight: bold; }

        #scanner-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .scanner-box { background: var(--panel); border-radius: 12px; width: 100%; max-width: 400px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #363a45; }
        .scanner-header { padding: 15px; border-bottom: 1px solid #2a2e39; display: flex; justify-content: space-between; align-items: center; }
        .scanner-title { font-size: 16px; font-weight: bold; color: #fff; }
        .scanner-close { background: transparent; border: none; color: var(--sub); font-size: 20px; cursor: pointer; }
        .scanner-content { padding: 15px; overflow-y: auto; flex: 1; }
        .scan-loading { text-align: center; color: var(--yellow); font-weight: bold; padding: 20px; }
        .scan-tip { font-size: 12px; color: var(--sub); text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="scanner-modal">
        <div class="scanner-box">
            <div class="scanner-header">
                <div class="scanner-title">📡 1H 趋势狙击雷达</div>
                <button class="scanner-close" onclick="closeScanner()">×</button>
            </div>
            <div class="scanner-content" id="scanner-content">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <div id="top-bar">
        <div class="top-controls">
            <div class="search-box">
                <input type="text" id="coinInput" placeholder="输入合约，如 BTC" onkeydown="if(event.key==='Enter') addCoin()">
                <button onclick="addCoin()">+</button>
            </div>
            <button class="scan-btn" onclick="runScanner()">📡 雷达扫描</button>
            <button class="toggle-btn" id="toggleBtn" onclick="toggleDisplayArea()" style="background:#363a45; color:#fff; border:none; padding:8px 12px; border-radius:4px; font-size:12px; font-weight:bold;">▼ 自选</button>
        </div>
        
        <div class="display-area" id="scanArea" style="display: none;">
            <div class="rank-row">
                <div class="rank-label long">做多榜</div>
                <div class="rank-items" id="rank-longs"></div>
            </div>
            <div class="rank-row">
                <div class="rank-label short">做空榜</div>
                <div class="rank-items" id="rank-shorts"></div>
            </div>
        </div>
        <div id="coinList"></div>
    </div>

    <div id="time-bar">
        <button class="time-btn" data-tf="5m" onclick="switchTimeframe('5m')">5分</button>
        <button class="time-btn active" data-tf="15m" onclick="switchTimeframe('15m')">15分</button>
        <button class="time-btn" data-tf="30m" onclick="switchTimeframe('30m')">30分</button>
        <button class="time-btn" data-tf="1H" onclick="switchTimeframe('1H')">1小时</button>
        <button class="time-btn" data-tf="4H" onclick="switchTimeframe('4H')">4小时</button>
        <button class="time-btn" data-tf="1D" onclick="switchTimeframe('1D')">日线</button>
    </div>

    <div id="price-bar">
        <span id="currentCoinName">--</span>
        <span id="currentPrice">--</span><span class="currency">USDT</span>
        <div class="right-info">
            <span id="realtime-clock">--:--:--</span>
            <span id="status-tag">加载中...</span>
        </div>
    </div>

    <div id="ai-panel">
        <div class="period-row"><div class="period-name">30分</div><div class="period-signal sig-neutral" id="sig-30m">观望</div><div class="period-conf" id="conf-30m">50%</div></div>
        <div class="period-row"><div class="period-name">1小时</div><div class="period-signal sig-neutral" id="sig-1h">观望</div><div class="period-conf" id="conf-1h">50%</div></div>
        <div class="period-row"><div class="period-name">4小时</div><div class="period-signal sig-neutral" id="sig-4h">观望</div><div class="period-conf" id="conf-4h">50%</div></div>
        <div class="period-row"><div class="period-name">1日</div><div class="period-signal sig-neutral" id="sig-1d">观望</div><div class="period-conf" id="conf-1d">50%</div></div>
    </div>

    <div id="chart-container">
        <div id="empty-tip">❌ 该永续合约不存在或网络异常</div>
        <canvas id="chartCanvas"></canvas>
        <div id="indicator-bar">
            <span>EMA20: <span id="valEma20" style="color:#fcd535;">--</span> | EMA50: <span id="valEma50" style="color:#e056fd;">--</span> | EMA100: <span id="valEma100" style="color:#2962ff;">--</span></span>
            <span>BOLL: <span id="valBoll" style="color:#2962ff;">--</span></span>
            <span>MACD: <span id="valMacd" style="color:#0ecb81;">--</span></span>
        </div>
    </div>

    <div id="analysis-panel">
        <div class="analysis-header">AI 深度盘面解析</div>
        <div id="analysis-text">等待数据加载...</div>
    </div>

<script>
    function updateClock() { document.getElementById('realtime-clock').innerText = new Date().toLocaleTimeString('zh-CN', { hour12: false }); }
    setInterval(updateClock, 1000); updateClock();

    function formatNum(num) {
        if(!num || isNaN(num)) return "--";
        let str = num.toFixed(8);
        return str.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    }

    function getCoinIconHtml(coinName) {
        const symbol = coinName.replace('-USDT-SWAP', '').toUpperCase();
        const lowerSymbol = symbol.toLowerCase();
        let hash = 0;
        for (let i = 0; i < symbol.length; i++) hash = symbol.charCodeAt(i) + ((hash << 5) - hash);
        const color = `hsl(${Math.abs(hash) % 360}, 70%, 50%)`;
        const src1 = `https://essamamdani.github.io/open-crypto-icons/icons/colored/${lowerSymbol}.svg`;
        return `<img src="${src1}" class="coin-icon" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';" alt="${symbol}"><span class="coin-icon" style="background: ${color}; display: none;">${symbol.charAt(0)}</span>`;
    }

    let coinList = JSON.parse(localStorage.getItem('okx_swap_coins')) || ['BTC-USDT-SWAP', 'ETH-USDT-SWAP', 'SOL-USDT-SWAP'];
    let scanResults = JSON.parse(localStorage.getItem('okx_scan_results')) || null; 
    let currentCoin = scanResults ? scanResults.longs[0].instId : coinList[0];
    let currentTf = '15m'; 
    let klineData = [], ema20Data = [], ema50Data = [], ema100Data = [], bollUpData = [], bollDownData = [];
    let ws = null;
    let currentSignals = { '30m': 50, '1h': 50, '4h': 50, '1d': 50 };
    let isHighVolume = false;
    let displayMode = 'scan';

    function updateCoinNameUI() { document.getElementById('currentCoinName').innerText = currentCoin.replace('-SWAP', ''); }

    window.toggleDisplayArea = function() {
        const btnEl = document.getElementById('toggleBtn');
        const scanArea = document.getElementById('scanArea');
        const listEl = document.getElementById('coinList');

        if(displayMode === 'scan') {
            displayMode = 'self';
            scanArea.style.display = 'none';
            listEl.style.display = 'flex';
            btnEl.innerText = '▼ 自选';
        } else {
            if(scanResults) {
                displayMode = 'scan';
                listEl.style.display = 'none';
                scanArea.style.display = 'flex';
                btnEl.innerText = '▼ 榜单';
            } else {
                listEl.style.display = 'none';
                btnEl.innerText = '▼ 收起';
            }
        }
    }

    function renderCoinList() {
        const listEl = document.getElementById('coinList');
        listEl.innerHTML = '';
        coinList.forEach(coin => {
            const div = document.createElement('div');
            div.className = `coin-tag ${coin === currentCoin ? 'active' : ''}`;
            div.innerHTML = `
                <div onclick="switchCoin('${coin}')" style="display:flex; align-items:center; gap:6px;">
                    ${getCoinIconHtml(coin)} <span>${coin.replace('-USDT-SWAP', '')}</span>
                </div>
                <span class="del-btn" onclick="removeCoin(event, '${coin}')">×</span>
            `;
            listEl.appendChild(div);
        });
        updateCoinNameUI(); 
    }

    function renderScanResults() {
        if(!scanResults) return;
        const longEl = document.getElementById('rank-longs');
        const shortEl = document.getElementById('rank-shorts');
        
        longEl.innerHTML = scanResults.longs.map((item, idx) => `
            <div class="coin-tag rank-${idx+1} ${item.instId === currentCoin ? 'active' : ''}" onclick="switchCoin('${item.instId}')">
                <span style="font-size:10px; margin-right:2px;">${idx+1}</span>
                ${getCoinIconHtml(item.instId)} <span>${item.instId.replace('-USDT-SWAP', '')}</span>
                <span style="font-size:11px; opacity:0.8; margin-left:4px;">${item.score}%</span>
            </div>
        `).join('');
        
        shortEl.innerHTML = scanResults.shorts.map((item, idx) => `
            <div class="coin-tag rank-${idx+1} ${item.instId === currentCoin ? 'active' : ''}" onclick="switchCoin('${item.instId}')">
                <span style="font-size:10px; margin-right:2px;">${idx+1}</span>
                ${getCoinIconHtml(item.instId)} <span>${item.instId.replace('-USDT-SWAP', '')}</span>
                <span style="font-size:11px; opacity:0.8; margin-left:4px;">${item.score}%</span>
            </div>
        `).join('');
    }

    window.addCoin = function() {
        let val = document.getElementById('coinInput').value.trim().toUpperCase();
        if(!val) return;
        val = val.replace(/\s+/g, '');
        if(val.includes('-USDT') && !val.includes('-SWAP')) val = val.replace('-USDT', '-USDT-SWAP');
        else if (!val.includes('-SWAP')) val = val + '-USDT-SWAP';

        if(coinList.includes(val)) { alert("该合约已在列表中！"); document.getElementById('coinInput').value = ''; return; }

        document.getElementById('coinInput').value = '验证中...';
        fetch(`https://www.okx.com/api/v5/market/candles?instId=${val}&bar=1m&limit=1`)
            .then(res => res.json())
            .then(res => {
                document.getElementById('coinInput').value = '';
                if(res.code === '0' && res.data && res.data.length > 0) {
                    coinList.push(val); localStorage.setItem('okx_swap_coins', JSON.stringify(coinList));
                    renderCoinList(); switchCoin(val);
                } else { alert(`❌ 欧易(OKX)没有找到 ${val} 这个永续合约！`); }
            })
            .catch(err => { document.getElementById('coinInput').value = ''; alert(`⚠️ 网络请求失败，无法验证。`); });
    }

    window.removeCoin = function(e, coin) {
        e.stopPropagation(); if(coinList.length <= 1) return alert("至少保留一个合约！");
        coinList = coinList.filter(c => c !== coin); localStorage.setItem('okx_swap_coins', JSON.stringify(coinList));
        if(currentCoin === coin) { currentCoin = coinList[0]; renderCoinList(); initData(); } else renderCoinList();
    }

    function switchCoin(coin) { 
        if(currentCoin === coin) return; 
        currentCoin = coin; 
        renderCoinList(); 
        renderScanResults();
        initData(); 
    }
    
    function switchTimeframe(tf) {
        if(currentTf === tf) return; currentTf = tf;
        document.querySelectorAll('.time-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tf === tf));
        initData();
    }

    function initData() {
        if(ws) { ws.close(); ws = null; }
        klineData = []; 
        document.getElementById('empty-tip').style.display = 'none';
        document.getElementById('status-tag').innerText = "连接中...";
        document.getElementById('status-tag').style.background = "var(--yellow)"; document.getElementById('status-tag').style.color = "#000";

        currentSignals = { '30m': 50, '1h': 50, '4h': 50, '1d': 50 };
        document.getElementById('analysis-text').innerText = "正在连接欧易合约服务器...";

        const url = `https://www.okx.com/api/v5/market/candles?instId=${currentCoin}&bar=${currentTf}&limit=200`;
        fetch(url).then(res => res.json()).then(res => {
            if(res.code !== '0' || !res.data) { handleLoadError(); return; }
            
            klineData = res.data.reverse().map(d => ({ time: parseInt(d[0])/1000, open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), vol: parseFloat(d[5]) }));
            processAndDraw();
            document.getElementById('status-tag').innerText = "✅ 实时合约"; document.getElementById('status-tag').style.background = "var(--up)"; document.getElementById('status-tag').style.color = "#fff";
            
            quickGenerateText();
            connectWebSocket(); 
            fetchMultiSignals();
        }).catch(err => { handleLoadError(); });
    }

    function handleLoadError() {
        document.getElementById('status-tag').innerText = "❌ 加载失败"; 
        document.getElementById('status-tag').style.background = "var(--down)"; document.getElementById('status-tag').style.color = "#fff";
        document.getElementById('currentPrice').innerText = "--";
        const canvas = document.getElementById('chartCanvas'); const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('empty-tip').style.display = 'block';
        document.getElementById('analysis-text').innerText = "合约不存在或网络断开，无法生成解析。";
    }

    function connectWebSocket() {
        ws = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
        ws.onopen = () => ws.send(JSON.stringify({ "op": "subscribe", "args": [{ "channel": `candle${currentTf}`, "instId": currentCoin }] }));
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if(msg.data && msg.arg && msg.arg.channel.startsWith('candle')) {
                const k = msg.data[0];
                const newCandle = { time: parseInt(k[0])/1000, open: parseFloat(k[1]), high: parseFloat(k[2]), low: parseFloat(k[3]), close: parseFloat(k[4]), vol: parseFloat(k[5]) };
                const lastIdx = klineData.length - 1;
                if(klineData[lastIdx] && klineData[lastIdx].time === newCandle.time) klineData[lastIdx] = newCandle;
                else { klineData.push(newCandle); if(klineData.length > 200) klineData.shift(); }
                processAndDraw();
            }
        };
    }

    function processAndDraw() {
        if(klineData.length === 0) return;
        const closes = klineData.map(d => d.close);
        document.getElementById('currentPrice').innerText = formatNum(closes[closes.length-1]);

        ema20Data = calcEMA(closes, 20); ema50Data = calcEMA(closes, 50); ema100Data = calcEMA(closes, 100);
        const boll = calcBOLL(closes, 20); bollUpData = boll.up; bollDownData = boll.down;
        const macd = calcMACD(closes);

        isHighVolume = false;
        if(klineData.length > 20) {
            let volData = klineData.map(d => d.vol || 0);
            let avgVol = volData.slice(-21, -1).reduce((a,b)=>a+b, 0) / 20;
            if(volData[volData.length - 1] > avgVol * 1.5) isHighVolume = true;
        }

        document.getElementById('valEma20').innerText = formatNum(ema20Data[ema20Data.length-1]);
        document.getElementById('valEma50').innerText = formatNum(ema50Data[ema50Data.length-1]);
        document.getElementById('valEma100').innerText = formatNum(ema100Data[ema100Data.length-1]);
        document.getElementById('valBoll').innerText = formatNum(bollUpData[bollUpData.length-1]) + ' / ' + formatNum(bollDownData[bollDownData.length-1]);
        document.getElementById('valMacd').innerText = formatNum(macd[macd.length-1]);
        drawChart();
    }

    function drawChart() {
        const canvas = document.getElementById('chartCanvas'); const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1; const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr); const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h); if(klineData.length === 0) return;

        let allHighs = klineData.map(d => d.high).concat(bollUpData, ema20Data, ema50Data, ema100Data);
        let allLows = klineData.map(d => d.low).concat(bollDownData, ema20Data, ema50Data, ema100Data);
        let max = Math.max(...allHighs), min = Math.min(...allLows); let range = max - min || 1; const cw = w / klineData.length;

        ctx.strokeStyle = '#2a2e39'; ctx.lineWidth = 1;
        for(let i=1; i<=4; i++) { let y = (h / 4) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        klineData.forEach((d, i) => {
            const x = i * cw, yH = h - ((d.high - min) / range) * h, yL = h - ((d.low - min) / range) * h, yO = h - ((d.open - min) / range) * h, yC = h - ((d.close - min) / range) * h;
            ctx.strokeStyle = d.close >= d.open ? '#0ecb81' : '#f6465d'; ctx.beginPath(); ctx.moveTo(x + cw/2, yH); ctx.lineTo(x + cw/2, yL); ctx.stroke();
            ctx.fillStyle = d.close >= d.open ? '#0ecb81' : '#f6465d'; const rectY = Math.min(yO, yC); const rectH = Math.max(Math.abs(yO - yC), 1.5);
            ctx.fillRect(x + cw*0.15, rectY, cw * 0.7, rectH);
        });

        const drawLine = (data, color, dashed = false) => {
            ctx.strokeStyle = color; ctx.lineWidth = 1.2; if(dashed) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
            ctx.beginPath(); data.forEach((val, i) => {
                if(val === null || isNaN(val)) return; const x = i * cw + cw/2, y = h - ((val - min) / range) * h;
                if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }); ctx.stroke(); ctx.setLineDash([]);
        };
        drawLine(ema20Data, '#fcd535'); drawLine(ema50Data, '#e056fd'); drawLine(ema100Data, '#2962ff');
        drawLine(bollUpData, 'rgba(132, 142, 156, 0.5)', true); drawLine(bollDownData, 'rgba(132, 142, 156, 0.5)', true);
    }

    function fetchMultiSignals() {
        const periods = ['30m', '1h', '4h', '1d'];
        periods.forEach(p => {
            fetch(`https://www.okx.com/api/v5/market/candles?instId=${currentCoin}&bar=${p}&limit=100`)
                .then(res => res.json()).then(res => {
                    if(res.code === '0' && res.data) calculateScore(res.data.reverse().map(d => ({ open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) })), p);
                    else updateSignal(p, 50);
                }).catch(() => updateSignal(p, 50));
        });
    }

    function calculateScore(data, periodTf) {
        if(data.length < 60) { updateSignal(periodTf, 50); return; }
        const closes = data.map(d => d.close); const currentPrice = closes[closes.length - 1];
        const ema20 = calcEMA(closes, 20), boll = calcBOLL(closes, 20), macd = calcMACD(closes), kdj = calcKDJ(data, 9, 3, 3);
        let score = 50;
        const lastEma = ema20[ema20.length-1], lastMacd = macd[macd.length-1], lastJ = kdj.J[kdj.J.length-1];
        const lastUp = boll.up[boll.up.length-1], lastDown = boll.down[boll.down.length-1];
        if(!isNaN(lastEma) && currentPrice > lastEma) score += 20; else score -= 20;
        if(!isNaN(lastMacd) && lastMacd > 0) score += 20; else score -= 20;
        if(!isNaN(lastDown) && currentPrice <= lastDown) score += 15; else if(!isNaN(lastUp) && currentPrice >= lastUp) score -= 15;
        if(!isNaN(lastJ) && lastJ < 20) score += 15; else if(!isNaN(lastJ) && lastJ > 80) score -= 15;
        updateSignal(periodTf, Math.max(0, Math.min(100, score)));
    }

    function updateSignal(tf, score) {
        currentSignals[tf] = score;
        const sigEl = document.getElementById(`sig-${tf}`), confEl = document.getElementById(`conf-${tf}`);
        if(!sigEl || !confEl) return;
        confEl.innerText = score + '%';
        if(score >= 65) { sigEl.innerText = "做多"; sigEl.className = "period-signal sig-long"; } 
        else if(score <= 35) { sigEl.innerText = "做空"; sigEl.className = "period-signal sig-short"; } 
        else { sigEl.innerText = "观望"; sigEl.className = "period-signal sig-neutral"; }
        generateAnalysisText();
    }

    function quickGenerateText() {
        document.getElementById('analysis-text').innerHTML = `📊 <b>初步研判：</b>当前${currentCoin.replace('-SWAP','')}永续合约数据已加载。正在极速核算多周期数据...`;
    }

    function generateAnalysisText() {
        const s30 = currentSignals['30m'], s1h = currentSignals['1h'], s4h = currentSignals['4h'], s1d = currentSignals['1d'];
        const textEl = document.getElementById('analysis-text');
        if(s30 === 50 && s1h === 50) return; 
        let trend = ""; let action = "";
        if (s1d >= 65) trend = "日线级别处于明显的多头趋势中";
        else if (s1d <= 35) trend = "日线级别整体呈现空头压制状态";
        else trend = "日线级别大趋势处于宽幅震荡整理阶段";

        if (s30 <= 35 && s1h <= 35 && s4h <= 35) { trend = "全周期呈现出极度弱势的共振下跌形态"; action = "操作建议：空头力量强劲，切勿盲目抄底。建议以反弹逢高做空为主。"; } 
        else if (s30 >= 65 && s1h >= 65 && s4h >= 65) { trend = "全周期呈现出极强的多头共振突破形态"; action = "操作建议：顺势而为，回踩任何短期支撑位都是较好的做多入场点。"; } 
        else if (s30 <= 35 && s4h >= 65) { trend = `当前${currentCoin}呈现出“短空长多”的格局`; action = "操作建议：通常是主力洗盘。短线可轻仓空，但更稳妥是等企稳后逢低做多。"; } 
        else if (s30 >= 65 && s4h <= 35) { trend = `当前${currentCoin}呈现出“短多长空”的格局`; action = "操作建议：警惕反弹诱多风险，建议以观望为主，或逢高做空。"; } 
        else { trend = `当前${currentCoin}多周期指标出现分歧，市场处于剧烈博弈的震荡市`; action = "操作建议：方向不明，极易被来回扫损。建议保持观望，高抛低吸。"; }

        let volText = isHighVolume ? `<span class="highlight-vol">当前伴有显著放量，趋势动能强劲。</span>` : "当前成交量相对温和。";
        let html = `📊 <b>行情研判：</b>${trend}。${volText}<br><br>`;
        html += `📈 <b>具体指标：</b>30分信号得分 <span class="${s30 >= 65 ? 'highlight-up' : (s30 <= 35 ? 'highlight-down' : 'highlight-neutral')}">${s30}%</span>，4小时信号得分 <span class="${s4h >= 65 ? 'highlight-up' : (s4h <= 35 ? 'highlight-down' : 'highlight-neutral')}">${s4h}%</span>。<br><br>`;
        html += `💡 <b>${action}</b>`;
        textEl.innerHTML = html;
    }

    window.closeScanner = function() { document.getElementById('scanner-modal').style.display = 'none'; }

    // === 雷达扫描核心逻辑 (前100名，过滤震荡，寻找1H最佳进场) ===
    window.runScanner = async function() {
        document.getElementById('scanner-modal').style.display = 'flex';
        const contentEl = document.getElementById('scanner-content');
        contentEl.innerHTML = `<div class="scan-loading">正在获取欧易全市场合约列表...</div>`;

        try {
            let res = await fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP');
            let data = await res.json();
            if(data.code !== '0') throw new Error("获取市场列表失败");

            let usdtTickers = data.data.filter(t => t.instId.endsWith('-USDT-SWAP'));
            usdtTickers.sort((a, b) => parseFloat(b.volCcy24h) - parseFloat(a.volCcy24h));
            let top100 = usdtTickers.slice(0, 100); 

            let results = [];

            for (let i = 0; i < top100.length; i++) {
                let instId = top100[i].instId;
                contentEl.innerHTML = `<div class="scan-loading">正在过滤震荡并狙击趋势：${instId.replace('-USDT-SWAP','')} (${i+1}/${top100.length})<br><br><span class="scan-tip">扫描高精度指标组合 (ADX/EMA/MACD)，请稍候...</span></div>`;
                
                try {
                    // 抓取200根 15m K线数据，用于计算往后1-2小时走势
                    let kRes = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=15m&limit=200`);
                    let kData = await kRes.json();
                    
                    if(kData.code === '0' && kData.data && kData.data.length > 100) {
                        let formatted = kData.data.reverse().map(d => ({ open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), vol: parseFloat(d[5]) }));
                        let score = trendSniperScore(formatted);
                        if(score !== null) results.push({ instId: instId, score: score }); // 如果ADX过滤了震荡，返回null，不加入榜单
                    }
                } catch(e) {}
                await new Promise(r => setTimeout(r, 80)); // 稍微快一点
            }

            if(results.length === 0) throw new Error("当前市场多为震荡，未发现极佳趋势标的。");

            results.sort((a, b) => b.score - a.score);
            
            let topLongs = results.slice(0, 3);
            let topShorts = [...results].reverse().slice(0, 3);

            scanResults = { longs: topLongs, shorts: topShorts };
            localStorage.setItem('okx_scan_results', JSON.stringify(scanResults));

            closeScanner();
            displayMode = 'self'; toggleDisplayArea(); 
            renderScanResults();

        } catch (error) {
            contentEl.innerHTML = `<div style="color:var(--down); text-align:center;">${error.message || '扫描失败，请检查网络/VPN'}</div>`;
        }
    }

    // === 核心策略：ADX 趋势过滤 + 1H 进场点位打分 ===
    function trendSniperScore(data) {
        if(data.length < 100) return null;
        const closes = data.map(d => d.close); const highs = data.map(d => d.high); const lows = data.map(d => d.low);
        const currentPrice = closes[closes.length - 1];
        
        const ema20 = calcEMA(closes, 20), ema50 = calcEMA(closes, 50), ema100 = calcEMA(closes, 100);
        const macd = calcMACD(closes);
        const adx = calcADX(highs, lows, closes, 14);
        
        const lastEma20 = ema20[ema20.length-1], lastEma50 = ema50[ema50.length-1], lastEma100 = ema100[ema100.length-1];
        const lastMacd = macd[macd.length-1];
        const lastAdx = adx[adx.length-1];

        // --- 1. 过滤震荡 (ADX < 22 判定为震荡) ---
        if(isNaN(lastAdx) || lastAdx < 22) return null; 

        let score = 50;
        
        // --- 2. 趋势排列判定 (主要决定方向) ---
        let isUpTrend = false, isDownTrend = false;
        if(currentPrice > lastEma20 && lastEma20 > lastEma50 && lastEma50 > lastEma100) isUpTrend = true;
        if(currentPrice < lastEma20 && lastEma20 < lastEma50 && lastEma50 < lastEma100) isDownTrend = true;

        // --- 3. 打分逻辑 (满分为100，分数越高越适合进场) ---
        if(isUpTrend) {
            score += 30; // 完美的多头排列
            if(lastMacd > 0) score += 20; // MACD 零轴上，动能强
            // 回踩不破判定 (价格离 EMA20 很近，最适合进场)
            let distToEma20 = (currentPrice - lastEma20) / lastEma20;
            if(distToEma20 > 0 && distToEma20 < 0.01) score += 20; 
            // ADX 强度加分
            if(lastAdx > 30) score += 15;
        } else if(isDownTrend) {
            score -= 30;
            if(lastMacd < 0) score -= 20;
            let distToEma20 = (lastEma20 - currentPrice) / lastEma20;
            if(distToEma20 > 0 && distToEma20 < 0.01) score -= 20; 
            if(lastAdx > 30) score -= 15;
        } else {
            // 虽然 ADX 高，但均线没有完美排列，属于趋势中继或反转，减分
            score += (currentPrice > lastEma20 ? 5 : -5); 
        }

        return Math.max(0, Math.min(100, score));
    }

    // --- 新增指标：ADX (平均趋向指标) ---
    function calcADX(highs, lows, closes, period) {
        let tr = [], plusDM = [], minusDM = [];
        for(let i=1; i<closes.length; i++) {
            let h = highs[i], l = lows[i], pc = closes[i-1];
            let t = Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc));
            tr.push(t);
            
            let upMove = h - highs[i-1];
            let downMove = lows[i-1] - l;
            let pDM = (upMove > downMove && upMove > 0) ? upMove : 0;
            let mDM = (downMove > upMove && downMove > 0) ? downMove : 0;
            plusDM.push(pDM); minusDM.push(mDM);
        }

        let smoothTR = calcEMA(tr, period);
        let smoothPlusDM = calcEMA(plusDM, period);
        let smoothMinusDM = calcEMA(minusDM, period);

        let dx = [];
        for(let i=0; i<smoothTR.length; i++) {
            if(smoothTR[i] === 0) { dx.push(0); continue; }
            let diPlus = 100 * (smoothPlusDM[i] / smoothTR[i]);
            let diMinus = 100 * (smoothMinusDM[i] / smoothTR[i]);
            let sum = diPlus + diMinus;
            let d = sum === 0 ? 0 : 100 * Math.abs(diPlus - diMinus) / sum;
            dx.push(d);
        }
        return calcEMA(dx, period);
    }

    function calcEMA(prices, period) { const k = 2 / (period + 1); let ema = [prices[0]]; let prev = prices[0]; for (let i = 1; i < prices.length; i++) { prev = prices[i] * k + prev * (1 - k); ema.push(prev); } return ema; }
    function calcBOLL(prices, period) { let up = [], down = []; for(let i=0; i<prices.length; i++) { let sum = 0, sqSum = 0, start = Math.max(0, i - period + 1), count = i - start + 1; for(let j=start; j<=i; j++) { sum += prices[j]; sqSum += prices[j]*prices[j]; } let mean = sum / count; let variance = (sqSum / count) - (mean * mean); let stdDev = Math.sqrt(variance); up.push(mean + stdDev * 2); down.push(mean - stdDev * 2); } return { up, down }; }
    function calcMACD(prices) { const ema12 = calcEMA(prices, 12), ema26 = calcEMA(prices, 26); let macdLine = ema12.map((v, i) => v - ema26[i]); const signalLine = calcEMA(macdLine, 9); return macdLine.map((v, i) => v - signalLine[i]); }
    function calcKDJ(data, n, m1, m2) { let K = [], D = [], J = [], prevK = 50, prevD = 50; for(let i=0; i<data.length; i++) { let start = Math.max(0, i - n + 1), highest = -Infinity, lowest = Infinity; for(let j=start; j<=i; j++) { if(data[j].high > highest) highest = data[j].high; if(data[j].low < lowest) lowest = data[j].low; } let rsv = (data[i].close - lowest) / (highest - lowest) * 100; if(isNaN(rsv)) rsv = 50; let curK = (2/3) * prevK + (1/3) * rsv; let curD = (2/3) * prevD + (1/3) * curK; let curJ = 3 * curK - 2 * curD; K.push(curK); D.push(curD); J.push(curJ); prevK = curK; prevD = curD; } return { K, D, J }; }

    window.addEventListener('resize', drawChart);
    
    window.onload = () => { 
        renderCoinList(); 
        if(scanResults) {
            displayMode = 'scan';
            document.getElementById('scanArea').style.display = 'flex';
            document.getElementById('coinList').style.display = 'none';
            document.getElementById('toggleBtn').innerText = '▼ 榜单';
            renderScanResults();
        } else {
            document.getElementById('coinList').style.display = 'flex';
        }
        initData(); 
    };
</script>
