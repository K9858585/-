
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OKX 智能实时看盘终端</title>
    <!-- 引入轻量级专业K线图库 TradingView -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c;
            --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff;
        }
        body {
            background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        /* 顶部币种栏 */
        #top-bar { background: var(--panel); padding: 8px 10px; border-bottom: 1px solid #2a2e39; display: flex; gap: 10px; align-items: center; }
        .add-coin-box { display: flex; gap: 5px; width: 180px; flex-shrink: 0; }
        .add-coin-box input { width: 100%; background: #2a2e39; border: 1px solid #363a45; color: #fff; padding: 6px; border-radius: 4px; outline: none; font-size: 13px; text-transform: uppercase; }
        .add-coin-box button { background: var(--blue); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .coin-list { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: none; }
        .coin-list::-webkit-scrollbar { display: none; }
        .coin-tag { 
            padding: 6px 12px; background: #2a2e39; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap;
            border: 1px solid transparent; display: flex; align-items: center; gap: 8px;
        }
        .coin-tag.active { background: rgba(41, 98, 255, 0.1); border-color: var(--blue); color: var(--blue); }
        .coin-tag .del-btn { color: var(--down); font-size: 16px; display: none; }
        .coin-tag.active .del-btn { display: block; }
        
        /* 时间周期栏 */
        #time-bar { display: flex; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid #2a2e39; gap: 5px; overflow-x: auto; }
        .time-btn { background: transparent; border: none; color: var(--sub); padding: 6px 12px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .time-btn.active { background: #2a2e39; color: #fff; }
        
        /* 价格显示 */
        #price-bar { padding: 10px 15px; font-size: 24px; font-weight: bold; color: #fff; font-family: monospace; }
        #price-bar span { font-size: 14px; color: var(--sub); margin-left: 10px; font-family: -apple-system, sans-serif;}
        
        /* K线图容器 */
        #chart-container { flex: 1; position: relative; width: 100%; min-height: 300px; }
        
        /* 智能预测悬浮面板 */
        #ai-panel {
            position: absolute; top: 10px; right: 10px; background: rgba(26, 31, 43, 0.95);
            border: 1px solid #363a45; border-radius: 12px; padding: 15px; z-index: 10; width: 170px;
            backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .ai-title { font-size: 12px; color: var(--sub); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .ai-signal { 
            font-size: 28px; font-weight: 900; text-align: center; padding: 10px 0; border-radius: 8px; 
            margin-bottom: 10px; letter-spacing: 2px; transition: all 0.3s;
        }
        .sig-long { color: var(--up); background: rgba(14,203,129,0.1); border: 1px solid var(--up); box-shadow: 0 0 20px rgba(14,203,129,0.3); }
        .sig-short { color: var(--down); background: rgba(246,70,93,0.1); border: 1px solid var(--down); box-shadow: 0 0 20px rgba(246,70,93,0.3); }
        .sig-neutral { color: var(--yellow); background: rgba(252,213,53,0.1); border: 1px solid var(--yellow); }
        
        .conf-label { font-size: 11px; color: var(--sub); display: flex; justify-content: space-between; margin-bottom: 4px; }
        .conf-bg { height: 6px; background: #2a2e39; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
        .conf-bar { height: 100%; width: 0%; transition: width 0.3s; }
        
        .indicator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; color: var(--sub); }
        .ind-val { display: block; color: #fff; font-size: 13px; font-weight: bold; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- 顶部币种栏 -->
    <div id="top-bar">
        <div class="add-coin-box">
            <input type="text" id="coinInput" placeholder="如 BTC-USDT" onkeydown="if(event.key==='Enter') addCoin()">
            <button onclick="addCoin()">+</button>
        </div>
        <div class="coin-list" id="coinList"></div>
    </div>

    <!-- 时间周期栏 -->
    <div id="time-bar">
        <button class="time-btn" data-tf="1s">1秒</button>
        <button class="time-btn active" data-tf="1m">1分</button>
        <button class="time-btn" data-tf="15m">15分</button>
        <button class="time-btn" data-tf="1H">1小时</button>
        <button class="time-btn" data-tf="1D">日线</button>
    </div>

    <!-- 最新价格 -->
    <div id="price-bar"><span id="currentPrice">0.00</span><span>USDT</span></div>

    <!-- K线图表区 -->
    <div id="chart-container">
        <!-- 智能预测悬浮面板 -->
        <div id="ai-panel">
            <div class="ai-title"><span>未来30分钟预测</span><span id="aiTime">--:--</span></div>
            <div class="ai-signal sig-neutral" id="aiSignal">观望</div>
            
            <div class="conf-label"><span>信心指数</span><span id="aiConfText" style="color:#fff;">0%</span></div>
            <div class="conf-bg"><div class="conf-bar" id="aiConfBar" style="background:var(--yellow);"></div></div>
            
            <div class="indicator-grid">
                <div>EMA20<span class="ind-val" id="valEma20">--</span></div>
                <div>EMA60<span class="ind-val" id="valEma60">--</span></div>
                <div>RSI(14)<span class="ind-val" id="valRsi">--</span></div>
                <div>MACD<span class="ind-val" id="valMacd">--</span></div>
            </div>
        </div>
    </div>

<script>
    // ==========================================
    // 1. 全局状态与配置
    // ==========================================
    let coinList = JSON.parse(localStorage.getItem('okx_coins')) || ['BTC-USDT', 'ETH-USDT', 'SOL-USDT'];
    let currentCoin = coinList[0];
    let currentTimeframe = '1m';
    
    let chart, candleSeries, ema20Series, ema60Series;
    let ws = null;
    let klineData = []; // 格式: [{time, open, high, low, close}]
    const MAX_DATA_POINTS = 150;

    // ==========================================
    // 2. UI 渲染模块
    // ==========================================
    function renderCoinList() {
        const listEl = document.getElementById('coinList');
        listEl.innerHTML = '';
        coinList.forEach(coin => {
            const div = document.createElement('div');
            div.className = `coin-tag ${coin === currentCoin ? 'active' : ''}`;
            div.innerHTML = `<span onclick="switchCoin('${coin}')">${coin}</span><span class="del-btn" onclick="removeCoin(event, '${coin}')">×</span>`;
            listEl.appendChild(div);
        });
    }

    window.addCoin = function() {
        let val = document.getElementById('coinInput').value.trim().toUpperCase();
        if(!val) return;
        if(!val.includes('-')) val += '-USDT'; // 自动补全
        if(!coinList.includes(val)) {
            coinList.push(val);
            localStorage.setItem('okx_coins', JSON.stringify(coinList));
            document.getElementById('coinInput').value = '';
            renderCoinList();
            switchCoin(val);
        }
    }

    window.removeCoin = function(e, coin) {
        e.stopPropagation();
        if(coinList.length <= 1) return alert('至少保留一个币种');
        coinList = coinList.filter(c => c !== coin);
        localStorage.setItem('okx_coins', JSON.stringify(coinList));
        if(currentCoin === coin) switchCoin(coinList[0]);
        renderCoinList();
    }

    window.switchCoin = function(coin) {
        currentCoin = coin;
        renderCoinList();
        initData();
    }

    document.getElementById('time-bar').addEventListener('click', (e) => {
        if(e.target.tagName === 'BUTTON') {
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentTimeframe = e.target.dataset.tf;
            initData();
        }
    });

    // ==========================================
    // 3. 图表初始化 (TradingView)
    // ==========================================
    function initChart() {
        const container = document.getElementById('chart-container');
        
        // 强制适配手机屏幕尺寸
        const width = container.clientWidth;
        const height = container.clientHeight;

        chart = LightweightCharts.createChart(container, {
            width: width,
            height: height,
            layout: { background: { type: 'solid', color: '#12161f' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
        });

        candleSeries = chart.addCandlestickSeries({
            upColor: '#0ecb81', downColor: '#f6465d', borderUpColor: '#0ecb81', borderDownColor: '#f6465d', wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
        });
        
        ema20Series = chart.addLineSeries({ color: '#fcd535', lineWidth: 1.5, crosshairMarkerVisible: false });
        ema60Series = chart.addLineSeries({ color: '#e056fd', lineWidth: 1.5, crosshairMarkerVisible: false });

        window.addEventListener('resize', () => {
            chart.resize(container.clientWidth, container.clientHeight);
        });
    }

    // ==========================================
    // 4. 数据获取模块 (REST 历史 + WS 实时)
    // ==========================================
    function initData() {
        if(ws) { ws.close(); ws = null; }
        klineData = [];
        
        // OKX 时间格式映射
        const tfMap = {'1s':'1s','1m':'1m','15m':'15m','1H':'1H','1D':'1D'};
        const okxTf = tfMap[currentTimeframe];

        // 1. 获取 REST 历史数据
        fetch(`https://www.okx.com/api/v5/market/candles?instId=${currentCoin}&bar=${okxTf}&limit=150`)
            .then(res => res.json())
            .then(res => {
                if(res.code === '0') {
                    const data = res.data.reverse().map(d => ({
                        time: parseInt(d[0]) / 1000,
                        open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
                    }));
                    candleSeries.setData(data);
                    klineData = data;
                    updateUIAndCalculate(data[data.length-1].close);
                    connectWebSocket();
                }
            }).catch(err => {
                console.error("历史数据加载失败", err);
                document.getElementById('currentPrice').innerText = "网络错误";
            });
    }

    // 2. 实时 WebSocket 推送
    function connectWebSocket() {
        ws = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
        
        ws.onopen = () => {
            const subMsg = {
                "op": "subscribe",
                "args": [{ "channel": `candle${currentTimeframe}`, "instId": currentCoin }]
            };
            ws.send(JSON.stringify(subMsg));
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if(msg.data && msg.arg && msg.arg.channel.startsWith('candle')) {
                const k = msg.data[0];
                const newCandle = {
                    time: parseInt(k[0]) / 1000,
                    open: parseFloat(k[1]), high: parseFloat(k[2]), low: parseFloat(k[3]), close: parseFloat(k[4])
                };
                
                candleSeries.update(newCandle);
                updateUIAndCalculate(newCandle.close);

                // 更新本地缓存用于计算指标
                const lastIdx = klineData.length - 1;
                if(klineData[lastIdx] && klineData[lastIdx].time === newCandle.time) {
                    klineData[lastIdx] = newCandle;
                } else {
                    klineData.push(newCandle);
                    if(klineData.length > MAX_DATA_POINTS) klineData.shift();
                }
            }
        };
    }

    // ==========================================
    // 5. 智能预测面板逻辑 (纯前端核心算法)
    // ==========================================
    function updateUIAndCalculate(currentPrice) {
        // 更新顶部价格
        document.getElementById('currentPrice').innerText = currentPrice.toFixed(4);
        document.getElementById('aiTime').innerText = new Date().toTimeString().slice(0,5);

        if(klineData.length < 60) return; // 数据不足暂不计算

        const closes = klineData.map(d => d.close);
        
        // 计算指标
        const ema20 = calcEMA(closes, 20);
        const ema60 = calcEMA(closes, 60);
        const rsi = calcRSI(closes, 14);
        const macd = calcMACD(closes);

        const lastEma20 = ema20[ema20.length - 1];
        const lastEma60 = ema60[ema60.length - 1];
        const lastRsi = rsi[rsi.length - 1];
        const lastMacd = macd[macd.length - 1];

        // 更新K线图上的均线
        ema20Series.setData(klineData.map((d, i) => ({ time: d.time, value: ema20[i] })));
        ema60Series.setData(klineData.map((d, i) => ({ time: d.time, value: ema60[i] })));

        // 更新右侧面板数值
        document.getElementById('valEma20').innerText = lastEma20.toFixed(2);
        document.getElementById('valEma60').innerText = lastEma60.toFixed(2);
        document.getElementById('valRsi').innerText = lastRsi.toFixed(1);
        document.getElementById('valMacd').innerText = lastMacd.toFixed(2);

        // --- 核心打分逻辑 ---
        let score = 50; // 基础分

        // 1. EMA 趋势
        if(currentPrice > lastEma20 && lastEma20 > lastEma60) score += 25; // 强多头
        else if(currentPrice < lastEma20 && lastEma20 < lastEma60) score -= 25; // 强空头

        // 2. MACD 动能
        if(lastMacd > 0) score += 15;
        else score -= 15;

        // 3. RSI 超买超卖
        if(lastRsi < 30) score += 10; // 超卖反弹
        else if(lastRsi > 70) score -= 10; // 超买回落

        score = Math.max(0, Math.min(100, score));

        // --- 渲染信号 ---
        const sigEl = document.getElementById('aiSignal');
        const confText = document.getElementById('aiConfText');
        const confBar = document.getElementById('aiConfBar');

        confText.innerText = score + '%';
        confBar.style.width = score + '%';

        if(score >= 65) {
            sigEl.innerText = "做多";
            sigEl.className = "ai-signal sig-long";
            confBar.style.background = "var(--up)";
            confText.style.color = "var(--up)";
        } else if(score <= 35) {
            sigEl.innerText = "做空";
            sigEl.className = "ai-signal sig-short";
            confBar.style.background = "var(--down)";
            confText.style.color = "var(--down)";
        } else {
            sigEl.innerText = "观望";
            sigEl.className = "ai-signal sig-neutral";
            confBar.style.background = "var(--yellow)";
            confText.style.color = "var(--yellow)";
        }
    }

    // ==========================================
    // 6. 指标数学公式
    // ==========================================
    function calcEMA(prices, period) {
        const k = 2 / (period + 1); let ema = [prices[0]]; let prev = prices[0];
        for (let i = 1; i < prices.length; i++) { prev = prices[i] * k + prev * (1 - k); ema.push(prev); }
        return ema;
    }
    function calcRSI(prices, period) {
        let gains = 0, losses = 0, rsi = new Array(prices.length).fill(50);
        if (prices.length < period) return rsi;
        for (let i = 1; i <= period; i++) { prices[i] > prices[i-1] ? gains += prices[i]-prices[i-1] : losses += prices[i-1]-prices[i]; }
        let avgGain = gains/period, avgLoss = losses/period;
        rsi[period] = 100 - (100 / (1 + avgGain/avgLoss));
        for (let i = period+1; i < prices.length; i++) {
            let diff = prices[i] - prices[i-1];
            avgGain = (avgGain*(period-1) + (diff>0?diff:0))/period;
            avgLoss = (avgLoss*(period-1) + (diff<0?-diff:0))/period;
            rsi[i] = 100 - (100 / (1 + avgGain/avgLoss));
        }
        return rsi;
    }
    function calcMACD(prices) {
        const ema12 = calcEMA(prices, 12), ema26 = calcEMA(prices, 26);
        let macdLine = ema12.map((v, i) => v - ema26[i]);
        const signalLine = calcEMA(macdLine, 9);
        return macdLine.map((v, i) => v - signalLine[i]); 
    }

    // ==========================================
    // 7. 启动程序
    // ==========================================
    window.onload = () => {
        initChart();
        renderCoinList();
        initData();
    };
</script>
</body>
</html>
