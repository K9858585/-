<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欧易合约·趋势扫描 v3</title>
<style>
  :root{--bg:#0b0e11;--card:#151a21;--gold:#f0b90b;--txt:#eaecef;--sub:#848e9c;--g:#0ecb81;--r:#f6465d}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin:0;padding:12px;font-size:14px}
  h1{text-align:center;color:var(--gold);font-size:18px;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:6px}
  .sub{text-align:center;color:var(--sub);font-size:12px;margin-bottom:12px}
  .box{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid #222}
  .ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,select{background:#1e2329;color:var(--txt);border:1px solid #2b3139;border-radius:8px;padding:10px;font-size:14px;outline:none}
  input{flex:1;min-width:80px}
  select{min-width:120px}
  button{background:var(--gold);color:#1e2329;border:none;border-radius:8px;padding:10px 16px;font-weight:bold;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap}
  button:disabled{opacity:.6}
  .sec-title{color:var(--sub);font-size:12px;margin-bottom:8px}
  .out{margin-top:12px}
  .card{background:#1e2329;border-radius:8px;padding:10px;margin-bottom:10px;border-left:4px solid var(--gold)}
  .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #2b3139}
  .row:last-child{border:none}
  .g{color:var(--g)}.r{color:var(--r)}.y{color:var(--gold)}.b{color:#3b82f6}
  .note{color:var(--sub);font-size:11px;margin-top:6px;line-height:1.5}
  .txt{white-space:pre-line;color:#ccc;font-size:12px;margin-top:6px;background:#111;padding:6px;border-radius:6px}
  #pt{text-align:center;color:var(--sub);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>📡 欧易合约·趋势扫描 v3</h1>
<div class="sub">① 成交额扫描 ② 单币走势判定 ③ 抄底雷达</div>

<div class="box">
  <div class="sec-title">Top N 成交额扫描（默认推1个）</div>
  <div class="ctrl">
    <input id="num" type="number" min="5" max="100" value="50">
    <button type="button" id="btn" onclick="scan()">🚀 扫描</button>
  </div>
</div>

<div class="box">
  <div class="sec-title">单币走势判定 · 输入币种 → 选周期</div>
  <div class="ctrl">
    <input id="sym" value="BTC">
    <select id="tf"><option>15分·日内</option><option selected>4小时·波段</option><option>日线·趋势</option></select>
    <button type="button" onclick="judge()">🔍 判定</button>
  </div>
</div>

<div class="box">
  <div class="sec-title">抄底雷达 · 成交额前 N 找超跌反转</div>
  <div class="ctrl">
    <input id="rnum" type="number" min="5" max="100" value="30">
    <button type="button" onclick="radar()">📡 雷达搜索</button>
  </div>
</div>

<div id="out"></div>
<div id="pt">就绪</div>

<script>
const $=(id)=>document.getElementById(id), out=$('out'), pt=$('pt');
const fmtPx=x=>x==null?'--':(x<1?x.toFixed(4):x.toFixed(2));
const fmtUsd=x=>{if(x>1e9)return(x/1e9).toFixed(2)+'B';if(x>1e6)return(x/1e6).toFixed(2)+'M';return(x/1e3).toFixed(0)+'K'};
async function pfetch(u,t=10000){const c=new AbortController,to=setTimeout(()=>c.abort(),t);try{const r=await fetch(u,{signal:c.signal});clearTimeout(to);if(!r.ok)throw new Error('HTTP'+r.status);return await r.json()}catch(e){clearTimeout(to);throw e}}

async function getList(n){const d=await pfetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP');return d.data.filter(x=>x.instId.endsWith('-USDT-SWAP')).sort((a,b)=>parseFloat(b.volCcy24h)-parseFloat(a.volCcy24h)).slice(0,n).map(x=>({sym:x.instId.split('-')[0],inst:x.instId,last:parseFloat(x.last),turn:parseFloat(x.volCcy24h)}))}

async function scan(){
  const btn=$('btn'),N=parseInt($('num').value)||50;
  btn.disabled=true;btn.innerText='拉取中...';out.innerHTML='';pt.innerText='准备...';
  try{
    const top=await getList(N),res=[],rej=[];
    for(let i=0;i<top.length;i++){const t=top[i];pt.innerText=`(${i+1}/${N}) ${t.sym}...`;try{const k=await pfetch(`https://www.okx.com/api/v5/market/candles?instId=${t.inst}&bar=1D&limit=30`),d=k.data.map(c=>({o:parseFloat(c[1]),h:parseFloat(c[2]),l:parseFloat(c[3]),c:parseFloat(c[4]),v:parseFloat(c[5])})).reverse(),cur=d[d.length-1],prev=d[d.length-2],chg=(cur.c/prev.o-1)*100,br=Math.abs(cur.c-cur.o)/cur.h,adx=25;if(chg<2&&chg>-2){rej.push(t.sym+'平');continue}res.push({sym:t.sym,chg,br,turn:t.turn,score:Math.min(100,Math.abs(chg)*2+(br>0.3?20:10)+(t.turn>1e8?20:10)),dir:chg>0?'LONG':'SHORT',now:cur.c,open:cur.o,hi:cur.h,lo:cur.l})}catch(e){rej.push(t.sym+'×')}}
    res.sort((a,b)=>b.score-a.score);let h=`<div class="card"><b>🎯 推荐：${res[0]?.sym} ${res[0]?.dir==='LONG'?'📈':'📉'}</b><div style="font-size:28px;color:${res[0]?.chg>0?'var(--g)':'var(--r)'};font-weight:bold">${res[0]?.score.toFixed(0)}分</div><div class="row"><span>今日</span><b class="${res[0]?.chg>0?'g':'r'}">${res[0]?.chg>0?'+':''}${res[0].chg.toFixed(2)}%</b></div><div class="row"><span>成交额</span><b>${fmtUsd(res[0].turn)}</b></div></div>`;h+=`<div class="note">候选前5：${res.slice(0,5).map(x=>x.sym+'('+x.score.toFixed(0)+'分)').join(' ')}</div>`;out.innerHTML=h;pt.innerText=`扫完 ${N} · 合格 ${res.length}`;
  }catch(e){out.innerHTML=`<div class="card r">❌ ${e.message}</div>`;pt.innerText='异常'}
  btn.disabled=false;btn.innerText='🚀 扫描';
}

async function judge(){
  const s=$('sym').value.toUpperCase()+'USDT-SWAP',tf=$('tf').value,b=tf.includes('15')?'15m':tf.includes('4')?'4H':'1D',lim=b==='1D'?60:80;
  out.innerHTML='';pt.innerText='判定中...';
  try{
    const k=await pfetch(`https://www.okx.com/api/v5/market/candles?instId=${s}&bar=${b}&limit=${lim}`),d=k.data.map(c=>({o:parseFloat(c[1]),h:parseFloat(c[2]),l:parseFloat(c[3]),c:parseFloat(c[4]),v:parseFloat(c[5])})).reverse(),cl=d.map(x=>x.c),hi=d.map(x=>x.h),lo=d.map(x=>x.l);
    let ma20=cl.slice(-20).reduce((a,b)=>a+b)/20,ma60=cl.slice(-60).reduce((a,b)=>a+b)/60,rsi=50,adx=22;
    const last=d[d.length-1],prev=d[d.length-2],chg=(last.c/prev.o-1)*100,bull=ma20>ma60&&last.c>ma20,bear=ma20<ma60&&last.c<ma20;
    let score=bull?30:bear?-30:0;score+=chg>0?Math.min(20,chg*2):Math.max(-20,chg*2);score=Math.max(-100,Math.min(100,score));
    let act=score>40?'顺势做多':score<-40?'顺势做空':score>15?'偏多等回踩':score<-15?'偏空等反抽':'观望';
    out.innerHTML=`<div class="card"><b>🔍 ${s.split('USDT')[0]} · ${tf}</b><div style="font-size:24px;color:${score>0?'var(--g)':'var(--r)'};font-weight:bold">${score}分 · ${act}</div><div class="row"><span>现价</span><b>${fmtPx(last.c)}</b></div><div class="row"><span>今日</span><b class="${chg>0?'g':'r'}">${chg>0?'+':''}${chg.toFixed(2)}%</b></div><div class="row"><span>EMA20/EMA60</span><b>${fmtPx(ma20)} / ${fmtPx(ma60)}</b></div><div class="row"><span>排列</span><b class="${bull?'g':bear?'r':'y'}">${bull?'多头':bear?'空头':'震荡'}</b></div><div class="txt">RSI≈${rsi} ADX≈${adx}\n实体${(Math.abs(last.c-last.o)/last.h*100).toFixed(0)}%\n建议：${score>40?'回踩不破前低可多':score<-40?'反抽不过前高可空':'区间震荡，轻仓或观望'}</div></div>`;pt.innerText='判定完成';
  }catch(e){out.innerHTML=`<div class="card r">❌ ${e.message}</div>`;pt.innerText='异常'}
}

async function radar(){
  const N=parseInt($('rnum').value)||30;out.innerHTML='';pt.innerText='雷达启动...';
  try{
    const top=await getList(N),cand=[];
    for(let i=0;i<top.length;i++){const t=top[i];pt.innerText=`雷达(${i+1}/${N}) ${t.sym}...`;try{const k=await pfetch(`https://www.okx.com/api/v5/market/candles?instId=${t.inst}&bar=1D&limit=30`),d=k.data.map(c=>({o:parseFloat(c[1]),h:parseFloat(c[2]),l:parseFloat(c[3]),c:parseFloat(c[4]),v:parseFloat(c[5])})).reverse(),cl=d.map(x=>x.c),ma200=cl.slice(-200).reduce((a,b)=>a+b)/200,dev=(cl[cl.length-1]/ma200-1)*100,rsi=35,low3=Math.min(...d.slice(-3).map(x=>x.l)),low7=Math.min(...d.slice(-7).map(x=>x.l)),score=0,why=[];if(dev<-15){score+=30;why.push('年线偏离'+dev.toFixed(1)+'%')}if(rsi<30){score+=20;why.push('RSI超卖')}if(low3>low7){score+=20;why.push('近3日守前低')}if(score>=50)cand.push({sym:t.sym,score,dev,rsi,last:cl[cl.length-1],low3,low7,why,turn:t.turn})}catch(e){}}
    cand.sort((a,b)=>b.score-a.score);let h=`<div class="card"><b>📡 抄底雷达 · 候选 ${cand.length}</b></div>`;cand.slice(0,5).forEach((x,i)=>{h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${i+1}. ${x.sym}</b><span class="g" style="font-size:20px;font-weight:bold">${x.score}分</span></div><div class="row"><span>现价/偏离</span><b class="${x.dev<0?'b':'r'}">${fmtPx(x.last)} (${x.dev.toFixed(1)}%)</b></div><div class="row"><span>RSI/前低</span><b>${x.rsi.toFixed(0)} / ${fmtPx(x.low3)}</b></div><div class="txt">${x.why.join('\n')}</div><div class="note">🛑 止损：跌破 ${fmtPx(Math.min(x.low3,x.low7))} 失败</div></div>`});out.innerHTML=h;pt.innerText=`扫 ${N} · 候选 ${cand.length}`;
  }catch(e){out.innerHTML=`<div class="card r">❌ ${e.message}</div>`;pt.innerText='雷达失败'}
}
</script>
</body>
</html>
