<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>当日趋势扫描器 v4.2 超时兜底</title>
<style>
  :root { --bg:#0b0e11; --card:#181b21; --txt:#eaecef; --sub:#9aa5b1; --gold:#f5a623; --green:#0ecb81; --red:#f6465d; --border:#2b3139; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; margin:0; padding:12px; font-size:14px; }
  .header { text-align:center; margin-bottom:12px; }
  .title { font-size:22px; font-weight:800; color:var(--gold); letter-spacing:.5px; }
  .sub { color:var(--sub); font-size:12px; margin-top:6px; line-height:1.4; }
  .ctrl { display:flex; gap:8px; justify-content:center; margin:12px 0; flex-wrap:wrap; }
  input, select { background:var(--card); color:var(--txt); border:1px solid var(--border); padding:10px; border-radius:8px; font-size:15px; outline:none; }
  input { width:70px; }
  button { background:var(--gold); color:#000; border:none; padding:10px 18px; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; min-width:90px; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .status { text-align:center; color:var(--sub); margin:8px 0; font-size:13px; min-height:20px; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin-bottom:10px; border:1px solid var(--border); }
  .top-title { font-size:20px; font-weight:800; margin-bottom:8px; display:flex; justify-content:space-between; align-items:end; }
  .top-sub { font-size:12px; color:var(--sub); font-weight:400; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { color:var(--sub); font-weight:400; text-align:left; padding:6px 4px; border-bottom:1px solid var(--border); }
  th:nth-child(3), th:nth-child(4) { text-align:right; }
  td { padding:7px 4px; border-bottom:1px solid #20242b; }
  td:nth-child(3), td:nth-child(4) { text-align:right; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .res-box { background:var(--card); border-radius:10px; padding:12px; border:1px solid var(--gold); margin-top:10px; display:none; }
  .res-title { color:var(--gold); font-weight:800; font-size:16px; margin-bottom:8px; }
  .empty { color:var(--red); text-align:center; padding:20px; }
  .note { color:var(--sub); font-size:11px; margin-top:8px; line-height:1.4; }
</style>
</head>
<body>
<div class="header">
  <div class="title">📡 当日趋势扫描器 v4.2 超时兜底</div>
  <div class="sub">实时拉全市场永续 → 按 24h 成交额 USDT 降序取前 N → 逐个日线打分 → 只推 1 个<br>当前 <span id="now"></span> · 口径 UTC+8 北京0点换日 · 与欧易 App 图表设置一致</div>
</div>

<div class="ctrl">
  <input id="topN" type="number" value="10" min="5" max="50">
  <select id="tz">
    <option value="8" selected>UTC+8（北京）</option>
    <option value="0">UTC+0（伦敦）</option>
  </select>
  <select id="mode">
    <option value="1" selected>每个币只保留成交最大合约</option>
  </select>
  <button id="btn">🚀 扫描</button>
</div>

<div class="status" id="status">左边填的数字 = 成交额 Top N（不是随便抓 N 只）。换日口径要和欧易 App 图表设置一致。</div>

<div class="card" id="topCard" style="display:none;">
  <div class="top-title">成交额 Top <span id="topNum"></span> <span class="top-sub">全市场 <span id="totalSwap"></span> 个永续中筛出</span></div>
  <table>
    <thead><tr><th>#</th><th>币</th><th>24h成交额</th><th>24h涨跌</th></tr></thead>
    <tbody id="topBody"></tbody>
  </table>
  <div class="note">成交额 = volCcy24h；该字段缺失时用「张数 × ctVal × 最新价」补算。<br>同名合约已去重（只留主合约）。</div>
</div>

<div class="res-box" id="resBox">
  <div class="res-title">🎯 当日唯一推荐</div>
  <div id="resBody"></div>
  <div class="note" id="rejNote" style="margin-top:10px;"></div>
</div>

<script>
/* ========== 核心配置 ========== */
// 德国/EEA 环境强制走 eea 域名，否则 www 会被静默拦截
const OKX_BASE = "https://eea.okx.com/api/v5"; 
// const OKX_BASE = "https://www.okx.com/api/v5"; // 非欧洲用这个

const btn = document.getElementById('btn');
const status = document.getElementById('status');
document.getElementById('now').innerText = new Date().toLocaleString('zh-CN');

/* ========== 可中断请求（AbortController） ========== */
async function fetchWithAbort(url, timeoutMs = 8000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const txt = await res.text();
    try { return JSON.parse(txt); } 
    catch(e) { throw new Error('返回内容非JSON(可能网关拦截)'); }
  } catch (e) {
    clearTimeout(timer);
    if(e.name === 'AbortError') throw new Error('请求超时('+timeoutMs+'ms)');
    throw e;
  }
}

/* ========== 工具函数 ========== */
function fmtM(v){ if(v>=1e6) return '$'+(v/1e6).toFixed(0)+'M'; if(v>=1e3) return '$'+(v/1e3).toFixed(0)+'K'; return '$'+v.toFixed(0); }
function pct(v){ return (v>=0?'+':'')+v.toFixed(2)+'%'; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ========== 单币分析（12秒硬超时，绝不卡死） ========== */
async function analyzeCoin(coin, idx, total) {
  const t0 = Date.now();
  console.log(`(${idx}/${total}) 分析 ${coin.sym}`);
  status.innerText = `(${idx}/${total}) 分析 ${coin.sym}  成交额 ${fmtM(coin.turn)}`;
  
  try {
    return await Promise.race([
      (async () => {
        // 1. K线（8秒超时）
        const kl = await fetchWithAbort(`${OKX_BASE}/market/candles?instType=SWAP&instId=${encodeURIComponent(coin.instId)}&bar=1D&limit=150`, 8000);
        if(!kl || kl.code!=='0' || !kl.data || kl.data.length<120) throw new Error('K线不足');
        const kdata = kl.data.map(d=>({t:+d[0], o:+d[1], h:+d[2], l:+d[3], c:+d[4], v:+d[5]}));
        
        // 2. 资金费率（5秒，失败不影响）
        let fundRate = null;
        try {
          const fr = await fetchWithAbort(`${OKX_BASE}/public/funding-rate?instId=${encodeURIComponent(coin.instId)}`, 5000);
          if(fr.code==='0' && fr.data[0]) fundRate = parseFloat(fr.data[0].fundingRate||0)*100;
        } catch(e) {}
        
        // 3. OI（5秒，失败不影响）
        let oi = null;
        try {
          const oiR = await fetchWithAbort(`${OKX_BASE}/public/open-interest?instType=SWAP&instId=${encodeURIComponent(coin.instId)}`, 5000);
          if(oiR.code==='0' && oiR.data[0]) oi = parseFloat(oiR.data[0].oi||0);
        } catch(e) {}

        // --- 简易指标计算（MACD趋势 + RSI + 成交额） ---
        const cls = kdata.map(d=>d.c);
        const len = cls.length;
        let ema12=cls[0], ema26=cls[0];
        for(let i=1;i<len;i++){ ema12=cls[i]*0.1538+ema12*0.8462; ema26=cls[i]*0.0741+ema26*0.9259; }
        const macd = ema12-ema26;
        
        let up=0, dn=0;
        for(let i=1;i<len;i++){ const ch=cls[i]-cls[i-1]; if(ch>0)up+=ch; else dn-=ch; }
        const rsi = 100 - 100/(1+(up/dn||0));
        
        const last = cls[len-1], prev = cls[len-2];
        const dayChg = (last-prev)/prev*100;
        const turnBoi = (oi && coin.last)>0 ? coin.turn/(oi*coin.last) : 0;
        
        // 打分：趋势+动能+资金+流动性
        let score = 0;
        if(macd>0) score+=2; if(macd>ema12*0.02) score+=1;
        if(rsi>50 && rsi<75) score+=2; else if(rsi>75) score-=1;
        if(dayChg>0) score+=1; if(dayChg>2) score+=1;
        if(fundRate!==null && fundRate>0) score+=0.5;
        if(turnBoi>0.1 && turnBoi<5) score+=1; // 成交额/OI 合理
        
        return { ...coin, score, macd, rsi, dayChg, fundRate, oi, turnBoi, last };
      })(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('单币分析超12秒')), 12000))
    ]);
  } catch (e) {
    console.warn(`跳过 ${coin.sym}: ${e.message}`);
    return { ...coin, _skip: true, _reason: e.message };
  }
}

/* ========== 扫描主体 ========== */
async function scanCore() {
  const n = parseInt(document.getElementById('topN').value)||10;
  const tz = parseInt(document.getElementById('tz').value);
  
  // 1. 拉榜单（20秒整体超时）
  status.innerText = '拉取全市场永续榜单...';
  const tickUrl = `${OKX_BASE}/market/tickers?instType=SWAP`;
  const j = await fetchWithAbort(tickUrl, 20000);
  if(!j || j.code!=='0') throw new Error('榜单拉取失败');
  
  const all = j.data;
  const totalSwap = all.length;
  
  // 2. 处理同名合约（只留成交额最大），补算成交额
  const map = {};
  for(const d of all){
    const sym = d.instId.split('-')[0];
    const last = parseFloat(d.last||0);
    const vol = parseFloat(d.volCcy24h||0);
    const sz = parseFloat(d.vol24h||0);
    const ct = parseFloat(d.ctVal||1);
    let turn = vol;
    if(!turn || turn<=0) turn = sz * ct * last; // 张数*面值*价
    
    if(!map[sym] || turn > map[sym].turn){
      map[sym] = { sym, instId:d.instId, turn, last, chg:parseFloat(d.chg24h||0)*100 };
    }
  }
  
  const arr = Object.values(map).sort((a,b)=>b.turn-a.turn).slice(0,n);
  
  // 渲染 Top N
  document.getElementById('topNum').innerText = n;
  document.getElementById('totalSwap').innerText = totalSwap;
  const tb = document.getElementById('topBody');
  tb.innerHTML = '';
  arr.forEach((d,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${d.sym}</td><td>${fmtM(d.turn)}</td><td class="${d.chg>=0?'pos':'neg'}">${pct(d.chg)}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById('topCard').style.display = 'block';
  
  // 3. 逐个分析（带 12 秒硬超时 + 异常跳过）
  let res = [], rej = [];
  for(let i=0; i<arr.length; i++){
    const r = await analyzeCoin(arr[i], i+1, n);
    if(r && !r._skip) res.push(r); 
    else if(r) rej.push(`${r.sym}(${r._reason})`);
  }
  
  // 4. 选最优
  res.sort((a,b)=>b.score-a.score);
  const best = res[0];
  
  // 渲染结果
  const rb = document.getElementById('resBody');
  if(best){
    rb.innerHTML = `<b>${best.sym}</b> (${best.instId})<br>
      得分: ${best.score.toFixed(1)} · 收盘 ${best.last} · 日涨跌 ${pct(best.dayChg)}<br>
      MACD: ${best.macd.toFixed(4)} · RSI: ${best.rsi.toFixed(1)}<br>
      资金费: ${best.fundRate!==null?pct(best.fundRate):'N/A'} · 成交额/OI: ${best.turnBoi.toFixed(2)}<br>
      24h成交额: ${fmtM(best.turn)}`;
  } else {
    rb.innerHTML = '<div class="empty">无合格标的（全部超时/异常）</div>';
  }
  
  document.getElementById('rejNote').innerText = rej.length ? `过滤: ${rej.join(', ')}` : `扫完 ${n} 只 · 合格 ${res.length} 只`;
  document.getElementById('resBox').style.display = 'block';
  status.innerText = `完成 · 扫完 ${n} 只 · 合格 ${res.length} 只 · 过滤 ${rej.length} 只`;
}

/* ========== 入口（防连点 + finally恢复） ========== */
async function scan(){
  if(btn.disabled) return;
  btn.disabled = true;
  btn.innerText = '扫描中...';
  document.getElementById('resBox').style.display = 'none';
  
  try {
    await Promise.race([
      scanCore(),
      new Promise((_,r)=>setTimeout(()=>r(new Error('整轮扫描超3分钟')), 180000))
    ]);
  } catch(e) {
    console.error('扫描崩溃:', e);
    status.innerText = '扫描异常: ' + e.message;
    document.getElementById('resBody').innerHTML = '<div class="empty">扫描异常，已停止<br>'+e.message+'</div>';
    document.getElementById('resBox').style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerText = '🚀 扫描';
  }
}

btn.onclick = scan;
</script>
</body>
</html>
