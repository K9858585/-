<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>50大精选币 纯5M超买超卖/放量拐点扫描</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        #top-bar { background: var(--panel); padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; align-items: center; gap: 15px; }

        .btn-container { width: 100%; max-width: 400px; }
        .scan-btn {
            background: linear-gradient(135deg, #0ecb81, #2962ff); color: #fff; border: none;
            padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(41,98,255,0.4); width: 100%; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .scan-btn:active { transform: scale(0.98); }
        .scan-btn:disabled { background: #363a45; color: #848e9c; box-shadow: none; cursor: not-allowed; }

        .progress-text { font-size: 13px; color: var(--yellow); height: 20px; text-align: center; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 4px; background: #2a2e39; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }

        #result-area { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 20px; }

        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title.long { color: var(--up); }
        .section-title.short { color: var(--down); }

        .card { background: var(--panel); border-radius: 12px; padding: 15px; margin-bottom: 12px; position: relative; overflow: hidden; border-left: 4px solid #fff; }
        .card.long-card { border-left-color: var(--up); box-shadow: 0 4px 15px rgba(14,203,129,0.05); }
        .card.short-card { border-left-color: var(--down); box-shadow: 0 4px 15px rgba(246,70,93,0.05); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .coin-name { font-size: 20px; font-weight: 900; color: #fff; }
        .score-badge { font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
        .long-card .score-badge { background: rgba(14,203,129,0.15); color: var(--up); }
        .short-card .score-badge { background: rgba(246,70,93,0.15); color: var(--down); }

        .reason-box { font-size: 13px; line-height: 1.7; color: #b2b5be; text-align: justify; background: #12161f; padding: 12px; border-radius: 8px; }
        .highlight { color: var(--yellow); font-weight: bold; }
        .empty-tip { color: #848e9c; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="btn-container">
            <button class="scan-btn" id="startBtn" onclick="runScanner()">
                <span id="btnText">🎯 启动 纯5M布林/RSI放量 扫描</span>
            </button>
        </div>
        <div class="progress-text" id="progressText">准备就绪，点击上方按钮开始</div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="result-area"></div>

<script>
    const targetCoins = [
        "BTC-USDT-SWAP", "ETH-USDT-SWAP", "OKB-USDT-SWAP", "SOL-USDT-SWAP", "DOGE-USDT-SWAP",
        "XRP-USDT-SWAP", "BCH-USDT-SWAP", "DOOD-USDT-SWAP", "ZEC-USDT-SWAP", "xNVDA-USDT-SWAP",
        "PEPE-USDT-SWAP", "XAUT-USDT-SWAP", "xSNDK-USDT-SWAP", "UNI-USDT-SWAP", "HYPE-USDT-SWAP",
        "TRUMP-USDT-SWAP", "BNB-USDT-SWAP", "xSOXL-USDT-SWAP", "SUI-USDT-SWAP", "FIL-USDT-SWAP",
        "ADA-USDT-SWAP", "AVAX-USDT-SWAP", "DOT-USDT-SWAP", "LINK-USDT-SWAP", "LTC-USDT-SWAP",
        "TRX-USDT-SWAP", "ATOM-USDT-SWAP", "NEAR-USDT-SWAP", "APT-USDT-SWAP", "ARB-USDT-SWAP",
        "OP-USDT-SWAP", "INJ-USDT-SWAP", "TIA-USDT-SWAP", "RNDR-USDT-SWAP", "IMX-USDT-SWAP",
        "STX-USDT-SWAP", "HBAR-USDT-SWAP", "ICP-USDT-SWAP", "ETC-USDT-SWAP", "XLM-USDT-SWAP",
        "VET-USDT-SWAP", "GRT-USDT-SWAP", "THETA-USDT-SWAP", "FTM-USDT-SWAP", "SAND-USDT-SWAP",
        "MANA-USDT-SWAP", "EOS-USDT-SWAP", "AAVE-USDT-SWAP", "MKR-USDT-SWAP", "WIF-USDT-SWAP"
    ];

    let isRunning = false;

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        if (percent !== undefined) {
            document.getElementById('progressBarBg').style.display = 'block';
            document.getElementById('progressBar').style.width = Math.min(100, percent) + '%';
        }
    }

    function endScanner() {
        isRunning = false;
        const btn = document.getElementById('startBtn');
        btn.disabled = false;
        document.getElementById('btnText').innerText = "🎯 重新扫描";
    }

    async function fetchCandles(instId, bar, limit) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const res = await fetch(
                `https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`,
                { signal: ctrl.signal }
            ).then(r => r.json());
            if (res.code !== '0' || !res.data || !res.data.length) throw new Error('no data');
            return res.data.map(d => ({
                t: +d[0], o: +d[1], h: +d[2], l: +d[3], c: +d[4], v: +d[5],
                confirm: d[8] === '1'
            })).reverse();
        } finally {
            clearTimeout(timer);
        }
    }

    function getLastClosedIdx(klines) {
        for (let i = klines.length - 1; i >= 0; i--) {
            if (klines[i].confirm) return i;
        }
        return klines.length - 2;
    }

    // 纯 5m 判定：布林带极值 + RSI极值 + 放量 + 反向实体
    function analyze5m(klines) {
        const lastIdx = getLastClosedIdx(klines);
        if (lastIdx < 30) return null;

        const closed = klines.slice(0, lastIdx + 1);
        const closes = closed.map(k => k.c);
        const lastK = closed[lastIdx];

        // 1. 算 RSI(14)
        const rsi = calcRSI(closes, 14);
        
        // 2. 算 BOLL(20, 2)
        const boll = calcBOLL(closes, 20, 2);
        
        // 3. 算量比（最新已收盘成交量 / 前5根均量）
        let prevVolSum = 0;
        for (let i = lastIdx - 5; i < lastIdx; i++) {
            prevVolSum += closed[i].v;
        }
        const avgVol = prevVolSum / 5;
        const volRatio = avgVol > 0 ? lastK.v / avgVol : 1;
        
        // 4. 实体形态
        const isBull = lastK.c > lastK.o;
        const isBear = lastK.c < lastK.o;
        
        // 5. 是否触碰极值轨
        const touchLower = lastK.l <= boll.lower;
        const touchUpper = lastK.h >= boll.upper;
        
        return { rsi, boll, volRatio, isBull, isBear, touchLower, touchUpper, lastK };
    }

    window.runScanner = async function() {
        if (isRunning) return;
        isRunning = true;

        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        document.getElementById('btnText').innerText = "⏳ 正在全速扫描...";
        const area = document.getElementById('result-area');
        area.style.display = 'none';
        area.innerHTML = '';

        const longResults = [];
        const shortResults = [];

        try {
            // ========== 直接扫描 5m ==========
            updateProgress("正在扫描 50 个币的 5m 极值信号...", 5);
            const chunkSize = 10;
            let done = 0;

            for (let i = 0; i < targetCoins.length; i += chunkSize) {
                const chunk = targetCoins.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (instId) => {
                    try {
                        const k5 = await fetchCandles(instId, '5m', 50);
                        const st = analyze5m(k5);
                        if (!st) return;

                        // ---- 做多条件 ----
                        // 1. 最新K线收阳
                        // 2. 必须放量 (量比 >= 1.2)
                        // 3. 必须触碰下轨 或 RSI <= 35
                        if (st.isBull && st.volRatio >= 1.2 && (st.touchLower || st.rsi <= 35)) {
                            let score = 60 + Math.min((st.volRatio - 1) * 15, 15);
                            if (st.rsi <= 35) score += Math.min((35 - st.rsi) * 1, 10);
                            if (st.touchLower) score += 10;
                            score = Math.min(100, Math.round(score));

                            let reason = `5m 最新K线收阳，且放量（量比 <span class="highlight">${st.volRatio.toFixed(2)}</span>）。`;
                            if (st.touchLower) reason += ` 价格下探至<b>布林带下轨</b>。`;
                            if (st.rsi <= 35) reason += ` RSI(14) 降至 <span class="highlight">${st.rsi.toFixed(1)}</span> 的<b>超卖区</b>。`;
                            reason += ` 短线砸盘动能衰竭，出现企稳反弹信号。`;

                            longResults.push({ instId: instId.replace('-USDT-SWAP', ''), score, reason, volRatio: st.volRatio });
                        }

                        // ---- 做空条件 ----
                        // 1. 最新K线收阴
                        // 2. 必须放量 (量比 >= 1.2)
                        // 3. 必须触碰上轨 或 RSI >= 65
                        if (st.isBear && st.volRatio >= 1.2 && (st.touchUpper || st.rsi >= 65)) {
                            let score = 60 + Math.min((st.volRatio - 1) * 15, 15);
                            if (st.rsi >= 65) score += Math.min((st.rsi - 65) * 1, 10);
                            if (st.touchUpper) score += 10;
                            score = Math.min(100, Math.round(score));

                            let reason = `5m 最新K线收阴，且放量（量比 <span class="highlight">${st.volRatio.toFixed(2)}</span>）。`;
                            if (st.touchUpper) reason += ` 价格上探至<b>布林带上轨</b>。`;
                            if (st.rsi >= 65) reason += ` RSI(14) 升至 <span class="highlight">${st.rsi.toFixed(1)}</span> 的<b>超买区</b>。`;
                            reason += ` 短线拉升动能透支，出现遇阻回落信号。`;

                            shortResults.push({ instId: instId.replace('-USDT-SWAP', ''), score, reason, volRatio: st.volRatio });
                        }

                    } catch (e) { /* ignore */ }

                    done++;
                    updateProgress(`正在扫描 5m 信号... (${done}/${targetCoins.length})`,
                        5 + (done / targetCoins.length) * 90);
                }));
            }

            // ========== 排序取前三 ==========
            updateProgress("正在整理榜单...", 98);

            longResults.sort((a, b) => b.score - a.score || b.volRatio - a.volRatio);
            shortResults.sort((a, b) => b.score - a.score || b.volRatio - a.volRatio);

            renderResults(longResults.slice(0, 3), shortResults.slice(0, 3));

        } catch (err) {
            updateProgress("推算发生错误，请检查网络后再试。", 100);
            endScanner();
        }
    };

    function renderResults(longs, shorts) {
        updateProgress("✅ 扫描完成！已按 5M极值放量拐点 排出榜单。", 100);
        endScanner();

        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        let html = '';

        html += `<div class="section-title long">🟢 做多 Top 3（5m 下轨/超卖 + 放量收阳）</div>`;
        if (longs.length === 0) {
            html += `<div class="empty-tip">当前无符合极度严格结构的做多标的。</div>`;
        }
        longs.forEach((item, index) => {
            html += `
                <div class="card long-card">
                    <div class="card-header">
                        <div class="coin-name">${index + 1}. ${item.instId}</div>
                        <div class="score-badge">信心分: ${item.score}</div>
                    </div>
                    <div class="reason-box">${item.reason}</div>
                </div>`;
        });

        html += `<div class="section-title short" style="margin-top:10px;">🔴 做空 Top 3（5m 上轨/超买 + 放量收阴）</div>`;
        if (shorts.length === 0) {
            html += `<div class="empty-tip">当前无符合极度严格结构的做空标的。</div>`;
        }
        shorts.forEach((item, index) => {
            html += `
                <div class="card short-card">
                    <div class="card-header">
                        <div class="coin-name">${index + 1}. ${item.instId}</div>
                        <div class="score-badge">信心分: ${item.score}</div>
                    </div>
                    <div class="reason-box">${item.reason}</div>
                </div>`;
        });

        area.innerHTML = html;
    }

    // 标准 RSI 计算
    function calcRSI(closes, period = 14) {
        if (closes.length <= period) return 50;
        let gains = 0, losses = 0;
        for (let i = 1; i <= period; i++) {
            const diff = closes[i] - closes[i - 1];
            if (diff >= 0) gains += diff;
            else losses -= diff;
        }
        let avgGain = gains / period;
        let avgLoss = losses / period;
        
        for (let i = period + 1; i < closes.length; i++) {
            const diff = closes[i] - closes[i - 1];
            let gain = diff > 0 ? diff : 0;
            let loss = diff < 0 ? -diff : 0;
            avgGain = (avgGain * (period - 1) + gain) / period;
            avgLoss = (avgLoss * (period - 1) + loss) / period;
        }
        if (avgLoss === 0) return 100;
        const rs = avgGain / avgLoss;
        return 100 - (100 / (1 + rs));
    }

    // 布林带计算
    function calcBOLL(closes, period = 20, mult = 2) {
        if (closes.length < period) return { upper: Infinity, lower: -Infinity, mid: 0 };
        const slice = closes.slice(-period);
        const sma = slice.reduce((a, b) => a + b, 0) / period;
        const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
        const stdDev = Math.sqrt(variance);
        return {
            upper: sma + mult * stdDev,
            mid: sma,
            lower: sma - mult * stdDev
        };
    }
</script>
</body>
</html>
