<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20大精选币 4H/1H/5m 极速推算</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { background: var(--panel); padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .btn-container { width: 100%; max-width: 400px; }
        .scan-btn { 
            background: linear-gradient(135deg, #2962ff, #e056fd); color: #fff; border: none; 
            padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; 
            box-shadow: 0 6px 20px rgba(41,98,255,0.4); width: 100%; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .scan-btn:active { transform: scale(0.98); }
        .scan-btn:disabled { background: #363a45; color: #848e9c; box-shadow: none; cursor: not-allowed; }
        
        .progress-text { font-size: 13px; color: var(--yellow); height: 20px; text-align: center; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 4px; background: #2a2e39; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }
        
        /* 结果展示区 */
        #result-area { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 20px; }
        
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title.long { color: var(--up); }
        .section-title.short { color: var(--down); }

        .card { background: var(--panel); border-radius: 12px; padding: 15px; margin-bottom: 12px; position: relative; overflow: hidden; border-left: 4px solid #fff; }
        .card.long-card { border-left-color: var(--up); box-shadow: 0 4px 15px rgba(14,203,129,0.05); }
        .card.short-card { border-left-color: var(--down); box-shadow: 0 4px 15px rgba(246,70,93,0.05); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .coin-name { font-size: 20px; font-weight: 900; color: #fff; }
        .score-badge { font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
        .long-card .score-badge { background: rgba(14,203,129,0.15); color: var(--up); }
        .short-card .score-badge { background: rgba(246,70,93,0.15); color: var(--down); }

        .reason-box { font-size: 13px; line-height: 1.6; color: #b2b5be; text-align: justify; background: #12161f; padding: 12px; border-radius: 8px; }
        .highlight { color: var(--yellow); font-weight: bold; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="btn-container">
            <button class="scan-btn" id="startBtn" onclick="runScanner()">
                <span id="btnText">⚡ 启动 4H/1H/5m 推算</span>
            </button>
        </div>
        <div class="progress-text" id="progressText">准备就绪，点击上方按钮开始</div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="result-area"></div>

<script>
    // 你指定的 20 个币种
    const targetCoins = [
        "BTC-USDT-SWAP", "ETH-USDT-SWAP", "OKB-USDT-SWAP", "SOL-USDT-SWAP", "DOGE-USDT-SWAP",
        "XRP-USDT-SWAP", "BCH-USDT-SWAP", "DOOD-USDT-SWAP", "ZEC-USDT-SWAP", "xNVDA-USDT-SWAP",
        "PEPE-USDT-SWAP", "XAUT-USDT-SWAP", "xSNDK-USDT-SWAP", "UNI-USDT-SWAP", "HYPE-USDT-SWAP",
        "TRUMP-USDT-SWAP", "BNB-USDT-SWAP", "xSOXL-USDT-SWAP", "SUI-USDT-SWAP", "FIL-USDT-SWAP"
    ];

    let isRunning = false;

    // === UI 控制 ===
    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        if(percent !== undefined) {
            document.getElementById('progressBarBg').style.display = 'block';
            document.getElementById('progressBar').style.width = percent + '%';
        }
    }

    // === 极速启动引擎 ===
    window.runScanner = async function() {
        if(isRunning) return;
        isRunning = true;
        
        let btn = document.getElementById('startBtn');
        btn.disabled = true;
        document.getElementById('btnText').innerText = "⏳ 正在全速推算中...";
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('result-area').innerHTML = '';
        
        let longResults = [];
        let shortResults = [];
        let passed4HCoins = []; // 第一轮胜出者

        try {
            // ================= 第一轮：4H 大趋势过滤 =================
            updateProgress("第 1/3 步：正在扫描4H大趋势...", 10);
            const chunkSize = 5;
            
            for (let i = 0; i < targetCoins.length; i += chunkSize) {
                let chunk = targetCoins.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (instId) => {
                    try {
                        let res = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=4H&limit=30`).then(r=>r.json());
                        if(res.code === '0' && res.data.length > 20) {
                            let c4H = res.data.reverse().map(d => +d[4]);
                            let e5 = calcEMA(c4H, 5), e10 = calcEMA(c4H, 10), e20 = calcEMA(c4H, 20);
                            let last = c4H.length - 1;

                            // 4H 完美多头：价格 > 20均线，且 5均线 > 10均线
                            let isBull4H = (c4H[last] > e20[last]) && (e5[last] > e10[last]);
                            // 4H 完美空头：价格 < 20均线，且 5均线 < 10均线
                            let isBear4H = (c4H[last] < e20[last]) && (e5[last] < e10[last]);

                            if(isBull4H) passed4HCoins.push({ instId, type: 'LONG' });
                            if(isBear4H) passed4HCoins.push({ instId, type: 'SHORT' });
                        }
                    } catch(e) {}
                }));
                updateProgress("第 1/3 步：正在扫描4H大趋势...", 10 + (i / targetCoins.length) * 30);
            }

            if(passed4HCoins.length === 0) {
                updateProgress("扫描完毕：当前20个币4H级别均无极端单边趋势。", 100);
                endScanner();
                return;
            }

            // ================= 第二轮：1H 拐点过滤 =================
            updateProgress(`已过滤${targetCoins.length - passed4HCoins.length}个，正在找1H拐点...`, 40);
            let passed1HCoins = [];

            for (let i = 0; i < passed4HCoins.length; i += chunkSize) {
                let chunk = passed4HCoins.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (coin) => {
                    try {
                        let res = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${coin.instId}&bar=1H&limit=30`).then(r=>r.json());
                        if(res.code === '0' && res.data.length > 20) {
                            let c1H = res.data.reverse().map(d => +d[4]);
                            let macd = calcMACD(c1H);
                            let e20 = calcEMA(c1H, 20);
                            let last = c1H.length - 1;
                            let price = c1H[last];

                            if(coin.type === 'LONG') {
                                // 多头拐点：1H MACD死叉(回调)，或价格逼近1H EMA20
                                let isPullback = (macd.macd[last] < macd.signal[last]) || (Math.abs(price - e20[last]) / price < 0.01);
                                if(isPullback) passed1HCoins.push({ ...coin, c1H: c1H }); 
                            } else {
                                // 空头拐点：1H MACD金叉(反弹)，或价格反抽1H EMA20
                                let isRebound = (macd.macd[last] > macd.signal[last]) || (Math.abs(price - e20[last]) / price < 0.01);
                                if(isRebound) passed1HCoins.push({ ...coin, c1H: c1H });
                            }
                        }
                    } catch(e) {}
                }));
                updateProgress("第 2/3 步：正在寻找1H级别拐点...", 40 + (i / passed4HCoins.length) * 30);
            }

            if(passed1HCoins.length === 0) {
                updateProgress("扫描完毕：均无1H级别回调/反弹，建议等待。", 100);
                endScanner();
                return;
            }

            // ================= 第三轮：5m 回弹/切入 =================
            updateProgress(`还剩${passed1HCoins.length}个，正在精准切入5m买点...`, 75);
            
            await Promise.all(passed1HCoins.map(async (coin) => {
                try {
                    let res = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${coin.instId}&bar=5m&limit=30`).then(r=>r.json());
                    if(res.code === '0' && res.data.length > 20) {
                        let fmt5M = res.data.reverse().map(d => ({ o:+d[1], c:+d[4], h:+d[2], l:+d[3], v:+d[5] }));
                        let c5M = fmt5M.map(d => d.c);
                        let macd = calcMACD(c5M);
                        let rsi = calcRSI(c5M, 14);
                        let last = c5M.length - 1;
                        let currK = fmt5M[last];

                        let score = 80;
                        let reason = '';
                        let vol = currK.v;
                        let avgVol = fmt5M.slice(-20).reduce((a,b)=>a+b.v,0)/20;
                        let volSpike = vol > avgVol * 1.2;

                        if(coin.type === 'LONG') {
                            // 5m 回弹切入：刚金叉，或极度超卖收阳
                            let isEntry = (macd.macd[last-1] <= macd.signal[last-1] && macd.macd[last] > macd.signal[last]) || (rsi[last] < 35 && currK.c > currK.o);
                            if(isEntry) {
                                if(volSpike) score += 10;
                                if(rsi[last] < 30) score += 5;
                                reason = `4H级别大趋势<b>完美多头</b>，1H级别正处于主力洗盘（拐点已现）。当前5分钟级别 ${macd.hist[last] > 0 ? 'MACD刚金叉' : '严重超卖'} 且 ${volSpike ? '<span class="highlight">伴随放量</span>' : '缩量'}。微观买点已现，属于<b>顺大势、逆小势的绝佳回弹切入位</b>。`;
                                longResults.push({ instId: coin.instId.replace('-USDT-SWAP', ''), score: score, reason: reason });
                            }
                        } else {
                            // 5m 遇阻切入：刚死叉，或极度超买收阴
                            let isEntry = (macd.macd[last-1] >= macd.signal[last-1] && macd.macd[last] < macd.signal[last]) || (rsi[last] > 65 && currK.c < currK.o);
                            if(isEntry) {
                                if(volSpike) score += 10;
                                if(rsi[last] > 70) score += 5;
                                reason = `4H级别被均线死死压制，属于<b>宏观空头</b>。1H级别反弹诱多结束（拐点已现）。当前5分钟级别 ${macd.hist[last] < 0 ? 'MACD刚死叉' : '严重超买'} 且遇阻。上方抛压极重，属于<b>顺势逢高做空的最佳切入点</b>。`;
                                shortResults.push({ instId: coin.instId.replace('-USDT-SWAP', ''), score: score, reason: reason });
                            }
                        }
                    }
                } catch(e) {}
            }));

            // 渲染结果
            longResults.sort((a, b) => b.score - a.score);
            shortResults.sort((a, b) => b.score - a.score);
            renderResults(longResults.slice(0, 3), shortResults.slice(0, 3));

        } catch (err) {
            updateProgress("推算发生错误，请检查网络后再试。", 100);
            endScanner();
        }
    }

    function endScanner() {
        isRunning = false;
        let btn = document.getElementById('startBtn');
        btn.disabled = false;
        document.getElementById('btnText').innerText = "⚡ 重新推算";
    }

    // === UI 渲染 ===
    function renderResults(longs, shorts) {
        updateProgress("✅ 推算完成！已为您找出最优共振点。", 100);
        endScanner();
        
        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        let html = '';

        html += `<div class="section-title long">🟢 强烈看多 Top 3</div>`;
        if(longs.length === 0) html += `<div style="color:#848e9c; font-size:13px; margin-bottom:20px;">暂无完美多头。耐心等4H多头+1H回调+5m企稳。</div>`;
        longs.forEach((item, index) => {
            html += `
                <div class="card long-card">
                    <div class="card-header"><div class="coin-name">${index+1}. ${item.instId}</div><div class="score-badge">信心分: ${item.score}</div></div>
                    <div class="reason-box"><b>推算理由：</b><br>${item.reason}</div>
                </div>`;
        });

        html += `<div class="section-title short" style="margin-top:10px;">🔴 强烈看空 Top 3</div>`;
        if(shorts.length === 0) html += `<div style="color:#848e9c; font-size:13px;">暂无完美空头。耐心等4H空头+1H反弹+5m遇阻。</div>`;
        shorts.forEach((item, index) => {
            html += `
                <div class="card short-card">
                    <div class="card-header"><div class="coin-name">${index+1}. ${item.instId}</div><div class="score-badge">信心分: ${item.score}</div></div>
                    <div class="reason-box"><b>推算理由：</b><br>${item.reason}</div>
                </div>`;
        });

        area.innerHTML = html;
    }

    // ================= 指标计算函数区 =================
    function calcEMA(prices, p) { let k=2/(p+1), e=[prices[0]], prev=prices[0]; for(let i=1;i<prices.length;i++){prev=prices[i]*k+prev*(1-k);e.push(prev);} return e; }
    
    function calcMACD(prices) { 
        let e12 = calcEMA(prices, 12); let e26 = calcEMA(prices, 26); 
        let macdLine = e12.map((v, i) => v - e26[i]); 
        let signalLine = calcEMA(macdLine, 9); 
        let hist = macdLine.map((v, i) => (v - signalLine[i]) * 2);
        return { macd: macdLine, signal: signalLine, hist: hist }; 
    }

    function calcRSI(prices, period) { 
        let gains=0,losses=0,rsi=[]; 
        for(let i=1;i<prices.length;i++){
            let diff=prices[i]-prices[i-1]; 
            if(diff>=0) gains+=diff; else losses-=diff; 
            if(i===period){let ag=gains/period, al=losses/period; rsi.push(100-(100/(1+ag/al)));} 
            else if(i>period){
                let diff2=prices[i]-prices[i-1]; let g=diff2>0?diff2:0; let l=diff2<0?-diff2:0; 
                let lastRsi=rsi[rsi.length-1]; 
                rsi.push(lastRsi + (100-lastRsi)*g/period - lastRsi*l/period);
            } else { rsi.push(50); }
        } 
        return rsi; 
    }
</script>
</body>
</html>
