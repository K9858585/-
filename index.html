<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欧易合约·趋势扫描 v4.4</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 15px; padding-bottom: 80px; font-size: 14px;
  }
  .header { text-align: center; margin: 20px 0 25px; color: #f5d76e; }
  .header h1 { font-size: 24px; font-weight: 800; }
  .header p { font-size: 13px; color: #888; margin-top: 5px; }
  .section {
    background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 20px;
    border: 1px solid #333;
  }
  .sec-title { font-size: 15px; color: #bbb; margin-bottom: 12px; display: block; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  input, select {
    flex: 1; background: #2a2a2a; border: 1px solid #444; color: #fff;
    padding: 12px; border-radius: 8px; font-size: 16px; outline: none;
  }
  .btn {
    background: #f5d142; color: #121212; border: none; padding: 12px 20px;
    border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    white-space: nowrap; touch-action: manipulation;
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-full { width: 100%; margin-top: 5px; background: #333; color: #ccc; border: 1px solid #444; }
  .status { text-align: center; margin-top: 15px; color: #888; font-size: 14px; }
  .card { background: #252525; border-radius: 10px; padding: 12px; margin-top: 10px; border-left: 4px solid #555; }
  .card.l1 { border-left-color: #ffd700; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rank { font-weight: bold; font-size: 16px; }
  .g { color: #0ecb81; } .r { color: #f6465d; } .y { color: #f5d142; } .b { color: #888; }
  .row-d { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
  .row-d span { color: #999; }
  .txt { font-size: 13px; line-height: 1.5; color: #ccc; margin-top: 8px; white-space: pre-line; }
  .note { font-size: 12px; color: #777; margin-top: 8px; }
  .err { color: #f6465d; padding: 15px; background: #2a1a1a; border-radius: 8px; margin-top: 10px; }
  .empty { text-align: center; color: #888; padding: 20px 0; }
  .fold-bar {
    background: #2a2a2a; padding: 10px; border-radius: 6px; margin-top: 10px;
    cursor: pointer; font-size: 13px; color: #bbb; display: flex; justify-content: space-between;
  }
  .fold-content { display: none; padding: 10px 0 0; }
  .fold-content.open { display: block; }
</style>
</head>
<body>
  <div class="header">
    <h1>🛰️ 欧易合约·趋势扫描 v4.4</h1>
    <p>① 成交额前5详情 ② 单币走势判定 ③ 抄底雷达</p>
  </div>

  <!-- 第一栏 -->
  <div class="section">
    <span class="sec-title">Top N 成交额扫描 · 展示前 5 名详细判定</span>
    <div class="row">
      <input type="number" id="inpScan" value="50">
      <button class="btn" id="btnScan">🚀 扫描</button>
    </div>
    <div id="scanOut"></div>
  </div>

  <!-- 第二栏 -->
  <div class="section">
    <span class="sec-title">单币走势判定 · 输入币种 → 选周期</span>
    <div class="row">
      <input type="text" id="inpSym" value="BTC" placeholder="如 BTC">
      <select id="inpPeriod"><option>4小时·波段</option><option>15分钟·短线</option><option>日线·趋势</option></select>
      <button class="btn" id="btnJudge">🔍 判定</button>
    </div>
    <button class="btn btn-full" id="btnClear">🗑️ 清空历史</button>
    <div id="judgeOut"></div>
  </div>

  <!-- 第三栏 -->
  <div class="section">
    <span class="sec-title">抄底雷达 · 成交额前 N 找超跌反转</span>
    <div class="row">
      <input type="number" id="inpRadar" value="30">
      <button class="btn" id="btnRadar">📡 雷达搜索</button>
    </div>
    <div id="radarOut"></div>
  </div>

  <div class="status" id="pt">就绪</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n?.toLocaleString(undefined,{maximumFractionDigits:2}) ?? '--';
const fmtUsd = n => (n>=1e8?fmt(n/1e8)+'亿':n>=1e4?fmt(n/1e4)+'万':fmt(n))+' USDT';
const esc = s => s.replace(/</g,'&lt;');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function foldHtml(id, title, lines, open){
  return `<div class="fold-bar" onclick="document.getElementById('${id}').classList.toggle('open')">${title} <span>▼</span></div>
          <div class="fold-content ${open?'open':''}" id="${id}">${lines.map(l=>`<div class="txt">• ${esc(l)}</div>`).join('')}</div>`;
}

// 模拟接口与判定（实际环境需替换为真实API请求，此处保证UI可交互）
async function mockScan(N){
  $('pt').innerText = `扫描中 ${N}...`;
  await sleep(600);
  let h = `<div class="card l1"><div class="head"><span class="rank">1. BTC</span><span class="g" style="font-weight:700">活跃</span></div>
    <div class="row-d"><span>现价/成交额</span><b>64915 · 120亿</b></div>
    <div class="row-d"><span>本周期</span><b class="g">+1.87%</b></div>
    <div class="txt">EMA20与EMA50未形成排列，压在年线下方，大周期偏空。ADX 38趋势行情，空方主导。RSI 52中性。</div>
    ${foldHtml('s1','📝 详细依据(5条)',['方向未定','反弹属修复','红柱放大','空方主导','缩量0.6倍'],true)}
    <div class="note r">🛑 止损：61931 ｜ 压力：81944</div></div>`;
  $('scanOut').innerHTML = h;
  $('pt').innerText = `扫完 ${N} 只 · 展示前 1`;
}

async function mockJudge(){
  $('pt').innerText = '判定中...';
  await sleep(400);
  $('judgeOut').innerHTML = `<div class="card"><div class="head"><span class="rank">BTC · 4小时</span><span class="y">27分</span></div>
    <div class="row-d"><span>现价</span><b>64915.40</b></div>
    <div class="txt">均线纠缠，趋势市。价在VWAP下方，反弹有压制。处于区间15%位置。</div>
    <div class="note">短周期方向要和日线同向才可靠。</div></div>`;
  $('pt').innerText = 'BTC 判定完成';
}

async function mockRadar(N){
  $('pt').innerText = `雷达扫描 ${N}...`;
  await sleep(800);
  $('radarOut').innerHTML = `<div class="card"><div class="empty">前 ${N} 名无抄底候选<br>趋势市里抄底等于逆势，空仓也是仓位</div></div>`;
  $('pt').innerText = `扫完 ${N} 只 · 0 候选`;
}

// 绑定事件（确保不冲突）
$('btnScan').onclick = e => { if(e.target.disabled) return; e.target.disabled=true; mockScan($('inpScan').value).finally(()=>e.target.disabled=false); };
$('btnJudge').onclick = e => { if(e.target.disabled) return; e.target.disabled=true; mockJudge().finally(()=>e.target.disabled=false); };
$('btnRadar').onclick = e => { if(e.target.disabled) return; e.target.disabled=true; mockRadar($('inpRadar').value).finally(()=>e.target.disabled=false); };
$('btnClear').onclick = () => { $('judgeOut').innerHTML=''; localStorage.removeItem('hist'); $('pt').innerText='历史已清空'; };

// 初始加载
window.onload = () => { mockScan(50); };
</script>
</body>
</html>
