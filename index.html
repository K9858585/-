<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前20币 未来1小时预测 (防接飞刀终极版)</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; -webkit-overflow-scrolling: touch; }

        #top-bar { background: var(--panel); padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }

        .btn-container { width: 100%; max-width: 400px; display: flex; gap: 10px; }
        .scan-btn {
            background: linear-gradient(135deg, #0ecb81, #2962ff); color: #fff; border: none;
            padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(41,98,255,0.4); flex: 1; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .scan-btn:active { transform: scale(0.98); }
        .scan-btn:disabled { background: #363a45; color: #848e9c; box-shadow: none; cursor: not-allowed; }
        
        .auto-btn { background: linear-gradient(135deg, #fcd535, #f6465d); box-shadow: 0 6px 20px rgba(246,70,93,0.4); }
        .auto-btn.active { background: #2a2e39; color: var(--yellow); box-shadow: none; border: 1px solid var(--yellow); }

        .progress-text { font-size: 13px; color: var(--yellow); height: 20px; text-align: center; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 4px; background: #2a2e39; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }

        #result-area { flex: 1; padding: 15px; padding-bottom: 100px; display: none; flex-direction: column; gap: 15px; }

        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title.long { color: var(--up); }
        .section-title.short { color: var(--down); }

        details { background: var(--panel); border-radius: 10px; margin-bottom: 10px; overflow: hidden; border-left: 4px solid #fff; transition: all 0.3s; }
        details.long-item { border-left-color: var(--up); }
        details.short-item { border-left-color: var(--down); }
        
        summary { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none; font-weight: bold; }
        summary::-webkit-details-marker { display: none; }
        
        .summary-left { display: flex; align-items: center; gap: 10px; }
        .coin-name { font-size: 18px; color: #fff; }
        .summary-right { display: flex; align-items: center; gap: 10px; }
        
        .score-badge { font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
        .long-item .score-badge { background: rgba(14,203,129,0.15); color: var(--up); }
        .short-item .score-badge { background: rgba(246,70,93,0.15); color: var(--down); }
        
        .arrow-icon { font-size: 12px; color: var(--sub); transition: transform 0.2s; }
        details[open] .arrow-icon { transform: rotate(180deg); }

        .detail-content { padding: 0 15px 15px 15px; border-top: 1px solid #2a2e39; margin-top: 5px; }
        
        .reason-tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin: 3px; background: #12161f; border: 1px solid #2a2e39; }
        .tag-long { color: var(--up); border-color: rgba(14,203,129,0.3); }
        .tag-short { color: var(--down); border-color: rgba(246,70,93,0.3); }
        
        .analysis-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2a2e39; font-size: 13px; }
        .analysis-row:last-child { border-bottom: none; }
        .analysis-label { color: var(--sub); }
        .analysis-value { font-weight: bold; color: #fff; text-align: right;}

        .empty-tip { color: #848e9c; font-size: 13px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="btn-container">
            <button class="scan-btn" id="startBtn" onclick="runScanner()">
                <span id="btnText">🎯 预测未来1小时 (前20币)</span>
            </button>
            <button class="scan-btn auto-btn" id="autoBtn" onclick="toggleAutoScan()" style="flex: 0.6;">
                <span id="autoBtnText">⏱️ 1分定时</span>
            </button>
        </div>
        <div class="progress-text" id="progressText">准备就绪</div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="result-area"></div>

<script>
    let isRunning = false;
    let autoScanInterval = null;
    let countdownInterval = null;
    let nextScanTime = 0;
    let isAutoScanning = false;
    const SCAN_INTERVAL = 1 * 60 * 1000; 

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        if (percent !== undefined) {
            document.getElementById('progressBarBg').style.display = 'block';
            document.getElementById('progressBar').style.width = Math.min(100, percent) + '%';
        }
    }

    function endScanner() {
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('btnText').innerText = "🎯 预测未来1小时 (前20币)";
        if (isAutoScanning) nextScanTime = Date.now() + SCAN_INTERVAL;
    }

    function toggleAutoScan() {
        const autoBtn = document.getElementById('autoBtn');
        const autoBtnText = document.getElementById('autoBtnText');
        if (isAutoScanning) {
            isAutoScanning = false;
            clearInterval(autoScanInterval); clearInterval(countdownInterval);
            autoBtn.classList.remove('active');
            autoBtnText.innerText = "⏱️ 1分定时";
            updateProgress("已停止自动扫描", 0);
        } else {
            isAutoScanning = true;
            autoBtn.classList.add('active');
            autoBtnText.innerText = "🛑 停止";
            runScanner();
            autoScanInterval = setInterval(() => { if (!isRunning) runScanner(); }, SCAN_INTERVAL);
            countdownInterval = setInterval(() => {
                if (!isRunning && nextScanTime > 0) {
                    const left = Math.max(0, nextScanTime - Date.now());
                    const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
                    if (left > 0) updateProgress(`⏱️ 自动运行中... 下次倒计时: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`, ((SCAN_INTERVAL - left) / SCAN_INTERVAL) * 100);
                }
            }, 1000);
        }
    }

    // ================= 指标计算函数区 =================
    function getEMAArray(prices, period) {
        if (prices.length === 0) return [];
        let k = 2 / (period + 1);
        let ema = prices[0];
        let result = [ema];
        for (let i = 1; i < prices.length; i++) {
            ema = prices[i] * k + ema * (1 - k);
            result.push(ema);
        }
        return result;
    }

    function calcMACD(closes) {
        if (closes.length < 26) return 0;
        const ema12 = getEMAArray(closes, 12);
        const ema26 = getEMAArray(closes, 26);
        return ema12[ema12.length-1] - ema26[ema26.length-1];
    }

    function calcRSI(closes, period = 14) {
        if (closes.length <= period) return 50;
        let gains = 0, losses = 0;
        for (let i = 1; i <= period; i++) {
            const diff = closes[i] - closes[i - 1];
            if (diff >= 0) gains += diff; else losses -= diff;
        }
        let avgGain = gains / period, avgLoss = losses / period;
        for (let i = period + 1; i < closes.length; i++) {
            const diff = closes[i] - closes[i - 1];
            let gain = diff > 0 ? diff : 0, loss = diff < 0 ? -diff : 0;
            avgGain = (avgGain * (period - 1) + gain) / period;
            avgLoss = (avgLoss * (period - 1) + loss) / period;
        }
        if (avgLoss === 0) return 100;
        return 100 - (100 / (1 + (avgGain / avgLoss)));
    }

    function calcBOLL(closes, period = 20, mult = 2) {
        if (closes.length < period) return { upper: 0, mid: 0, lower: 0 };
        const slice = closes.slice(-period);
        const sma = slice.reduce((a, b) => a + b, 0) / period;
        const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
        const stdDev = Math.sqrt(variance);
        return { upper: sma + mult * stdDev, mid: sma, lower: sma - mult * stdDev };
    }

    // ================= 核心打分引擎 (防飞刀版) =================
    function evaluateCoin(k15, k5, chgToday) {
        const closed15m = k15.slice(0, -1);
        const closes15m = closed15m.map(k => k.c);
        const last15m = closed15m[closed15m.length - 1];
        const cur15m = k15[k15.length - 1]; // 当前正在走的15m
        
        const closed5m = k5.slice(0, -1);
        const closes5m = closed5m.map(k => k.c);
        const lastK5 = closed5m[closed5m.length - 1];

        const ema20_15 = getEMAArray(closes15m, 20);
        const macd15 = calcMACD(closes15m);
        const boll15 = calcBOLL(closes15m);
        const macd5 = calcMACD(closes5m);
        const boll5 = calcBOLL(closes5m);
        const rsi5 = calcRSI(closes5m, 14);

        const prev5vol = closed5m.slice(-6, -1);
        const avgVol = prev5vol.reduce((sum, k) => sum + k.v, 0) / 5;
        const volRatio = avgVol > 0 ? lastK5.v / avgVol : 1;

        // 计算 K 线形态
        const body5 = Math.abs(lastK5.c - lastK5.o);
        const lowerWick5 = Math.min(lastK5.c, lastK5.o) - lastK5.l;
        const upperWick5 = lastK5.h - Math.max(lastK5.c, lastK5.o);
        
        let longScore = 0;
        let longReasons = [];
        let shortScore = 0;
        let shortReasons = [];

        // ================= 🚨 一票否决区（防接飞刀） =================
        // 1. 15m 极速下跌：当前15m正在走大阴线，跌幅超 0.8%，绝对禁止做多
        const cur15mDrop = (cur15m.o - cur15m.c) / cur15m.o * 100;
        if (cur15mDrop > 0.8) {
            longScore = -999; 
        }
        // 2. 5m 极速下跌：最新5m收盘是实体大阴线，跌幅超 0.8%，绝对禁止做多
        const last5mDrop = (lastK5.o - lastK5.c) / lastK5.o * 100;
        if (last5mDrop > 0.8) {
            longScore = -999;
        }
        // 3. 光脚阴线：最新5m是阴线且没有下影线，说明还要跌
        if (lastK5.c < lastK5.o && lowerWick5 < body5 * 0.2) {
            longScore = -999;
        }

        // 做空的一票否决区
        const cur15mRise = (cur15m.c - cur15m.o) / cur15m.o * 100;
        if (cur15mRise > 0.8) shortScore = -999;
        const last5mRise = (lastK5.c - lastK5.o) / lastK5.o * 100;
        if (last5mRise > 0.8) shortScore = -999;
        if (lastK5.c > lastK5.o && upperWick5 < body5 * 0.2) shortScore = -999;


        // ================= 做多打分逻辑 =================
        if (longScore > -999) {
            if (closes15m[closes15m.length-1] > ema20_15[ema20_15.length-1]) { longScore += 10; longReasons.push("15m价格在EMA20上"); }
            if (macd15 > 0) { longScore += 10; longReasons.push("15m MACD多头"); }
            if (closes15m[closes15m.length-1] > boll15.mid) { longScore += 10; longReasons.push("15m运行于中轨上"); }
            if (macd5 > 0) { longScore += 10; longReasons.push("5m MACD多头"); }
            if (lastK5.c > boll5.mid) { longScore += 10; longReasons.push("5m价格在中轨上"); }

            // 只有企稳反转才加分
            if (rsi5 < 40 && lastK5.c > lastK5.o) { longScore += 15; longReasons.push(`5m RSI超卖且收阳`); }
            if (lowerWick5 > body5 * 1.5 && lastK5.c > lastK5.o) { longScore += 15; longReasons.push("5m长下影探底回升"); }

            if (volRatio > 1.5 && lastK5.c > lastK5.o) { longScore += 10; longReasons.push("5m放量阳线"); }
            if (chgToday < -8) { longScore += 10; longReasons.push(`今日大跌${chgToday.toFixed(1)}%`); }
        }

        // ================= 做空打分逻辑 =================
        if (shortScore > -999) {
            if (closes15m[closes15m.length-1] < ema20_15[ema20_15.length-1]) { shortScore += 10; shortReasons.push("15m价格在EMA20下"); }
            if (macd15 < 0) { shortScore += 10; shortReasons.push("15m MACD空头"); }
            if (closes15m[closes15m.length-1] < boll15.mid) { shortScore += 10; shortReasons.push("15m运行于中轨下"); }
            if (macd5 < 0) { shortScore += 10; shortReasons.push("5m MACD空头"); }
            if (lastK5.c < boll5.mid) { shortScore += 10; shortReasons.push("5m价格在中轨下"); }

            if (rsi5 > 60 && lastK5.c < lastK5.o) { shortScore += 15; shortReasons.push(`5m RSI超买且收阴`); }
            if (upperWick5 > body5 * 1.5 && lastK5.c < lastK5.o) { shortScore += 15; shortReasons.push("5m长上影冲高回落"); }

            if (volRatio > 1.5 && lastK5.c < lastK5.o) { shortScore += 10; shortReasons.push("5m放量阴线"); }
            if (chgToday > 8) { shortScore += 10; shortReasons.push(`今日大涨${chgToday.toFixed(1)}%`); }
        }

        return { 
            longScore: Math.min(100, longScore), longReasons,
            shortScore: Math.min(100, shortScore), shortReasons,
            rsi5, macd15, macd5
        };
    }


    // ================= 主流程 =================
    async function fetchTop20Swaps() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 15000);
        try {
            const [instRes, tickerRes] = await Promise.all([
                fetch('https://www.okx.com/api/v5/public/instruments?instType=SWAP', { signal: ctrl.signal }).then(r => r.json()),
                fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP', { signal: ctrl.signal }).then(r => r.json())
            ]);
            if (instRes.code !== '0' || tickerRes.code !== '0') return [];
            const validInsts = new Set(instRes.data.filter(i => i.instId.endsWith('-USDT-SWAP')).map(i => i.instId));
            
            return tickerRes.data
                .filter(t => validInsts.has(t.instId))
                .map(t => {
                    const last = +t.last;
                    const todayOpen = +t.sodUtc8 || +t.open24h; 
                    return { instId: t.instId, vol: +t.volCcy24h || 0, chgToday: todayOpen > 0 ? (last - todayOpen) / todayOpen * 100 : 0 };
                })
                .sort((a, b) => b.vol - a.vol).slice(0, 20); 
        } finally { clearTimeout(timer); }
    }

    async function fetchCandles(instId, bar, limit) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const res = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`, { signal: ctrl.signal }).then(r => r.json());
            if (res.code !== '0' || !res.data || !res.data.length) throw new Error('no data');
            return res.data.map(d => ({ t: +d[0], o: +d[1], h: +d[2], l: +d[3], c: +d[4], v: +d[5], confirm: d[8] === '1' })).reverse();
        } finally { clearTimeout(timer); }
    }

    window.runScanner = async function() {
        if (isRunning) return;
        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('btnText').innerText = "⏳ 深度计算指标中...";
        const area = document.getElementById('result-area');
        area.style.display = 'none';
        area.innerHTML = '';
        
        let longResults = [], shortResults = [];

        try {
            const targetCoins = await fetchTop20Swaps();
            if (targetCoins.length === 0) { updateProgress("获取合约失败。", 100); endScanner(); return; }

            updateProgress(`正在对前20活跃币进行未来1小时推演...`, 5);
            let done = 0;

            await Promise.all(targetCoins.map(async (coin) => {
                try {
                    const [k15, k5] = await Promise.all([
                        fetchCandles(coin.instId, '15m', 30), 
                        fetchCandles(coin.instId, '5m', 30)
                    ]);
                    
                    if (k15.length < 25 || k5.length < 25) return;

                    const result = evaluateCoin(k15, k5, coin.chgToday);
                    const currentPrice = k5[k5.length - 1].c;

                    // 只有大于 0 分且没有被一票否决，才进入榜单
                    if (result.longScore >= 50) {
                        longResults.push({ ...coin, ...result, price: currentPrice });
                    }
                    if (result.shortScore >= 50) {
                        shortResults.push({ ...coin, ...result, price: currentPrice });
                    }
                } catch (e) {}
                done++;
                updateProgress(`推演中... (${done}/20)`, 5 + (done / 20) * 90);
            }));

            longResults.sort((a, b) => b.longScore - a.longScore);
            shortResults.sort((a, b) => b.shortScore - a.shortScore);

            renderResults(longResults.slice(0, 3), shortResults.slice(0, 3));

        } catch (err) {
            updateProgress("推算发生错误，请稍后再试。", 100);
            endScanner();
        }
    };

    function formatPrice(p) {
        if (p >= 1000) return p.toFixed(2); if (p >= 10) return p.toFixed(3);
        if (p >= 0.1) return p.toFixed(4); if (p >= 0.001) return p.toFixed(5);
        return p.toFixed(6);
    }

    function renderResults(longs, shorts) {
        updateProgress("✅ 推演完成，已生成排名", 100);
        endScanner();
        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        let html = '';

        // --- 做多榜 ---
        html += `<div class="section-title long">🟢 未来1小时 做多潜力 Top 3</div>`;
        if (longs.length === 0) html += `<div class="empty-tip">当前市场无明显做多指标共振（或正在加速下跌，已过滤）。</div>`;
        
        longs.forEach((item, index) => {
            html += `
                <details class="long-item" ${index === 0 ? 'open' : ''}>
                    <summary>
                        <div class="summary-left">
                            <span class="coin-name">${index + 1}. ${item.instId.replace('-USDT-SWAP', '')}</span>
                        </div>
                        <div class="summary-right">
                            <span class="score-badge">多分: ${item.longScore}</span>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </summary>
                    <div class="detail-content">
                        <div class="analysis-row">
                            <span class="analysis-label">当前价格 / 今日涨跌</span>
                            <span class="analysis-value">${formatPrice(item.price)} / <span style="color:${item.chgToday>0?'var(--up)':'var(--down)'}">${item.chgToday.toFixed(2)}%</span></span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">5m RSI 极值</span>
                            <span class="analysis-value" style="color:var(--yellow)">${item.rsi5.toFixed(1)}</span>
                        </div>
                        
                        <div style="margin-top: 10px;">
                            <div class="analysis-label" style="margin-bottom: 5px;">核心得分点：</div>
                            ${item.longReasons.map(r => `<span class="reason-tag tag-long">✔ ${r}</span>`).join('')}
                        </div>
                    </div>
                </details>`;
        });

        // --- 做空榜 ---
        html += `<div class="section-title short" style="margin-top:20px;">🔴 未来1小时 做空潜力 Top 3</div>`;
        if (shorts.length === 0) html += `<div class="empty-tip">当前市场无明显做空指标共振（或正在加速拉升，已过滤）。</div>`;
        
        shorts.forEach((item, index) => {
            html += `
                <details class="short-item" ${index === 0 ? 'open' : ''}>
                    <summary>
                        <div class="summary-left">
                            <span class="coin-name">${index + 1}. ${item.instId.replace('-USDT-SWAP', '')}</span>
                        </div>
                        <div class="summary-right">
                            <span class="score-badge">空分: ${item.shortScore}</span>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </summary>
                    <div class="detail-content">
                        <div class="analysis-row">
                            <span class="analysis-label">当前价格 / 今日涨跌</span>
                            <span class="analysis-value">${formatPrice(item.price)} / <span style="color:${item.chgToday>0?'var(--up)':'var(--down)'}">${item.chgToday.toFixed(2)}%</span></span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">5m RSI 极值</span>
                            <span class="analysis-value" style="color:var(--yellow)">${item.rsi5.toFixed(1)}</span>
                        </div>

                        <div style="margin-top: 10px;">
                            <div class="analysis-label" style="margin-bottom: 5px;">核心得分点：</div>
                            ${item.shortReasons.map(r => `<span class="reason-tag tag-short">✔ ${r}</span>`).join('')}
                        </div>
                    </div>
                </details>`;
        });

        area.innerHTML = html;
    }
</script>
</body>
</html>
