<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欧易参数 多空双杀雷达</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { background: var(--panel); padding: 10px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; gap: 10px; }
        .top-controls { display: flex; gap: 8px; width: 100%; align-items: center; }
        .search-box { display: flex; flex: 1; gap: 5px; }
        .search-box input { flex: 1; background: #2a2e39; border: 1px solid #363a45; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px; text-transform: uppercase; outline: none; }
        .search-box button { background: var(--blue); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .scan-btn { background: linear-gradient(135deg, #0ecb81, #f6465d); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; box-shadow: 0 0 10px rgba(246,70,93,0.4);}
        
        /* 多空列表展示区 */
        #signal-area { display: none; flex-direction: column; gap: 8px; padding-top: 5px; }
        .signal-row { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .card-long { flex: 1 1 30%; min-width: 90px; padding: 6px; border-radius: 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; background: rgba(14,203,129,0.08); border: 1px solid var(--up); }
        .card-short { flex: 1 1 30%; min-width: 90px; padding: 6px; border-radius: 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; background: rgba(246,70,93,0.08); border: 1px solid var(--down); }
        
        .card-title { font-size: 10px; color: #fff; }
        .coin-long { font-size: 14px; font-weight: 900; color: var(--up); }
        .coin-short { font-size: 14px; font-weight: 900; color: var(--down); }
        .score-text { font-size: 9px; color: var(--sub); }

        #coinList { display: none; flex-wrap: wrap; gap: 8px; max-height: 120px; overflow-y: auto; }
        .coin-tag { padding: 6px 10px; background: #2a2e39; border-radius: 4px; font-size: 13px; font-weight: bold; color: var(--sub); cursor: pointer; border: 1px solid transparent;}
        .coin-tag.active { background: rgba(41, 98, 255, 0.1); border-color: var(--blue); color: var(--blue); }

        #time-bar { display: flex; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid #2a2e39; gap: 5px; overflow-x: auto; }
        .time-btn { background: transparent; border: none; color: var(--sub); padding: 6px 12px; font-size: 13px; font-weight: bold; border-radius: 4px; }
        .time-btn.active { background: #2a2e39; color: #fff; }
        
        #price-bar { padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        #currentCoinName { font-size: 18px; font-weight: 900; color: #fff; }
        #currentPrice { font-size: 32px; font-weight: 900; color: var(--up); font-family: monospace; }
        .right-info { display: flex; flex-direction: column; align-items: flex-end; margin-left: auto; }
        #status-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #fcd535; color: #000; font-weight: bold;}
        
        #chart-container { flex: 1; min-height: 200px; position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        
        #analysis-panel { height: 20vh; background: var(--panel); padding: 15px; overflow-y: auto; flex-shrink: 0; border-top: 1px solid #2a2e39; }
        .analysis-header { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 8px; }
        #analysis-text { font-size: 13px; line-height: 1.6; color: #b2b5be; text-align: justify; }

        #scanner-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .scanner-box { background: var(--panel); border-radius: 12px; width: 100%; max-width: 350px; padding: 20px; border: 1px solid #363a45; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .scan-loading { color: var(--yellow); font-weight: bold; font-size: 14px; line-height: 1.5;}
        .close-btn { display: none; margin-top: 15px; padding: 10px 20px; background: var(--blue); color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="scanner-modal">
        <div class="scanner-box">
            <div class="scan-loading" id="scan-status">正在执行多空双杀扫描...</div>
            <button class="close-btn" id="modal-close-btn" onclick="closeScannerModal()">返回页面</button>
        </div>
    </div>

    <div id="top-bar">
        <div class="top-controls">
            <div class="search-box">
                <input type="text" id="coinInput" placeholder="如 BTC" onkeydown="if(event.key==='Enter') addCoin()">
                <button onclick="addCoin()">+</button>
            </div>
            <button class="scan-btn" onclick="runScanner()">⚔️ 多空双杀扫描</button>
            <button onclick="toggleView()" style="background:#363a45; color:#fff; border:none; padding:8px; border-radius:4px;">▼</button>
        </div>
        
        <!-- 多空展示区 -->
        <div id="signal-area">
            <div class="signal-row" id="long-area"></div>
            <div class="signal-row" id="short-area"></div>
        </div>
        
        <div id="coinList"></div>
    </div>

    <div id="time-bar">
        <button class="time-btn active" data-tf="5m" onclick="switchTimeframe('5m')">5分 (找买点)</button>
        <button class="time-btn" data-tf="1H" onclick="switchTimeframe('1H')">1小时 (看回调)</button>
        <button class="time-btn" data-tf="4H" onclick="switchTimeframe('4H')">4小时 (看大牛/大熊)</button>
    </div>

    <div id="price-bar">
        <span id="currentCoinName">--</span>
        <span id="currentPrice">--</span>
        <div class="right-info"><span id="status-tag">加载中...</span></div>
    </div>

    <div id="chart-container">
        <canvas id="chartCanvas"></canvas>
    </div>

    <div id="analysis-panel">
        <div class="analysis-header">🎯 双杀解析</div>
        <div id="analysis-text">等待扫描...</div>
    </div>

<script>
    let scanLongs = JSON.parse(localStorage.getItem('okx_dual_long')) || null; 
    let scanShorts = JSON.parse(localStorage.getItem('okx_dual_short')) || null; 
    let coinList = JSON.parse(localStorage.getItem('okx_coins')) || ['BTC-USDT-SWAP', 'ETH-USDT-SWAP'];
    
    let currentCoin = (scanLongs && scanLongs.length > 0) ? scanLongs[0].instId : ((scanShorts && scanShorts.length > 0) ? scanShorts[0].instId : coinList[0]);
    let currentTf = '5m'; 
    let klineData = [];
    let ws = null;

    window.closeScannerModal = function() {
        document.getElementById('scanner-modal').style.display = 'none';
        document.getElementById('modal-close-btn').style.display = 'none';
    }

    window.toggleView = function() {
        let isScan = document.getElementById('signal-area').style.display === 'flex';
        document.getElementById('signal-area').style.display = isScan ? 'none' : 'flex';
        document.getElementById('coinList').style.display = isScan ? 'flex' : 'none';
    }

    window.addCoin = function() {
        let val = document.getElementById('coinInput').value.trim().toUpperCase();
        if(!val) return;
        val = val.replace('-USDT', '') + '-USDT-SWAP';
        if(coinList.includes(val)) return alert('已存在');
        fetch(`https://www.okx.com/api/v5/market/candles?instId=${val}&bar=1m&limit=1`).then(res=>res.json()).then(res=>{
            if(res.code === '0') {
                coinList.push(val); localStorage.setItem('okx_coins', JSON.stringify(coinList));
                document.getElementById('coinInput').value = ''; renderList(); switchCoin(val);
            } else alert('合约不存在');
        }).catch(()=>alert('网络错误'));
    }

    function renderList() {
        // 渲染自选
        document.getElementById('coinList').innerHTML = coinList.map(c => `
            <div class="coin-tag ${c===currentCoin?'active':''}" onclick="switchCoin('${c}')">
                ${c.replace('-USDT-SWAP','')}
            </div>
        `).join('');
        
        // 渲染多头
        const longArea = document.getElementById('long-area');
        longArea.innerHTML = '';
        if(scanLongs) {
            scanLongs.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = 'card-long';
                div.onclick = () => switchCoin(item.instId.replace('-USDT-SWAP',''));
                div.innerHTML = `<div class="card-title">🟢 多头 Top ${index+1}</div><div class="coin-long">${item.instId.replace('-USDT-SWAP','')}</div><div class="score-text">分: ${item.score}</div>`;
                longArea.appendChild(div);
            });
        }

        // 渲染空头
        const shortArea = document.getElementById('short-area');
        shortArea.innerHTML = '';
        if(scanShorts) {
            scanShorts.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = 'card-short';
                div.onclick = () => switchCoin(item.instId.replace('-USDT-SWAP',''));
                div.innerHTML = `<div class="card-title">🔴 空头 Top ${index+1}</div><div class="coin-short">${item.instId.replace('-USDT-SWAP','')}</div><div class="score-text">分: ${item.score}</div>`;
                shortArea.appendChild(div);
            });
        }
        
        document.getElementById('currentCoinName').innerText = currentCoin.replace('-USDT-SWAP','');
    }

    window.switchCoin = function(name) { 
        if(name === '--') return;
        let fullName = name.includes('-SWAP') ? name : name + '-USDT-SWAP';
        if(currentCoin !== fullName) { currentCoin = fullName; renderList(); loadData(); } 
    }

    window.switchTimeframe = function(tf) {
        currentTf = tf;
        document.querySelectorAll('.time-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tf === tf));
        loadData();
    }

    function loadData() {
        if(ws) ws.close();
        document.getElementById('status-tag').innerText = '加载中...';
        document.getElementById('status-tag').style.background = 'var(--yellow)';
        
        let t = setTimeout(() => { document.getElementById('status-tag').innerText = '超时'; document.getElementById('status-tag').style.background = 'var(--down)'; }, 3000);

        fetch(`https://www.okx.com/api/v5/market/candles?instId=${currentCoin}&bar=${currentTf}&limit=150`)
            .then(res => res.json())
            .then(res => {
                clearTimeout(t);
                if(res.code !== '0') throw new Error('API错误');
                klineData = res.data.reverse().map(d => ({ t: parseInt(d[0])/1000, o: +d[1], h: +d[2], l: +d[3], c: +d[4] }));
                document.getElementById('status-tag').innerText = '✅ 实时';
                document.getElementById('status-tag').style.background = 'var(--up)';
                drawChart();
                connectWS();
            })
            .catch(err => {
                clearTimeout(t);
                document.getElementById('status-tag').innerText = '❌ 失败';
                document.getElementById('status-tag').style.background = 'var(--down)';
            });
    }

    function connectWS() {
        ws = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
        ws.onopen = () => ws.send(JSON.stringify({ "op": "subscribe", "args": [{ "channel": `candle${currentTf}`, "instId": currentCoin }] }));
        ws.onmessage = (e) => {
            let msg = JSON.parse(e.data);
            if(msg.data) {
                let k = msg.data[0];
                let newC = { t: parseInt(k[0])/1000, o: +k[1], h: +k[2], l: +k[3], c: +k[4] };
                let last = klineData[klineData.length-1];
                if(last.t === newC.t) klineData[klineData.length-1] = newC;
                else klineData.push(newC);
                drawChart();
            }
        }
    }

    function drawChart() {
        if(!klineData.length) return;
        document.getElementById('currentPrice').innerText = klineData[klineData.length-1].c;

        const canvas = document.getElementById('chartCanvas'); const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        const w = canvas.clientWidth, h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);

        let max = Math.max(...klineData.map(d => d.h));
        let min = Math.min(...klineData.map(d => d.l));
        if(isNaN(max) || isNaN(min)) return;
        
        let range = max - min || 1; let cw = w / klineData.length;

        klineData.forEach((d, i) => {
            let x = i * cw;
            let yH = h - ((d.h - min) / range) * h;
            let yL = h - ((d.l - min) / range) * h;
            let yO = h - ((d.o - min) / range) * h;
            let yC = h - ((d.c - min) / range) * h;
            ctx.strokeStyle = d.c >= d.o ? '#0ecb81' : '#f6465d';
            ctx.beginPath(); ctx.moveTo(x + cw/2, yH); ctx.lineTo(x + cw/2, yL); ctx.stroke();
            ctx.fillStyle = d.c >= d.o ? '#0ecb81' : '#f6465d';
            ctx.fillRect(x + cw*0.2, Math.min(yO, yC), cw*0.6, Math.max(Math.abs(yO-yC), 1));
        });
    }

    // === 核心引擎：多空双杀 (欧易默认参数) ===
    window.runScanner = async function() {
        document.getElementById('scanner-modal').style.display = 'flex';
        document.getElementById('modal-close-btn').style.display = 'none';
        let status = document.getElementById('scan-status');
        status.innerText = "正在获取流动性最好的前150名...";

        try {
            let res = await fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP');
            let data = await res.json();
            
            let usdt = data.data.filter(t => t.instId.endsWith('-USDT-SWAP'));
            usdt.sort((a, b) => parseFloat(b.volCcy24h) - parseFloat(a.volCcy24h));
            let targetCoins = usdt.slice(0, 150); 

            let longCandidates1 = []; 
            let shortCandidates1 = []; 
            let batchSize = 15; 

            // --- 第一屏：4H 定大方向 ---
            status.innerText = "第一屏：寻找4H真多头与真空头...";
            for (let i = 0; i < targetCoins.length; i += batchSize) {
                let batch = targetCoins.slice(i, i + batchSize);
                
                let promises = batch.map(async (coin) => {
                    let instId = coin.instId;
                    try {
                        let k4H = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=4H&limit=50`).then(r=>r.json());
                        if(k4H.code === '0' && k4H.data.length > 30) {
                            let c4H = k4H.data.reverse().map(d => +d[4]);
                            let currentPrice = c4H[c4H.length - 1];

                            let e5 = calcEMA(c4H, 5);
                            let e10 = calcEMA(c4H, 10);
                            let e20 = calcEMA(c4H, 20);
                            
                            let macd4H = calcMACD(c4H);
                            let currDif = macd4H.macd[macd4H.macd.length-1];
                            let currDea = macd4H.signal[macd4H.signal.length-1];
                            
                            let lastE5 = e5[e5.length-1];
                            let lastE10 = e10[e10.length-1];
                            let lastE20 = e20[e20.length-1];

                            // 真多头
                            let isBull4H = (currentPrice > lastE5) && (lastE5 > lastE10) && (lastE10 > lastE20) && (currDif > currDea) && (currDif > 0);
                            // 真空头
                            let isBear4H = (currentPrice < lastE5) && (lastE5 < lastE10) && (lastE10 < lastE20) && (currDif < currDea) && (currDif < 0);

                            return { instId, isBull4H, isBear4H }; 
                        }
                    } catch(e) {}
                    return null;
                });
                let results = await Promise.all(promises);
                results.forEach(r => {
                    if(r) {
                        if(r.isBull4H) longCandidates1.push({instId: r.instId});
                        if(r.isBear4H) shortCandidates1.push({instId: r.instId});
                    }
                });
                await new Promise(r => setTimeout(r, 20));
            }

            if(longCandidates1.length === 0 && shortCandidates1.length === 0) {
                throw new Error("全市场暂无明显的4H大趋势。");
            }

            // --- 第二、三屏：1H回调 + 5m入场 ---
            status.innerText = "第二、三屏：精准共振过滤...";
            let finalLongs = [];
            let finalShorts = [];

            // 处理多头
            for (let i = 0; i < longCandidates1.length; i += batchSize) {
                let batch = longCandidates1.slice(i, i + batchSize);
                let promises = batch.map(async (coin) => {
                    try {
                        let [k1H, k5M] = await Promise.all([
                            fetch(`https://www.okx.com/api/v5/market/candles?instId=${coin.instId}&bar=1H&limit=50`).then(r=>r.json()),
                            fetch(`https://www.okx.com/api/v5/market/candles?instId=${coin.instId}&bar=5m&limit=50`).then(r=>r.json())
                        ]);
                        if(k1H.code === '0' && k5M.code === '0') {
                            let c1H = k1H.data.reverse().map(d => +d[4]);
                            let macd1H = calcMACD(c1H);
                            let is1HDead = macd1H.macd[macd1H.macd.length-1] < macd1H.signal[macd1H.signal.length-1]; // 1H回调

                            if(is1HDead) {
                                let fmt5M = k5M.data.reverse().map(d => ({ o:+d[1], c:+d[4], h:+d[2], l:+d[3], v:+d[5] }));
                                let c5M = fmt5M.map(d => d.c);
                                let macd5M = calcMACD(c5M);
                                let is5mCross = macd5M.macd[macd5M.macd.length-2] <= macd5M.signal[macd5M.signal.length-2] && macd5M.macd[macd5M.macd.length-1] > macd5M.signal[macd5M.signal.length-1];
                                let is5mRev = macd5M.hist[macd5M.hist.length-1] < 0 && macd5M.hist[macd5M.hist.length-1] > macd5M.hist[macd5M.hist.length-2];

                                if(is5mCross || is5mRev) {
                                    let score = 80;
                                    if(fmt5M[fmt5M.length-1].c > fmt5M[fmt5M.length-1].o) score += 10;
                                    return { instId: coin.instId, score: score };
                                }
                            }
                        }
                    } catch(e) {}
                    return null;
                });
                let results = await Promise.all(promises);
                finalLongs.push(...results.filter(r => r !== null));
            }

            // 处理空头
            for (let i = 0; i < shortCandidates1.length; i += batchSize) {
                let batch = shortCandidates1.slice(i, i + batchSize);
                let promises = batch.map(async (coin) => {
                    try {
                        let [k1H, k5M] = await Promise.all([
                            fetch(`https://www.okx.com/api/v5/market/candles?instId=${coin.instId}&bar=1H&limit=50`).then(r=>r.json()),
                            fetch(`https://www.okx.com/api/v5/market/candles?instId=${coin.instId}&bar=5m&limit=50`).then(r=>r.json())
                        ]);
                        if(k1H.code === '0' && k5M.code === '0') {
                            let c1H = k1H.data.reverse().map(d => +d[4]);
                            let macd1H = calcMACD(c1H);
                            let is1HGold = macd1H.macd[macd1H.macd.length-1] > macd1H.signal[macd1H.signal.length-1]; // 1H反弹

                            if(is1HGold) {
                                let fmt5M = k5M.data.reverse().map(d => ({ o:+d[1], c:+d[4], h:+d[2], l:+d[3], v:+d[5] }));
                                let c5M = fmt5M.map(d => d.c);
                                let macd5M = calcMACD(c5M);
                                let is5mCross = macd5M.macd[macd5M.macd.length-2] >= macd5M.signal[macd5M.signal.length-2] && macd5M.macd[macd5M.macd.length-1] < macd5M.signal[macd5M.signal.length-1]; // 5m死叉
                                let is5mRev = macd5M.hist[macd5M.hist.length-1] > 0 && macd5M.hist[macd5M.hist.length-1] < macd5M.hist[macd5M.hist.length-2]; // 红柱缩短

                                if(is5mCross || is5mRev) {
                                    let score = 80;
                                    if(fmt5M[fmt5M.length-1].c < fmt5M[fmt5M.length-1].o) score += 10; // 阴线加分
                                    return { instId: coin.instId, score: score };
                                }
                            }
                        }
                    } catch(e) {}
                    return null;
                });
                let results = await Promise.all(promises);
                finalShorts.push(...results.filter(r => r !== null));
            }

            // --- 结果处理 ---
            finalLongs.sort((a, b) => b.score - a.score);
            finalShorts.sort((a, b) => b.score - a.score);
            
            scanLongs = finalLongs.slice(0, 5);
            scanShorts = finalShorts.slice(0, 5);

            if(scanLongs.length === 0 && scanShorts.length === 0) {
                throw new Error("当前多空均无完美共振标的，建议空仓观望。");
            }

            localStorage.setItem('okx_dual_long', JSON.stringify(scanLongs));
            localStorage.setItem('okx_dual_short', JSON.stringify(scanShorts));
            
            document.getElementById('scanner-modal').style.display = 'none';
            document.getElementById('signal-area').style.display = 'flex';
            document.getElementById('coinList').style.display = 'none';
            renderList();
            
            // 默认优先展示多头，没有多头则展示空头
            if(scanLongs.length > 0) switchCoin(scanLongs[0].instId); 
            else if(scanShorts.length > 0) switchCoin(scanShorts[0].instId); 

        } catch (error) {
            status.innerText = error.message;
            document.getElementById('modal-close-btn').style.display = 'block';
        }
    }

    // ================= 指标计算函数区 =================
    function calcEMA(prices, p) { let k=2/(p+1), e=[prices[0]], prev=prices[0]; for(let i=1;i<prices.length;i++){prev=prices[i]*k+prev*(1-k);e.push(prev);} return e; }
    
    function calcMACD(prices) { 
        let e12 = calcEMA(prices, 12); let e26 = calcEMA(prices, 26); 
        let macdLine = e12.map((v, i) => v - e26[i]); 
        let signalLine = calcEMA(macdLine, 9); 
        let hist = macdLine.map((v, i) => (v - signalLine[i]) * 2);
        return { macd: macdLine, signal: signalLine, hist: hist }; 
    }

    window.onload = () => {
        renderList();
        if((scanLongs && scanLongs.length > 0) || (scanShorts && scanShorts.length > 0)) {
            document.getElementById('signal-area').style.display = 'flex';
            document.getElementById('coinList').style.display = 'none';
        } else {
            document.getElementById('coinList').style.display = 'flex';
        }
        loadData();
    };
</script>
