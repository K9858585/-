<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧易·双模技术选币</title>
<style>
  body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:680px;margin:0 auto}
  h1{font-size:20px;color:#f0b90b;margin:0 0 4px}
  .sub{font-size:12px;color:#888;margin-bottom:12px}
  .box{border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:16px;background:#181818}
  .ttl{font-size:15px;font-weight:bold;margin-bottom:10px;color:#fff}
  input,select,button{background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:8px 10px;font-size:14px;outline:none}
  input{flex:1;min-width:80px}
  button{background:#f0b90b;color:#111;font-weight:bold;cursor:pointer;border:none;padding:9px 14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .card{border:1px solid #333;border-radius:8px;padding:10px;margin-top:10px;background:#1c1c1c}
  .card.up{border-left:4px solid #0ecb81}
  .card.down{border-left:4px solid #f6465d}
  .score{float:right;font-size:22px;font-weight:bold}
  .up .score{color:#0ecb81}
  .down .score{color:#f6465d}
  .rd{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;color:#ccc}
  .rd b{color:#fff;font-weight:500}
  .g{color:#0ecb81}.r{color:#f6465d}
  .tag{font-size:11px;background:#333;padding:2px 6px;border-radius:4px;color:#aaa;margin-left:4px}
  .note{font-size:12px;color:#888;margin-top:6px;line-height:1.5}
  .err{color:#f6465d;font-size:14px;margin:10px 0}
  .toggle{cursor:pointer;color:#888;font-size:12px;margin-top:6px}
  .hidden{display:none}
  #st{font-size:12px;color:#666;margin-top:8px;text-align:right}
</style>
</head>
<body>
<h1>🛰 欧易·双模技术选币</h1>
<div class="sub">实时Ticker现价(盘口级) + 真实成交额 + 手动触发（无自动搜索）</div>

<!-- 窗口一：成交量排名 -->
<div class="box">
  <div class="ttl">① 成交量排名 · 推荐币种</div>
  <div class="row">
    <input id="inpN" placeholder="输入N（如 10 或 100）" value="10">
    <select id="bar1">
      <option value="4H">4小时（波段）</option>
      <option value="1D">日线（趋势）</option>
      <option value="1H">1小时（短线）</option>
    </select>
    <button id="btnRank">🎯 扫描成交额&推荐</button>
  </div>
  <div id="outRank"></div>
</div>

<!-- 窗口二：指定币种 -->
<div class="box">
  <div class="ttl">② 指定币种 · 系统分析</div>
  <div class="row">
    <input id="inpSym" placeholder="输入名称（如 BTC 或 BTC,ETH,SATS）">
    <select id="bar2">
      <option value="4H">4小时（波段）</option>
      <option value="1D">日线（趋势）</option>
      <option value="1H">1小时（短线）</option>
    </select>
    <button id="btnSym">🔍 单币技术分析</button>
  </div>
  <div id="outSym"></div>
</div>

<div id="st"></div>

<script>
const BASE = 'https://www.okx.com/api/v5';
// 工具函数
const fmtPx = (p,sym) => {
  if(p==null||isNaN(p)) return '--';
  if(sym==='SATS'||p<0.01) return (+p).toFixed(8).replace(/0+$/,'');
  if(p<1) return (+p).toFixed(4);
  return (+p).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const fmtUsd = v => {
  if(v==null||isNaN(v)) return '--';
  if(v>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
  if(v>=1e6) return '$'+(v/1e6).toFixed(2)+'M';
  if(v>=1e3) return '$'+(v/1e3).toFixed(2)+'K';
  return '$'+v.toFixed(0);
};
const pct = v => (v>=0?'+':'') + (v*100).toFixed(2) + '%';
const esc = s => (s+'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// 安全获取Ticker（修复报错核心）
async function getTicker(instId) {
  try {
    const r = await fetch(`${BASE}/market/ticker?instId=${instId}`);
    const j = await r.json();
    if(j.code==='0' && j.data && j.data[0]) {
      const t = j.data[0];
      // 严格校验 last 存在
      if(t.last!=null && !isNaN(+t.last)) {
        return { last:+t.last, change24h:+(t.change24h||0), volCcy24h:+(t.volCcy24h||0), ok:true };
      }
    }
    return {ok:false, err:'ticker空'};
  } catch(e) { return {ok:false, err:e.message}; }
}
// K线指标计算
async function getInd(instId, bar) {
  try {
    const r = await fetch(`${BASE}/market/candles?instId=${instId}&bar=${bar}&limit=150`);
    const j = await r.json();
    if(j.code!=='0'||!j.data) return null;
    const k = j.data.reverse().map(d=>({o:+d[1],h:+d[2],l:+d[3],c:+d[4],v:+d[5]}));
    if(k.length<50) return null;
    // EMA
    let e20=0,e50=0,e200=0;
    for(let i=0;i<k.length;i++){
      const c=k[i].c;
      e20=i?e20+(c-e20)*2/(20+1):c;
      e50=i?e50+(c-e50)*2/(50+1):c;
      e200=i?e200+(c-e200)*2/(200+1):c;
    }
    // MACD
    let ema12=e20, ema26=e50, macd=0, sig=0, hist=0;
    for(let i=0;i<k.length;i++){
      ema12=ema12+(k[i].c-ema12)*2/13;
      ema26=ema26+(k[i].c-ema26)*2/27;
      macd=ema12-ema26;
      sig=sig+(macd-sig)*2/10;
      hist=2*(macd-sig);
    }
    // RSI14
    let gain=0,loss=0;
    for(let i=1;i<k.length;i++){
      const ch=k[i].c-k[i-1].c;
      gain+=Math.max(ch,0); loss+=Math.max(-ch,0);
    }
    const avgG=gain/14, avgL=loss/14;
    const rsi = avgL===0?100:100-100/(1+avgG/avgL);
    // ADX简化
    let adx=0, diP=0, diM=0;
    for(let i=1;i<k.length;i++){
      const tr=Math.max(k[i].h-k[i].l, Math.abs(k[i].h-k[i-1].c), Math.abs(k[i].l-k[i-1].c));
      const up=k[i].h-k[i-1].h, dn=k[i-1].l-k[i].l;
      diP+=Math.max(up,0); diM+=Math.max(dn,0);
      adx+=tr;
    }
    adx = adx?(diP+diM)/adx*100:0;
    return {ema20:e20,ema50:e50,ema200:e200,macd:hist,rsi,adx,low7:Math.min(...k.slice(-7).map(x=>x.l)),low3:Math.min(...k.slice(-3).map(x=>x.l)),lastC:k[k.length-1].c};
  } catch(e) { return null; }
}
// 评分
function score(ind, tk, sym) {
  let s=0, why=[], risk=[];
  const {ema20,ema50,ema200,macd,rsi,adx,low7,low3,lastC} = ind;
  const last = tk.last;
  // 均线
  if(ema20>ema50) { s+=15; why.push("EMA20>50多头"); } else { s-=10; why.push("EMA20<50空头"); risk.push("均线空头"); }
  if(last>ema20) { s+=10; why.push("价在EMA20上"); } else { s-=5; why.push("价压EMA20下"); }
  if(last>ema200) s+=10; else s-=10;
  // MACD
  if(macd>0) { s+=10; why.push("MACD红柱"); } else { s-=10; why.push("MACD绿柱"); }
  // RSI
  if(rsi<30) { s+=5; why.push("RSI超卖"+rsi.toFixed(0)); risk.push("超卖"); } 
  else if(rsi>70) { s-=5; why.push("RSI超买"+rsi.toFixed(0)); risk.push("超买"); }
  else why.push("RSI中性"+rsi.toFixed(0));
  // ADX
  if(adx>25) { s+=5; why.push("ADX趋势"+adx.toFixed(0)); } else { s-=5; why.push("ADX震荡"+adx.toFixed(0)); }
  // 量/价
  const chg24 = tk.change24h||0;
  if(chg24>0.02) s+=5; else if(chg24<-0.02) s-=5;
  why.push("24h涨跌"+pct(chg24));
  return {s:Math.max(0,Math.min(100,s)), why, risk, ind, tk};
}

// 窗口一：排名推荐
$('btnRank').onclick = async () => {
  const btn=$('btnRank'), out=$('outRank'), N=parseInt($('inpN').value)||10, bar=$('bar1').value;
  btn.disabled=true; btn.innerText='扫描中...'; out.innerHTML='';
  try {
    // 获取永续列表
    const r = await fetch(`${BASE}/public/instruments?instType=SWAP&state=live`);
    const j = await r.json();
    const swaps = j.data.filter(d=>d.instId.endsWith('-USDT-SWAP')).slice(0, 200); // 限制200只
    // 批量ticker（分组避免限频）
    const tks = [];
    for(let i=0;i<swaps.length;i+=20){
      const batch = swaps.slice(i,i+20);
      const res = await Promise.all(batch.map(s=>getTicker(s.instId)));
      res.forEach((t,k)=>{ if(t.ok) tks.push({instId:batch[k].instId, sym:batch[k].instId.split('-')[0], ...t}); });
      if(i+20<swaps.length) await new Promise(r=>setTimeout(r,200));
    }
    // 真实成交额排序
    const ranked = tks.map(t=>({...t, usdt:t.volCcy24h*t.last})).sort((a,b)=>b.usdt-a.usdt).slice(0,N);
    if(ranked.length===0) { out.innerHTML='<div class="err">无有效数据</div>'; return; }
    // 指标分析（取前几只）
    const top = ranked.slice(0, Math.min(5,N));
    let up=null, down=null;
    for(const t of top) {
      const ind = await getInd(t.instId, bar);
      if(!ind) continue;
      const sc = score(ind, t, t.sym);
      if(!up || sc.s>up.sc.s) up={sym:t.sym, tk:t, ind, sc, bar};
      if(!down || sc.s<down.sc.s) down={sym:t.sym, tk:t, ind, sc, bar};
      await new Promise(r=>setTimeout(r,100));
    }
    // 渲染
    let h = `<div class="note">候选池：${ranked.map((t,i)=>`${i+1}.${t.sym}(${fmtUsd(t.usdt)})`).join(' | ')}</div>`;
    if(up) h += `<div class="card up"><div>🚀 最可能上涨 <span class="score">${up.sc.s}分</span></div>
      <b>${up.sym}</b> <span class="tag">${up.bar}</span><br>
      <div class="rd"><span>现价/成交额</span><b>${fmtPx(up.tk.last,up.sym)} · ${fmtUsd(up.tk.volCcy24h*up.tk.last)}</b></div>
      <div class="rd"><span>24h涨跌</span><b class="${up.tk.change24h>=0?'g':'r'}">${pct(up.tk.change24h)}</b></div>
      <div class="rd"><span>EMA20/50</span><b>${fmtPx(up.ind.ema20,up.sym)} / ${fmtPx(up.ind.ema50,up.sym)}</b></div>
      <div class="rd"><span>MACD/ADX/RSI</span><b>${up.ind.macd.toFixed(up.sym==='SATS'?6:2)} / ${up.ind.adx.toFixed(0)} / ${up.ind.rsi.toFixed(0)}</b></div>
      <div class="toggle" onclick="this.nextElementSibling.classList.toggle('hidden')">📋 展开推理 ▼</div>
      <div class="hidden" style="font-size:12px;color:#aaa;margin-top:4px">${up.sc.why.map(w=>'· '+w).join('<br>')}</div>
    </div>`;
    if(down && down.sym!==up.sym) h += `<div class="card down"><div>📉 最可能下跌 <span class="score">${down.sc.s}分</span></div>
      <b>${down.sym}</b> <span class="tag">${down.bar}</span><br>
      <div class="rd"><span>现价/成交额</span><b>${fmtPx(down.tk.last,down.sym)} · ${fmtUsd(down.tk.volCcy24h*down.tk.last)}</b></div>
      <div class="rd"><span>24h涨跌</span><b class="${down.tk.change24h>=0?'g':'r'}">${pct(down.tk.change24h)}</b></div>
      <div class="rd"><span>EMA20/50</span><b>${fmtPx(down.ind.ema20,down.sym)} / ${fmtPx(down.ind.ema50,down.sym)}</b></div>
      <div class="rd"><span>MACD/ADX/RSI</span><b>${down.ind.macd.toFixed(down.sym==='SATS'?6:2)} / ${down.ind.adx.toFixed(0)} / ${down.ind.rsi.toFixed(0)}</b></div>
      <div class="toggle" onclick="this.nextElementSibling.classList.toggle('hidden')">📋 展开推理 ▼</div>
      <div class="hidden" style="font-size:12px;color:#aaa;margin-top:4px">${down.sc.why.map(w=>'· '+w).join('<br>')}</div>
      ${down.sc.risk.length?`<div class="note" style="color:#f6465d">⚠️ ${down.sc.risk.join('、')}</div>`:''}
    </div>`;
    out.innerHTML = h;
    $('st').innerText = `完成 | 池${ranked.length}只 | ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    out.innerHTML = `<div class="err">❌ ${e.message}</div>`;
  }
  btn.disabled=false; btn.innerText='🎯 扫描成交额&推荐';
};

// 窗口二：指定币种
$('btnSym').onclick = async () => {
  const btn=$('btnSym'), out=$('outSym'), txt=$('inpSym').value.trim(), bar=$('bar2').value;
  if(!txt) { out.innerHTML='<div class="err">请输入币种名</div>'; return; }
  btn.disabled=true; btn.innerText='分析中...'; out.innerHTML='';
  const syms = txt.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
  let h = '';
  for(const sym of syms) {
    const instId = sym.includes('-')?sym:`${sym}-USDT-SWAP`;
    const tk = await getTicker(instId);
    if(!tk.ok) { h+=`<div class="err">❌ ${sym}: ${tk.err}</div>`; continue; }
    const ind = await getInd(instId, bar);
    if(!ind) { h+=`<div class="err">❌ ${sym}: K线不足</div>`; continue; }
    const sc = score(ind, tk, sym);
    h += `<div class="card ${sc.s>=55?'up':sc.s<45?'down':''}">
      <div><b>${sym}</b> <span class="tag">${bar}</span> <span class="score" style="float:right">${sc.s}分</span></div>
      <div class="rd"><span>现价/成交额</span><b>${fmtPx(tk.last,sym)} · ${fmtUsd(tk.volCcy24h*tk.last)}</b></div>
      <div class="rd"><span>24h涨跌</span><b class="${tk.change24h>=0?'g':'r'}">${pct(tk.change24h)}</b></div>
      <div class="rd"><span>EMA20/50/200</span><b>${fmtPx(ind.ema20,sym)} / ${fmtPx(ind.ema50,sym)} / ${fmtPx(ind.ema200,sym)}</b></div>
      <div class="rd"><span>MACD/ADX/RSI</span><b>${ind.macd.toFixed(sym==='SATS'?6:2)} / ${ind.adx.toFixed(0)} / ${ind.rsi.toFixed(0)}</b></div>
      <div class="toggle" onclick="this.nextElementSibling.classList.toggle('hidden')">📋 推理 ▼</div>
      <div class="hidden" style="font-size:12px;color:#aaa;margin-top:4px">${sc.why.map(w=>'· '+w).join('<br>')}</div>
      ${sc.risk.length?`<div class="note" style="color:#f6465d">⚠️ ${sc.risk.join('、')}</div>`:''}
    </div>`;
  }
  out.innerHTML = h;
  $('st').innerText = `完成 | 分析${syms.length}只 | ${new Date().toLocaleTimeString()}`;
  btn.disabled=false; btn.innerText='🔍 单币技术分析';
};

function $(id){return document.getElementById(id)}
// 无自动执行
</script>
</body>
</html>
