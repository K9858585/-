<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单币深度分析 + 批量扫描</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        #top-bar { background: var(--panel); padding: 15px 20px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 10; }

        .search-container { width: 100%; max-width: 400px; display: flex; gap: 8px; }
        .search-input {
            flex: 1; background: #12161f; border: 1px solid #2a2e39; color: #fff;
            padding: 12px; border-radius: 8px; font-size: 16px; outline: none; text-transform: uppercase;
        }
        .search-input::placeholder { color: #555; text-transform: none; }
        .search-btn {
            background: #2962ff; color: #fff; border: none; padding: 0 20px; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s;
        }
        .search-btn:active { transform: scale(0.95); }

        .btn-container { width: 100%; max-width: 400px; display: flex; gap: 10px; margin-top: 5px; }
        .scan-btn {
            background: linear-gradient(135deg, #0ecb81, #2962ff); color: #fff; border: none;
            padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold;
            flex: 1; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .scan-btn:active { transform: scale(0.98); }
        
        .auto-btn { background: linear-gradient(135deg, #fcd535, #f6465d); }
        .auto-btn.active { background: #2a2e39; color: var(--yellow); box-shadow: none; border: 1px solid var(--yellow); }

        .progress-text { font-size: 13px; color: var(--yellow); height: 20px; text-align: center; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 4px; background: #2a2e39; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }

        #result-area { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 15px; }

        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .section-title.long { color: var(--up); }
        .section-title.short { color: var(--down); }

        details { background: var(--panel); border-radius: 10px; margin-bottom: 10px; overflow: hidden; border-left: 4px solid #fff; transition: all 0.3s; }
        details.long-item { border-left-color: var(--up); }
        details.short-item { border-left-color: var(--down); }
        
        summary { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none; font-weight: bold; }
        summary::-webkit-details-marker { display: none; }
        
        .summary-left { display: flex; align-items: center; gap: 10px; }
        .coin-name { font-size: 18px; color: #fff; }
        .summary-right { display: flex; align-items: center; gap: 10px; }
        
        .score-badge { font-size: 13px; padding: 4px 8px; border-radius: 6px; }
        .long-item .score-badge { background: rgba(14,203,129,0.15); color: var(--up); }
        .short-item .score-badge { background: rgba(246,70,93,0.15); color: var(--down); }
        
        .arrow-icon { font-size: 12px; color: var(--sub); transition: transform 0.2s; }
        details[open] .arrow-icon { transform: rotate(180deg); }

        .detail-content { padding: 0 15px 15px 15px; border-top: 1px solid #2a2e39; margin-top: 5px; }
        .reason-box { font-size: 13px; line-height: 1.7; color: #b2b5be; text-align: justify; background: #12161f; padding: 12px; border-radius: 8px; margin-bottom: 15px; margin-top: 15px; }
        .trade-plan { display: flex; justify-content: space-between; background: #1a1f2b; border: 1px solid #2a2e39; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: bold; }
        .trade-plan .tp { color: var(--up); }
        .trade-plan .sl { color: var(--down); }

        .highlight { color: var(--yellow); font-weight: bold; }
        .empty-tip { color: #848e9c; font-size: 13px; margin-bottom: 20px; text-align: center; }

        /* 深度分析卡片 */
        .analysis-card { background: var(--panel); border-radius: 12px; padding: 20px; border-top: 4px solid var(--blue); margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .analysis-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2e39; padding-bottom: 15px;}
        .analysis-block { margin-bottom: 20px; background: #12161f; padding: 15px; border-radius: 8px; border: 1px solid #2a2e39;}
        .block-title { font-size: 15px; color: var(--blue); font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .analysis-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2a2e39; font-size: 14px; }
        .analysis-row:last-child { border-bottom: none; }
        .analysis-label { color: var(--sub); }
        .analysis-value { font-weight: bold; color: #fff; text-align: right;}
        
        .conclusion-box { margin-top: 20px; padding: 18px; border-radius: 8px; font-size: 16px; font-weight: bold; line-height: 1.5; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);}
        .conclusion-long { background: rgba(14,203,129,0.15); color: var(--up); border: 1px solid var(--up); }
        .conclusion-short { background: rgba(246,70,93,0.15); color: var(--down); border: 1px solid var(--down); }
        .conclusion-wait { background: rgba(252,213,53,0.1); color: var(--yellow); border: 1px solid var(--yellow); }

        #toast-banner {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--up); color: #fff; padding: 15px 30px; border-radius: 30px;
            font-weight: bold; font-size: 16px; box-shadow: 0 10px 30px rgba(14,203,129,0.5);
            transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 999;
            cursor: pointer;
        }
        #toast-banner.show { top: 20px; }
        #toast-banner.short { background: var(--down); box-shadow: 0 10px 30px rgba(246,70,93,0.5); }
    </style>
</head>
<body>

    <div id="toast-banner" onclick="window.scrollTo(0, 0); this.classList.remove('show');"></div>

    <div id="top-bar">
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="输入币种深度分析 (如 BTC)">
            <button class="search-btn" onclick="analyzeSingleCoin()">体检</button>
        </div>
        
        <div class="btn-container">
            <button class="scan-btn" id="startBtn" onclick="runScanner()">
                <span id="btnText">🎯 批量扫描前100</span>
            </button>
            <button class="scan-btn auto-btn" id="autoBtn" onclick="toggleAutoScan()" style="flex: 0.6;">
                <span id="autoBtnText">⏱️ 1分定时</span>
            </button>
        </div>
        <div class="progress-text" id="progressText">准备就绪</div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="result-area"></div>

<script>
    let isRunning = false;
    let autoScanInterval = null;
    let countdownInterval = null;
    let nextScanTime = 0;
    let isAutoScanning = false;
    const SCAN_INTERVAL = 1 * 60 * 1000; 

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        if (percent !== undefined) {
            document.getElementById('progressBarBg').style.display = 'block';
            document.getElementById('progressBar').style.width = Math.min(100, percent) + '%';
        }
    }

    function endScanner() {
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('btnText').innerText = "🎯 批量扫描前100";
        if (isAutoScanning) nextScanTime = Date.now() + SCAN_INTERVAL;
    }

    // ================= 深度分析引擎 =================
    window.analyzeSingleCoin = async function() {
        let input = document.getElementById('searchInput').value.trim().toUpperCase();
        if(!input) { alert("请输入币种名称，如 BTC"); return; }
        if(!input.includes('-USDT-SWAP')) input = input + '-USDT-SWAP';

        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        area.innerHTML = `<div class="empty-tip">正在拉取 ${input.replace('-USDT-SWAP','')} 全周期数据并计算指标...</div>`;

        try {
            // 并发拉取行情和多周期K线
            const [tickerRes, k1d, k4h, k1h, k15, k5] = await Promise.all([
                fetch(`https://www.okx.com/api/v5/market/ticker?instId=${input}`).then(r => r.json()),
                fetchCandles(input, '1D', 30),
                fetchCandles(input, '4H', 30),
                fetchCandles(input, '1H', 30),
                fetchCandles(input, '15m', 30),
                fetchCandles(input, '5m', 15)
            ]);

            if (tickerRes.code !== '0' || !tickerRes.data || tickerRes.data.length === 0) {
                area.innerHTML = `<div class="empty-tip">找不到该币种，请检查名称。</div>`;
                return;
            }

            const t = tickerRes.data[0];
            const chg24h = ((+t.last - +t.open24h) / +t.open24h) * 100;
            const curPrice = +t.last;

            if (k1d.length < 25 || k4h.length < 25 || k1h.length < 25 || k15.length < 25 || k5.length < 5) {
                area.innerHTML = `<div class="empty-tip">K线数据不足。</div>`;
                return;
            }

            // ==================== 指标计算 ====================
            // 1. 日线分析
            const closes1D = k1d.slice(0, -1).map(k => k.c);
            const ema20_1D = getEMAArray(closes1D, 20);
            const trend1D = closes1D[closes1D.length-1] > ema20_1D[ema20_1D.length-1] ? "多头" : "空头";
            const rsi1D = calcRSI(closes1D, 14);

            // 2. 4H 分析
            const closes4H = k4h.slice(0, -1).map(k => k.c);
            const ema20_4H = getEMAArray(closes4H, 20);
            const trend4H = closes4H[closes4H.length-1] > ema20_4H[ema20_4H.length-1] ? "多头" : "空头";
            const macd4H = calcMACD(closes4H);

            // 3. 1H 分析
            const closes1H = k1h.slice(0, -1).map(k => k.c);
            const ema20_1H = getEMAArray(closes1H, 20);
            const trend1H = closes1H[closes1H.length-1] > ema20_1H[ema20_1H.length-1] ? "多头" : "空头";

            // 4. 15m 结构
            const closed15m = k15.slice(0, -1);
            const closes15m = closed15m.map(k => k.c);
            const ema5_arr = getEMAArray(closes15m, 5);
            const ema20_arr = getEMAArray(closes15m, 20);
            const len = closes15m.length;
            let is15mCrossBull = false, is15mCrossBear = false;
            for (let j = Math.max(1, len - 2); j < len; j++) {
                if (ema5_arr[j] > ema20_arr[j] && ema5_arr[j-1] <= ema20_arr[j-1]) is15mCrossBull = true;
                if (ema5_arr[j] < ema20_arr[j] && ema5_arr[j-1] >= ema20_arr[j-1]) is15mCrossBear = true;
            }
            const ema20_up = ema20_arr[len-1] > ema20_arr[len-2];
            const ema20_down = ema20_arr[len-1] < ema20_arr[len-2];
            const macd15m = calcMACD(closes15m);

            // 5. 5m 微观
            const closed5m = k5.slice(0, -1);
            const lastK5 = closed5m[closed5m.length - 1];
            const body5m = ((lastK5.c - lastK5.o) / lastK5.o * 100).toFixed(2);
            const is5mBull = lastK5.c > lastK5.o;
            
            const prev5vol = closed5m.slice(-6, -1);
            const avgVol = prev5vol.reduce((sum, k) => sum + k.v, 0) / 5;
            const volRatio = (lastK5.v / avgVol).toFixed(2);

            // ==================== 综合诊断逻辑树 ====================
            let conclusion = "", conclusionClass = "";
            
            const isDayBull = chg24h > 0;
            const isDayBear = chg24h < 0;

            // 暴力做多：日线多头 + 4H/1H多头 + 15m刚金叉向上 + 5m收阴
            if (trend1D === "多头" && trend4H === "多头" && trend1H === "多头" && is15mCrossBull && ema20_up && isDayBull && !is5mBull) {
                conclusion = "🔥 完美多头共振：各周期皆多，15m刚金叉，5m回调到位！";
                conclusionClass = "conclusion-long";
            } 
            // 暴力做空：日线空头 + 4H/1H空头 + 15m刚死叉向下 + 5m收阳
            else if (trend1D === "空头" && trend4H === "空头" && trend1H === "空头" && is15mCrossBear && ema20_down && isDayBear && is5mBull) {
                conclusion = "🔥 完美空头共振：各周期皆空，15m刚死叉，5m反弹到位！";
                conclusionClass = "conclusion-short";
            }
            // 极度超卖（抄底）：日线/4H空头，但 1H RSI < 25，15m刚金叉
            else if (rsi1D < 30 && is15mCrossBull) {
                conclusion = "⚠️ 超跌反弹：日线极度超卖，15m出现金叉，可轻仓博反弹。";
                conclusionClass = "conclusion-wait";
            }
            // 均线纠缠：15m无交叉，或方向不一致
            else if (!is15mCrossBull && !is15mCrossBear) {
                conclusion = "⏳ 震荡观望：15m近期无明确交叉，等待方向选择。";
                conclusionClass = "conclusion-wait";
            }
            // 方向冲突：日线和4H/1H冲突
            else if (trend1D !== trend4H) {
                conclusion = "🚫 逆势警告：日线与4H趋势冲突，切勿盲目操作。";
                conclusionClass = "conclusion-wait";
            }
            else {
                conclusion = "👀 结构性机会：趋势存在，但5m形态尚未配合，加入自选盯盘。";
                conclusionClass = "conclusion-wait";
            }

            // ==================== 渲染报告 ====================
            let html = `
                <div class="analysis-card">
                    <div class="analysis-title">
                        <span>${input.replace('-USDT-SWAP','')}</span>
                        <span style="color:${chg24h >= 0 ? 'var(--up)' : 'var(--down)'};">${chg24h > 0 ? '+' : ''}${chg24h.toFixed(2)}%</span>
                    </div>
                    
                    <div class="analysis-block">
                        <div class="block-title">🌐 宏观多周期趋势</div>
                        <div class="analysis-row">
                            <span class="analysis-label">当前价格</span>
                            <span class="analysis-value">${formatPrice(curPrice)}</span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">日线大趋势 (1D)</span>
                            <span class="analysis-value" style="color:${trend1D === '多头' ? 'var(--up)' : 'var(--down)'}">${trend1D} (RSI: ${rsi1D.toFixed(1)})</span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">中期趋势 (4H)</span>
                            <span class="analysis-value" style="color:${trend4H === '多头' ? 'var(--up)' : 'var(--down)'}">${trend4H}</span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">短期趋势 (1H)</span>
                            <span class="analysis-value" style="color:${trend1H === '多头' ? 'var(--up)' : 'var(--down)'}">${trend1H}</span>
                        </div>
                    </div>

                    <div class="analysis-block">
                        <div class="block-title">🎯 精准指标探测</div>
                        <div class="analysis-row">
                            <span class="analysis-label">4H MACD 动能</span>
                            <span class="analysis-value" style="color:${macd4H > 0 ? 'var(--up)' : 'var(--down)'}">${macd4H > 0 ? '零轴上 强多头' : '零轴下 弱空头'}</span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">日线 RSI (14)</span>
                            <span class="analysis-value" style="color:${rsi1D > 70 ? 'var(--down)' : rsi1D < 30 ? 'var(--up)' : '#fff'}">${rsi1D.toFixed(1)} ${rsi1D>70?'(超买)':rsi1D<30?'(超卖)':''}</span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">15m MACD 动能</span>
                            <span class="analysis-value" style="color:${macd15m > 0 ? 'var(--up)' : 'var(--down)'}">${macd15m > 0 ? '多头动能' : '空头动能'}</span>
                        </div>
                    </div>

                    <div class="analysis-block">
                        <div class="block-title">⚡ 微观结构 (15m / 5m)</div>
                        <div class="analysis-row">
                            <span class="analysis-label">15m EMA 交叉 (2根内)</span>
                            <span class="analysis-value" style="color:${(is15mCrossBull||is15mCrossBear) ? 'var(--yellow)' : '#fff'}">
                                ${is15mCrossBull ? '🔥 刚金叉' : is15mCrossBear ? '🔥 刚死叉' : '无交叉 (纠缠)'}
                            </span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">15m EMA20 方向</span>
                            <span class="analysis-value" style="color:${ema20_up ? 'var(--up)' : 'var(--down)'}">${ema20_up ? '向上 ↗' : '向下 ↘'}</span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">最新 5m K 线</span>
                            <span class="analysis-value" style="color:${is5mBull ? 'var(--up)' : 'var(--down)'}">${is5mBull ? '阳线' : '阴线'} (实体 ${body5m}%)</span>
                        </div>
                        <div class="analysis-row">
                            <span class="analysis-label">5m 量能对比</span>
                            <span class="analysis-value">${volRatio > 1.5 ? '<span style="color:var(--yellow)">放量 ('+volRatio+'倍)</span>' : '缩量/平量 ('+volRatio+'倍)'}</span>
                        </div>
                    </div>

                    <div class="conclusion-box ${conclusionClass}">
                        ${conclusion}
                    </div>
                </div>
            `;

            area.innerHTML = html;

        } catch (e) {
            console.error(e);
            area.innerHTML = `<div class="empty-tip">分析出错，请检查网络或币种名称。</div>`;
        }
    };


    // ==================== 指标计算函数 ====================
    function calcMACD(closes) {
        // 简化版：判断当前快慢线在零轴上还是下，以确定大动能
        if (closes.length < 26) return 0;
        const ema12 = getEMAArray(closes, 12);
        const ema26 = getEMAArray(closes, 26);
        return ema12[ema12.length-1] - ema26[ema26.length-1];
    }

    function calcRSI(closes, period = 14) {
        if (closes.length <= period) return 50;
        let gains = 0, losses = 0;
        for (let i = 1; i <= period; i++) {
            const diff = closes[i] - closes[i - 1];
            if (diff >= 0) gains += diff; else losses -= diff;
        }
        let avgGain = gains / period, avgLoss = losses / period;
        for (let i = period + 1; i < closes.length; i++) {
            const diff = closes[i] - closes[i - 1];
            let gain = diff > 0 ? diff : 0, loss = diff < 0 ? -diff : 0;
            avgGain = (avgGain * (period - 1) + gain) / period;
            avgLoss = (avgLoss * (period - 1) + loss) / period;
        }
        if (avgLoss === 0) return 100;
        return 100 - (100 / (1 + (avgGain / avgLoss)));
    }


    // ================= 批量扫描功能 =================
    function toggleAutoScan() {
        const autoBtn = document.getElementById('autoBtn');
        const autoBtnText = document.getElementById('autoBtnText');

        if (isAutoScanning) {
            isAutoScanning = false;
            clearInterval(autoScanInterval);
            clearInterval(countdownInterval);
            autoBtn.classList.remove('active');
            autoBtnText.innerText = "⏱️ 1分定时";
            updateProgress("已停止自动扫描", 0);
        } else {
            isAutoScanning = true;
            autoBtn.classList.add('active');
            autoBtnText.innerText = "🛑 停止";
            
            if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission();
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext(); ctx.resume();
            } catch(e) {}
            
            runScanner();
            autoScanInterval = setInterval(() => { if (!isRunning) runScanner(); }, SCAN_INTERVAL);

            countdownInterval = setInterval(() => {
                if (!isRunning && nextScanTime > 0) {
                    const left = Math.max(0, nextScanTime - Date.now());
                    const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
                    if (left > 0) updateProgress(`⏱️ 自动运行中... 下次倒计时: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`, ((SCAN_INTERVAL - left) / SCAN_INTERVAL) * 100);
                }
            }, 1000);
        }
    }

    function playAlert() {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); setTimeout(() => { osc.stop(); }, 200);
        } catch (e) {}
    }

    function sendNotification(title, body, isLong) {
        const banner = document.getElementById('toast-banner');
        banner.innerText = `🎯 ${title}`;
        banner.className = isLong ? 'show' : 'show short';
        setTimeout(() => { banner.classList.remove('show'); }, 8000);
        playAlert();
        if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body: body });
    }

    async function fetchTop100Swaps() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 15000);
        try {
            const [instRes, tickerRes] = await Promise.all([
                fetch('https://www.okx.com/api/v5/public/instruments?instType=SWAP', { signal: ctrl.signal }).then(r => r.json()),
                fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP', { signal: ctrl.signal }).then(r => r.json())
            ]);
            if (instRes.code !== '0' || tickerRes.code !== '0') return [];
            const validInsts = new Set(instRes.data.filter(i => i.instId.endsWith('-USDT-SWAP')).map(i => i.instId));
            return tickerRes.data
                .filter(t => validInsts.has(t.instId))
                .map(t => {
                    const last = +t.last, open24h = +t.open24h;
                    return { instId: t.instId, vol: +t.volCcy24h || 0, chg24h: open24h > 0 ? (last - open24h) / open24h * 100 : 0 };
                })
                .sort((a, b) => b.vol - a.vol).slice(0, 100); 
        } finally { clearTimeout(timer); }
    }

    async function fetchCandles(instId, bar, limit) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const res = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`, { signal: ctrl.signal }).then(r => r.json());
            if (res.code !== '0' || !res.data || !res.data.length) throw new Error('no data');
            return res.data.map(d => ({ t: +d[0], o: +d[1], h: +d[2], l: +d[3], c: +d[4], v: +d[5], confirm: d[8] === '1' })).reverse();
        } finally { clearTimeout(timer); }
    }

    function getEMAArray(prices, period) {
        if (prices.length === 0) return [];
        let k = 2 / (period + 1), ema = prices[0], result = [ema];
        for (let i = 1; i < prices.length; i++) { ema = prices[i] * k + ema * (1 - k); result.push(ema); }
        return result;
    }

    window.runScanner = async function() {
        if (isRunning) return;
        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('btnText').innerText = "⏳ 扫描中...";
        const area = document.getElementById('result-area');
        area.style.display = 'none';
        area.innerHTML = '';
        const longResults = [], shortResults = [];

        try {
            const targetCoins = await fetchTop100Swaps();
            if (targetCoins.length === 0) { updateProgress("获取合约列表失败。", 100); endScanner(); return; }

            updateProgress(`已锁定前100活跃币，正在计算...`, 5);
            const chunkSize = 15; 
            let done = 0;

            for (let i = 0; i < targetCoins.length; i += chunkSize) {
                const chunk = targetCoins.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (coin) => {
                    try {
                        const isDayBull = coin.chg24h > 0, isDayBear = coin.chg24h < 0;
                        if (!isDayBull && !isDayBear) return; 

                        const [k15, k5] = await Promise.all([
                            fetchCandles(coin.instId, '15m', 30), 
                            fetchCandles(coin.instId, '5m', 15)
                        ]);
                        
                        if (k15.length < 25 || k5.length < 5) return;

                        const closed15m = k15.slice(0, -1);
                        const closes15m = closed15m.map(k => k.c);
                        const ema5_arr = getEMAArray(closes15m, 5);
                        const ema20_arr = getEMAArray(closes15m, 20);
                        const len = closes15m.length;
                        let is15mCrossBull = false, is15mCrossBear = false;

                        for (let j = Math.max(1, len - 2); j < len; j++) {
                            if (ema5_arr[j] > ema20_arr[j] && ema5_arr[j-1] <= ema20_arr[j-1]) is15mCrossBull = true;
                            if (ema5_arr[j] < ema20_arr[j] && ema5_arr[j-1] >= ema20_arr[j-1]) is15mCrossBear = true;
                        }

                        const ema20_trend_up = ema20_arr[len-1] > ema20_arr[len-2];
                        const ema20_trend_down = ema20_arr[len-1] < ema20_arr[len-2];

                        const isBullTrend = is15mCrossBull && ema20_trend_up && isDayBull;
                        const isBearTrend = is15mCrossBear && ema20_trend_down && isDayBear;
                        if (!isBullTrend && !isBearTrend) return;

                        const closed5m = k5.slice(0, -1);
                        const lastK = closed5m[closed5m.length - 1];
                        const bodyChgPct = Math.abs((lastK.c - lastK.o) / lastK.o * 100);

                        let type = null, slPrice = 0, tpPrice = 0, entryPrice = lastK.c, riskPct = 0;

                        if (isBullTrend && lastK.c < lastK.o) {
                            type = 'LONG'; slPrice = lastK.l * (1 - 0.002); riskPct = (entryPrice - slPrice) / entryPrice;
                            if (riskPct > 0.02) return; if (riskPct < 0.003) slPrice = entryPrice * (1 - 0.003);
                            tpPrice = entryPrice + (entryPrice - slPrice) * 2.5;
                        } else if (isBearTrend && lastK.c > lastK.o) {
                            type = 'SHORT'; slPrice = lastK.h * (1 + 0.002); riskPct = (slPrice - entryPrice) / entryPrice;
                            if (riskPct > 0.02) return; if (riskPct < 0.003) slPrice = entryPrice * (1 + 0.003);
                            tpPrice = entryPrice - (slPrice - entryPrice) * 2.5;
                        }

                        if (!type) return;

                        let score = 60 + Math.min(Math.round(bodyChgPct * 20), 20); 
                        const reason = `今日涨跌幅为 <b>${coin.chg24h > 0 ? '+' : ''}${coin.chg24h.toFixed(2)}%</b>。15m 级别 EMA5 与 EMA20 刚发生<b>${type === 'LONG' ? '金叉' : '死叉'}</b>。<br>5m 最新收盘为反向实体${type === 'LONG' ? '阴线' : '阳线'}。`;
                        const resObj = { instId: coin.instId.replace('-USDT-SWAP', ''), score, price: entryPrice, reason, slPrice, tpPrice, riskPct: (riskPct * 100).toFixed(2) };

                        if (type === 'LONG') longResults.push(resObj);
                        else shortResults.push(resObj);

                    } catch (e) { /* ignore */ }
                    done++;
                    if (!isAutoScanning) updateProgress(`正在扫描... (${done}/${targetCoins.length})`, 5 + (done / targetCoins.length) * 90);
                }));
            }

            longResults.sort((a, b) => b.score - a.score); shortResults.sort((a, b) => b.score - a.score);
            
            if (isAutoScanning && (longResults.length > 0 || shortResults.length > 0)) {
                if (longResults.length > 0 && shortResults.length > 0) sendNotification(`发现双向信号`, `多: ${longResults[0].instId} / 空: ${shortResults[0].instId}`, true);
                else if (longResults.length > 0) sendNotification(`发现 ${longResults.length} 个做多信号`, `首选: ${longResults[0].instId}`, true);
                else sendNotification(`发现 ${shortResults.length} 个做空信号`, `首选: ${shortResults[0].instId}`, false);
            }

            renderResults(longResults.slice(0, 3), shortResults.slice(0, 3), isAutoScanning);

        } catch (err) { updateProgress("推算发生错误，请稍后再试。", 100); endScanner(); }
    };

    function formatPrice(p) {
        if (p >= 1000) return p.toFixed(2); if (p >= 10) return p.toFixed(3);
        if (p >= 0.1) return p.toFixed(4); if (p >= 0.001) return p.toFixed(5);
        return p.toFixed(6);
    }

    function renderResults(longs, shorts, isAuto) {
        if (!isAuto) updateProgress("✅ 扫描完成！", 100);
        endScanner();
        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        let html = '';

        html += `<div class="section-title long">🟢 做多 Top 3（日涨 + 15m金叉 + 5m收阴）</div>`;
        if (longs.length === 0) html += `<div class="empty-tip">当前无符合结构的做多标的。</div>`;
        longs.forEach((item, index) => {
            html += `
                <details class="long-item">
                    <summary>
                        <div class="summary-left"><span class="coin-name">${index + 1}. ${item.instId}</span></div>
                        <div class="summary-right"><span class="score-badge">分: ${item.score}</span><span class="arrow-icon">▼</span></div>
                    </summary>
                    <div class="detail-content">
                        <div class="reason-box">${item.reason}</div>
                        <div class="trade-plan">
                            <span class="sl">止损: ${formatPrice(item.slPrice)} (-${item.riskPct}%)</span>
                            <span style="color:#fff;">参考价: ${formatPrice(item.price)}</span>
                            <span class="tp">止盈: ${formatPrice(item.tpPrice)}</span>
                        </div>
                    </div>
                </details>`;
        });

        html += `<div class="section-title short" style="margin-top:15px;">🔴 做空 Top 3（日跌 + 15m死叉 + 5m收阳）</div>`;
        if (shorts.length === 0) html += `<div class="empty-tip">当前无符合结构的做空标的。</div>`;
        shorts.forEach((item, index) => {
            html += `
                <details class="short-item">
                    <summary>
                        <div class="summary-left"><span class="coin-name">${index + 1}. ${item.instId}</span></div>
                        <div class="summary-right"><span class="score-badge">分: ${item.score}</span><span class="arrow-icon">▼</span></div>
                    </summary>
                    <div class="detail-content">
                        <div class="reason-box">${item.reason}</div>
                        <div class="trade-plan">
                            <span class="tp">止盈: ${formatPrice(item.tpPrice)}</span>
                            <span style="color:#fff;">参考价: ${formatPrice(item.price)}</span>
                            <span class="sl">止损: ${formatPrice(item.slPrice)} (+${item.riskPct}%)</span>
                        </div>
                    </div>
                </details>`;
        });

        area.innerHTML = html;
    }
</script>
