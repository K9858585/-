<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETH 专属深度分析终端</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:680px;margin:0 auto}
h2{font-size:16px;margin:0 0 10px;color:#627eea;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:16px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.7}
.b1{background:#627eea;color:#fff; box-shadow:0 4px 15px rgba(98,126,234,0.4)}
.b2{background:#238636;color:#fff}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:11px;margin:8px 0}
.title{font-size:14px;font-weight:bold;color:#8b949e;margin-bottom:8px;display:flex;justify-content:space-between}
.L{color:#3fb950}.S{color:#f85149}.N{color:#ff9f0a}
.info-row{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;border-bottom:1px dashed #30363d;padding-bottom:4px}
.info-row:last-child{border-bottom:none}
.val{font-weight:bold;color:#fff}
.big-val{font-size:20px;font-weight:900;color:#627eea}
.box-long{background:#0d2818; border:1px solid #2f6f3e; border-radius:10px; padding:14px; margin-top:10px;}
.box-short{background:#2b0d0d; border:1px solid #da3633; border-radius:10px; padding:14px; margin-top:10px;}
.box-neutral{background:#2d1a00; border:1px solid #8b6914; border-radius:10px; padding:14px; margin-top:10px;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#627eea;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="win">
  <h2><img src="https://s2.coinmarketcap.com/static/img/coins/64x64/1027.png" width="20" height="20" style="border-radius:50%"> ETH 实时多维度深度分析</h2>
  <button class="btn b1" id="f1">🔍 开始深度计算 (拉取多周期数据)</button>
  <div class="st" id="st1">等待启动...</div>
</div>

<div id="result-area" style="display:none;">
  <div class="win">
    <div class="title">当前报价 (USDT)</div>
    <div class="big-val" id="eth-price">--</div>
    <div class="sub" id="eth-change" style="font-size:12px; margin-top:4px;">--</div>
  </div>

  <div class="win">
    <div class="title">各时段动能预判 (根据均线/RSI/MACD)</div>
    <div class="grid">
      <div class="card">
        <div class="title">15分钟 (极短线)</div>
        <div id="tf-15m" style="font-size:16px;font-weight:bold;">--</div>
      </div>
      <div class="card">
        <div class="title">1小时 (日内)</div>
        <div id="tf-1h" style="font-size:16px;font-weight:bold;">--</div>
      </div>
      <div class="card">
        <div class="title">4小时 (波段)</div>
        <div id="tf-4h" style="font-size:16px;font-weight:bold;">--</div>
      </div>
      <div class="card">
        <div class="title">日线 (宏观大趋势)</div>
        <div id="tf-1d" style="font-size:16px;font-weight:bold;">--</div>
      </div>
    </div>
  </div>

  <div class="win">
    <div class="title">技术指标明细</div>
    <div class="info-row"><span>日线 EMA20 (生命线)</span><span class="val" id="ind-ema">--</span></div>
    <div class="info-row"><span>日线 RSI(14)</span><span class="val" id="ind-rsi">--</span></div>
    <div class="info-row"><span>4H MACD 动能</span><span class="val" id="ind-macd">--</span></div>
    <div class="info-row"><span>15m ATR (真实波幅)</span><span class="val" id="ind-atr">--</span></div>
  </div>

  <div class="win">
    <div class="title">🎯 策略与点位建议 (基于 15m)</div>
    <div id="trade-box" class="box-neutral">等待计算...</div>
  </div>
</div>

<script>
const PROXIES = ["", "https://api.codetabs.com/v1/proxy?quest=", "https://corsproxy.io/?"];
const $=i=>document.getElementById(i);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function okx(path, retries=2){
  const targetUrl = 'https://www.okx.com' + path;
  for(let i=0; i<=retries; i++){
    const proxy = PROXIES[i % PROXIES.length];
    const fetchUrl = proxy ? proxy + encodeURIComponent(targetUrl) : targetUrl;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try{
      const r = await fetch(fetchUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      if(r.status === 429 || r.status >= 500) continue;
      if(!r.ok) continue;
      const j = await r.json();
      if(j.code !== '0') return {err:`API:${j.msg}`};
      return {data:j.data};
    }catch(e){
      clearTimeout(timer);
      if(i === retries) return {err:`网络失败`};
      await sleep(300);
    }
  }
}

// ================= 指标计算函数 =================
const ema = (arr, n) => {
  const k = 2 / (n + 1);
  const res = [arr[0]];
  for(let i = 1; i < arr.length; i++) { res.push(arr[i] * k + res[i - 1] * (1 - k)); }
  return res;
};

const calcRSI = (closes, period = 14) => {
  if (closes.length <= period) return 50;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
      const diff = closes[i] - closes[i - 1];
      if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period, avgLoss = losses / period;
  for (let i = period + 1; i < closes.length; i++) {
      const diff = closes[i] - closes[i - 1];
      let gain = diff > 0 ? diff : 0, loss = diff < 0 ? -diff : 0;
      avgGain = (avgGain * (period - 1) + gain) / period;
      avgLoss = (avgLoss * (period - 1) + loss) / period;
  }
  if (avgLoss === 0) return 100;
  return 100 - (100 / (1 + (avgGain / avgLoss)));
};

const calcMACD = (closes) => {
  const ema12 = ema(closes, 12);
  const ema26 = ema(closes, 26);
  const diff = ema12.map((v, i) => v - ema26[i]);
  const dea = ema(diff, 9);
  return { diff: diff[diff.length-1], dea: dea[dea.length-1], hist: (diff[diff.length-1] - dea[dea.length-1]) * 2 };
};

const calcATR = (h, l, c, period = 14) => {
  let trs = [];
  for (let i = 1; i < c.length; i++) {
      const tr = Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1]));
      trs.push(tr);
  }
  let atr = trs.slice(0, period).reduce((a, b) => a + b, 0) / period;
  for (let i = period; i < trs.length; i++) {
      atr = (atr * (period - 1) + trs[i]) / period;
  }
  return atr;
};

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closedData = d.filter(x => x[8] === '1'); // 只拿已收盘
  const data=[...closedData].reverse();
  for(const x of data){
    o.push(parseFloat(x[1])); h.push(parseFloat(x[2])); l.push(parseFloat(x[3])); c.push(parseFloat(x[4]));
  }
  return{o,h,l,c};
}

// ================= 核心分析主函数 =================
async function analyzeETH(){
  $('st1').innerHTML = '<span class="sp"></span>拉取多周期实时数据...';
  $('result-area').style.display = 'none';

  const instId = 'ETH-USDT-SWAP';
  try {
    // 1. 获取实时报价
    const tickRes = await okx(`/api/v5/market/ticker?instId=${instId}`);
    const tick = tickRes.data[0];
    const lastPrice = parseFloat(tick.last);
    const open24h = parseFloat(tick.open24h);
    const changePct = ((lastPrice - open24h) / open24h) * 100;

    // 2. 并行获取四个周期数据
    const [k15m, k1h, k4h, k1d] = await Promise.all([
      okx(`/api/v5/market/candles?instId=${instId}&bar=15m&limit=50`),
      okx(`/api/v5/market/candles?instId=${instId}&bar=1H&limit=50`),
      okx(`/api/v5/market/candles?instId=${instId}&bar=4H&limit=50`),
      okx(`/api/v5/market/candles?instId=${instId}&bar=1D&limit=50`)
    ]);

    const d15m = parseK(k15m.data);
    const d1h = parseK(k1h.data);
    const d4h = parseK(k4h.data);
    const d1d = parseK(k1d.data);

    // 3. 计算核心指标
    // 日线指标
    const ema20_1d = ema(d1d.c, 20)[d1d.c.length - 1];
    const rsi_1d = calcRSI(d1d.c);
    
    // 4H 指标
    const macd_4h = calcMACD(d4h.c);
    
    // 15m 指标 (ATR)
    const atr_15m = calcATR(d15m.h, d15m.l, d15m.c);

    // 4. UI 更新基础数据
    $('eth-price').innerText = `$${lastPrice.toFixed(2)}`;
    $('eth-change').innerHTML = `24h涨跌: <span style="color:${changePct>=0?'#3fb950':'#f85149'}">${changePct>=0?'+':''}${changePct.toFixed(2)}%</span>`;
    
    $('ind-ema').innerText = `$${ema20_1d.toFixed(2)} (${lastPrice > ema20_1d ? '价格在上' : '价格在下'})`;
    $('ind-ema').style.color = lastPrice > ema20_1d ? '#3fb950' : '#f85149';

    $('ind-rsi').innerText = `${rsi_1d.toFixed(1)} (${rsi_1d > 70 ? '超买' : rsi_1d < 30 ? '超卖' : '中性'})`;
    $('ind-rsi').style.color = rsi_1d > 70 ? '#f85149' : rsi_1d < 30 ? '#3fb950' : '#fff';

    const macdState = macd_4h.hist > 0 ? '多头放量' : '空头放量';
    $('ind-macd').innerText = `${macdState} (${macd_4h.hist.toFixed(2)})`;
    $('ind-macd').style.color = macd_4h.hist > 0 ? '#3fb950' : '#f85149';

    $('ind-atr').innerText = `$${atr_15m.toFixed(2)}`;

    // 5. 各周期预判逻辑
    // 15m
    const ema20_15m = ema(d15m.c, 20)[d15m.c.length - 1];
    const t15 = lastPrice > ema20_15m ? '偏多 (在均线上)' : '偏空 (在均线下)';
    $('tf-15m').innerHTML = `<span style="color:${lastPrice > ema20_15m ? '#3fb950' : '#f85149'}">${t15}</span>`;

    // 1H
    const ema20_1h = ema(d1h.c, 20)[d1h.c.length - 1];
    const t1h = lastPrice > ema20_1h ? '偏多 (短期有支撑)' : '偏空 (短期承压)';
    $('tf-1h').innerHTML = `<span style="color:${lastPrice > ema20_1h ? '#3fb950' : '#f85149'}">${t1h}</span>`;

    // 4H
    const t4h = macd_4h.hist > 0 ? '动能向上' : '动能向下';
    $('tf-4h').innerHTML = `<span style="color:${macd_4h.hist > 0 ? '#3fb950' : '#f85149'}">${t4h}</span>`;

    // 1D
    const t1d = lastPrice > ema20_1d ? (rsi_1d > 70 ? '超买风险' : '多头排列') : (rsi_1d < 30 ? '超卖反弹' : '空头压制');
    const c1d = lastPrice > ema20_1d ? (rsi_1d > 70 ? '#ff9f0a' : '#3fb950') : (rsi_1d < 30 ? '#ff9f0a' : '#f85149');
    $('tf-1d').innerHTML = `<span style="color:${c1d}">${t1d}</span>`;

    // 6. 进场与止盈止损计算 (结合 15m ATR 做极窄防守)
    let html = '';
    let isLong = false, isShort = false;

    // 做多条件：日线在均线上，4H动能向上，15m在均线上
    if(lastPrice > ema20_1d && macd_4h.hist > 0 && lastPrice > ema20_15m) {
      isLong = true;
    } 
    // 做空条件：日线在均线下，4H动能向下，15m在均线下
    else if(lastPrice < ema20_1d && macd_4h.hist < 0 && lastPrice < ema20_15m) {
      isShort = true;
    }

    if(isLong){
      // 极窄止损：现价减去 1.5 倍 ATR
      const stopLoss = lastPrice - (atr_15m * 1.5);
      const risk = lastPrice - stopLoss;
      const tp1 = lastPrice + risk * 2;
      const tp2 = lastPrice + risk * 3;
      
      html = `
        <div class="box-long">
          <div style="font-size:16px; font-weight:bold; color:#3fb950; margin-bottom:10px;">🚀 当前盘面共振看多 (顺势)</div>
          <div class="info-row"><span>建议方向</span><span class="val L">做多 (LONG)</span></div>
          <div class="info-row"><span>参考进场价</span><span class="val">${lastPrice.toFixed(2)} (市价)</span></div>
          <div class="info-row"><span>极窄防守 (止损)</span><span class="val S">${stopLoss.toFixed(2)} (风险空间: ${((risk/lastPrice)*100).toFixed(2)}%)</span></div>
          <div class="info-row"><span>第一止盈 (1:2)</span><span class="val L">${tp1.toFixed(2)}</span></div>
          <div class="info-row"><span>第二止盈 (1:3)</span><span class="val L">${tp2.toFixed(2)}</span></div>
        </div>
      `;
    } else if(isShort){
      const stopLoss = lastPrice + (atr_15m * 1.5);
      const risk = stopLoss - lastPrice;
      const tp1 = lastPrice - risk * 2;
      const tp2 = lastPrice - risk * 3;
      
      html = `
        <div class="box-short">
          <div style="font-size:16px; font-weight:bold; color:#f85149; margin-bottom:10px;">🌊 当前盘面共振看空 (顺势)</div>
          <div class="info-row"><span>建议方向</span><span class="val S">做空 (SHORT)</span></div>
          <div class="info-row"><span>参考进场价</span><span class="val">${lastPrice.toFixed(2)} (市价)</span></div>
          <div class="info-row"><span>极窄防守 (止损)</span><span class="val L">${stopLoss.toFixed(2)} (风险空间: ${((risk/lastPrice)*100).toFixed(2)}%)</span></div>
          <div class="info-row"><span>第一止盈 (1:2)</span><span class="val S">${tp1.toFixed(2)}</span></div>
          <div class="info-row"><span>第二止盈 (1:3)</span><span class="val S">${tp2.toFixed(2)}</span></div>
        </div>
      `;
    } else {
      html = `
        <div class="box-neutral">
          <div style="font-size:16px; font-weight:bold; color:#ff9f0a; margin-bottom:10px;">⚠️ 信号冲突，建议观望</div>
          <div style="font-size:13px; line-height:1.6; color:#c9d1d9;">
            当前日线趋势、4H动能与15m短线出现分歧，此时进场容易被来回双杀。<br>
            <b>策略：</b>等待 15m 重新站上均线，或者等待日线回调至 EMA20 (${ema20_1d.toFixed(2)}) 附近再寻找机会。
          </div>
        </div>
      `;
    }

    $('trade-box').outerHTML = html;
    $('st1').innerText = '✅ 分析完成';
    $('st1').style.color = '#3fb950';
    $('result-area').style.display = 'block';

  } catch (e) {
    $('st1').innerText = '❌ 获取数据失败，可能代理超时，请重试。';
    $('st1').style.color = '#f85149';
  }
}

$('f1').onclick = analyzeETH;

</script>
</body>
</html>
