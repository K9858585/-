<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧易合约扫描｜极致极值反转 (v293)</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:680px;margin:0 auto}
h2{font-size:15px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:16px}
.win2{border-color:#2f6f3e}
.btn{display:block;width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.7}
.b1{background:#ff9f0a;color:#000}.b2{background:#238636;color:#fff}.b3{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
.row{display:flex;align-items:center;margin:9px 0;gap:8px;flex-wrap:wrap}
.row label{color:#8b949e;font-size:13px;min-width:120px}
.row input,.row select{flex:1;min-width:110px;padding:9px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:14px}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;line-height:1.6;word-break:break-all; min-height:42px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:11px;margin:8px 0}
.t{font-size:17px;font-weight:700}
.L{color:#3fb950}.S{color:#f85149}.N{color:#8b949e}.Y{color:#ff9f0a}
.info{font-size:13px;line-height:1.75;margin-top:5px}
.info b{color:#fff}
.sub{color:#8b949e;font-size:12px;line-height:1.7}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;border:1px solid #2f6f3e;color:#3fb950;margin-left:6px}
.tagShort{border-color:#da3633;color:#f85149;margin-left:6px;}
.sp{display:inline-block;width:13px;height:13px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.warn{background:#2d1a00;border:1px solid #8b6914;color:#ffbf47;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.6;margin:8px 0}
.empty{color:#8b949e;font-size:13px;padding:10px;text-align:center;border:1px dashed #30363d;border-radius:10px}
.checkRow{align-items:center;}
</style>
</head>
<body>
<div class="warn">
⚠️窗口二：1H信号K涨跌幅≥1.2%；新增EMA20过滤开关，默认关闭。
</div>
<div class="win">
  <h2>窗口一 · 专属固定池 (含日线容差)</h2>
  <button class="btn b1" id="f1">📥 抓取专属100池数据</button>
  <div class="row">
    <label>日线影线容忍幅度(%)</label>
    <input type="number" id="dailyWickTol" value="1.0" step="0.1" min="0" max="5">
  </div>
  <div class="st" id="st1">就绪，点击上方按钮开始</div>
  <div id="out1"></div>
</div>
<div class="win win2">
  <h2>窗口二 · 1H 极值反转狙击</h2>
  <div class="row">
    <label>扫描目标池</label>
    <select id="poolSource">
      <option value="longPool">🟢 多头火箭池</option>
      <option value="shortPool">🔴 空头瀑布池</option>
    </select>
  </div>
  <div class="row">
    <label>极值容差(%)</label>
    <input type="number" id="extremeTol" value="1.5" step="0.1" min="0" max="10">
    <span class="sub" style="font-size:11px">K线距离极值的误差允许范围</span>
  </div>
  <div class="row checkRow">
    <label></label>
    <div style="display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="useEma20Filter">
      <span style="font-size:13px;color:#8b949e;">启用1H‑EMA20过滤（做多>EMA20 / 做空&lt;EMA20）</span>
    </div>
  </div>
  <button class="btn b2" id="f2">🎯 扫描当前池（不刷新日线）</button>
  <div class="st" id="st2">等待窗口一生成币种池</div>
  <div id="out2"></div>
</div>
<script>
const FIXED_COINS = [
  "BTCUSDT", "ETHUSDT", "SOXLUSDT", "SNDKUSDT", "ZECUSDT", "SOLUSDT", "NVDAUSDT", "XAUUSDT", "ANTUSDT", "MMTUSDT",
  "MUUSDT", "XRPUSDT", "SKHYNIXUSDT", "SOXSUSDT", "HYPEUSDT", "PIEVERSEUSDT", "BREVUSDT", "XAGUSDT", "KORUUSDT", "DOGEUSDT",
  "PEPEUSDT", "SPCXUSDT", "NEARUSDT", "PIPPINUSDT", "SNXXUSDT", "CLUSDT", "PUMPUSDT", "SKHYUSDT", "MSTRUSDT", "UNIUSDT",
  "QQQUSDT", "LITUSDT", "AKEUSDT", "WLDUSDT", "AMDUSDT", "AAOIUSDT", "ENAUSDT", "FILUSDT", "SUIUSDT", "INTCUSDT",
  "ZHONGJIUSDT", "NBISUSDT", "BNBUSDT", "CRCLUSDT", "TRUMPUSDT", "PENGUUSDT", "ADAUSDT", "AAVEUSDT", "TQQQUSDT", "LINKUSDT",
  "GOOGLUSDT", "UNITREEUSDT", "MRVLUSDT", "BZUSDT", "LTCUSDT", "HUMAUSDT", "INJUSDT", "STRKUSDT", "LITEUSDT", "BCHUSDT",
  "AVAXUSDT", "ASTERUSDT", "TSLAUSDT", "IRYSUSDT", "CRWVUSDT", "DRAMUSDT", "TAOUSDT", "ZROUSDT", "ARBUSDT", "SAMSUNGUSDT",
  "ZILUSDT", "UPUSDT", "ZHIPUUSDT", "VVVUSDT", "BTWUSDT", "AAPLUSDT", "XPLUSDT", "ONDOUSDT", "TRXUSDT", "OKBUSDT",
  "TSMUSDT", "NESUSDT", "AXTIUSDT", "NIGHTUSDT", "SPYUSDT", "UVXYUSDT", "MUUUSDT", "DGAIUSDT", "GRAMUSDT", "XLMUSDT",
  "ICPUSDT", "SQQQUSDT", "CXMTUSDT", "BEUSDT", "SOPHUSDT", "PROSUSDT", "EWYUSDT", "USELESSUSDT", "ZKPUSDT", "OPUSDT"
];
const PROXIES = ["", "https://api.codetabs.com/v1/proxy?quest=", "https://corsproxy.io/?"];
const K_LONG_POOL='okx_longpool_v20';
const K_SHORT_POOL='okx_shortpool_v20';
let longPool=[], shortPool=[];
const $=i=>document.getElementById(i);
const st=(id,h,c)=>{const e=$(id);e.innerHTML=h;e.style.color=c==='e'?'#f85149':c==='o'?'#3fb950':c==='w'?'#ffbf47':'#8b949e'};
const pc=v=>(v*100).toFixed(2)+'%';
const volFormat=v=>v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(2)+'M':(v/1e3).toFixed(0)+'K';
const px=p=>p>=1000?p.toFixed(0):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const num=x=>parseFloat(x)||0;
async function okx(path, retries=2){
  const targetUrl = 'https://www.okx.com' + path;
  for(let i=0; i<=retries; i++){
    const proxy = PROXIES[i % PROXIES.length];
    const fetchUrl = proxy ? proxy + encodeURIComponent(targetUrl) : targetUrl;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try{
      const r = await fetch(fetchUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      if(r.status === 429 || r.status >= 500) continue;
      if(!r.ok) continue;
      const j = await r.json();
      if(j.code !== '0') return {err:`API:${j.msg}`};
      return {data:j.data};
    }catch(e){
      clearTimeout(timer);
      if(i === retries) return {err:`网络失败`};
      await sleep(300);
    }
  }
}
const ema = (arr, n) => {
  const k = 2 / (n + 1);
  const res = [arr[0]];
  for(let i = 1; i < arr.length; i++) { res.push(arr[i] * k + res[i - 1] * (1 - k)); }
  return res;
};
function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closedData = d.filter(x => x[8] === '1');
  const data=[...closedData].reverse();
  for(const x of data){
    const co=num(x[1]),hi=num(x[2]),lo=num(x[3]),cl=num(x[4]);
    if(!isFinite(co)||!isFinite(hi)||!isFinite(lo)||!isFinite(cl)) return{err:'K线异常'};
    o.push(co);h.push(hi);l.push(lo);c.push(cl);
  }
  return{o,h,l,c};
}
function dailyCheck(kData, wickTolPct){
  const {h,l,c}=kData;
  const i=c.length - 1;
  const E5=ema(c,5),E20=ema(c,20);
  const last=c[i],e5=E5[i],e20=E20[i];

  if(!isFinite(last)||!isFinite(e5)||!isFinite(e20)) return{err:'EMA异常'};

  const divergence = Math.abs(e5 - e20) / e20;
  if(divergence < 0.015) return{err:'均线粘合'};

  const change5d = Math.abs(last - c[i-5]) / c[i-5];
  if(change5d < 0.07) return{err:'无爆发力'};
  const wickTol = wickTolPct / 100;
  let isRocket = true;
  let isWaterfall = true;
  for(let j=i-2; j<=i; j++){
    if(c[j] <= E5[j] || c[j] <= E20[j]) isRocket = false;
    if(c[j] >= E5[j] || c[j] >= E20[j]) isWaterfall = false;
  }
  let up5=0, dn5=0, up20=0, dn20=0;
  for(let j=i;j>i-3&&j>=1;j--){
    if(E5[j]>E5[j-1]) up5++; else dn5++;
    if(E20[j]>E20[j-1]) up20++; else dn20++;
  }
  if(isRocket && up5>=2 && up20>=2) {
    let wickBreach = false;
    for(let j=i-2; j<=i; j++){
      if(l[j] < E5[j]) {
        const breachPct = (E5[j] - l[j]) / E5[j];
        if(breachPct > wickTol) wickBreach = true;
      }
    }
    if(!wickBreach) return{kind:'long',last,e5,e20,change5d};
  }

  if(isWaterfall && dn5>=2 && dn20>=2) {
    let wickBreach = false;
    for(let j=i-2; j<=i; j++){
      if(h[j] > E5[j]) {
        const breachPct = (h[j] - E5[j]) / E5[j];
        if(breachPct > wickTol) wickBreach = true;
      }
    }
    if(!wickBreach) return{kind:'short',last,e5,e20,change5d};
  }

  return{err:'非单边极值'};
}
async function runFullScan(){
  const wickInput = num($('dailyWickTol').value);
  st('st1','<span class="sp"></span>获取固定池实时行情...');

  const tickRes=await okx('/api/v5/market/tickers?instType=SWAP');
  if(tickRes.err){ st('st1','❌'+tickRes.err,'e'); return; }

  const targetInstIds = FIXED_COINS.map(c => c.replace('USDT', '-USDT-SWAP'));

  let rawList = [];
  tickRes.data.forEach(x => {
    if(targetInstIds.includes(x.instId)) {
      rawList.push({
        instId: x.instId,
        base: x.instId.split('-')[0],
        last: num(x.last),
        volCcy24h: num(x.volCcy24h) * num(x.last)
      });
    }
  });
  if(rawList.length===0){ st('st1','❌获取不到行情，可能代理失效','e'); return; }

  longPool=[]; shortPool=[];
  const rejectList=[];
  const total=rawList.length;

  st('st1',`<span class="sp"></span>开始处理专属池 (共${total}个)...`);
  for(let i=0;i<rawList.length;i++){
    const item=rawList[i];
    st('st1',`<span class="sp"></span>处理 ${i+1}/${total} ｜ ${item.base}`);
    const kr=await okx(`/api/v5/market/candles?instId=${item.instId}&bar=1D&limit=40`);

    if(kr.err){ rejectList.push(`${item.base}:${kr.err}`); await sleep(200); continue; }
    if(!kr.data||kr.data.length<25){ rejectList.push(`${item.base}:K线不足`); await sleep(200); continue; }

    const kParsed=parseK(kr.data);
    if(kParsed.err){ rejectList.push(`${item.base}:${kParsed.err}`); await sleep(200); continue; }

    const checkRes = dailyCheck(kParsed, wickInput);
    if(checkRes.err){ rejectList.push(`${item.base}:${checkRes.err}`); }
    else if(checkRes.kind==='long'){ longPool.push({...item,...checkRes}); }
    else if(checkRes.kind==='short'){ shortPool.push({...item,...checkRes}); }

    await sleep(200);
  }

  longPool.sort((a,b)=>b.volCcy24h-a.volCcy24h);
  shortPool.sort((a,b)=>b.volCcy24h-a.volCcy24h);
  localStorage.setItem(K_LONG_POOL,JSON.stringify(longPool));
  localStorage.setItem(K_SHORT_POOL,JSON.stringify(shortPool));

  st('st1',`✅固定池扫描完成｜多头${longPool.length}，空头${shortPool.length}，淘汰${rejectList.length}`,'o');
  renderPool(rejectList);
}
function renderPool(rej=[]){
  let html='';
  if(longPool.length>0){
    html+=`<div class="card"><div style="color:#3fb950;font-weight:bold">🚀 极端多头（火箭）</div>`;
    longPool.forEach(x=>{
      html+=`<div style="margin-top:6px"><b class="L">${x.base}</b> <span class="tag">多头</span> <span class="sub">#vol:${volFormat(x.volCcy24h)} 5日涨${pc(x.change5d)}</span></div>`;
    });
    html+=`</div>`;
  }else html+=`<div class="empty">🚀 火箭池为空</div>`;
  if(shortPool.length>0){
    html+=`<div class="card"><div style="color:#f85149;font-weight:bold">🌊 极端空头（瀑布）</div>`;
    shortPool.forEach(x=>{
      html+=`<div style="margin-top:6px"><b class="S">${x.base}</b> <span class="tagShort">空头</span> <span class="sub">#vol:${volFormat(x.volCcy24h)} 5日跌${pc(x.change5d)}</span></div>`;
    });
    html+=`</div>`;
  }else html+=`<div class="empty">🌊 瀑布池为空</div>`;
  if(rej&&rej.length>0){
    html+=`<div class="card sub">淘汰列表(最多展示前50)<br>${rej.slice(0,50).join('<br>')}</div>`;
  }
  $('out1').innerHTML=html;
}
// =================窗口二｜1小时K线，新增EMA20开关=================
$('f2').onclick=async()=>{
  const poolSource=$('poolSource').value;
  const usePool = poolSource==="longPool"?longPool:shortPool;
  const useEmaFilter = $('useEma20Filter').checked;
  if(usePool.length===0){ st('st2','⚠️池子为空，请先在窗口一点击扫描','e'); return; }

  const extTolPct = num($('extremeTol').value) / 100;
  const hits=[],miss=[];
  st('st2',`<span class="sp"></span>开始1小时极值反转扫描...`);
  $('out2').innerHTML='';

  for(let i=0;i<usePool.length;i++){
    const it=usePool[i];
    st('st2',`<span class="sp"></span>扫描 ${i+1}/${usePool.length}｜${it.base}`);
    const kr=await okx(`/api/v5/market/candles?instId=${it.instId}&bar=1H&limit=40`);

    if(kr.err){ miss.push(`${it.base}:${kr.err}`); await sleep(200); continue; }
    if(!kr.data||kr.data.length<15){ miss.push(`${it.base}:K线不足`); await sleep(200); continue; }

    const kp=parseK(kr.data);
    if(kp.err){ miss.push(`${it.base}:${kp.err}`); await sleep(200); continue; }

    const {c, o, l, h} = kp;
    const idx = c.length - 1;
    const sigK = { o: o[idx], c: c[idx], h: h[idx], l: l[idx] };
    const e20_1h = ema(c,20)[idx];

    let isValidEntry = false;
    let stop = 0, tp = 0;

    if(it.kind === 'long'){
      //做多：信号大阴线，跌幅≥1.2%，实体≥前10根阴线最大实体*1.5
      const sigBody = sigK.o - sigK.c;
      const cond1 = (sigK.o - sigK.c) / sigK.o >= 0.012;

      let maxPrevRedBody = 0;
      for(let j = idx-10; j < idx; j++){
        if(j < 0) continue;
        const ko = o[j];
        const kc = c[j];
        if(kc < ko){
          const body = ko - kc;
          if(body > maxPrevRedBody) maxPrevRedBody = body;
        }
      }
      const cond2 = (maxPrevRedBody > 0) && (sigBody >= maxPrevRedBody * 1.5);
      const isSigBigRed = cond1 && cond2;

      const redLowList = [];
      for(let j = idx-11; j < idx; j++) {
          if(j >= 0){
              const kO = o[j];
              const kC = c[j];
              if(kC < kO){
                redLowList.push(l[j]);
              }
          }
      }
      let sigIsRedLowest = true;
      if(redLowList.length > 0){
          const minRedL = Math.min(...redLowList);
          const dist = (minRedL - sigK.l) / minRedL;
          sigIsRedLowest = dist <= extTolPct;
      }
      if(redLowList.length === 0){
          sigIsRedLowest = false;
      }

      //EMA20开关判断：开启则要求信号K收盘价大于1H‑EMA20
      let emaOk = true;
      if(useEmaFilter){
          emaOk = sigK.c > e20_1h;
      }

      if(isSigBigRed && sigIsRedLowest && emaOk) {
        isValidEntry = true;
        stop = sigK.l * 0.998;
        const entry = sigK.c;
        tp = entry + (entry - stop) * 3;
      }
    } else {
      //做空：信号大阳线，涨幅≥1.2%，实体≥前10根阳线最大实体*1.5
      const sigBody = sigK.c - sigK.o;
      const cond1 = (sigK.c - sigK.o) / sigK.o >= 0.012;

      let maxPrevGreenBody = 0;
      for(let j = idx-10; j < idx; j++){
        if(j < 0) continue;
        const ko = o[j];
        const kc = c[j];
        if(kc > ko){
          const body = kc - ko;
          if(body > maxPrevGreenBody) maxPrevGreenBody = body;
        }
      }
      const cond2 = (maxPrevGreenBody > 0) && (sigBody >= maxPrevGreenBody * 1.5);
      const isSigBigGreen = cond1 && cond2;

      const greenHighList = [];
      for(let j = idx-11; j < idx; j++) {
          if(j >= 0){
              const kO = o[j];
              const kC = c[j];
              if(kC > kO){
                greenHighList.push(h[j]);
              }
          }
      }
      let sigIsGreenHighest = true;
      if(greenHighList.length > 0){
          const maxGreenH = Math.max(...greenHighList);
          const dist = (maxGreenH - sigK.h) / maxGreenH;
          sigIsGreenHighest = dist <= extTolPct;
      }
      if(greenHighList.length === 0){
          sigIsGreenHighest = false;
      }

      //EMA20开关判断：开启则要求信号K收盘价小于1H‑EMA20
      let emaOk = true;
      if(useEmaFilter){
          emaOk = sigK.c < e20_1h;
      }

      if(isSigBigGreen && sigIsGreenHighest && emaOk) {
        isValidEntry = true;
        stop = sigK.h * 1.002;
        const entry = sigK.c;
        tp = entry - (stop - entry) * 3;
      }
    }

    if(isValidEntry){
      hits.push({...it, entry: sigK.c, stop, tp, risk: Math.abs(sigK.c-stop)/sigK.c});
    } else {
      miss.push(`${it.base}:未达极值反转条件`);
    }
    await sleep(200);
  }

  let html='';
  if(hits.length>0){
    hits.forEach(x=>{
      const cls = x.kind === 'long' ? 'L' : 'S';
      const dir = x.kind === 'long' ? '做多🚀' : '做空🌊';
      html+=`<div class="card"><div class="t ${cls}">${x.base} <span style="font-size:14px">${dir}</span></div>
      <div class="info">
        <b>进场:</b> ${px(x.entry)}<br>
        <b>防守:</b> ${px(x.stop)}<br>
        <b>止盈:</b> ${px(x.tp)}<br>
        <span class="Y">风险空间: ${pc(x.risk)}</span>
      </div></div>`;
    });
  }else html+=`<div class="empty">无符合1H极值反转进场条件</div>`;

  if(miss.length>0) html+=`<div class="card sub">过滤原因：${miss.slice(0,25).join('<br>')}</div>`;

  $('out2').innerHTML=html;
  st('st2',`✅扫描结束，命中${hits.length}个进场点`,'o');
};
$('f1').onclick=runFullScan;
</script>
</body>
</html>
