<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧易合约扫描｜平滑极强趋势 (v298)</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:680px;margin:0 auto}
h2{font-size:15px;margin:0 0 10px;color:#ff9f0a;letter-spacing:.5px}
.win{background:#11161d;border:1px solid #30363d;border-radius:14px;padding:14px;margin-bottom:16px}
.btn{display:block;width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:active{opacity:0.7}
.b1{background:#ff9f0a;color:#000}.b2{background:#238636;color:#fff}.b3{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
.row{display:flex;align-items:center;margin:9px 0;gap:8px;flex-wrap:wrap}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;line-height:1.6;word-break:break-all; min-height:42px; display:flex; justify-content:space-between; align-items:center;}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:11px;margin:8px 0; animation: pop 0.3s ease-out;}
@keyframes pop { 0%{transform:scale(0.95);opacity:0} 100%{transform:scale(1);opacity:1} }
.t{font-size:17px;font-weight:700; display:flex; justify-content:space-between;}
.L{color:#3fb950}.S{color:#f85149}.N{color:#8b949e}.Y{color:#ff9f0a}
.info{font-size:13px;line-height:1.75;margin-top:5px}
.info b{color:#fff}
.sub{color:#8b949e;font-size:12px;line-height:1.7}
.sp{display:inline-block;width:13px;height:13px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
.warn{background:#2d1a00;border:1px solid #8b6914;color:#ffbf47;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.6;margin:8px 0}
.empty{color:#8b949e;font-size:13px;padding:10px;text-align:center;border:1px dashed #30363d;border-radius:10px}
.countdown{font-size:14px; font-weight:bold; color:#79c0ff;}
.badge{font-size:12px; padding:2px 6px; border-radius:4px; background:#2a2e39; color:#ff9f0a;}
</style>
</head>
<body>
<div class="warn">
⚠️ 已开启“剔除大阳/大阴妖币”过滤：过去 10 根内实体涨跌幅不得超 2%，要求极致平滑。
</div>
<div class="win">
  <h2>实时监控中</h2>
  <div class="st">
    <span id="st2">准备就绪，等待收线...</span>
    <span class="countdown" id="countdown">--:--</span>
  </div>
  <button class="btn b2" id="f2">🎯 立即手动扫描一次</button>
  <div id="out2"></div>
</div>

<script>
const FIXED_COINS = [
  "BTCUSDT", "ETHUSDT", "SOXLUSDT", "SNDKUSDT", "ZECUSDT", "SOLUSDT", "NVDAUSDT", "XAUUSDT", "ANTUSDT", "MMTUSDT",
  "MUUSDT", "XRPUSDT", "SKHYNIXUSDT", "SOXSUSDT", "HYPEUSDT", "PIEVERSEUSDT", "BREVUSDT", "XAGUSDT", "KORUUSDT", "DOGEUSDT",
  "PEPEUSDT", "SPCXUSDT", "NEARUSDT", "PIPPINUSDT", "SNXXUSDT", "CLUSDT", "PUMPUSDT", "SKHYUSDT", "MSTRUSDT", "UNIUSDT",
  "QQQUSDT", "LITUSDT", "AKEUSDT", "WLDUSDT", "AMDUSDT", "AAOIUSDT", "ENAUSDT", "FILUSDT", "SUIUSDT", "INTCUSDT",
  "ZHONGJIUSDT", "NBISUSDT", "BNBUSDT", "CRCLUSDT", "TRUMPUSDT", "PENGUUSDT", "ADAUSDT", "AAVEUSDT", "TQQQUSDT", "LINKUSDT",
  "GOOGLUSDT", "UNITREEUSDT", "MRVLUSDT", "BZUSDT", "LTCUSDT", "HUMAUSDT", "INJUSDT", "STRKUSDT", "LITEUSDT", "BCHUSDT",
  "AVAXUSDT", "ASTERUSDT", "TSLAUSDT", "IRYSUSDT", "CRWVUSDT", "DRAMUSDT", "TAOUSDT", "ZROUSDT", "ARBUSDT", "SAMSUNGUSDT",
  "ZILUSDT", "UPUSDT", "ZHIPUUSDT", "VVVUSDT", "BTWUSDT", "AAPLUSDT", "XPLUSDT", "ONDOUSDT", "TRXUSDT", "OKBUSDT",
  "TSMUSDT", "NESUSDT", "AXTIUSDT", "NIGHTUSDT", "SPYUSDT", "UVXYUSDT", "MUUUSDT", "DGAIUSDT", "GRAMUSDT", "XLMUSDT",
  "ICPUSDT", "SQQQUSDT", "CXMTUSDT", "BEUSDT", "SOPHUSDT", "PROSUSDT", "EWYUSDT", "USELESSUSDT", "ZKPUSDT", "OPUSDT"
];

const PROXIES = ["", "https://api.codetabs.com/v1/proxy?quest=", "https://corsproxy.io/?"];
const $=i=>document.getElementById(i);
const st=(id,h,c)=>{const e=$(id);e.innerHTML=h;e.style.color=c==='e'?'#f85149':c==='o'?'#3fb950':c==='w'?'#ffbf47':'#8b949e'};
const pc=v=>(v*100).toFixed(2)+'%';
const px=p=>p>=1000?p.toFixed(0):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
const num=x=>parseFloat(x)||0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function playAlert(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch (e) { console.log('浏览器阻止了声音'); }
  
  let isBlink = false;
  const blinkTimer = setInterval(() => {
    document.title = isBlink ? '🚨发现进场信号！' : '欧易合约扫描｜平滑极强趋势';
    isBlink = !isBlink;
  }, 500);
  setTimeout(() => { clearInterval(blinkTimer); document.title = '欧易合约扫描｜平滑极强趋势'; }, 5000);
}

async function okx(path, retries=1){
  const targetUrl = 'https://www.okx.com' + path;
  for(let i=0; i<=retries; i++){
    const proxy = PROXIES[i % PROXIES.length];
    const fetchUrl = proxy ? proxy + encodeURIComponent(targetUrl) : targetUrl;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000); // 极致超时控制，加快失败切换
    try{
      const r = await fetch(fetchUrl, { signal: ctrl.signal });
      clearTimeout(timer);
      if(r.status === 429 || r.status >= 500) continue;
      if(!r.ok) continue;
      const j = await r.json();
      if(j.code !== '0') return {err:`API:${j.msg}`};
      return {data:j.data};
    }catch(e){
      clearTimeout(timer);
      if(i === retries) return {err:`网络失败`};
    }
  }
}

const ema = (arr, n) => {
  const k = 2 / (n + 1);
  const res = [arr[0]];
  for(let i = 1; i < arr.length; i++) { res.push(arr[i] * k + res[i - 1] * (1 - k)); }
  return res;
};

function parseK(d){
  const o=[],h=[],l=[],c=[];
  const closedData = d.filter(x => x[8] === '1'); 
  const data=[...closedData].reverse();
  for(const x of data){
    const co=num(x[1]),hi=num(x[2]),lo=num(x[3]),cl=num(x[4]);
    if(!isFinite(co)||!isFinite(hi)||!isFinite(lo)||!isFinite(cl)) return{err:'K线异常'};
    o.push(co);h.push(hi);l.push(lo);c.push(cl);
  }
  return{o,h,l,c};
}

async function run5mScan() {
  st('st2','<span class="sp"></span>极速扫描中...');
  const out = $('out2');
  out.innerHTML = '';

  const targetInstIds = FIXED_COINS.map(c => c.replace('USDT', '-USDT-SWAP'));
  
  // 极速并发请求
  const promises = targetInstIds.map(async (instId) => {
    const kr = await okx(`/api/v5/market/candles?instId=${instId}&bar=5m&limit=35`);
    if (kr.err || !kr.data || kr.data.length < 30) return { err: true, instId };
    
    const kp = parseK(kr.data);
    if (kp.err) return { err: true, instId };

    const { c, o, l, h } = kp;
    const idx = c.length - 1;
    const lastC = c[idx];
    const lastO = o[idx];
    
    const e20_5m = ema(c, 20);
    
    let longCount = 0;
    let shortCount = 0;
    let hasBigCandle = false; // 是否出现大阴大阳

    // 检查最近 10 根（含最后一根）的形态
    for (let j = idx; j >= idx - 10 && j >= 0; j--) {
        // 计算实体涨跌幅（开盘到收盘的百分比）
        const bodyPct = Math.abs(c[j] - o[j]) / o[j];
        // 如果单根实体振幅超过 2%，视为大K线，标记为不合格
        if(bodyPct > 0.02) {
            hasBigCandle = true;
            break;
        }

        // 做多：收在均线上，下影线不破均线
        if(c[j] > e20_5m[j] && l[j] > e20_5m[j]) {
            longCount++;
        } else {
            longCount = -999; // 做多形态破坏
        }

        // 做空：收在均线下，上影线不破均线
        if(c[j] < e20_5m[j] && h[j] < e20_5m[j]) {
            shortCount++;
        } else {
            shortCount = -999;
        }
    }

    let hitKind = null;
    let stop = 0, tp = 0;
    let continuousBars = 0;
    let score = 0;

    // 如果出现大K线，直接淘汰
    if(!hasBigCandle) {
        // 做多：连续合格 >= 10 根
        if(longCount >= 10) {
            hitKind = 'long';
            continuousBars = longCount;
            stop = l[idx] * 0.998; 
            tp = lastC + (lastC - stop) * 3; 
        } 
        // 做空：连续合格 >= 10 根
        else if(shortCount >= 10) {
            hitKind = 'short';
            continuousBars = shortCount;
            stop = h[idx] * 1.002;
            tp = lastC - (stop - lastC) * 3;
        }
    }

    // 打分机制：刚好 10 根给 100 分
    if(hitKind) {
        score = Math.max(10, 100 - (continuousBars - 10) * 10);
        return {
            err: false, hit: true, instId, base: instId.split('-')[0],
            hitKind, continuousBars, score, entry: lastC, stop, tp, risk: Math.abs(lastC - stop) / lastC
        };
    } else {
        return { err: false, hit: false, instId };
    }
  });

  const results = await Promise.all(promises);
  let hits = results.filter(r => !r.err && r.hit);
  
  // 按得分从高到低排序
  hits.sort((a, b) => b.score - a.score);
  
  if(hits.length > 0){
    let html = '';
    hits.forEach(x=>{
      const cls = x.hitKind === 'long' ? 'L' : 'S';
      const dir = x.hitKind === 'long' ? '极强做多🚀' : '极强做空🌊';
      const sColor = x.score >= 80 ? '#3fb950' : '#ff9f0a'; 
      
      html+=`<div class="card">
        <div class="t ${cls}">
            <span>${x.base} <span style="font-size:14px">${dir}</span></span>
            <span class="badge" style="color:${sColor}; border:1px solid ${sColor}">连续${x.continuousBars}根 [${x.score}分]</span>
        </div>
        <div class="info">
            <b>进场:</b> ${px(x.entry)}<br>
            <b>防守:</b> ${px(x.stop)}<br>
            <b>止盈:</b> ${px(x.tp)}<br>
            <span class="Y">风险空间: ${pc(x.risk)}</span>
        </div>
      </div>`;
    });
    out.innerHTML = html;
    st('st2',`✅扫描结束，命中 ${hits.length} 个目标`, 'o');
    playAlert();
  } else {
    out.innerHTML = `<div class="empty">无符合极强形态的币种 (已过滤大K线，要求连续10根以上极强)</div>`;
    st('st2',`本轮未发现目标`, 'n');
  }
}

let countdownTimer = null;
function scheduleNextScan() {
  const now = new Date();
  const ms = now.getTime();
  const next5m = Math.ceil(ms / (5 * 60 * 1000)) * (5 * 60 * 1000) + 2000; 
  
  if(countdownTimer) clearInterval(countdownTimer);
  
  countdownTimer = setInterval(() => {
    const left = Math.max(0, next5m - Date.now());
    const m = Math.floor(left / 60000);
    const s = Math.floor((left % 60000) / 1000);
    $('countdown').innerText = `⏱️ ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')} 后扫描`;
    
    if (left <= 0) {
      clearInterval(countdownTimer);
      run5mScan(); 
      scheduleNextScan(); 
    }
  }, 1000);
}

$('f2').onclick = () => {
  run5mScan();
};

window.onload = () => {
  scheduleNextScan();
};
</script>
</body>
</html>
