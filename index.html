<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>成交额选币极简版</title>
<style>
  :root { --bg:#111; --card:#1a1a1a; --text:#fff; --sub:#888; --up:#0ecb81; --down:#f6465d; --gold:#fcd535; }
  body { background:var(--bg); color:var(--text); font-family: -apple-system, sans-serif; margin:0; padding:12px; font-size:14px; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  input, select { background:#222; color:var(--text); border:1px solid #333; border-radius:6px; padding:10px; font-size:15px; outline:none; }
  input { flex:1; }
  select { width:90px; }
  button { background:var(--gold); color:#000; border:none; border-radius:6px; padding:10px 16px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { opacity:.6; }
  .card { background:var(--card); border-radius:8px; padding:14px; margin-top:12px; border-left:4px solid #333; }
  .card.down { border-color:var(--down); }
  .card.up { border-color:var(--up); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .sym { font-size:24px; font-weight:bold; }
  .dir { font-size:20px; font-weight:bold; text-align:right; }
  .dir.down { color:var(--down); }
  .dir.up { color:var(--up); }
  .dir.none { color:var(--sub); }
  .sub { color:var(--sub); font-size:12px; margin-top:2px; text-align:right; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin-top:12px; }
  .grid div { color:var(--sub); }
  .grid b { color:var(--text); float:right; font-weight:normal; }
  .reason { margin-top:12px; padding-top:12px; border-top:1px solid #333; font-size:13px; line-height:1.6; color:#ccc; }
  .reason div { margin-bottom:4px; }
  .warn { color:#ffb800; }
  .toggle { color:var(--gold); font-size:13px; margin-top:8px; cursor:pointer; user-select:none; }
  .hidden { display:none; }
  .top10 { margin-top:12px; padding-top:12px; border-top:1px solid #333; color:var(--sub); font-size:12px; line-height:1.5; }
  .status { color:var(--sub); font-size:12px; margin-top:8px; }
  .nan { color:var(--sub); }
</style>
</head>
<body>
  <div class="row">
    <input id="nInput" type="number" value="50" min="1" max="100">
    <select id="barSelect">
      <option value="1D">日线</option>
      <option value="4H">4小时</option>
    </select>
    <button id="startBtn">🎯 开始</button>
  </div>
  <div id="status" class="status"></div>
  <div id="result"></div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n==null||isNaN(n)?'--':Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(2)+'K':n.toFixed(2);
const pct = n => n==null||isNaN(n)?'<span class="nan">--%</span>':(n>0?'+':'')+n.toFixed(2)+'%';
const px = (n,sym) => n==null||isNaN(n)?'--':(sym&&sym.includes('SATS')?n.toFixed(8):n.toLocaleString(undefined,{maximumFractionDigits:2}));

// EMA计算
function ema(arr, p) {
  let k=2/(p+1), v=arr[0];
  for(let i=1;i<arr.length;i++) v=v*k+(1-k)*arr[i];
  return v;
}

// 技术评分：返回 {score, dir, reasons, failPrice}
function score(k, t) {
  const c=k.close, e20=ema(c,20), e50=ema(c,50), e200=ema(c,200);
  const macd = ema(c,12)-ema(c,26);
  const sig = ema(c.map((_,i)=>ema(c.slice(0,i+1),12)-ema(c.slice(0,i+1),26)),9);
  const macdH = macd-sig;
  // RSI14
  let g=0,b=0;
  for(let i=1;i<c.length;i++){const d=c[i]-c[i-1]; if(d>0)g+=d; else b-=d;}
  const rsi = 100 - 100/(1+(g/b));
  // ADX14 (简化)
  let tr=[],dmP=[],dmM=[];
  for(let i=1;i<c.length;i++){
    const h=k.high[i],l=k.low[i],pc=c[i-1];
    tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));
    dmP.push(h>k.high[i-1]&&h-k.high[i-1]>k.low[i-1]-l?h-k.high[i-1]:0);
    dmM.push(l<k.low[i-1]&&k.low[i-1]-l>h-k.high[i-1]?k.low[i-1]-l:0);
  }
  const atr=ema(tr,14), diP=ema(dmP,14)/atr*100, diM=ema(dmM,14)/atr*100;
  const adx=ema(tr.map((_,i)=>Math.abs(diP[i]-diM[i])/(diP[i]+diM[i])*100),14);
  const last=c[c.length-1], open=k.open[k.open.length-1];
  const chg=(last-open)/open*100;
  const rng=k.high[k.high.length-1]-k.low[k.low.length-1];
  const upSh=k.high[k.high.length-1]-Math.max(last,open);
  const dnSh=Math.min(last,open)-k.low[k.low.length-1];
  const upR=upSh/rng, dnR=dnSh/rng;
  const pos = (last-k.low[0])/(k.high[k.high.length-1]-k.low[0]);
  
  let s=50, dir=null, reasons=[], fail=null;
  // 均线
  if(last<e20&&e20<e50){s-=22; dir='down'; reasons.push(`均线空头排列：现价 < EMA20 ${px(e20)} < EMA50 ${px(e50)}`);}
  else if(last>e20&&e20>e50){s+=22; dir='up'; reasons.push(`均线多头排列：现价 > EMA20 ${px(e20)} > EMA50 ${px(e50)}`);}
  if(e200){ if(last<e200){s-=12; reasons.push(`压在年线 ${px(e200)} 下方，大周期逆风`);} else{s+=12; reasons.push(`站上年线 ${px(e200)}，大周期顺风`);} }
  // MACD
  if(macdH<0){s-=12; reasons.push(`MACD在零轴下 (${macd.toFixed(2)})，动能偏空`);} else{s+=12; reasons.push(`MACD在零轴上 (${macd.toFixed(2)})，动能偏多`);}
  // ADX
  const adxV=adx[adx.length-1]||adx;
  if(adxV>25){ if(diM>diP){s-=12; dir=dir||'down'; reasons.push(`ADX ${adxV.toFixed(0)} 且 -DI>${diP.toFixed(0)}，下降趋势成立`);}
    else{s+=12; dir=dir||'up'; reasons.push(`ADX ${adxV.toFixed(0)} 且 +DI>${diM.toFixed(0)}，上升趋势成立`);} }
  else { reasons.push(`ADX ${adxV.toFixed(0)} 趋势弱`); }
  // RSI
  if(rsi<30){s-=5; reasons.push(`RSI ${rsi.toFixed(0)} 超卖，容易反抽`);}
  else if(rsi>70){s+=5; reasons.push(`RSI ${rsi.toFixed(0)} 超买，容易回落`);}
  // 影线
  if(upR>0.4){reasons.push(`⚠️ 上影线占振幅 ${upR.toFixed(0)}%，冲高被砸，假突破风险`);}
  if(dnR>0.35){reasons.push(`⚠️ 下影线占振幅 ${dnR.toFixed(0)}%，杀跌被接回，假破位风险`);}
  // 区间
  reasons.push(`区间位置 ${pos.toFixed(2)*100}% (低 ${px(k.low[0])} / 高 ${px(k.high[k.high.length-1])})`);
  
  if(dir==='down'){ s=Math.max(0,s); fail=px(e50); }
  else if(dir==='up'){ s=Math.min(100,s); fail=px(e50); }
  else { dir='none'; s=50; }
  
  return {score:s, dir, e20,e50,e200,macd:macdH,rsi,adx:adxV, reasons, failPrice:fail, last, chg, upR, dnR};
}

// 获取K线
async function getK(inst, bar) {
  const r=await fetch(`https://www.okx.com/api/v5/market/candles?instId=${inst}&bar=${bar}&limit=200`,{cache:'no-store'});
  const j=await r.json(); if(!j.data) return null;
  const d=j.data.reverse();
  return {open:d.map(x=>+x[1]), high:d.map(x=>+x[2]), low:d.map(x=>+x[3]), close:d.map(x=>+x[4])};
}
// 获取Ticker
async function getT(inst) {
  const r=await fetch(`https://www.okx.com/api/v5/market/ticker?instId=${inst}`,{cache:'no-store'});
  const j=await r.json(); if(!j.data||!j.data[0]) return null;
  const d=j.data[0];
  return {last:+d.last, vol:+d.volCcy24h, chg:d.chgPct24h?+d.chgPct24h:null, bid:+d.bidPx, ask:+d.askPx, ts:+d.ts};
}
// 获取永续列表
async function getList() {
  const r=await fetch(`https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId=BTC-USDT-SWAP`,{cache:'no-store'});
  // 实际需拉全部，这里用搜索式：为极简，遍历主流（避免CORS/限流，实际部署需代理或全量）
  // 修正：直接硬编码主流+动态拉（因OKX无搜索全部CORS友好），这里用常见50个
  const common=['BTC','ETH','SOL','XRP','DOGE','ADA','TRX','AVAX','LINK','DOT','MATIC','LTC','BCH','ETC','FIL','APT','OP','ARB','INJ','ATOM','NEAR','SUI','SEI','TIA','ORDI','STX','IMX','GMX','MKR','AAVE','UNI','CRV','SNX','COMP','YFI','SUSHI','1INCH','ENJ','MANA','SAND','AXS','GALA','FTM','HBAR','EGLD','XTZ','ALGO','VET','THETA','EOS'];
  return common.map(s=>({instId:`${s}-USDT-SWAP`, base:s}));
}

$('startBtn').onclick = async () => {
  const btn=$('startBtn'), n=+ $('nInput').value, bar=$('barSelect').value;
  btn.disabled=true; btn.innerText='扫描中...';
  $('status').innerText='拉取列表...';
  $('result').innerHTML='';
  try {
    const list = await getList();
    $('status').innerText=`计算成交额(前${n})...`;
    const arr=[];
    // 为防限流，并发控制（简单版：逐个，实际可Promise.allSettled分批）
    for(let i=0;i<list.length;i++){
      if(i%10===0) $('status').innerText=`拉取Ticker ${i}/${list.length}`;
      const t=await getT(list[i].instId).catch(()=>null);
      if(t&&t.last&&t.vol){ arr.push({...list[i], ...t, usd:t.vol*t.last}); }
    }
    arr.sort((a,b)=>b.usd-a.usd);
    const top=arr.slice(0,n);
    $('status').innerText=`成功算指标 ${top.length}只...`;
    let best=null;
    for(const x of top){
      const k=await getK(x.instId, bar).catch(()=>null);
      if(!k) continue;
      const sc=score(k,x);
      x.sc=sc; x.k=k;
      // 选最明确方向（|score-50|最大），且>60
      if(!best || Math.abs(sc.score-50)>Math.abs(best.sc.score-50)) best=x;
    }
    // 渲染
    if(!best){ $('result').innerHTML='<div class="card">无有效数据</div>'; return; }
    const b=best, s=b.sc;
    const isNone = s.score<60 || s.dir==='none';
    const cls = s.dir==='down'?'down':s.dir==='up'?'up':'';
    const dirTxt = isNone?'无明确方向':(s.dir==='down'?'偏跌 ▼':'偏涨 ▲');
    const pctTxt = isNone?'':(s.dir==='down'?`${Math.min(95, 50+s.score)}%`:`${Math.min(95, 50+(100-s.score))}%`);
    const top10 = top.slice(0,10).map((x,i)=>`${i+1}. ${x.base} $${fmt(x.usd)}`).join(' | ');
    const chgDisp = b.chg!=null?pct(b.chg):(s.chg?pct(s.chg):'<span class="nan">NaN%</span>');
    
    $('result').innerHTML = `
      <div class="card ${cls}">
        <div class="top">
          <div><div class="sym">${b.base}</div><div class="sub">成交额排名 · 第${top.findIndex(x=>x.instId===b.instId)+1}名 / 池内 ${top.length}只</div></div>
          <div class="dir ${isNone?'none':s.dir}">${dirTxt} ${pctTxt}<br><span class="sub">${s.score}分</span></div>
        </div>
        <div class="grid">
          <div>现价(实时)</div><b>${px(b.last,b.base)}</b>
          <div>24h成交额</div><b>$${fmt(b.usd)}</b>
          <div>24h涨跌</div><b>${chgDisp}</b>
          <div>EMA20/50/200</div><b>${px(s.e20,b.base)} / ${px(s.e50,b.base)} / ${px(s.e200,b.base)}</b>
          <div>MACD/RSI/ADX</div><b>${s.macd.toFixed(2)} / ${s.rsi.toFixed(0)} / ${s.adx.toFixed(0)}</b>
          <div>参考失效位</div><b style="color:${s.dir==='down'?'var(--up)':'var(--down)'}">${s.dir==='down'?'站回':'跌破'} ${s.failPrice}</b>
        </div>
        <div class="toggle" onclick="this.nextElementSibling.classList.toggle('hidden')">📋 展开推理 ▼</div>
        <div class="reason hidden">${s.reasons.map(r=>`<div class="${r.includes('⚠')?'warn':''}">· ${r}</div>`).join('')}</div>
        <div class="top10">成交额池 TOP10:<br>${top10}</div>
        <div class="sub" style="margin-top:10px">口径：成交额=24h币量×实时价；指标基于${bar} K线(EMA20/50/200、MACD12/26/9、RSI14、ADX14)。${isNone?'分数<60，最优解是不做。':'分数≥60，方向参考。'}</div>
      </div>`;
    $('status').innerText=`完成 · 池 ${top.length}只 · 成功算指标 ${top.filter(x=>x.k).length}只 · ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    $('status').innerText='失败: '+e.message;
  }
  btn.disabled=false; btn.innerText='🎯 开始';
};
</script>
</body>
</html>
