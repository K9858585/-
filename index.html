<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日线潜力币·实时扫描</title>
<style>
:root{--bg:#0b0e11;--card:#151a21;--line:#232a34;--green:#0ecb81;--red:#f6465d;--gold:#f0b90b;--cyan:#4aa8ff;--txt:#eaecef;--sub:#848e9c}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:14px;font-size:14px}
.wrap{max-width:520px;margin:0 auto}
h1{text-align:center;font-size:18px;margin:4px 0;color:var(--gold)}
.sub{text-align:center;font-size:11px;color:var(--sub);line-height:1.6;margin-bottom:12px}
.ctrl{display:flex;gap:8px;margin-bottom:10px}
.ctrl input{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:14px}
.ctrl button{background:var(--gold);color:#000;font-weight:bold;border:0;border-radius:8px;padding:0 16px;font-size:15px;cursor:pointer}
.ctrl button:disabled{opacity:.5}
.pt{text-align:center;font-size:11px;color:var(--sub);margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:11px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#666}
.card.LONG::before{background:var(--green)}
.card.SHORT::before{background:var(--red)}
.hd{display:flex;justify-content:space-between;align-items:center}
.sy{font-size:22px;font-weight:bold}
.dr{font-size:13px;font-weight:bold;padding:4px 10px;border-radius:5px}
.dr.LONG{background:rgba(14,203,129,.16);color:var(--green)}
.dr.SHORT{background:rgba(246,70,93,.16);color:var(--red)}
.sc{text-align:center;margin:8px 0}
.sc .n{font-size:32px;font-weight:bold}
.txt{font-size:13px;line-height:1.8;color:#c7ced6;white-space:pre-wrap;margin-top:10px;
  background:#10141a;border:1px solid #1c2229;border-radius:8px;padding:11px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #1c2229;color:#b7bfc9}
.row:last-child{border:0}
.row b{color:var(--txt)}
.g{color:var(--green)!important}.r{color:var(--red)!important}.y{color:var(--gold)!important}
.note{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6}
.empty{text-align:center;color:var(--sub);font-size:12px;padding:18px}
</style>
</head>
<body>
<div class="wrap">
<h1>📡 日线潜力币·实时扫描</h1>
<div class="sub">实时拉欧易永续行情 → 按24h成交额取前N只 → 日线过滤横盘/插针/飞刀 → 只推1个</div>

<div class="ctrl">
  <input id="num" type="number" min="5" max="200" value="50" />
  <button id="btn" onclick="scan()">🚀 扫描</button>
</div>
<div class="pt" id="pt">就绪</div>
<div id="out"></div>
</div>

<script>
/* ============ 指标 ============ */
function ema(a,n){const k=2/(n+1);let e=a[0],r=[e];for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);r.push(e)}return r}
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}return l===0?100:100-100/(1+(g/n)/(l/n))}
function adxCalc(h,l,c,p=14){
  const up=[],dn=[],tr=[];
  for(let i=1;i<c.length;i++){up.push(h[i]-h[i-1]);dn.push(l[i-1]-l[i]);tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])))}
  let su=0,sd=0,st=0;for(let i=tr.length-p;i<tr.length;i++){su+=Math.max(up[i],0);sd+=Math.max(dn[i],0);st+=tr[i]}
  if(!st)return{adx:0,pdi:0,mdi:0};
  const pdi=100*su/st,mdi=100*sd/st;
  return{adx:100*Math.abs(pdi-mdi)/(pdi+mdi),pdi,mdi};
}
function slope(a){const n=a.length;let sx=0,sy=0,sxy=0,sxx=0;for(let i=0;i<n;i++){sx+=i;sy+=a[i];sxy+=i*a[i];sxx+=i*i}const d=n*sxx-sx*sx;if(!d)return 0;return((n*sxy-sx*sy)/d)/a[n-1]*100}
function atr(h,l,c,p=14){let tr=[];for(let i=1;i<c.length;i++)tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));let s=0;for(let i=tr.length-p;i<tr.length;i++)s+=tr[i];return s/p}
function bollWidth(c,p=20){const m=c.slice(-p).reduce((a,b)=>a+b)/p;let sd=0;for(const x of c.slice(-p))sd+=(x-m)**2;sd=Math.sqrt(sd/p);return((m+2*sd)-(m-2*sd))/m}

async function getTopSymbols(N){
  const r=await fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP');
  const j=await r.json();
  if(j.code!=='0')return [];
  return j.data
    .filter(x=>x.instId.endsWith('-USDT-SWAP'))
    .map(x=>({sym:x.instId.replace('-USDT-SWAP',''),vol:parseFloat(x.volCcy24h||0)}))
    .sort((a,b)=>b.vol-a.vol)
    .slice(0,N)
    .map(x=>x.sym);
}
async function fetchK(sym,bar,limit){
  try{
    const r=await fetch(`https://www.okx.com/api/v5/market/candles?instId=${sym}-USDT-SWAP&bar=${bar}&limit=${limit}`);
    const j=await r.json();
    if(j.code!=='0'||!j.data)return null;
    return j.data.slice(1).reverse().map(d=>({o:+d[1],h:+d[2],l:+d[3],c:+d[4],v:+d[5]}));
  }catch(e){return null}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ 日线评估 ============ */
function evalDaily(sym,d){
  const c=d.map(x=>x.c),h=d.map(x=>x.h),l=d.map(x=>x.l),o=d.map(x=>x.o),v=d.map(x=>x.v);
  const n=c.length;
  const e20=ema(c,20),e50=ema(c,50),e200=ema(c,Math.min(200,n-1));
  const ad=adxCalc(h,l,c,14), a=ad.adx, sl=slope(c.slice(-20)), bw=bollWidth(c,20);
  const atrv=atr(h,l,c,14)/c[n-1];

  if(a<22 && bw<0.06) return {reject:`横盘死市（ADX ${a.toFixed(0)}，布林带宽 ${(bw*100).toFixed(1)}%）`};
  let spike=0;
  for(let i=n-20;i<n;i++){
    const body=Math.abs(c[i]-o[i]), upS=h[i]-Math.max(o[i],c[i]), dnS=Math.min(o[i],c[i])-l[i];
    const maxS=Math.max(upS,dnS);
    if(body>0 && maxS/body>2.2 && maxS/c[i]>atrv*1.5) spike++;
  }
  if(spike>=4) return {reject:`插针盘（近20日 ${spike} 根长影线，洗盘概率高）`};

  let score=0,dir=null,log=[];
  if(c[n-1]>e20[n-1]&&e20[n-1]>e50[n-1]&&e50[n-1]>e200[n-1]){score+=30;dir='LONG';log.push('日线完美多头排列')}
  else if(c[n-1]<e20[n-1]&&e20[n-1]<e50[n-1]&&e50[n-1]<e200[n-1]){score+=30;dir='SHORT';log.push('日线完美空头排列')}
  else if(c[n-1]>e200[n-1]){score+=12;dir='LONG';log.push('价格站上年线')}
  else {score+=12;dir='SHORT';log.push('价格跌破年线')}

  score+=Math.min(20,Math.max(0,(a-22)*0.8));
  if(a>25)log.push(`ADX ${a.toFixed(0)} 趋势强`);
  if(dir==='LONG'&&ad.pdi>ad.mdi){score+=10;log.push('+DI 主导资金')}else if(dir==='SHORT'&&ad.mdi>ad.pdi){score+=10;log.push('-DI 主导资金')}
  if(Math.abs(sl)>0.3)score+=10;
  const hh20=Math.max(...h.slice(-20)),hh40=Math.max(...h.slice(-40,-20));
  const ll20=Math.min(...l.slice(-20)),ll40=Math.min(...l.slice(-40,-20));
  if(dir==='LONG'&&hh20>hh40&&ll20>ll40){score+=10;log.push('高点抬高低点抬高')}
  if(dir==='SHORT'&&hh20<hh40&&ll20<ll40){score+=10;log.push('高点降低低点降低')}
  const v5=v.slice(-5).reduce((x,y)=>x+y)/5, v20=v.slice(-20).reduce((x,y)=>x+y)/20;
  if(v5>v20*1.1){score+=8;log.push('量能放大')}else score-=4;

  const r=rsi(c,14);
  if(dir==='LONG'&&r>78)return {reject:`日线超买 RSI ${r.toFixed(0)}，不接飞刀`};
  if(dir==='SHORT'&&r<22)return {reject:`日线超卖 RSI ${r.toFixed(0)}，不接飞刀`};
  const dev=(c[n-1]-e200[n-1])/e200[n-1];
  if(Math.abs(dev)>0.35)return {reject:`偏离年线 ${(dev*100).toFixed(0)}% 过远，不追`};

  score=Math.round(Math.min(100,Math.max(0,score)));
  return {sym,dir,score,adx:a,rsi:r,dev,slope:sl,log,close:c[n-1],
    e20:e20[n-1],e50:e50[n-1],e200:e200[n-1],atrPct:atrv*100,spike};
}

/* ============ 文字解读 ============ */
function explain(best){
  const isL=best.dir==='LONG';
  const trend=isL?'日线级别上涨趋势':'日线级别下跌趋势';
  const why=best.log.join('，');
  const risk=isL
    ? `如果价格跌破 ${best.e20.toFixed(best.close<1?4:2)}（EMA20）说明短期多头转弱，先减仓；跌破年线 ${best.e200.toFixed(best.close<1?4:2)} 直接离场。`
    : `如果价格反弹突破 ${best.e20.toFixed(best.close<1?4:2)}（EMA20）说明空头失效，先减仓；重新站回年线 ${best.e200.toFixed(best.close<1?4:2)} 直接离场。`;
  const chase=Math.abs(best.dev)>0.25?`注意：当前已偏离年线 ${(best.dev*100).toFixed(1)}%，不是底部，属于趋势中段的顺势单，别重仓追。`:`位置相对年线不算极端，可以等回踩均线再动手。`;
  return `【${best.sym}】判断：日线${isL?'看涨':'看跌'}，潜力分 ${best.score}/100。

`+
`1. 大方向：${trend}。\n`+
`   现在价格 ${best.close.toFixed(best.close<1?5:2)}，${isL?'在':'在'}年线上方还是下方？${best.close>best.e200?isL?'在年线上方，多头市场':'反常：价格虽在年线上但结构偏空':isL?'但结构仍偏多':'在年线下方，空头市场'}。\n\n`+
`2. 为什么选它：\n`+
`   ${why}。ADX ${best.adx.toFixed(0)} 说明趋势不是假突破；20日斜率 ${best.slope.toFixed(2)}% 说明动量真实存在，不是横盘乱震。\n\n`+
`3. 风险过滤：\n`+
`   已排除横盘死市和插针洗盘（近20日长影 ${best.spike} 根），也不是超买超卖接飞刀。\n\n`+
`4. 怎么处理：\n`+
`   ${chase}\n`+
`   止损逻辑：本金亏 5 倍就走（按 10x 杠杆≈反向 0.5% 硬止损），不止损硬扛；\n`+
`   止盈不预设顶部，用移动止盈——浮盈超 5% 后，回撤 ${ (best.atrPct*1.5).toFixed(2) }% 就落袋。\n\n`+
`5. 退出信号：\n`+
`   ${risk}\n`+
`   日线收盘破位才认错，不用看 5 分钟噪音。`;
}

/* ============ 扫描主流程 ============ */
async function scan(){
  const btn=document.getElementById('btn'), pt=document.getElementById('pt'), out=document.getElementById('out');
  const N=Math.max(5,Math.min(200,parseInt(document.getElementById('num').value||50)));
  btn.disabled=true;btn.innerText='拉取中...';out.innerHTML='';
  pt.innerText=`实时拉取欧易前 ${N} 只活跃永续...`;

  let syms=[];
  try{ syms=await getTopSymbols(N); }catch(e){}
  if(!syms.length){out.innerHTML='<div class="empty">行情拉取失败，检查代理/网络</div>';btn.disabled=false;btn.innerText='🚀 扫描';return;}

  const res=[],rej=[];
  for(let i=0;i<syms.length;i++){
    const sym=syms[i];
    pt.innerText=`(${i+1}/${syms.length}) 分析 ${sym}`;
    const d=await fetchK(sym,'1D',210);
    if(!d||d.length<120){rej.push(sym+' 数据不足');await sleep(20);continue}
    await sleep(50);
    const r=evalDaily(sym,d);
    if(r.reject){rej.push(sym+'：'+r.reject);continue}
    res.push(r);
  }

  if(!res.length){
    out.innerHTML=`<div class="card"><div class="empty">前 ${N} 只里没有符合「日线趋势+非横盘非插针」的币。<br>市场大概率整体震荡/洗盘，不硬推。</div></div>`+
      `<div class="note">过滤记录：${rej.slice(0,10).join('　')}</div>`;
    pt.innerText='0 个合格';
    btn.disabled=false;btn.innerText='🚀 扫描';return;
  }
  res.sort((a,b)=>b.score-a.score);
  const best=res[0], isL=best.dir==='LONG';
  const p=x=>x<0.01?x.toFixed(6):x.toFixed(2);

  let html=`<div class="card ${best.dir}">
    <div class="hd"><span class="sy">${best.sym}</span>
    <span class="dr ${best.dir}">${isL?'📈 做多':'📉 做空'} · 日线${isL?'看涨':'看跌'}</span></div>
    <div class="sc"><div class="n" style="color:${isL?'var(--green)':'var(--red)'}">${best.score}</div>
    <div class="t" style="font-size:11px;color:var(--sub)">潜力分/100（实时数据）</div></div>
    <div class="row"><span>实时价</span><b>${p(best.close)}</b></div>
    <div class="row"><span>EMA20/50/200</span><b>${p(best.e20)} / ${p(best.e50)} / ${p(best.e200)}</b></div>
    <div class="row"><span>ADX / RSI</span><b>${best.adx.toFixed(0)} / ${best.rsi.toFixed(0)}</b></div>
    <div class="row"><span>20日斜率</span><b>${best.slope.toFixed(2)}%</b></div>
    <div class="row"><span>止损/止盈</span><b class="r">本金5倍</b> <b class="g">无上限·移动止盈</b></div>
    <div class="txt">${explain(best)}</div>
  </div>`;
  html+=`<div class="note">📊 候选前5：${res.slice(0,5).map(x=>x.sym+'('+x.score+x.dir[0]+')').join('　')}</div>`;
  html+=`<div class="note">🚫 过滤 ${rej.length} 个：${rej.slice(0,6).join('　')}</div>`;
  out.innerHTML=html;
  pt.innerText=`扫完 ${syms.length} 只 · 合格 ${res.length} 只 · 推1个`;
  btn.disabled=false;btn.innerText='🚀 扫描';
}
</script>
</body>
</html>
