<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多空推荐器 · 固定止盈止损版</title>
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--border:#2a2a2a;--green:#00d4aa;--red:#ff4757;--yellow:#ffc107;--text:#e0e0e0;--sub:#888}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:12px;font-size:14px}
.wrap{max-width:440px;margin:0 auto}
h1{text-align:center;font-size:17px;margin:6px 0;color:var(--yellow)}
.desc{text-align:center;color:var(--sub);font-size:11px;margin-bottom:10px;line-height:1.5}
.cfg{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.cfg .t{font-size:11px;color:var(--sub);margin-bottom:6px}
.crow{display:flex;gap:6px;margin-bottom:6px}
.crow input{flex:1;background:#111;border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px;font-size:13px;outline:none;text-align:center}
.crow span{font-size:11px;color:var(--sub);align-self:center;min-width:52px}
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:6px;background:var(--green);color:#000}
.btn.sec{background:#2a2a2a;color:var(--text);font-size:13px;padding:9px}
.progress{height:4px;background:#222;border-radius:2px;margin:8px 0 4px;overflow:hidden}
.pf{height:100%;background:var(--green);width:0%;transition:width .3s}
.ptext{text-align:center;font-size:11px;color:var(--sub);margin-bottom:10px}
.big{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.big.long{border-left:4px solid var(--green)}
.big.short{border-left:4px solid var(--red)}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bsym{font-size:20px;font-weight:bold}
.bdir{font-size:12px;padding:4px 10px;border-radius:5px;font-weight:bold}
.bl{background:var(--green);color:#000}.bs{background:var(--red);color:#fff}
.score{text-align:center;margin:8px 0;padding:8px;background:#111;border-radius:6px}
.score .num{font-size:26px;font-weight:bold}
.score .lbl{font-size:10px;color:var(--sub)}
.row{display:flex;justify-content:space-between;font-size:12px;margin:3px 0;color:#bbb}
.row b{color:var(--text)}
.hl{color:var(--yellow)!important;font-weight:bold}
.danger{background:rgba(255,71,87,.12);border:1px solid var(--red);border-radius:6px;padding:8px;font-size:11px;color:#ff8a95;margin-top:8px;line-height:1.6}
.warn{font-size:11px;color:var(--sub);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);line-height:1.6}
.rank{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.6}
.empty{text-align:center;color:var(--sub);font-size:12px;padding:16px}
.hist{font-size:11px;color:#666;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 多空推荐器</h1>
<div class="desc">止盈50% · 止损30% · 最大杠杆<br>自动避开高波动 · 不重复推荐</div>

<div class="cfg">
  <div class="t">⚙️ 止盈止损（按本金百分比）</div>
  <div class="crow"><span>止盈</span><input id="tpPct" type="number" value="50"><span>% 本金</span></div>
  <div class="crow"><span>止损</span><input id="slPct" type="number" value="30"><span>% 本金</span></div>
  <div class="crow"><span>杠杆</span><input id="lev" type="number" value="50"><span>x（欧易上限）</span></div>
  <div class="t" style="margin-top:8px">🛡️ 波动过滤（避免几下扫到止损）</div>
  <div class="crow"><span>1H平均振幅上限</span><input id="maxAmp" type="number" step="0.1" value="1.2"><span>%</span></div>
  <div class="crow"><span>ATR/价格上限</span><input id="maxAtr" type="number" step="0.1" value="1.5"><span>%</span></div>
  <div class="crow"><span>连续同向根数上限</span><input id="maxStreak" type="number" value="4"><span>根</span></div>
</div>

<button class="btn" onclick="start()">🚀 扫描推荐</button>
<button class="btn sec" onclick="clearHist()">🗑️ 清空排除名单（当前 <span id="hc">0</span> 个）</button>
<div class="progress"><div class="pf" id="bar"></div></div>
<div class="ptext" id="ptext">就绪</div>
<div id="results"></div>
</div>

<script>
const TOP50=["BTC","ETH","SOL","XRP","DOGE","BNB","ADA","AVAX","LINK","DOT","MATIC","ATOM","NEAR","APT","SUI","ARB","OP","LTC","BCH","XLM","ETC","FIL","ICP","HBAR","VET","ALGO","THETA","XTZ","EOS","AAVE","UNI","MKR","CRV","LDO","RUNE","INJ","SEI","TIA","STX","PENDLE","ENA","WLD","JUP","ONDO","ETHFI","ZEC","TRX","KAS","HYPE","FET"];
const HKEY='swing_excluded_v1';
let excluded=JSON.parse(localStorage.getItem(HKEY)||'[]');

function ema(a,n){const k=2/(n+1);let e=a[0],r=[e];for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);r.push(e)}return r}
function rsi(a,n=14){if(a.length<n+1)return 50;let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}if(l===0)return 100;return 100-100/(1+(g/n)/(l/n))}
function adxCalc(h,l,c,p=14){
  const up=[],dn=[],tr=[];
  for(let i=1;i<c.length;i++){up.push(h[i]-h[i-1]);dn.push(l[i-1]-l[i]);tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])))}
  let su=0,sd=0,st=0;
  for(let i=Math.max(1,tr.length-p);i<tr.length;i++){su+=Math.max(up[i],0);sd+=Math.max(dn[i],0);st+=tr[i]}
  if(st===0)return{adx:0,pdi:0,mdi:0};
  const pdi=100*su/st,mdi=100*sd/st;
  return{adx:100*Math.abs(pdi-mdi)/(pdi+mdi),pdi,mdi};
}
async function fetchK(inst,bar,limit){
  try{
    const r=await fetch(`https://www.okx.com/api/v5/market/candles?instId=${inst}-USDT-SWAP&bar=${bar}&limit=${limit}`);
    const j=await r.json();
    if(j.code!=='0'||!j.data)return null;
    return j.data.reverse().map(d=>({o:+d[1],h:+d[2],l:+d[3],c:+d[4],v:+d[5]}));
  }catch(e){return null}
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function clearHist(){if(confirm('清空排除名单？下次扫描会重新推荐扫过的币')){excluded=[];localStorage.removeItem(HKEY);document.getElementById('hc').innerText='0';document.getElementById('results').innerHTML=''}}

async function start(){
  const btn=document.querySelector('.btn');
  btn.disabled=true;btn.innerText='扫描中...';
  const tpPct=+document.getElementById('tpPct').value/100;
  const slPct=+document.getElementById('slPct').value/100;
  const lev=+document.getElementById('lev').value;
  const maxAmp=+document.getElementById('maxAmp').value/100;
  const maxAtr=+document.getElementById('maxAtr').value/100;
  const maxStreak=+document.getElementById('maxStreak').value;

  // 价格需要走到的距离（杠杆放大后）
  const needTP=tpPct/lev, needSL=slPct/lev;

  const pool=TOP50.filter(s=>!excluded.includes(s));
  const scored=[], rejected=[];
  let done=0;

  for(const sym of pool){
    done++;
    document.getElementById('bar').style.width=(done/pool.length*100)+'%';
    document.getElementById('ptext').innerText=`${done}/${pool.length}  ${sym}`;

    const h4=await fetchK(sym,'4H',60);
    const h1=await fetchK(sym,'1H',200);
    if(!h4||!h1||h4.length<50||h1.length<150){rejected.push(sym+' (数据不足)');continue}

    const c4=h4.map(d=>d.c),c1=h1.map(d=>d.c);
    const e20=ema(c4,20),e55=ema(c4,55);
    const adxR=adxCalc(h4.map(d=>d.h),h4.map(d=>d.l),c4);
    const last1=h1[h1.length-1],prev1=h1[h1.length-2];
    const r1=rsi(c1,14);

    // ===== 波动体检：这几项不过直接淘汰 =====
    // 1H 近20根平均振幅
    let ampSum=0;
    for(const k of h1.slice(-20))ampSum+=(k.h-k.l)/k.c;
    const avgAmp=ampSum/20;
    // ATR(14) 1H
    let trSum=0;
    for(let i=h1.length-14;i<h1.length;i++){const k=h1[i];trSum+=Math.max(k.h-k.l,Math.abs(k.h-h1[i-1].c),Math.abs(k.l-h1[i-1].c))}
    const atr=trSum/14/last1.c;
    // 连续同向根数（判断是不是在单边冲/砸）
    let streak=0,dir=0;
    for(let i=h1.length-1;i>h1.length-12;i--){
      const d=c1[i]>c1[i-1]?1:(c1[i]<c1[i-1]?-1:0);
      if(d===0)break;
      if(streak===0){dir=d;streak=1}
      else if(d===dir)streak++;
      else break;
    }
    // 插针
    let spikes=0;
    for(const k of h4.slice(-10)){const body=Math.abs(k.c-k.o);if(body>0&&(k.h-k.l)/body>2)spikes++}

    if(avgAmp>maxAmp){rejected.push(`${sym} (1H振幅${(avgAmp*100).toFixed(2)}%太抖)`);continue}
    if(atr>maxAtr){rejected.push(`${sym} (ATR${(atr*100).toFixed(2)}%太大)`);continue}
    if(streak>=maxStreak){rejected.push(`${sym} (连续${streak}根单边，追进去易吃反抽)`);continue}
    if(spikes>=3){rejected.push(`${sym} (插针${spikes}根，庄盘)`);continue}
    // 止损距离小于2倍ATR → 正常呼吸就打掉
    if(needSL<atr*2){rejected.push(`${sym} (止损距离只有${(needSL*100).toFixed(2)}%，不足2倍ATR)`);continue}

    const win=h1.slice(-13,-1);
    const hh=Math.max(...win.map(d=>d.h)),ll=Math.min(...win.map(d=>d.l));
    const pos1=(last1.c-ll)/(hh-ll||1);
    const volUp=h1.slice(-3).reduce((s,d)=>s+d.v,0)/3>h1.slice(-20,-3).reduce((s,d)=>s+d.v,0)/17;

    // ===== 多头打分 =====
    let L=0;
    if(e20[e20.length-1]>e55[e55.length-1])L+=15;
    if(e20[e20.length-1]>e20[e20.length-3])L+=10;
    if(c4[c4.length-1]>e55[e55.length-1])L+=10;
    L+=clamp((adxR.adx-15)*1.2,0,20);
    if(adxR.pdi>adxR.mdi)L+=clamp((adxR.pdi-adxR.mdi)*1.5,0,20);
    L+=clamp(pos1*20,0,20);
    if(volUp&&last1.c>prev1.c)L+=15;
    const devL=(c4[c4.length-1]-e55[e55.length-1])/e55[e55.length-1];
    if(devL>0.08)L-=25;else if(devL>0.05)L-=10;
    if(r1>70)L-=15;else if(r1>65)L-=8;
    // 关键：止盈目标在不在够得着的地方
    const roomL=(hh-last1.c)/last1.c;
    if(roomL<needTP)L-=20;  // 前高比止盈目标还近，够不到50%
    if(roomL>needTP*4)L-=10;

    // ===== 空头打分（镜像）=====
    let S=0;
    if(e20[e20.length-1]<e55[e55.length-1])S+=15;
    if(e20[e20.length-1]<e20[e20.length-3])S+=10;
    if(c4[c4.length-1]<e55[e55.length-1])S+=10;
    S+=clamp((adxR.adx-15)*1.2,0,20);
    if(adxR.mdi>adxR.pdi)S+=clamp((adxR.mdi-adxR.pdi)*1.5,0,20);
    S+=clamp((1-pos1)*20,0,20);
    if(volUp&&last1.c<prev1.c)S+=15;
    const devS=(e55[e55.length-1]-c4[c4.length-1])/e55[e55.length-1];
    if(devS>0.08)S-=25;else if(devS>0.05)S-=10;
    if(r1<30)S-=15;else if(r1<35)S-=8;
    const roomS=(last1.c-ll)/last1.c;
    if(roomS<needTP)S-=20;
    if(roomS>needTP*4)S-=10;

    scored.push({sym,L:Math.round(clamp(L,0,100)),S:Math.round(clamp(S,0,100)),
      price:last1.c,adx:adxR.adx,rsi:r1,avgAmp,atr,spikes,streak,
      needTP,needSL,roomL,roomS,hh,ll});
  }

  const bestL=[...scored].sort((a,b)=>b.L-a.L)[0];
  const bestS=[...scored].sort((a,b)=>b.S-a.S)[0];
  const p=v=>v<0.01?v.toFixed(6):v.toFixed(2);
  const pick=[];

  let html='';
  function card(s,dir){
    const isL=dir==='LONG';
    const score=isL?s.L:s.S;
    const tp=isL?s.price*(1+s.needTP):s.price*(1-s.needTP);
    const sl=isL?s.price*(1-s.needSL):s.price*(1+s.needSL);
    const room=isL?s.roomL:s.roomS;
    return `<div class="big ${isL?'long':'short'}">
      <div class="bhead"><span class="bsym">${s.sym}</span><span class="bdir ${isL?'bl':'bs'}">${isL?'做多':'做空'} · ${document.getElementById('lev').value}x</span></div>
      <div class="score"><div class="num" style="color:${isL?'var(--green)':'var(--red)'}">${score}</div><div class="lbl">${isL?'多头':'空头'}强度分 / 100</div></div>
      <div class="row hl"><span>🎯 止盈（本金+${document.getElementById('tpPct').value}%）</span><b>${p(tp)}</b></div>
      <div class="row hl"><span>🛑 止损（本金-${document.getElementById('slPct').value}%）</span><b>${p(sl)}</b></div>
      <div class="row"><span>价格只需波动</span><b>涨/跌 ${(s.needTP*100).toFixed(2)}% 到止盈</b></div>
      <div class="row"><span></span><b>涨/跌 ${(s.needSL*100).toFixed(2)}% 到止损</b></div>
      <div class="row"><span>进场价</span><b>${p(s.price)}</b></div>
      <div class="row"><span>到止盈的空间</span><b>${(room*100).toFixed(2)}% ${room<s.needTP?'⚠️不够':'(够 '+(room/s.needTP).toFixed(1)+'倍)'}</b></div>
      <div class="row"><span>波动体检</span><b>振幅${(s.avgAmp*100).toFixed(2)}% · ATR${(s.atr*100).toFixed(2)}%</b></div>
      <div class="row"><span>ADX / RSI / 插针</span><b>${s.adx.toFixed(0)} / ${s.rsi.toFixed(0)} / ${s.spikes}根</b></div>
      <div class="danger">⚠️ 止损距离 ${(s.needSL*100).toFixed(2)}% = ${(s.needSL/s.atr).toFixed(1)} 倍ATR。${s.needSL/s.atr<3?'低于3倍，正常波动就可能打掉，建议降杠杆或放宽止损':'在3倍以上，相对安全'}<br>
      爆仓价约在 ${(s.needSL*100*0.9).toFixed(2)}% 反向波动处，止损先触发，不会先爆</div>
    </div>`;
  }

  if(bestL&&bestL.L>35){html+=card(bestL,'LONG');pick.push(bestL.sym)}
  else html+=`<div class="big"><div class="empty">当前无合格多头<br>${bestL?'最高分仅'+bestL.L+'，市场偏空':'池子已空'}</div></div>`;

  if(bestS&&bestS.S>35){html+=card(bestS,'SHORT');pick.push(bestS.sym)}
  else html+=`<div class="big"><div class="empty">当前无合格空头<br>${bestS?'最高分仅'+bestS.S+'，市场偏多':'池子已空'}</div></div>`;

  // 加入排除名单
  if(pick.length){
    excluded=[...new Set([...excluded,...pick])];
    localStorage.setItem(HKEY,JSON.stringify(excluded));
    html+=`<div class="rank">✅ 已加入排除名单，下次不再推荐：${pick.join('、')}</div>`;
  }
  document.getElementById('hc').innerText=excluded.length;

  const top=[...scored].sort((a,b)=>Math.max(b.L,b.S)-Math.max(a.L,a.S)).slice(0,6);
  if(top.length)html+=`<div class="rank">📊 本次候选前6：${top.map(s=>`${s.sym}(多${s.L}/空${s.S})`).join('  ')}</div>`;
  if(rejected.length)html+=`<div class="hist">🚫 波动过大被拦 ${rejected.length} 个：${rejected.slice(0,10).join('、')}${rejected.length>10?' 等':''}</div>`;
  if(excluded.length)html+=`<div class="hist">📋 历史排除（${excluded.length}）：${excluded.join('、')}</div>`;

  document.getElementById('results').innerHTML=html;
  document.getElementById('ptext').innerText=`扫完 ${scored.length} 个合格 · 拦掉 ${rejected.length} 个高波动`;
  btn.disabled=false;btn.innerText='🚀 重新扫描';
}
document.getElementById('hc').innerText=excluded.length;
</script>
</body>
</html>
