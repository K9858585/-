<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行情池工具</title>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background:#000; color:#fff; padding:16px; }
  #out1, #out2 { margin: 8px 0; padding: 8px; background:#111; min-height:120px; }
  button { padding: 6px 12px; margin: 4px 2px; cursor: pointer; }
</style>
</head>
<body>
  <div id="st1"></div>
  <div id="st2"></div>
  <button id="btn-fetch">重新抓取</button>
  <button id="btn-clear">清空缓存</button>
  <div id="out1"></div>
  <div id="out2"></div>

<script>
// ========== 如果需要，在这里补全你的原有变量/函数 ==========
const K_META = "META";
const K_LONG_POOL = "LONG_POOL";
const K_SHORT_POOL = "SHORT_POOL";

function $(id) {
  return document.getElementById(id);
}

function st(el, text, type = '') {
  $(el).textContent = text;
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

let longPool = [];
let shortPool = [];

function renderPool() {
  // 这里替换成你原来渲染列表的逻辑
  $("#out1").text(JSON.stringify(longPool, null, 2));
  $("#out2").text(JSON.stringify(shortPool, null, 2));
}

// “抓取”示例；替换成你原来的接口请求
function fetchData() {
  // 如果原接口有跨域/风控，这里会报错
  // $.get("你的接口地址", ...)
  st("st1", "开始抓取（示例占位）");
}

$("#btn-fetch").on("click", fetchData);
$("#btn-clear").on("click", function () {
  localStorage.removeItem(K_META);
  localStorage.removeItem(K_LONG_POOL);
  localStorage.removeItem(K_SHORT_POOL);
  longPool = [];
  shortPool = [];
  $("#out1").empty();
  $("#out2").empty();
  st("st1", "全部池子缓存已清空，请重新抓取。");
  st("st2", "等待窗口一生成多空池。");
});

(function init() {
  const dayStore = localStorage.getItem("DAY_STORE");
  longPool = JSON.parse(localStorage.getItem(K_LONG_POOL) || "[]");
  shortPool = JSON.parse(localStorage.getItem(K_SHORT_POOL) || "[]");

  if (longPool.length > 0 || shortPool.length > 0) {
    if (dayStore === today()) {
      st("st1", "✅ 本地今日缓存｜多头池 " + longPool.length + " 只，空头池 " + shortPool.length + " 只");
    } else {
      st("st1", "⚠️ 读取到旧日期缓存 [" + dayStore + "]，建议点抓取重扫描当日 K 线");
    }
    renderPool();
  } else {
    st("st1", "暂无缓存，请点抓取");
    st("st2", "等待窗口一生成多空池。");
  }
})();
</script>
</body>
</html>
