<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彩票胆码统计（娱乐版）</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>彩票胆码统计（娱乐版）</h1>
    <p class="warn">⚠️ 本工具仅做历史数据统计，彩票开奖随机，不构成投注建议。</p>

    <section class="controls">
      <label>
        彩票类型：
        <select id="type">
          <option value="ssq">双色球</option>
          <option value="dlt">大乐透</option>
        </select>
      </label>
      <label>
        参考期数：
        <select id="count">
          <option value="30">最近 30 期</option>
          <option value="50" selected>最近 50 期</option>
          <option value="100">最近 100 期</option>
        </select>
      </label>
      <button id="run">开始统计</button>
    </section>

    <section id="status" class="status"></section>

    <section id="result" class="result hidden">
      <h2>统计结果</h2>
      <div id="danma" class="danma"></div>
      <h3>红球/前区出现频次</h3>
      <div id="freq" class="freq"></div>
      <h3>最近开奖（部分）</h3>
      <div id="recent" class="recent"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
