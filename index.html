<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OKX 组合五智能推荐</title>
<style>
  :root{--bg:#0b0f14;--card:#11161d;--line:#1f2937;--txt:#e5e7eb;--sub:#9ca3af;--up:#22c55e;--down:#ef4444;--gold:#f59e0b;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:480px;margin:0 auto;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .btn{display:block;width:100%;padding:14px;border-radius:10px;background:var(--gold);color:#000;font-weight:700;border:none;margin-bottom:10px;cursor:pointer;font-size:15px;}
  .btn:disabled{opacity:.6;}
  .btn-sub{background:#1f2937;color:var(--txt);}
  .row{display:flex;align-items:center;margin:12px 0;gap:10px;}
  .row span{flex-shrink:0;}
  input,select{background:#0b0f14;border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:8px;font-size:15px;}
  input[type=number]{width:80px;text-align:center;}
  select{width:140px;}
  #status{margin-top:12px;color:var(--gold);font-size:14px;word-break:break-all;}
  .card{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:16px;background:#0f141a;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .sym{font-size:22px;font-weight:800;}
  .sub{color:var(--sub);font-size:12px;margin-top:4px;}
  .dir{text-align:right;font-weight:700;font-size:18px;}
  .dir.up{color:var(--up);}.dir.down{color:var(--down);}.dir.none{color:var(--sub);}
  .grid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;margin-top:12px;}
  .grid div{color:var(--sub);}.grid b{color:var(--txt);text-align:right;}
  .toggle{margin-top:12px;color:var(--gold);font-size:13px;cursor:pointer;}
  .reason{margin-top:8px;font-size:13px;color:var(--sub);line-height:1.6;}
  .hidden{display:none;}
  .warn{color:var(--down);}
  .top10{margin-top:12px;font-weight:700;color:var(--gold);}
</style>
</head>
<body>
  <div class="box">
    <button class="btn" id="btnList">📥 抓取今日成交额前100（每日一次）</button>
    <button class="btn" id="btnRec">🎯 推荐一只（轻量刷新实时价 + 前N评分）</button>
    <button class="btn btn-sub" id="btnClear">🗑 清空缓存</button>
    <div class="row"><span>推荐范围：前</span><input id="rangeIn" type="number" value="100" min="1" max="100"><span>名（留空=100）</span></div>
    <div class="row"><span>K线周期：</span>
      <select id="barIn">
        <option value="1D" selected>日线 (1D)</option>
        <option value="4H">4小时 (4H)</option>
        <option value="1H">1小时 (1H)</option>
        <option value="15m">15分钟 (15m)</option>
      </select>
    </div>
    <div id="status">加载中...</div>
  </div>
  <div id="result"></div>

<script>
const $ = id => document.getElementById(id);
const bjDate = () => new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);
const fmt = n => (n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(2)+'K':(n||0).toFixed(2));
const px = (p,sym) => {const f=sym==='BTC'||sym==='ETH'?2:4;return '$'+(p||0).toFixed(f);};
const pct = v => (v>0?'+':'')+(v*100).toFixed(2)+'%';

// 带超时 + 代理兜底的 fetch
async function fetchSafe(url, ms=8000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try {
    // 先直连
    let res = await fetch(url, {signal: controller.signal});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) {
    // 直连失败（404/跨域/超时）-> 走代理
    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, {signal: controller.signal});
    if(!res.ok) throw new Error(`代理也失败 HTTP ${res.status}`);
    return await res.json();
  } finally { clearTimeout(timer); }
}

// 缓存
function loadList(){try{const c=localStorage.getItem('okx_top100');return c?JSON.parse(c):null;}catch{return null;}}
function saveList(list){localStorage.setItem('okx_top100', JSON.stringify({date:bjDate(), list}));}

// 抓取榜单（OKX 正确接口）
async function fetchList(){
  $('status').innerText='抓取中...';
  const url = 'https://www.okx.com/api/v5/market/tickers?instType=SPOT';
  const j = await fetchSafe(url);
  if(j.code!=='0') throw new Error('OKX返回错误: '+j.msg);
  const data = j.data.filter(d=>d.instId.endsWith('-USDT')).sort((a,b)=>parseFloat(b.volCcy24h||0)-parseFloat(a.volCcy24h||0)).slice(0,100);
  saveList(data);
  $('status').innerText=`抓取完成，共${data.length}只（${bjDate()}）`;
}

// 计算指标
function calcScore(klines){
  const closes=klines.map(k=>parseFloat(k[4])), vols=klines.map(k=>parseFloat(k[5]));
  const e=(n)=>closes.slice(-n).reduce((a,b,i,a)=>a+(b*(i+1)),0)/closes.slice(-n).length;
  const e20=e(20),e50=e(50),e200=e(200);
  const last=closes[closes.length-1];
  let score=0, dir='none', reasons=[];
  if(last>e20&&e20>e50){score+=25;dir='up';reasons.push('EMA20>50 多头排列');}
  else if(last<e20&&e20<e50){score+=20;dir='down';reasons.push('EMA空头排列');}
  // MACD
  const ema12=closes.slice(-26).reduce((a,b,i)=>a+b*(i+1),0)/26;
  const ema26=closes.slice(-26).reduce((a,b,i)=>a+b*(i+1),0)/26;
  const dif=ema12-ema26;
  if(dif>0){score+=20;reasons.push('MACD偏多');}else{score+=10;reasons.push('MACD偏弱');}
  // RSI
  let up=0,down=0;for(let i=1;i<closes.length;i++){const d=closes[i]-closes[i-1];if(d>0)up+=d;else down-=d;}
  const rsi=100-(100/(1+(up/down)));
  if(rsi>50&&rsi<70){score+=15;reasons.push(`RSI${rsi.toFixed(0)}健康`);}else if(rsi>70){score+=10;reasons.push('RSI超买');}else{score+=5;reasons.push('RSI偏弱');}
  // ADX
  let tr=0,dm=0;for(let i=1;i<closes.length;i++){tr+=Math.abs(closes[i]-closes[i-1]);dm+=Math.abs(closes[i]-closes[i-1]);}
  const adx=tr?dm/tr*100:0;
  if(adx>20){score+=20;reasons.push(`趋势强ADX${adx.toFixed(0)}`);}else{score+=10;reasons.push('趋势弱');}
  // 量比
  const volR=vols.slice(-5).reduce((a,b)=>a+b,0)/5/(vols.slice(-20,-5).reduce((a,b)=>a+b,0)/15||1);
  if(volR>1.2){score+=10;reasons.push(`放量${volR.toFixed(1)}`);}else{score+=5;}
  // 影线
  const h=parseFloat(klines[klines.length-1][2]),l=parseFloat(klines[klines.length-1][3]),o=parseFloat(klines[klines.length-1][1]);
  const upSh=(h-Math.max(o,last))/(h-l||1), dnSh=(Math.min(o,last)-l)/(h-l||1);
  if(upSh<0.3&&dnSh<0.3){score+=10;reasons.push('实体强');}else{score+=5;}
  return {score,dir,reasons,e20,e50,e200,dif,rsi,adx,volR,upSh,dnSh};
}

// 推荐
async function recommend(){
  const cache=loadList(); if(!cache){$('status').innerText='无缓存，先点抓取';return;}
  const range=parseInt($('rangeIn').value)||100, bar=$('barIn').value;
  $('status').innerText=`轻量刷新 + 评分中(前${range}, ${bar})...`;
  const list=cache.list.slice(0,range);
  const scored=[];
  for(const d of list){
    try{
      // 实时价
      const tk=await fetchSafe(`https://www.okx.com/api/v5/market/ticker?instId=${d.instId}`);
      const t=tk.data[0];
      // K线
      const kl=await fetchSafe(`https://www.okx.com/api/v5/market/candles?instId=${d.instId}&bar=${bar}&limit=200`);
      const k=kl.data.reverse();
      const r=calcScore(k);
      scored.push({...d,...r, realLast:parseFloat(t.last), realUsd:parseFloat(t.volCcy24h), realChgPct:parseFloat(t.change24h), base:d.instId.split('-')[0]});
    }catch{}
  }
  scored.sort((a,b)=>b.score-a.score);
  const top=scored[0], top10=scored.slice(0,10).map(s=>s.base+'('+s.score+')').join(', ');
  if(!top){$('status').innerText='⚠ 全部失败，请检查网络/代理';return;}
  const isNone=top.score<55, cls=top.score>=70?'up':isNone?'none':(top.dir==='down'?'down':'up');
  const pctTxt=pct(top.realChgPct??top.chgPct), failPrice=top.dir==='up'?Math.min(top.e20,top.e50):Math.max(top.e20,top.e50);
  $('result').innerHTML=`
    <div class="card">
      <div class="top"><div><div class="sym">${top.base}</div><div class="sub">成交额第${cache.list.indexOf(top)+1}名 / 前${range}（共${cache.list.length}）</div></div>
        <div class="dir ${cls}">${pctTxt}<br><span class="sub">${top.score}分</span></div></div>
      <div class="grid">
        <div>现价(实时)</div><b>${px(top.realLast,top.base)}</b>
        <div>24h成交额</div><b>$${fmt(top.realUsd||top.volCcy24h)}</b>
        <div>EMA20/50/200</div><b>${px(top.e20,top.base)} / ${px(top.e50,top.base)} / ${px(top.e200,top.base)}</b>
        <div>MACD/RSI/ADX</div><b>${top.dif.toFixed(2)} / ${top.rsi.toFixed(0)} / ${top.adx.toFixed(0)}</b>
        <div>量比/影线</div><b>${top.volR.toFixed(1)} / 上${top.upSh.toFixed(2)}下${top.dnSh.toFixed(2)}</b>
        <div>失效位</div><b style="color:${top.dir==='down'?'var(--up)':'var(--down)'}">${top.dir==='down'?'站回':'跌破'} ${px(failPrice,top.base)}</b>
      </div>
      <div class="toggle" onclick="this.nextElementSibling.classList.toggle('hidden')">📋 展开推理 ▼</div>
      <div class="reason hidden">${top.reasons.map(r=>`<div>${r}</div>`).join('')}</div>
      <div class="top10">TOP10: ${top10}</div>
      <div class="sub" style="margin-top:10px">组合五 · 最高${top.score}分 · ${isNone?'⚠ <55不做':top.score>=70?'🔥强信号':'弱信号小仓'}</div>
    </div>`;
  $('status').innerText=`完成 · 前${range} · 最高${top.score}分 · ${new Date().toLocaleTimeString()}`;
}

$('btnList').onclick=async()=>{const b=$('btnList');b.disabled=true;try{await fetchList();}catch(e){$('status').innerText='⚠️ '+e.message;}b.disabled=false;};
$('btnRec').onclick=async()=>{const b=$('btnRec');b.disabled=true;await recommend();b.disabled=false;};
$('btnClear').onclick=()=>{localStorage.removeItem('okx_top100');$('status').innerText='缓存已清，请重新抓取';};
(function(){const c=loadList();$('status').innerText=c?`缓存：${c.date}（${c.list.length}只）${c.date!==bjDate()?' · 需重抓':''} · 推荐将轻量刷新`:'无缓存，先点【抓取】';})();
</script>
</body>
</html>
