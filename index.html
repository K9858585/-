<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OKX合约趋势扫描｜WebSocket实时 v4.4‑FIX</title>
<style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--bd:#333;--txt:#e0e0e0;--sub:#888;--ylw:#fcd34d;--red:#f6465d;--grn:#2eb872;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;padding:12px;padding-bottom:80px;}
.header{text-align:center;margin-bottom:16px;}
.title{font-size:22px;font-weight:800;color:var(--ylw);display:flex;align-items:center;justify-content:center;gap:8px;}
.sub-t{color:var(--sub);font-size:12px;margin-top:4px;}
.warn{border:1px solid #885400;background:#2b2210;padding:8px;border-radius:8px;font-size:12px;color:#ffd470;margin-bottom:12px;}
.section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:16px;}
.sec-t{font-size:13px;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between;}
.input-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
input,select{flex:1;min-width:120px;background:#222;color:var(--txt);border:1px solid #444;border-radius:8px;padding:10px;font-size:14px;outline:none;}
.btn{background:var(--ylw);color:#111;font-weight:700;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;white-space:nowrap;touch-action:manipulation;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-dark{background:#333;color:#aaa;}
.card{background:#1e1e1e;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:10px;position:relative;}
.card.l1{border-left:3px solid var(--ylw);}
.card.l2{border-left:3px solid #ccc;}
.card.l3{border-left:3px solid #b87333;}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rank{font-weight:700;font-size:15px;}
.row-d{display:flex;justify-content:space-between;margin:4px 0;font-size:13px;}
.row-d span{color:var(--sub);}
.b{color:var(--grn);}.r{color:var(--red);}.y{color:var(--ylw);}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;margin-right:4px;background:#333;color:#aaa;}
.tag.g{background:#1a3a2a;color:var(--grn);}.tag.y{background:#3a3a1a;color:var(--ylw);}
.fold{cursor:pointer;background:#252525;padding:8px;border-radius:6px;margin-top:8px;font-size:13px;display:flex;justify-content:space-between;touch-action:manipulation;}
.fold-body{display:none;padding:8px;background:#181818;border-radius:6px;margin-top:4px;font-size:12px;color:#bbb;white-space:pre-line;}
.fold.open .fold-body{display:block;}
.fold.open .ar{transform:rotate(180deg);}
.ar{transition:.2s;}
.err{color:var(--red);background:#2a1a1a;padding:10px;border-radius:8px;margin-top:8px;border:1px solid #441;}
.empty{color:var(--sub);text-align:center;padding:20px;}
.note{font-size:11px;color:var(--sub);margin-top:6px;}
.hist-item{display:inline-block;background:#2a2a2a;padding:4px 8px;border-radius:12px;margin:4px 4px 0 0;font-size:12px;color:#ccc;cursor:pointer;}
#pt{text-align:center;color:var(--sub);font-size:12px;margin-top:10px;}
.ws-status{font-size:12px;padding:4px 8px;border-radius:4px;}
.ws-ok{background:#1a3a2a;color:#2eb872;}
.ws-off{background:#3a1a1a;color:#f6465d;}
</style>
</head>
<body>
<div class="warn">⚠️本工具仅用于代码学习；虚拟货币合约风险极高，国内禁止虚拟货币交易；浏览器直接打开本地文件会CORS报错，请使用本地http服务或者CORS插件。</div>
<div class="header">
  <div class="title">🛰️ OKX合约·趋势扫描 v4.4‑FIX</div>
  <div class="sub-t">①成交额Top5 ②单币实时判定(WebSocket) ③抄底雷达｜真实RSI‑14 / SMA均线</div>
  <div id="wsWrap" class="note">WebSocket状态：<span id="wsStat" class="ws-status ws-off">未连接</span></div>
</div>

<!-- ① 成交额扫描 -->
<div class="section">
  <div class="sec-t"><span>Top N 成交额扫描 · 展示前5名</span></div>
  <div class="input-row">
    <input id="inN" type="number" value="50" min="1" max="200">
    <button class="btn" id="btnScan">🚀 扫描</button>
  </div>
  <div id="scanOut"></div>
</div>

<!-- ② 单币走势判定（WebSocket实时） -->
<div class="section">
  <div class="sec-t"><span>单币走势判定｜WebSocket自动更新K线</span></div>
  <div class="input-row">
    <input id="inSym" type="text" value="BTC" placeholder="币种如 BTC">
    <select id="inBar">
      <option value="15m">15分钟</option>
      <option value="1H">1小时</option>
      <option value="4H" selected>4小时·波段</option>
      <option value="1D">日线</option>
    </select>
    <button class="btn" id="btnJudge">🔍 开始判定+订阅实时</button>
  </div>
  <div class="input-row">
    <button class="btn btn-dark" id="btnWsClose">⏹️关闭WebSocket订阅</button>
    <button class="btn btn-dark" id="btnClear">🗑️清空历史</button>
  </div>
  <div id="histBox" class="note"></div>
  <div id="judgeOut" style="margin-top:10px;"></div>
</div>

<!-- ③ 抄底雷达 -->
<div class="section">
  <div class="sec-t"><span>抄底雷达 · 成交额前N筛选超跌</span></div>
  <div class="input-row">
    <input id="inRad" type="number" value="30" min="1" max="200">
    <button class="btn" id="btnRad">📡雷达搜索</button>
  </div>
  <div id="radarOut"></div>
</div>

<div id="pt">就绪</div>

<script>
const $=id=>document.getElementById(id);
let ws=null;
let currentInstId='';
let currentBar='';

const fmt=n=>n==null||isNaN(n)?'--':Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const fmtUsd=n=>{if(!n||isNaN(n))return '--';if(n>1e8)return (n/1e8).toFixed(2)+'亿';if(n>1e4)return (n/1e4).toFixed(2)+'万';return fmt(n);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const foldHtml=(title,arr,open)=>`<div class="fold ${open?'open':''}"><span>▶ ${esc(title)}</span><span class="ar">▼</span></div><div class="fold-body">${arr.map(esc).join('<br>')}</div>`;

// RSI‑14 标准计算
function calcRSI(closeList,period=14){
    if(closeList.length <= period) return null;
    let gains=[],losses=[];
    for(let i=1;i<closeList.length;i++){
        const diff=closeList[i]-closeList[i-1];
        gains.push(Math.max(diff,0));
        losses.push(Math.max(-diff,0));
    }
    let avgGain=gains.slice(0,period).reduce((a,b)=>a+b,0)/period;
    let avgLoss=losses.slice(0,period).reduce((a,b)=>a+b,0)/period;
    for(let i=period;i<gains.length;i++){
        avgGain=(avgGain*(period-1)+gains[i])/period;
        avgLoss=(avgLoss*(period-1)+losses[i])/period;
    }
    if(avgLoss===0) return 100;
    const rs=avgGain/avgLoss;
    return 100-(100/(1+rs));
}

// SMA简单移动平均
function calcSMA(list,period){
    if(list.length<period) return null;
    return list.slice(-period).reduce((s,v)=>s+v,0)/period;
}

// VWAP
function calcVWAP(bars){
    let pv=0,vol=0;
    bars.forEach(b=>{ pv+=b.c*b.v; vol+=b.v; });
    return vol>0? pv/vol:0;
}

// 历史记录localStorage
let hist=JSON.parse(localStorage.getItem('ok_hist')||'[]');
function saveHist(s){if(!hist.includes(s)){hist.unshift(s);hist=hist.slice(0,8);localStorage.setItem('ok_hist',JSON.stringify(hist));renderHist();}}
function renderHist(){
    if(!hist.length){$('histBox').innerHTML='暂无历史记录，判定后自动保存';return;}
    $('histBox').innerHTML=hist.map(h=>`<span class="hist-item" onclick="$('inSym').value='${h}';doJudge()">${h}</span>`).join('')+' <span style="color:#666;font-size:11px">点击快速判定</span>';
}
$('btnClear').onclick=()=>{localStorage.removeItem('ok_hist');hist=[];renderHist();closeWs();};
renderHist();

// http接口封装
async function api(url,tag){
  try{
    const c=await fetch(url,{method:'GET',headers:{'User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(8000)});
    if(!c.ok)throw new Error('HTTP '+c.status);
    const j=await c.json();
    if(j.code!=='0')throw new Error(j.msg||tag+'接口异常');
    return j.data;
  }catch(e){throw new Error(tag+':'+e.message);}
}

function calcTurn(d){
  let t=parseFloat(d.volCcyQuote)||0;
  if(t<=0){const v=parseFloat(d.vol)||0,cv=parseFloat(d.ctVal)||1,cl=parseFloat(d.last)||parseFloat(d.close)||0;t=v*cv*cl;}
  return t;
}

// 更新ws状态显示
function setWsStatus(text,isOk){
    const el=$('wsStat');
    el.innerText=text;
    el.className='ws-status '+(isOk?'ws-ok':'ws-off');
}

function closeWs(){
    if(ws){
        try{ws.close();}catch(e){}
        ws=null;
    }
    currentInstId='';currentBar='';
    setWsStatus("已断开",false);
}
$('btnWsClose').onclick=closeWs;

// ① 成交额扫描
$('btnScan').onclick=async()=>{
  const btn=$('btnScan'),N=parseInt($('inN').value)||50,out=$('scanOut');
  btn.disabled=true;btn.innerText='扫描中...';out.innerHTML='';$('pt').innerText=`扫描前 ${N}...`;
  try{
    const insts=await api('https://www.okx.com/api/v5/market/instruments?instType=SWAP','品种');
    const swap=insts.filter(x=>x.instId.endsWith('USDT-SWAP')).map(x=>({...x,instId:x.instId,sym:x.instId.split('-')[0]}));
    await sleep(200);
    const tick=await api('https://www.okx.com/api/v5/market/tickers?instType=SWAP','行情');
    let arr=tick.filter(t=>{const s=swap.find(z=>z.instId===t.instId);if(!s)return false;t.sym=s.sym;t.turn=calcTurn(t);return t.turn>0;});
    arr.sort((a,b)=>b.turn-a.turn);
    const tops=arr.slice(0,5);
    if(!tops.length)throw new Error('无有效合约，网络/跨域限制');
    let h=`<div style="margin-bottom:6px"><b>📊成交额Top5（扫描${N}）</b></div>`;
    tops.forEach((t,i)=>{
      const cls=i===0?'l1':i===1?'l2':i===2?'l3':'';
      const chg=parseFloat(t.chgPct24h);
      const chgTxt=isNaN(chg)?'--':(chg>0?'+':'')+chg.toFixed(2)+'%';
      h+=`<div class="card ${cls}"><div class="head"><span class="rank">${i+1}. ${t.sym}</span><span class="${chg>0?'b':'r'}" style="font-weight:700">${chgTxt}</span></div>
      <div class="row-d"><span>现价</span><b>${fmt(t.last)}</b></div>
      <div class="row-d"><span>成交额USDT</span><b>${fmtUsd(t.turn)}</b></div>
      <div class="note">${t.instId}</div></div>`;
    });
    out.innerHTML=h;$('pt').innerText=`扫完${N}，合格${arr.length}，展示Top5`;
  }catch(e){out.innerHTML=`<div class="err">❌行情失败：${e.message}</div>`;$('pt').innerText='行情失败';}
  btn.disabled=false;btn.innerText='🚀扫描';
};

// 核心：根据K线数组执行完整打分渲染
function analyseAndRenderBars(bars,sym,barType,outEl){
    const d=bars.map(c=>({t:Number(c[0]),o:parseFloat(c[1]),h:parseFloat(c[2]),l:parseFloat(c[3]),c:parseFloat(c[4]),v:parseFloat(c[5])})).reverse();
    const cl=d.map(x=>x.c);
    const last=d[d.length-1];
    const sma20=calcSMA(cl,20);
    const sma50=calcSMA(cl,50);
    const sma200=calcSMA(cl,200);
    const rsi14=calcRSI(cl,14);
    const vwap=calcVWAP(d);

    let score=50,why=[];
    if(sma20>sma50&&sma50>sma200){score+=15;why.push('多头排列 SMA')}
    else if(sma20<sma50&&sma50<sma200){score-=10;why.push('空头排列 SMA')}
    else why.push('均线纠缠');

    if(sma200 && last.c < sma200){score-=10;why.push('价格在SMA200下方，大周期偏空')}
    else if(sma200){score+=10;why.push('站上SMA200')}

    const chg=(last.c/last.o-1)*100;
    if(chg>2)score+=5;if(chg<-2)score-=5;

    const body=Math.abs(last.c-last.o)/last.o*100;
    const range=(last.h-last.l)/last.o*100;
    if(range>0 && (last.h-Math.max(last.o,last.c))/last.h>0.3){score-=15;why.push('长上影插针')}
    if(range>0 && body/range>0.7)why.push('K线实体饱满');

    score=Math.max(0,Math.min(100,score));
    const tagCls=score>=60?'g':score>=45?'y':'';
    const stopRef=fmt(Math.min(...d.slice(-3).map(x=>x.l)));

    let html=`<div class="card l1"><div class="head"><span class="rank">🔍 ${sym} · ${barType}</span><span class="${tagCls}" style="font-size:20px;font-weight:700">${score}分</span></div>
    <div><span class="tag ${score>=60?'g':''}">${sma20>sma50?'多头':'震荡'}</span><span class="tag">趋势市</span></div>
    <div class="row-d"><span>现价</span><b>${fmt(last.c)}</b></div>
    <div class="row-d"><span>本周期涨跌幅</span><b class="${chg>0?'b':'r'}">${chg>0?'+':''}${chg.toFixed(2)}%</b></div>
    <div class="row-d"><span>SMA20 / SMA50</span><b>${fmt(sma20)} / ${fmt(sma50)}</b></div>
    <div class="row-d"><span>SMA200</span><b>${fmt(sma200)}</b></div>
    <div class="row-d"><span>RSI‑14</span><b>${rsi14!==null?fmt(rsi14):'数据不足'}</b></div>
    <div class="row-d"><span>VWAP</span><b class="${last.c<vwap?'r':'b'}">${fmt(vwap)} ${last.c<vwap?'(价在下)':'(价在上)'}</b></div>
    <div class="row-d"><span>综合结论</span><b class="${score>=60?'b':score<40?'r':'y'}">${score>=60?'偏多':score<40?'偏空':'震荡'}</b></div>
    ${foldHtml('📝判定依据',why,true)}
    <div class="note r">🛑止损参考：${stopRef}</div></div>`;
    outEl.innerHTML=html;
}

// 单币判定入口，http拉取历史K线，然后建立WebSocket订阅
async function doJudge(){
    closeWs();
    const sym=$('inSym').value.trim().toUpperCase();
    const bar=$('inBar').value;
    const out=$('judgeOut');
    const btn=$('btnJudge');
    if(!sym)return;
    btn.disabled=true;btn.innerText='加载K线...';
    out.innerHTML='';
    saveHist(sym);
    try{
        const instId=sym+'-USDT-SWAP';
        currentInstId=instId;
        currentBar=bar;
        const kData=await api(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=100`,"K线");
        if(!kData||!kData.length)throw new Error("获取K线为空");
        analyseAndRenderBars(kData,sym,bar,out);
        // 建立WebSocket订阅实时K线
        const wsUrl="wss://ws.okx.com/ws/v5/public";
        ws=new WebSocket(wsUrl);
        setWsStatus("连接中…",false);
        ws.onopen=()=>{
            setWsStatus("已连接，订阅"+bar,true);
            const subMsg={op:"subscribe",args:[{channel:`candle${bar}`,instId:instId}]};
            ws.send(JSON.stringify(subMsg));
        };
        ws.onmessage=(evt)=>{
            try{
                const msg=JSON.parse(evt.data);
                if(msg.event==='error'){
                    out.innerHTML=`<div class="err">WebSocket订阅异常：${msg.msg||''}</div>`;
                    closeWs();
                }
                if(msg.arg && msg.data){
                    // WebSocket推送最新K线，重新分析渲染
                    analyseAndRenderBars(msg.data,sym,bar,out);
                }
            }catch(e){}
        };
        ws.onerror=()=>{
            out.innerHTML+=`<div class="err">WebSocket出错，停止实时更新</div>`;
            closeWs();
        };
        ws.onclose=()=>{
            setWsStatus("连接关闭",false);
        };
    }catch(e){
        out.innerHTML=`<div class="err">❌${e.message}</div>`;
    }
    btn.disabled=false;btn.innerText='🔍开始判定+订阅实时';
}

$('btnJudge').onclick=doJudge;
$('inSym').onkeydown=e=>{if(e.key==='Enter')doJudge();};

// ③抄底雷达
$('btnRad').onclick=async()=>{
  const btn=$('btnRad'),N=parseInt($('inRad').value)||30,out=$('radarOut');
  btn.disabled=true;btn.innerText='雷达搜索...';out.innerHTML='';$('pt').innerText=`雷达扫${N}...`;
  try{
    const insts=await api('https://www.okx.com/api/v5/market/instruments?instType=SWAP','品种');
    const swap=insts.filter(x=>x.instId.endsWith('USDT-SWAP')).map(x=>({...x,sym:x.instId.split('-')[0]}));
    await sleep(200);
    const tick=await api('https://www.okx.com/api/v5/market/tickers?instType=SWAP','行情');
    let arr=tick.filter(t=>{const s=swap.find(z=>z.instId===t.instId);if(!s)return false;t.sym=s.sym;t.turn=calcTurn(t);return t.turn>10000;});
    arr.sort((a,b)=>b.turn-a.turn);
    const tops=arr.slice(0,N);if(!tops.length)throw new Error('无有效合约');
    let cand=[],rej=[];
    for(let i=0;i<tops.length;i++){
      const t=tops[i];
      try{
        await sleep(120);
        const k=await api(`https://www.okx.com/api/v5/market/candles?instId=${t.instId}&bar=1D&limit=40`,'日K');
        const d=k.map(c=>({o:parseFloat(c[1]),h:parseFloat(c[2]),l:parseFloat(c[3]),c:parseFloat(c[4])})).reverse();
        const cl=d.map(x=>x.c);
        if(cl.length<20)continue;
        const sma200=calcSMA(cl,Math.min(200,cl.length));
        const dev=(cl[cl.length-1]/sma200-1)*100;
        const rsi=calcRSI(cl,14);
        if(rsi===null) continue;
        const low3=Math.min(...d.slice(-3).map(x=>x.l)),low7=Math.min(...d.slice(-7).map(x=>x.l));
        let sc=0,why=[];
        if(dev<-15){sc+=30;why.push('年线偏离'+dev.toFixed(1)+'%')}
        if(rsi<30){sc+=20;why.push('RSI超卖(<30)')}
        if(low3>low7){sc+=20;why.push('近3日守住前低')}
        const last=d[d.length-1],shad=(last.h-Math.max(last.o,last.c))/last.c;
        if(shad>0.15){sc-=30;why.push('长上影插针');rej.push(t.sym+'插针过滤');continue;}
        if(sc>=50) cand.push({sym:t.sym,score:sc,dev,rsi,last:cl[cl.length-1],low3,low7,why,turn:t.turn});
      }catch(e){}
    }
    if(!cand.length){
        out.innerHTML=`<div class="card"><div class="empty">前${N}名无抄底候选<br>趋势市里抄底等于逆势，空仓也是仓位</div>${rej.length?foldHtml('🚫被剔除'+rej.length+'个标的',rej,false):''}</div>`;
        $('pt').innerText=`扫完${N}，0候选`;
        btn.disabled=false;btn.innerText='📡雷达搜索';
        return;
    }
    cand.sort((a,b)=>b.score-a.score);
    let h=`<div style="margin-bottom:4px"><b>📡抄底雷达｜候选${cand.length}</b></div>`;
    cand.slice(0,5).forEach((x,i)=>{
      const cls=x.score>=65?'g':x.score>=50?'y':'b';
      h+=`<div class="card ${i===0?'l1':i===1?'l2':i===2?'l3':''}"><div class="head"><span class="rank">${i+1}. ${esc(x.sym)}</span><span class="${cls}" style="font-size:20px;font-weight:700">${x.score}分</span></div>
      <div class="row-d"><span>现价/成交额</span><b>${fmt(x.last)} · ${fmtUsd(x.turn)}</b></div>
      <div class="row-d"><span>SMA200偏离/RSI‑14</span><b class="${x.dev<0?'b':'r'}">${x.dev>0?'+':''}${x.dev.toFixed(1)}% / ${fmt(x.rsi)}</b></div>
      ${foldHtml('📝选入依据('+x.why.length+'条)',x.why,i===0)}
      <div class="note r">🛑止损：跌破${fmt(Math.min(x.low3,x.low7))}即失败</div></div>`;
    });
    if(rej.length)h+=foldHtml('🚫被剔除标的('+rej.length+')',rej,false);
    out.innerHTML=h;
    $('pt').innerText=`完成，扫${N}，候选${cand.length}`;
  }catch(e){out.innerHTML=`<div class="err">❌行情拉取失败：${e.message}</div>`;$('pt').innerText='行情失败';}
  btn.disabled=false;btn.innerText='📡雷达搜索';
};

setTimeout(()=>{$('btnScan').click();},1000);
</script>
</body>
