<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合约扫描 · 日线严排 + 15F末根极值</title>
<style>
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:14px;max-width:640px;margin:0 auto}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer}
.b1{background:#ff9f0a;color:#000}.b2{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
.row{display:flex;align-items:center;margin:10px 0;gap:8px;flex-wrap:wrap}
.row label{color:#8b949e;font-size:14px;min-width:52px}
.row input,.row select{flex:1;min-width:80px;padding:10px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:15px}
.st{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:13px;line-height:1.6}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin:8px 0}
.t{font-size:18px;font-weight:700}
.L{color:#3fb950}.S{color:#f85149}
.info{font-size:13px;line-height:1.7;margin-top:6px}
.info b{color:#fff}
.sub{color:#8b949e;font-size:12px;line-height:1.6}
.warn{color:#d29922;font-size:12px;line-height:1.6;margin-top:6px}
.sp{display:inline-block;width:13px;height:13px;border:2px solid #30363d;border-top-color:#ff9f0a;border-radius:50%;animation:r .8s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<button class="btn b1" id="f1">📥 抓取合约成交额前100</button>
<button class="btn b1" id="f2">🎯 扫描（日线严排 + 15F末根极值）</button>
<button class="btn b2" id="f3">🗑 清空缓存</button>

<div class="row"><label>扫描</label><input type="number" id="n" placeholder="100" min="1" max="100"><span class="sub">名（留空=100）</span></div>
<div class="row"><label>容差</label><input type="number" id="tol" value="0.3" step="0.1" min="0" max="5"><span class="sub">%（末根收盘与区间极值的允许差）</span></div>
<div class="row"><label>方向</label><select id="d"><option value="all">多空都看</option><option value="long">只看多</option><option value="short">只看空</option></select></div>

<div class="st" id="st">就绪。先点抓取。</div>
<div id="out"></div>

<script>
const KEY='okx_swap_strict_v6';
let C=null;

/* 日线严格排列 */
const D={
  DIV_MIN:0.005,   // 发散下限（低于=缠绕）
  DIV_MAX:0.15,    // 发散上限（高于=单根暴力拉升拽开均线）
  PRICE_MAX:0.08,  // 价格距EMA20上限（超过=追高/追空）
  TREND_BARS:3,    // 两线连续同向根数
  TOUCH_TOL:0.003  // 影线碰EMA5容差（0=完全不许碰）
};

const $=i=>document.getElementById(i);
const st=(h,c)=>{$('st').innerHTML=h;$('st').style.color=c==='e'?'#f85149':c==='o'?'#3fb950':'#8b949e'};
const pc=v=>(v*100).toFixed(2)+'%';
const vol=v=>v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(0)+'M':(v/1e3).toFixed(0)+'K';
const px=p=>p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);

async function okx(p){
  const r=await fetch('https://www.okx.com'+p,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(j.code!=='0') throw new Error(j.msg||'API');
  return j.data;
}
const ema=(a,n)=>{const k=2/(n+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o};
const K=d=>{const o=[],h=[],l=[],c=[];d.forEach(x=>{o.push(+x[1]);h.push(+x[2]);l.push(+x[3]);c.push(+x[4])});return{o,h,l,c}};

/* ===== 抓取：真实USDT成交额排序 ===== */
$('f1').onclick=async()=>{
  st('<span class="sp"></span>抓取合约榜...');
  try{
    const d=await okx('/api/v5/market/tickers?instType=SWAP');
    const list=d.filter(x=>x.instId.endsWith('USDT-SWAP'))
      .map(x=>{const vb=parseFloat(x.volCcy24h)||0,pr=parseFloat(x.last)||0,cv=parseFloat(x.ctVal)||1;
        return{instId:x.instId,base:x.instId.split('-')[0],volUsd:vb*cv*pr,last:pr};})
      .sort((a,b)=>b.volUsd-a.volUsd).slice(0,100).map((x,i)=>({...x,rank:i+1}));
    C={list,t:Date.now()};localStorage.setItem(KEY,JSON.stringify(C));
    st('✅ 抓取 '+list.length+' 只 · 前三：'+list.slice(0,3).map(x=>x.base+' $'+vol(x.volUsd)).join(' / '),'o');
    $('out').innerHTML='<div class="card sub">前10：'+list.slice(0,10).map((x,i)=>(i+1)+'.'+x.base).join(' · ')+'</div>';
  }catch(e){st('❌ '+e.message+'（若跨域报错，用浏览器直接打开本文件）','e')}
};

/* ===== 日线：方向 + 排列 + 影线，一步判定 ===== */
function daily(c,h,l){
  const i=c.length-1,e5=ema(c,5),e20=ema(c,20);
  const E5=e5[i],E20=e20[i],P=c[i];
  let u5=0,d5=0,u20=0,d20=0;
  for(let j=i;j>i-D.TREND_BARS&&j>=1;j--){
    if(e5[j]>e5[j-1])u5++; if(e5[j]<e5[j-1])d5++;
    if(e20[j]>e20[j-1])u20++; if(e20[j]<e20[j-1])d20++;
  }
  const rise=u5===D.TREND_BARS&&u20===D.TREND_BARS;
  const fall=d5===D.TREND_BARS&&d20===D.TREND_BARS;
  const div=(E5-E20)/E20, dist=Math.abs(P-E20)/E20;
  const loT=E5*(1-D.TOUCH_TOL), hiT=E5*(1+D.TOUCH_TOL);
  const L=l.slice(-10), Hh=h.slice(-10);

  /* 做空：EMA5<EMA20 且 价在EMA5下方（完美排列） */
  if(E5<E20&&P<E5){
    if(!fall) return{fail:'空排但双线未同步下压'};
    if(-div<D.DIV_MIN) return{fail:'发散仅'+pc(-div)+'，两线缠绕'};
    if(-div>D.DIV_MAX) return{fail:'发散'+pc(-div)+'过大，单根砸开均线'};
    if(dist>D.PRICE_MAX) return{fail:'价低于EMA20 '+pc(dist)+'，追空'};
    if(Math.min(...L)<loT) return{fail:'近10根下影 '+px(Math.min(...L))+' 刺破EMA5 '+px(E5)};
    return{dir:'short',E5,E20,P,div,dist,stop:Math.max(...Hh),touch:Math.min(...L)<=hiT};
  }
  /* 做多：EMA5>EMA20 且 价在EMA5上方 */
  if(E5>E20&&P>E5){
    if(!rise) return{fail:'多排但双线未同步抬升'};
    if(div<D.DIV_MIN) return{fail:'发散仅'+pc(div)+'，两线缠绕'};
    if(div>D.DIV_MAX) return{fail:'发散'+pc(div)+'过大，单根拉升拽开均线'};
    if(dist>D.PRICE_MAX) return{fail:'价高于EMA20 '+pc(dist)+'，追高'};
    if(Math.max(...Hh)>hiT) return{fail:'近10根上影 '+px(Math.max(...Hh))+' 刺破EMA5 '+px(E5)};
    return{dir:'long',E5,E20,P,div,dist,stop:Math.min(...L),touch:Math.max(...Hh)>=loT};
  }
  return{fail:E5<E20?'空头排列，但价格已收回EMA5上方（'+px(P)+' > '+px(E5)+'）':'多头排列，但价格已跌回EMA5下方（'+px(P)+' < '+px(E5)+'）'};
}

/* ===== 15F：11根，末根已收盘=区间极值 ===== */
function m15(k,dir,tol){
  const n=k.c.length-1, seg=Math.min(10,n), L=n-seg+1;
  const minL=Math.min(...k.l.slice(L,n+1)), maxH=Math.max(...k.h.slice(L,n+1)), last=k.c[n];
  if(dir==='long'){
    const ok=last<=minL*(1+tol);
    return{ok,minL,maxH,last,txt:ok?'末根收盘 '+px(last)+' = 区间最低 '+px(minL)+(tol?'（容差'+pc(tol)+'内，差'+pc((last-minL)/minL)+'）':'')
      :'末根收盘 '+px(last)+' 高出区间最低 '+px(minL)+' '+pc((last-minL)/minL)+'（容差'+pc(tol)+'）'};
  }
  const ok=last>=maxH*(1-tol);
  return{ok,minL,maxH,last,txt:ok?'末根收盘 '+px(last)+' = 区间最高 '+px(maxH)+(tol?'（容差'+pc(tol)+'内，差'+pc((maxH-last)/maxH)+'）':'')
    :'末根收盘 '+px(last)+' 低于区间最高 '+px(maxH)+' '+pc((maxH-last)/maxH)+'（容差'+pc(tol)+'）'};
}

/* ===== 扫描 ===== */
$('f2').onclick=async()=>{
  if(!C){const r=localStorage.getItem(KEY);if(!r){st('⚠️ 请先抓取','e');return}C=JSON.parse(r)}
  const raw=parseInt($('n').value);
  const n=isNaN(raw)?100:Math.min(Math.max(raw,1),100);
  const dp=$('d').value;
  const tol=Math.max(0,(parseFloat($('tol').value)||0)/100);
  const list=C.list.slice(0,n), out=[], rej=[];

  for(let i=0;i<list.length;i++){
    const it=list[i];
    try{
      st('<span class="sp"></span>'+(i+1)+'/'+list.length+' · '+it.base);
      const d=daily(K(await okx(`/api/v5/market/candles?instId=${it.instId}&bar=1D&limit=40`)));
      if(d.fail){rej.push(it.base+'：'+d.fail);continue}
      if(dp!=='all'&&dp!==d.dir){rej.push(it.base+'：做'+(d.dir==='long'?'多':'空')+'，已过滤');continue}
      const m=K(await okx(`/api/v5/market/candles?instId=${it.instId}&bar=15m&limit=11`));
      const q=m15(m,d.dir,tol);
      if(!q.ok){rej.push(it.base+'：'+q.txt);continue}
      const lp=m.c[m.c.length-1];
      const risk=Math.abs(lp-d.stop)/lp;
      const tp=d.dir==='long'?lp+(lp-d.stop)*1.5:lp-(d.stop-lp)*1.5;
      out.push({...it,...d,last:lp,stop:tp_stop(d),tp,risk,q});
    }catch(e){rej.push(it.base+'：数据异常')}
    if((i+1)%5===0) await new Promise(r=>setTimeout(r,80));
  }
  function tp_stop(x){return x.stop}

  if(!out.length){
    st('⚠️ 扫 '+list.length+' 只，达标 0 只','e');
    $('out').innerHTML='<div class="card sub">今日无合格形态，按规则=不入场。可把容差调到 0.5~0.8 放宽15F那条。<br><br>淘汰明细：<br>'+rej.map(x=>'· '+x).join('<br>')+'</div>';
    return;
  }

  $('out').innerHTML=out.map((x,i)=>{
    const cls=x.dir==='long'?'L':'S', txt=x.dir==='long'?'做多 ▲':'做空 ▼';
    return `<div class="card">
      <div class="t ${cls}">${x.base} <span style="font-size:14px">${txt} · 榜#${x.rank} · $${vol(x.volUsd)}</span></div>
      ${i===0?'<div class="sub" style="color:#ff9f0a">当日首选</div>':''}
      <div class="info">
        EMA5 <b>${px(x.E5)}</b> / EMA20 <b>${px(x.E20)}</b> · 发散 ${pc(x.div)} · 距EMA20 ${pc(x.dist)}<br>
        现价 <b>${px(x.last)}</b>（${x.dir==='long'?'EMA5上方':'EMA5下方'}）<br>
        15F：${x.q.txt}<br>
        影线：近10根${x.dir==='long'?'上影':'下影'}未破EMA5${x.touch?'（已回踩 touching）':'（未触及）'}<br>
        止损 <b style="color:#f85149">${px(x.stop)}</b>（${pc(x.risk)}） · 止盈 <b style="color:#3fb950">${px(x.tp)}</b>（1.5R）
      </div>
      ${x.risk>0.015?'<div class="warn">⚠️ 止损距离 '+pc(x.risk)+'。按 50x 算，价格反向走 '+(x.risk*100/50).toFixed(2)+'% 即爆仓；20x 需走 '+(x.risk*100/20).toFixed(2)+'%。建议降杠杆。</div>':''}
    </div>`;
  }).join('')+`<div class="card sub">扫 ${list.length} 只 · 达标 ${out.length} 只<br><br>淘汰明细：<br>${rej.map(x=>'· '+x).join('<br>')}</div>`;

  st('✅ 扫 '+list.length+' 只 · 达标 '+out.length+' 只 · 首选 '+out[0].base+' '+out[0].dir,'o');
};

$('f3').onclick=()=>{localStorage.removeItem(KEY);C=null;$('out').innerHTML='';st('缓存已清空')};
const r=localStorage.getItem(KEY);if(r){C=JSON.parse(r);st('已缓存 '+C.list.length+' 只，可直接扫描','o')}
</script>
</body>
</html>
