<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OKX 合约 EMA5/20 入场</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#0d1117;color:#c9d1d9;padding:12px;padding-bottom:80px}
  .btn{display:block;width:100%;padding:16px;margin:8px 0;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-primary{background:#ff9500;color:#000}
  .btn-primary:active{background:#e68500}
  .btn-secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
  .btn-secondary:active{background:#30363d}

  .row input,.row select{flex:1;padding:10px 12px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:15px}
  .status{margin:10px 0;padding:10px 12px;background:#161b22;border-radius:8px;font-size:14px;line-height:1.5}
  .status.ok{color:#3fb950}

  .card-dir{font-size:18px;font-weight:700}

  .badge-fire{background:#3fb95022;color:#3fb950;border:1px solid #3fb95044}
  .info-grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:8px 0}

  @keyframes spin{to{transform:rotate(360deg)}}

</head>
<body>
  <button class="btn btn-primary" onclick="fetchTickers()">📥 抓取今日合约成交额前100（每日一次）</button>
  <button class="btn btn-primary" onclick="recommend()">🎯 找最佳入场点（日线定方向 + 1H定回调）</button>
  <button class="btn btn-secondary" onclick="clearCache()">🗑 清空缓存</button>

  <div class="row">
    <label>扫描范围</label>
    <input type="number" id="scanN" placeholder="50" value="50">
    <span style="font-size:13px;color:#8b949e">名（留空=100）</span>
  </div>
  <div class="row">
    <label>方向</label>
    <select id="dirSel">
      <option value="both">多空都看</option>
      <option value="long">只看多</option>
      <option value="short">只看空</option>
    </select>
  </div>

  <div id="status"></div>
  <div id="result"></div>

<script>
// ========== 配置 ==========
const F = {
  // 横盘过滤（日线）
  RANGE20_MAX: 0.08,    // 20根高低幅 < 8% 算横盘
  SPREAD_MIN:  0.003,   // EMA5/20 发散 < 0.3% 算贴死
  CHG20_MIN:   0.05,    // 20根净涨跌 < 5% 且 < 3倍ATR 算无趋势
  // 插针过滤（日线近3根）
  WICK_SINGLE: 1.5,     // 单根影线 > 1.5倍ATR
  WICK_SUM:    2.2,     // 上下影总和 > 2.2倍ATR 且实体/全长<0.25
  WICK_BODY:   0.25,
  WICK_COUNT:  2,       // 近3根里 >=2 根长影就淘汰
  // 1H 反转K（只看最后一根已收盘）
  REQ_REVERSAL: false,  // true=硬门槛(不满足淘汰) false=只打分
  REV_BODY_ATR: 1.5,    // 实体达 1.5倍ATR 拿满实体分
  REV_WICK_OK:  3,      // 影线分档阈值
  DOJI_RATIO:   0.15,   // 实体<均实体15%算十字星(方向未明)
  // 1H 回调深度
  PULLBACK_MIN: 0.02,
  PULLBACK_MAX: 0.08,
  // 止损/盈亏比
  RR_TARGET:    1.5,
  STOP_ATR_MULT: 1.0,   // 备选止损：1倍ATR
};

const CACHE_KEY = 'okx_swap_ema5_20_v3';
const PROXY = 'https://corsproxy.io/?';

// ========== 工具 ==========
const $ = id => document.getElementById(id);
const setStatus = (t, c='') => $('status').innerHTML = `<div class="status ${c}">${t}</div>`;
const fmtPct = v => (v*100).toFixed(2)+'%';
const fmtNum = v => v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(2)+'K':v.toFixed(2);

async function okx(path){
  const url = PROXY ? PROXY + encodeURIComponent('https://www.okx.com'+path) : 'https://www.okx.com'+path;
  const r = await fetch(url, {headers:{'OK-ACCESS-KEY':''}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  if(j.code!=='0') throw new Error(j.msg||'API error');
  return j.data;
}

function ema(arr, n){
  const k = 2/(n+1), out = [];
  let e = arr[0];
  for(let i=0;i<arr.length;i++){ e = i===0 ? arr[i] : arr[i]*k + e*(1-k); out.push(e); }
  return out;
}

function atr(high, low, close, n=14){
  const tr = [];
  for(let i=0;i<high.length;i++){
    if(i===0){ tr.push(high[i]-low[i]); continue; }
    tr.push(Math.max(high[i]-low[i], Math.abs(high[i]-close[i-1]), Math.abs(low[i]-close[i-1])));
  }
  return ema(tr, n);
}

// ========== 抓取合约榜单 ==========
async function fetchTickers(){
  setStatus('<span class="spinner"></span>正在抓取 OKX 永续合约榜单...');
  try {
    // 直接拉 SWAP 全量 tickers，按成交额排序
    const data = await okx('/api/v5/market/tickers?instType=SWAP');
    // 过滤：只留 USDT 保证金的永续，排除反向/非USDT结算，排除稳定币base
    const stable = new Set(['USDT','USDC','DAI','BUSD','TUSD','FDUSD','PYUSD']);
    const list = data
      .filter(d => d.instId.endsWith('-USDT-SWAP') && !stable.has(d.instId.split('-')[0]))
      .map(d => ({
        instId: d.instId,
        base: d.instId.split('-')[0],
        vol24h: parseFloat(d.vol24h || d.volCcy24h || 0), // 成交量(币)
        turnover24h: parseFloat(d.turnover24h || 0),       // 成交额(USDT)
        last: parseFloat(d.last)
      }))
      .sort((a,b) => b.turnover24h - a.turnover24h);

    const top = list.slice(0, 100);
    const cache = { ts: Date.now(), list: top };
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    setStatus(`✅ 已抓取合约榜前 ${top.length} 只（按24h成交额）。首只：${top[0].base} 成交额 $${fmtNum(top[0].turnover24h)}`, 'ok');
  } catch(e){
    setStatus('❌ 抓取失败：'+e.message+'<br>可尝试挂代理或稍后重试', 'err');
  }
}

function getCache(){
  const raw = localStorage.getItem(CACHE_KEY);
  if(!raw) return null;
  const c = JSON.parse(raw);
  // 超过 24h 视为过期（合约数据也可每日抓一次）
  if(Date.now() - c.ts > 24*3600*1000){ return null; }
  return c;
}

function clearCache(){ localStorage.removeItem(CACHE_KEY); setStatus('🗑 缓存已清空，请重新抓取合约榜', 'warn'); }

// ========== K线 + 指标 ==========
async function getKLines(instId, bar='1D', limit=60){
  const data = await okx(`/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`);
  // OKX 返回 [[ts,open,high,low,close,vol, turnover], ...] 倒序(最新在[0])
  data.reverse();
  const open=[], high=[], low=[], close=[], vol=[];
  data.forEach(d => { open.push(+d[1]); high.push(+d[2]); low.push(+d[3]); close.push(+d[4]); vol.push(+d[5]); });
  const e5 = ema(close, 5), e20 = ema(close, 20), a = atr(high, low, close, 14);
  return { open, high, low, close, vol, e5, e20, atr: a, raw: data };
}

// ========== 日线过滤与评分 ==========
function dailyCheck(k, price){
  const { close:c, high:h, low:l, e5, e20, atr:a, open:o } = k;
  const i = c.length-1;
  const reasons = [], filt = [];
  let score = 0, chop = 0, wick = 0;

  // --- 横盘过滤 ---
  const hi20 = Math.max(...h.slice(-20)), lo20 = Math.min(...l.slice(-20));
  const range20 = (hi20-lo20)/price;
  if(range20 < F.RANGE20_MAX){ chop++; filt.push(`横盘·20根幅${fmtPct(range20)}`); }
  const spread = (e5[i]-e20[i])/price;
  if(Math.abs(spread) < F.SPREAD_MIN){ chop++; filt.push('横盘·EMA贴死'); }
  const chg20 = Math.abs(c[i]-c[i-20])/c[i-20];
  if(chg20 < F.CHG20_MIN && chg20 < a[i]*3/price){ chop++; filt.push(`横盘·20根仅${fmtPct(chg20)}`); }

  // --- 插针过滤（近3根日线）---
  let wickCnt = 0;
  for(let k2 = i-2; k2 <= i; k2++){
    const rng = h[k2]-l[k2] || 1e-9;
    const body = Math.abs(c[k2]-o[k2]);
    const upW = h[k2]-Math.max(c[k2], o[k2]);
    const dnW = Math.min(c[k2], o[k2])-l[k2];
    const tall = upW > a[k2]*F.WICK_SINGLE || dnW > a[k2]*F.WICK_SINGLE;
    const doubleSweep = (upW+dnW) > a[k2]*F.WICK_SUM && body/rng < F.WICK_BODY;
    if(tall || doubleSweep){ wickCnt++; filt.push(`插针·第${k2===i?'昨':(k2===i-1?'前2':'前3')}根影${Math.max(upW,dnW)/a[k2]<10?(Math.max(upW,dnW)/a[k2]).toFixed(1)+'×ATR':'长'}`); }
  }
  if(wickCnt >= F.WICK_COUNT){ wick++; filt.push('近3根反复插针'); }

  if(chop >= 2 || wick >= 1){
    return { dir:'none', score:0, reasons:[], filtered:true, filtReason:filt.join(' / ') };
  }

  // --- 方向判定（EMA5/20 排列 + 价格站上）---
  const longTrend = e5[i] > e20[i] && c[i] > e5[i];
  const shortTrend = e5[i] < e20[i] && c[i] < e5[i];
  let dir = 'none';
  if(longTrend) dir = 'long';
  else if(shortTrend) dir = 'short';

  if(dir==='long'){
    score += 20; reasons.push(`✅ EMA5(${e5[i].toFixed(2)}) > EMA20(${e20[i].toFixed(2)})，价站双线`);
  } else if(dir==='short'){
    score += 20; reasons.push(`✅ EMA5(${e5[i].toFixed(2)}) < EMA20(${e20[i].toFixed(2)})，价压双线`);
  } else {
    return { dir:'none', score:0, reasons:[], filtered:false, filtReason:'EMA排列/站线不满足' };
  }

  // 发散度
  const div = (e5[i]-e20[i])/e20[i];
  const divAbs = Math.abs(div);
  if(divAbs > 0.02){ score += 15; reasons.push(`✅ 发散度${fmtPct(div)}，趋势打开`); }
  else if(divAbs > 0.008){ score += 8; reasons.push(`➕ 发散度${fmtPct(div)}，温和`); }

  // 稳站双线（连续几根在 EMA5 同侧）
  let stable = 0;
  for(let j=i;j>i-10 && j>=0;j--){
    if(dir==='long' && c[j] > e5[j]) stable++;
    else if(dir==='short' && c[j] < e5[j]) stable++;
    else break;
  }
  if(stable >= 3){ score += 15; reasons.push(`✅ 连续${stable}根稳站EMA5`); }
  else if(stable >= 2){ score += 8; reasons.push(`➕ 连续${stable}根站EMA5`); }

  // 站上不超过3根（刚突破/刚破位，避免追高）
  if(stable <= 3 && stable >= 1){ score += 5; reasons.push(`✅ 站上第${stable}根，窗口佳`); }
  else if(stable > 3){ score -= 5; reasons.push(`⚠️ 已站${stable}根，偏追高`); }

  return { dir, score, reasons, filtered:false, filtReason:'', stable, div, spread:spread };
}

// ========== 1H 回调评分（含反转K） ==========
function h1Score(k1h, dir, price){
  const { close:c, high:h, low:l, open:o, e5, e20, atr:a } = k1h;
  const i = c.length-1;
  const reasons = [];
  let score = 0;

  // 最后一根已收盘 = i-1（i 是当前未收盘）
  const revIdx = i-1;
  if(revIdx < 1) return { score:0, reasons:['1H数据不足'], revBody:0, revWick:0 };

  const ro = o[revIdx], rc = c[revIdx], rh = h[revIdx], rl = l[revIdx];
  const body = Math.abs(rc-ro);
  const rng = rh-rl || 1e-9;
  const bodyRatio = body / (a[revIdx]*F.REV_BODY_ATR);
  const avgBody = (Math.abs(c[revIdx]-o[revIdx]) + Math.abs(c[revIdx-1]-o[revIdx-1]))/2 || 1e-9;
  const isDoji = body < avgBody * F.DOJI_RATIO;

  // 方向匹配：做多需收阴，做空需收阳
  const wantLongRev = dir==='long' && rc < ro;   // 阴线
  const wantShortRev = dir==='short' && rc > ro; // 阳线
  const matchDir = wantLongRev || wantShortRev;

  // 硬门槛模式
  if(F.REQ_REVERSAL && !matchDir){
    if(isDoji) return { score:0, reasons:[`❌ 非反转·上根十字星(实体${fmtPct(body/avgBody)})`,`方向未明`], revBody:0, revWick:0, rejected:true };
    return { score:0, reasons:[`❌ 非反转·上根${rc>ro?'收阳':'收阴'}，${dir==='long'?'回调未走完':'反弹未走完'}`], revBody:0, revWick:0, rejected:true };
  }

  // 打分模式：实体强度 0~7
  let revBody = 0, revWick = 0;
  if(matchDir && !isDoji){
    revBody = Math.min(7, Math.round(bodyRatio * 7));
    // 影线质量 0~3：做多时上影短为佳(空头推不回)，下影不超实体2倍(防假跌插针)
    if(dir==='long'){
      const upW = rh - Math.max(rc,ro);
      const dnW = Math.min(rc,ro) - rl;
      if(dnW > body*2){ return { score:0, reasons:[`❌ 反转K下影过长(${dnW.toFixed(1)}>2×实体)，疑似插针假跌`,`淘汰`], revBody:0, revWick:0, rejected:true }; }
      if(upW < body*0.3){ revWick = 3; }
      else if(upW < body*0.8){ revWick = 2; }
      else if(upW < body*1.0){ revWick = 1; }
    } else {
      const dnW = Math.min(rc,ro) - rl;
      const upW = rh - Math.max(rc,ro);
      if(upW > body*2){ return { score:0, reasons:[`❌ 反转K上影过长(${upW.toFixed(1)}>2×实体)，疑似插针假涨`,`淘汰`], revBody:0, revWick:0, rejected:true }; }
      if(dnW < body*0.3){ revWick = 3; }
      else if(dnW < body*0.8){ revWick = 2; }
      else if(dnW < body*1.0){ revWick = 1; }
    }
    const revScore = revBody + revWick;
    score += revScore;
    reasons.push(`✅ 反转K·${dir==='long'?'阴':'阳'}实体${bodyRatio.toFixed(2)}×ATR(${revBody}分)+影线(${revWick}分)=${revScore}分`);
  } else if(isDoji){
    reasons.push(`➖ 上根十字星，反转分0`);
  } else {
    reasons.push(`➖ 上根${rc>ro?'收阳':'收阴'}与${dir==='long'?'做多':'做空'}反向不符，反转分0`);
  }

  // 回调深度（相对日线EMA20附近）
  const e20now = e20[i-1];
  const pullback = dir==='long' ? (e20now-price)/price : (price-e20now)/price;
  if(pullback >= F.PULLBACK_MIN && pullback <= F.PULLBACK_MAX){
    score += 20; reasons.push(`✅ 回调幅度${fmtPct(pullback)}，区间佳`);
  } else if(pullback > F.PULLBACK_MAX){
    score += 5; reasons.push(`⚠️ 回调过深${fmtPct(pullback)}，可能转势`);
  } else if(pullback > 0){
    score += 10; reasons.push(`➕ 浅回调${fmtPct(pullback)}`);
  }

  // 1H结构：EMA5/20 在1H级别
  if(dir==='long' && e5[i-1] > e20[i-1] && c[i-1] > e5[i-1]){ score += 5; reasons.push('✅ 1H EMA5>20且价站上'); }
  else if(dir==='short' && e5[i-1] < e20[i-1] && c[i-1] < e5[i-1]){ score += 5; reasons.push('✅ 1H EMA5<20且价压下'); }

  // 短线：近3根1H
  const last3Chg = Math.abs(c[i-1]-c[i-3])/c[i-3];
  if(last3Chg < 0.015){ score += 5; reasons.push('✅ 近3根1H收敛，蓄势'); }

  // MACD柱（简化：用EMA12/26差）
  const ema12 = ema(c,12), ema26 = ema(c,26);
  const macd = ema12.map((v,j) => v-ema26[j]);
  if(dir==='long' && macd[i-1]>0 && macd[i-2]<=0){ score += 10; reasons.push('✅ MACD柱刚翻红'); }
  else if(dir==='short' && macd[i-1]<0 && macd[i-2]>=0){ score += 10; reasons.push('✅ MACD柱刚翻绿'); }
  else if((dir==='long' && macd[i-1]>0) || (dir==='short' && macd[i-1]<0)){ score += 5; reasons.push('➕ MACD柱方向一致'); }

  return { score, reasons, revBody, revWick };
}

// ========== 止损止盈 ==========
function calcSLTP(dir, price, kd, kh){
  // 止损：日线EMA20 与 近5根极值 取较近者
  const c = kd.close, h = kd.high, l = kd.low, e20 = kd.e20;
  const i = c.length-1;
  const recent5H = Math.max(...h.slice(-5)), recent5L = Math.min(...l.slice(-5));
  let stop;
  if(dir==='long'){
    stop = Math.max(recent5L*0.998, e20[i]*0.995);
  } else {
    stop = Math.min(recent5H*1.002, e20[i]*1.005);
  }
  const risk = Math.abs(price-stop);
  const tp = dir==='long' ? price + risk*F.RR_TARGET : price - risk*F.RR_TARGET;
  return { stop, tp, risk, rr: F.RR_TARGET };
}

// ========== 主流程 ==========
async function recommend(){
  const cache = getCache();
  if(!cache){ setStatus('⚠️ 请先抓取合约榜（每日一次）', 'warn'); return; }
  const n = parseInt($('scanN').value) || 100;
  const dirPref = $('dirSel').value;
  const list = cache.list.slice(0, n);

  setStatus(`<span class="spinner"></span>扫描合约榜前 ${list.length} 只（日线过滤横盘/插针 → 1H定回调）...`);
  $('result').innerHTML = '';

  const out = [];
  const filtDetail = [];

  for(let idx=0; idx<list.length; idx++){
    const it = list[idx];
    try {
      // 日线
      const kd = await getKLines(it.instId, '1D', 60);
      const price = kd.close[kd.close.length-1];
      const dCheck = dailyCheck(kd, price);

      if(dCheck.dir==='none'){
        filtDetail.push({ base:it.base, reason: dCheck.filtReason || dCheck.reasons.join(';') || '方向不符' });
        continue;
      }
      if(dirPref!=='both' && dCheck.dir!==dirPref) continue;

      // 1H
      const kh = await getKLines(it.instId, '1H', 48);
      const h1 = h1Score(kh, dCheck.dir, price);
      if(h1.rejected) continue;

      const totalScore = dCheck.score + h1.score;
      const sltp = calcSLTP(dCheck.dir, price, kd, kh);

      out.push({
        ...it, price, dir:dCheck.dir,
        dScore:dCheck.score, h1Score:h1.score, score:totalScore,
        reasons:[...dCheck.reasons, ...h1.reasons],
        stop:sltp.stop, tp:sltp.tp, rr:sltp.rr, risk:sltp.risk,
        stable:dCheck.stable, div:dCheck.div,
        rank: idx+1,
        filtReason:''
      });
    } catch(e){
      filtDetail.push({ base:it.base, reason:'数据异常:'+e.message });
    }
    // 限速：每 5 只停 100ms，防 429
    if((idx+1)%5===0) await new Promise(r=>setTimeout(r,100));
  }
