<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合约最佳入场点（极简直连版）</title>
<style>
  body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;padding:16px;max-width:600px;margin:0 auto}
  .btn{display:block;width:100%;padding:14px;margin:10px 0;border-radius:12px;border:none;font-size:16px;font-weight:bold;cursor:pointer}
  .btn-primary{background:#ff9f0a;color:#000}
  .btn-secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
  .row{display:flex;align-items:center;margin:12px 0}
  .row label{width:80px;color:#8b949e}
  .row input,.row select{flex:1;padding:10px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:16px}
  .status{margin-top:16px;padding:12px;border-radius:8px;background:#161b22;color:#8b949e;font-size:14px;line-height:1.5}
  .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-top:12px}
  .card-title{font-size:18px;font-weight:bold;color:#58a6ff}
  .dir-long{color:#3fb950}.dir-short{color:#f85149}
  .badge{display:inline-block;margin-top:6px;padding:2px 8px;background:#238636;color:#fff;border-radius:10px;font-size:12px}
  .err{color:#f85149;margin-top:10px}
  .tip{color:#8b949e;font-size:12px;margin-top:4px}
</style>
</head>
<body>
  <button class="btn btn-primary" id="btnFetch">📥 抓取今日合约成交额前100（每日一次）</button>
  <button class="btn btn-primary" id="btnScan">🎯 找最佳入场点（日线定方向+1H定回调）</button>
  <button class="btn btn-secondary" id="btnClear">🗑️ 清空缓存</button>
  
  <div class="row">
    <label>扫描范围</label>
    <input type="number" id="scanRange" value="50" min="10" max="100">
    <span style="margin-left:8px;color:#8b949e">名</span>
  </div>
  <div class="row">
    <label>方向</label>
    <select id="direction">
      <option value="all">多空都看</option>
      <option value="long">只看多</option>
      <option value="short">只看空</option>
    </select>
  </div>
  
  <div class="status" id="status">就绪。先点“抓取”，再点“找入场”。</div>
  <div id="result"></div>

<script>
const CACHE_KEY = 'okx_swap_simple_v1';
let cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{"list":[],"time":0}');

// 直连 OKX（无代理，依赖 OKX 公共接口允许跨域）
async function okx(path) {
  const url = 'https://www.okx.com' + path;
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('API ' + res.status + '（若403需临时用代理，见说明）');
  const j = await res.json();
  if (j.code !== '0') throw new Error(j.msg || 'OKX错误');
  return j.data;
}

// 简单 EMA
function ema(arr, n) {
  const k = 2 / (n + 1);
  let e = arr[0];
  for (let i = 1; i < arr.length; i++) e = arr[i] * k + e * (1 - k);
  return e;
}

// 获取 K 线并算基础指标
async function getK(instId, bar='1D', limit=30) {
  const d = await okx(`/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`);
  // [ts, open, high, low, close, vol, volCcy, volCcyQuote, confirm]
  const closes = d.map(x => parseFloat(x[4])).reverse();
  const highs = d.map(x => parseFloat(x[2])).reverse();
  const lows = d.map(x => parseFloat(x[3])).reverse();
  const e5 = ema(closes, 5);
  const e20 = ema(closes, 20);
  return { closes, highs, lows, e5, e20, last: closes[closes.length-1] };
}

// 日线定方向 + 1H 回调评分
async function check(instId) {
  const d = await getK(instId, '1D', 30);
  const h1 = await getK(instId, '1H', 30);
  let dir = null, score = 0, reasons = [];
  
  // 日线：EMA5 > EMA20 且收盘价在 EMA20 上 = 多；反之下 = 空
  if (d.e5 > d.e20 && d.last > d.e20) { dir = 'long'; score += 30; reasons.push('日线多'); }
  else if (d.e5 < d.e20 && d.last < d.e20) { dir = 'short'; score += 30; reasons.push('日线空'); }
  else { throw new Error('日线震荡，不入'); }
  
  // 发散度
  const div = (d.e5 - d.e20) / d.e20;
  if (Math.abs(div) > 0.02) score += 10; else score -= 10;
  
  // 1H 回调：多头时 1H 收盘价贴近 EMA20 或略破后收回
  if (dir === 'long') {
    const diff = (h1.last - h1.e20) / h1.e20;
    if (diff < 0.01 && diff > -0.02) { score += 30; reasons.push('1H回踩EMA20'); }
    else if (diff <= -0.02) { score += 15; reasons.push('1H略破EMA20'); }
    else { score -= 10; reasons.push('1H远离'); }
  } else {
    const diff = (h1.e20 - h1.last) / h1.e20;
    if (diff < 0.01 && diff > -0.02) { score += 30; reasons.push('1H反抽EMA20'); }
    else if (diff <= -0.02) { score += 15; reasons.push('1H略破EMA20'); }
    else { score -= 10; reasons.push('1H远离'); }
  }
  
  // 末根 K 线（1H 最后一根）实体与影线
  const lastC = h1.closes[h1.closes.length-1];
  const prevC = h1.closes[h1.closes.length-2];
  const body = Math.abs(lastC - prevC) / prevC;
  if (body > 0.005) score += 10; else score -= 5;
  
  // 止损：近 5 根极值
  const last5Lows = h1.lows.slice(-5);
  const last5Highs = h1.highs.slice(-5);
  const stop = dir === 'long' ? Math.min(...last5Lows) : Math.max(...last5Highs);
  const risk = Math.abs(h1.last - stop) / h1.last;
  if (risk < 0.03) score += 10; else if (risk > 0.06) score -= 15;
  
  const tp = dir === 'long' ? h1.last + (h1.last - stop) * 1.5 : h1.last - (stop - h1.last) * 1.5;
  const rr = 1.5;
  
  return { dir, score, reasons, price: h1.last, stop, tp, rr, risk, d, h1 };
}

// 抓取合约榜
document.getElementById('btnFetch').onclick = async () => {
  const st = document.getElementById('status');
  st.innerHTML = '⏳ 抓取中（直连 OKX，若403请稍后重试）...';
  try {
    // 只抓 SWAP，排除现货
    const d = await okx('/api/v5/market/tickers?instType=SWAP');
    // 按成交额排序（volCcy24h 或 turnover24h）
    const list = d.filter(x => x.instId.endsWith('USDT-SWAP'))
      .map(x => ({ instId: x.instId, base: x.instId.split('-')[0], vol: parseFloat(x.volCcy24h || x.turnover24h || 0) }))
      .sort((a,b) => b.vol - a.vol)
      .slice(0, 100);
    cache = { list, time: Date.now() };
    localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    st.innerHTML = `✅ 抓取成功：合约前 100（SWAP），已缓存。可点“找入场”。`;
  } catch(e) {
    st.innerHTML = `<span class="err">❌ 抓取失败：${e.message}</span><div class="tip">提示：若在 GitHub Pages 遇 403，可本地打开此文件（file://）通常能直连；或临时用 Cloudflare Worker 代理。</div>`;
  }
};

// 扫描入场
document.getElementById('btnScan').onclick = async () => {
  if (!cache.list.length) { alert('请先抓取合约榜'); return; }
  const range = parseInt(document.getElementById('scanRange').value) || 50;
  const dirFilter = document.getElementById('direction').value;
  const st = document.getElementById('status');
  const res = document.getElementById('result');
  res.innerHTML = '';
  const subs = cache.list.slice(0, range);
  const out = [];
  let done = 0;
  
  for (const it of subs) {
    st.innerHTML = `⏳ 扫描 ${done+1}/${subs.length}：${it.base}...`;
    try {
      const r = await check(it.instId);
      if (dirFilter !== 'all' && r.dir !== dirFilter) throw new Error('方向不符');
      if (r.score < 50) throw new Error(`分低${r.score}`);
      out.push({ ...it, ...r, rank: cache.list.findIndex(x=>x.instId===it.instId)+1 });
    } catch(e) {
      // 静默跳过
    }
    done++;
    if (done % 5 === 0) await new Promise(r => setTimeout(r, 100)); // 限速防 429
  }
  
  out.sort((a,b) => b.score - a.score);
  if (!out.length) {
    st.innerHTML = `⚠️ 扫描 ${range} 只合约，达标 0 只。条件较严或市场震荡，建议放宽方向/降低分阈。`;
    return;
  }
  
  const top = out[0];
  st.innerHTML = `✅ 完成 · 扫 ${range} 只合约 · 达标 ${out.length} 只 · 首选 ${top.base} ${top.score}分`;
  let html = `<div class="card">
    <div class="card-title">${top.base} <span class="${top.dir==='long'?'dir-long':'dir-short'}">${top.dir==='long'?'做多▲':'做空▼'}</span></div>
    <div style="color:#8b949e;font-size:14px">合约榜#${top.rank} · ${top.score}分</div>
    ${top.score>=75?'<div class="badge">🔥 极佳窗口</div>':''}
    <div style="margin-top:10px;line-height:1.8">
      入场：<b>${top.price.toFixed(top.price>100?2:4)}</b><br>
      止损：<b style="color:#f85149">${top.stop.toFixed(top.price>100?2:4)}</b>（${ (top.risk*100).toFixed(2)}%）<br>
      止盈(1.5R)：<b style="color:#3fb950">${top.tp.toFixed(top.price>100?2:4)}</b><br>
      理由：${top.reasons.join(' · ')}
    </div>
  </div>`;
  out.slice(1,5).forEach(x => {
    html += `<div class="card" style="padding:10px">
      <div class="card-title" style="font-size:16px">${x.base} <span class="${x.dir==='long'?'dir-long':'dir-short'}">${x.dir==='long'?'多':'空'}</span> <span style="float:right;color:#8b949e">${x.score}分</span></div>
      <div style="font-size:13px;color:#8b949e">#${x.rank} · 入场${x.price.toFixed(x.price>100?2:4)} · 止损${(x.risk*100).toFixed(1)}%</div>
    </div>`;
  });
  res.innerHTML = html;
};

document.getElementById('btnClear').onclick = () => {
  localStorage.removeItem(CACHE_KEY);
  cache = {list:[],time:0};
  document.getElementById('status').innerHTML = '缓存已清空，请重新抓取。';
  document.getElementById('result').innerHTML = '';
};

if (cache.list.length) document.getElementById('status').innerHTML = `已缓存 ${cache.list.length} 只合约榜（SWAP），可直接点“找入场”。`;
</script>
</body>
</html>
