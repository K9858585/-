<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧易合约 · 今日趋势扫描</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e11;color:#eaecef;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:14px;font-size:14px}
.wrap{max-width:560px;margin:0 auto}
h1{text-align:center;font-size:18px;color:#f0b90b;margin-bottom:4px}
.sub{text-align:center;font-size:11px;color:#848e9c;margin-bottom:12px;line-height:1.5}
.ctrl{display:flex;gap:6px;margin-bottom:8px}
.ctrl input,.ctrl select{flex:1;background:#151a21;color:#eaecef;border:1px solid #232a34;border-radius:8px;padding:10px;font-size:13px}
.ctrl button{background:#f0b90b;color:#000;font-weight:bold;border:none;border-radius:8px;padding:0 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.ctrl button:disabled{opacity:.5;cursor:not-allowed}
.pt{text-align:center;font-size:11px;color:#848e9c;margin:6px 0;min-height:16px}
.box{background:#151a21;border:1px solid #232a34;border-radius:11px;padding:12px;margin-bottom:10px}
.box h2{font-size:14px;color:#f0b90b;margin-bottom:8px}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{color:#848e9c;font-weight:normal;text-align:right;padding:5px 3px;border-bottom:1px solid #232a34}
.tbl th:first-child,.tbl td:first-child{text-align:center}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td{text-align:right;padding:5px 3px;border-bottom:1px solid #1a1f26}
.tbl tr:last-child td{border:0}
.g{color:#0ecb81} .r{color:#f6465d} .y{color:#f0b90b}
.card{background:#151a21;border:1px solid #f0b90b;border-radius:11px;padding:13px;margin-bottom:10px}
.card h2{color:#f0b90b;font-size:16px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #1c2229;color:#b7bfc9;gap:8px}
.row:last-child{border:0}
.row b{color:#eaecef;text-align:right}
.txt{font-size:11.5px;line-height:1.7;color:#c7ced6;white-space:pre-wrap;margin-top:8px;background:#10141a;border:1px solid #1c2229;border-radius:8px;padding:10px}
.note{font-size:10.5px;color:#848e9c;margin-top:6px;line-height:1.5}
.empty{text-align:center;color:#848e9c;padding:20px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>📡 欧易合约 · 今日趋势扫描</h1>
<div class="sub">实时拉全市场永续 → 成交额降序 → 今日方向+日线共振 → 只推1个</div>
<div class="ctrl">
  <input id="num" type="number" min="5" max="50" value="10" placeholder="Top N">
  <select id="tz"><option value="08:00" selected>UTC+8</option><option value="00:00">UTC</option></select>
  <button id="btn" onclick="scan()">🚀 扫描</button>
</div>
<div class="pt" id="pt">就绪 · 点击扫描开始</div>
<div id="out"></div>
</div>

<script>
const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];
let proxyIdx = 0;

async function pfetch(url, timeout = 12000) {
  let lastErr = '';
  for (let i = 0; i < PROXIES.length; i++) {
    const pi = (proxyIdx + i) % PROXIES.length;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(PROXIES[pi](url), { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const txt = await res.text();
      try {
        const parsed = JSON.parse(txt);
        proxyIdx = pi;
        return parsed;
      } catch(e) {
        throw new Error('JSON解析失败');
      }
    } catch (e) {
      clearTimeout(t);
      lastErr = e.message;
      continue;
    }
  }
  throw new Error(`所有代理不可用(${lastErr})`);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
function fmtUsd(v) {
  if (!isFinite(v) || v <= 0) return '--';
  if (v >= 1e12) return '$' + (v/1e12).toFixed(2) + 'T';
  if (v >= 1e8) return '$' + (v/1e8).toFixed(2) + '亿';
  if (v >= 1e4) return '$' + (v/1e4).toFixed(1) + '万';
  return '$' + v.toFixed(0);
}
function fmtPx(v) {
  const a = Math.abs(v);
  if (a >= 1000) return v.toFixed(2);
  if (a >= 1) return v.toFixed(4);
  if (a >= 0.01) return v.toFixed(6);
  return v.toFixed(8);
}
function ema(arr, n) { const k = 2/(n+1); let e = arr[0]; for (let i = 1; i < arr.length; i++) e = arr[i]*k + e*(1-k); return e; }
function rsiVal(arr, n = 14) {
  let g = 0, l = 0;
  for (let i = arr.length - n; i < arr.length; i++) { const d = arr[i] - arr[i-1]; if (d > 0) g += d; else l -= d; }
  if (l === 0) return 100;
  return 100 - 100/(1 + (g/n)/(l/n));
}
function adxCalc(h, l, c, p = 14) {
  let tr = 0, plus = 0, minus = 0;
  for (let i = 1; i < c.length; i++) {
    tr += Math.max(h[i]-l[i], Math.abs(h[i]-c[i-1]), Math.abs(l[i]-c[i-1]));
    plus += Math.max(h[i]-h[i-1], 0);
    minus += Math.max(l[i-1]-l[i], 0);
  }
  const atr = tr / Math.min(p, c.length - 1);
  const pdi = 100 * (plus / Math.min(p, c.length - 1)) / atr;
  const mdi = 100 * (minus / Math.min(p, c.length - 1)) / atr;
  return { adx: 100 * Math.abs(pdi - mdi) / (pdi + mdi || 1), pdi, mdi };
}

async function scan() {
  const btn = document.getElementById('btn');
  const pt = document.getElementById('pt');
  const out = document.getElementById('out');
  const N = Math.max(5, Math.min(50, parseInt(document.getElementById('num').value) || 10));
  const tz = document.getElementById('tz').value;

  btn.disabled = true;
  btn.innerText = '拉取中...';
  out.innerHTML = '';
  pt.innerText = '正在拉取全市场永续...';

  try {
    const tickUrl = 'https://www.okx.com/api/v5/market/tickers?instType=SWAP';
    let j;
    try { j = await pfetch(tickUrl, 15000); } catch(e) {
      out.innerHTML = `<div class="box"><div class="empty">❌ 代理全部不可用<br><span style="font-size:11px">${e.message}<br>请稍后重试</span></div></div>`;
      btn.disabled = false; btn.innerText = '🚀 扫描'; return;
    }
    if (!j || j.code !== '0') { out.innerHTML = '<div class="box"><div class="empty">接口返回异常</div></div>'; btn.disabled = false; btn.innerText = '🚀 扫描'; return; }

    const seen = {};
    const rows = [];
    for (const x of j.data) {
      if (!x.instId.endsWith('-USDT-SWAP')) continue;
      const last = parseFloat(x.last || 0);
      const vol24h = parseFloat(x.vol24h || 0);
      const ctVal = parseFloat(x.ctVal || 1);
      const turn = vol24h * ctVal * last;
      const base = x.instId.replace('-USDT-SWAP', '');
      if (seen[base] && seen[base].turn >= turn) continue;
      seen[base] = { turn };
      const sodUtc8 = parseFloat(x.sodUtc8 || 0);
      rows.push({ sym: base, instId: x.instId, turn, last, chg24: sodUtc8 > 0 ? (last - sodUtc8) / sodUtc8 * 100 : null });
    }
    rows.sort((a, b) => b.turn - a.turn);
    const top = rows.slice(0, N);

    let tbl = `<div class="box"><h2>成交额 Top ${N}</h2><table class="tbl"><tr><th>#</th><th>币</th><th>24h成交额</th><th>24h涨跌</th></tr>`;
    top.forEach((r, i) => {
      const cls = r.chg24 == null ? '' : r.chg24 > 0 ? 'g' : 'r';
      tbl += `<tr><td>${i+1}</td><td>${r.sym}</td><td>${fmtUsd(r.turn)}</td><td class="${cls}">${r.chg24 == null ? '--' : (r.chg24>0?'+':'') + r.chg24.toFixed(2) + '%'}</td></tr>`;
    });
    tbl += `</table><div class="note">全市场 ${rows.length} 个永续 · 成交额 = vol24h × ctVal × 价格</div></div>`;

    const res = [];
    const rej = [];
    for (let i = 0; i < top.length; i++) {
      const r0 = top[i];
      pt.innerText = `(${i+1}/${top.length}) 分析 ${r0.sym}...`;
      let k;
      try {
        const kUrl = `https://www.okx.com/api/v5/market/candles?instId=${encodeURIComponent(r0.instId)}&bar=1D&limit=150&tz=${tz}`;
        const kj = await pfetch(kUrl, 10000);
        if (kj && kj.code === '0' && kj.data && kj.data.length >= 2) {
          k = kj.data.slice(1).reverse().map(d => ({ o: +d[1], h: +d[2], l: +d[3], c: +d[4], v: +d[5] }));
        }
      } catch(e) { rej.push(r0.sym + '(K线拉取失败)'); continue; }
      if (!k || k.length < 30) { rej.push(r0.sym + '(K线不足)'); continue; }

      const c = k.map(x => x.c), h = k.map(x => x.h), l = k.map(x => x.l), o = k.map(x => x.o), v = k.map(x => x.v);
      const td = k[k.length - 1], yd = k[k.length - 2];
      const chg = (td.c - td.o) / td.o * 100;
      const body = Math.abs(td.c - td.o), rng = td.h - td.l;
      const br = rng > 0 ? body / rng : 0;
      const uw = td.h - Math.max(td.o, td.c), lw = Math.min(td.o, td.c) - td.l;
      const vwap = (td.h + td.l + td.c) / 3;
      const vr = yd.v > 0 ? td.v / yd.v : 1;

      if (chg > 5) { rej.push(r0.sym + `(今日已涨${chg.toFixed(2)}%)`); continue; }
      if (chg < -5) { rej.push(r0.sym + `(今日已跌${chg.toFixed(2)}%)`); continue; }
      if (Math.abs(chg) < 0.5) { rej.push(r0.sym + '(横盘)'); continue; }
      if (br < 0.45) { rej.push(r0.sym + `(实体${(br*100).toFixed(0)}%)`); continue; }
      if (chg > 0 && uw > body * 1.8) { rej.push(r0.sym + '(上影过长)'); continue; }
      if (chg < 0 && lw > body * 1.8) { rej.push(r0.sym + '(下影过长)'); continue; }

      const e20 = ema(c, 20), e50 = ema(c, 50), e200 = ema(c, Math.min(200, c.length - 1));
      const ad = adxCalc(h, l, c, 14);
      const rs = rsiVal(c, 14);

      if (ad.adx < 20) { rej.push(r0.sym + `(ADX ${ad.adx.toFixed(0)} 横盘)`); continue; }

      let score = 0, dir = chg > 0 ? 'LONG' : 'SHORT', log = [];
      const ac = Math.abs(chg);
      if (ac >= 1.5 && ac <= 3) { score += 30; log.push(`今日${chg>0?'涨':'跌'}${chg.toFixed(2)}%(甜点)`); }
      else if (ac > 3) { score += Math.max(12, 30 - (ac - 3) * 9); log.push(`${chg.toFixed(2)}%(偏高)`); }
      else { score += (ac - 0.6) / 0.9 * 30; log.push(`${chg.toFixed(2)}%(偏弱)`); }

      score += br > 0.7 ? 15 : br > 0.55 ? 10 : 5; log.push(`实体${(br*100).toFixed(0)}%`);
      if (vr > 1.5) { score += 15; log.push(`放量${vr.toFixed(1)}x`); }
      else if (vr > 1.2) { score += 12; log.push(`量能配合${vr.toFixed(1)}x`); }
      else if (vr > 0.8) { score += 6; log.push(`量能一般${vr.toFixed(1)}x`); }
      else { score += 2; log.push(`缩量${vr.toFixed(1)}x`); }

      if (dir === 'LONG' && td.c > vwap) { score += 10; log.push('站上VWAP'); }
      else if (dir === 'SHORT' && td.c < vwap) { score += 10; log.push('压在VWAP下'); }
      else { score += 3; log.push('VWAP逆向'); }

      if (dir === 'LONG' && td.c > e20 && e20 > e50) { score += 15; log.push('日线多头'); }
      else if (dir === 'SHORT' && td.c < e20 && e20 < e50) { score += 15; log.push('日线空头'); }
      else if ((dir === 'LONG' && td.c > e200) || (dir === 'SHORT' && td.c < e200)) { score += 8; log.push('年线同向'); }
      else { score -= 8; log.push('日线逆势'); }

      if (ad.adx > 25) { score += 5; log.push(`ADX ${ad.adx.toFixed(0)}`); }
      if (dir === 'LONG' && rs > 78) { score -= 15; log.push(`RSI ${rs.toFixed(0)}超买`); }
      else if (dir === 'SHORT' && rs < 22) { score -= 15; log.push(`RSI ${rs.toFixed(0)}超卖`); }
      else if (rs > 70 || rs < 30) { score -= 5; log.push(`RSI ${rs.toFixed(0)}`); }
      else log.push(`RSI ${rs.toFixed(0)}`);

      score = Math.round(Math.min(100, Math.max(0, score)));
      res.push({ sym: r0.sym, instId: r0.instId, rank: i + 1, turn: r0.turn, dir, score, chg, open: td.o, now: td.c, hi: td.h, lo: td.l, br, vr, vwap, adx: ad.adx, rsi: rs, e20, e200, log });
    }

    if (!res.length) {
      out.innerHTML = tbl + `<div class="box"><div class="empty">前 ${N} 名全部被过滤<br>今日无合适标的，空仓也是仓位</div></div><div class="note">${rej.join('　')}</div>`;
      pt.innerText = `扫完 ${top.length} 只 · 0 合格`;
      btn.disabled = false; btn.innerText = '🚀 扫描'; return;
    }
    res.sort((a, b) => b.score - a.score);
    const b = res[0];
    const iL = b.dir === 'LONG';

    let html = tbl;
    html += `<div class="card"><h2>🎯 推荐：${b.sym} ${b.dir === 'LONG' ? '📈 做多' : '📉 做空'}</h2>`;
    html += `<div style="text-align:center;margin:6px 0"><span style="font-size:32px;font-weight:bold;color:${iL?'#0ecb81':'#f6465d'}">${b.score}</span><span style="font-size:12px;color:#848e9c"> /100分</span></div>`;
    html += `<div class="row"><span>排名</span><b>成交额第 ${b.rank} · ${fmtUsd(b.turn)}</b></div>`;
    html += `<div class="row"><span>今日</span><b class="${b.chg>0?'g':'r'}">${b.chg>0?'+':''}${b.chg.toFixed(2)}%</b></div>`;
    html += `<div class="row"><span>开盘→现价</span><b>${fmtPx(b.open)} → ${fmtPx(b.now)}</b></div>`;
    html += `<div class="row"><span>高低</span><b>${fmtPx(b.hi)} / ${fmtPx(b.lo)}</b></div>`;
    html += `<div class="row"><span>实体/量比</span><b>${(b.br*100).toFixed(0)}% / ${b.vr.toFixed(1)}x</b></div>`;
    html += `<div class="row"><span>VWAP</span><b>${fmtPx(b.vwap)}</b></div>`;
    html += `<div class="row"><span>ADX / RSI</span><b>${b.adx.toFixed(0)} / ${b.rsi.toFixed(0)}</b></div>`;
    html += `<div class="row"><span>EMA20 / 年线</span><b>${fmtPx(b.e20)} / ${fmtPx(b.e200)}</b></div>`;
    html += `<div class="row"><span>杠杆</span><b class="y">${b.adx>28 && b.score>=70 ? '5x' : '3x'}</b></div>`;
    html += `<div class="txt">${b.log.join('　')}</div>`;
    html += `</div>`;
    html += `<div class="note">候选前5：${res.slice(0,5).map(x => x.sym + '(' + x.score + x.dir[0] + ' ' + (x.chg>0?'+':'') + x.chg.toFixed(1) + '%)').join('　')}</div>`;
    html += `<div class="note">过滤 ${rej.length} 个：${rej.slice(0, 8).join('　')}</div>`;

    out.innerHTML = html;
    pt.innerText = `扫完 ${top.length} 只 · 合格 ${res.length} 只 · 推1个`;

  } catch (e) {
    out.innerHTML = `<div class="box"><div class="empty">扫描异常：${e.message}</div></div>`;
    pt.innerText = '异常终止';
  }

  btn.disabled = false;
  btn.innerText = '🚀 扫描';
}
</script>
</body>
</html>
