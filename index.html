<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多空TOP1扫描器</title>
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--border:#2a2a2a;--green:#00d4aa;--red:#ff4757;--yellow:#ffc107;--text:#e0e0e0;--sub:#888}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:12px;font-size:14px}
.wrap{max-width:440px;margin:0 auto}
h1{text-align:center;font-size:17px;margin:6px 0;color:var(--yellow)}
.desc{text-align:center;color:var(--sub);font-size:11px;margin-bottom:10px;line-height:1.5}
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:8px;background:var(--green);color:#000}
.progress{height:4px;background:#222;border-radius:2px;margin:6px 0;overflow:hidden}
.pf{height:100%;background:var(--green);width:0%;transition:width .3s}
.ptext{text-align:center;font-size:11px;color:var(--sub);margin-bottom:10px}
.big{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.big.long{border-left:4px solid var(--green)}
.big.short{border-left:4px solid var(--red)}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bsym{font-size:20px;font-weight:bold}
.bdir{font-size:12px;padding:4px 10px;border-radius:5px;font-weight:bold}
.bl{background:var(--green);color:#000}
.bs{background:var(--red);color:#fff}
.score{text-align:center;margin:8px 0;padding:8px;background:#111;border-radius:6px}
.score .num{font-size:26px;font-weight:bold}
.score .lbl{font-size:10px;color:var(--sub)}
.row{display:flex;justify-content:space-between;font-size:12px;margin:3px 0;color:#bbb}
.row b{color:var(--text)}
.rr{font-size:15px!important;font-weight:bold;color:var(--yellow)!important}
.warn{font-size:11px;color:var(--sub);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);line-height:1.5}
.rank{font-size:11px;color:var(--sub);margin-top:4px}
.empty{text-align:center;color:var(--sub);font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 多空 TOP1 扫描器</h1>
<div class="desc">前50币打分排名 · 多头/空头各取1个<br>已剔除追高、插针、超买超卖</div>

<button class="btn" onclick="start()">🚀 扫描前50币</button>
<div class="progress"><div class="pf" id="bar"></div></div>
<div class="ptext" id="ptext">就绪</div>
<div id="results"></div>
</div>

<script>
const TOP50 = ["BTC","ETH","SOL","XRP","DOGE","BNB","ADA","AVAX","LINK","DOT",
"MATIC","ATOM","NEAR","APT","SUI","ARB","OP","LTC","BCH","XLM",
"ETC","FIL","ICP","HBAR","VET","ALGO","THETA","XTZ","EOS","AAVE",
"UNI","MKR","CRV","LDO","RUNE","INJ","SEI","TIA","STX","PENDLE",
"ENA","WLD","JUP","ONDO","ETHFI","ZEC","TRX","KAS","HYPE","FET"];

function ema(a,n){const k=2/(n+1);let e=a[0],r=[e];for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);r.push(e)}return r}
function rsi(a,n=14){if(a.length<n+1)return 50;let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}if(l===0)return 100;return 100-100/(1+(g/n)/(l/n))}
function adxCalc(h,l,c,p=14){
  const up=[],dn=[],tr=[];
  for(let i=1;i<c.length;i++){up.push(h[i]-h[i-1]);dn.push(l[i-1]-l[i]);tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])))}
  let su=0,sd=0,st=0;
  for(let i=Math.max(1,tr.length-p);i<tr.length;i++){su+=Math.max(up[i],0);sd+=Math.max(dn[i],0);st+=tr[i]}
  if(st===0)return{adx:0,pdi:0,mdi:0};
  const pdi=100*su/st, mdi=100*sd/st;
  return{adx:100*Math.abs(pdi-mdi)/(pdi+mdi),pdi,mdi};
}
async function fetchK(inst,bar,limit){
  try{
    const r=await fetch(`https://www.okx.com/api/v5/market/candles?instId=${inst}-USDT-SWAP&bar=${bar}&limit=${limit}`);
    const j=await r.json();
    if(j.code!=='0'||!j.data)return null;
    return j.data.reverse().map(d=>({o:+d[1],h:+d[2],l:+d[3],c:+d[4],v:+d[5]}));
  }catch(e){return null}
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

async function start(){
  const btn=document.querySelector('.btn');
  btn.disabled=true;btn.innerText='扫描中...';
  const scored=[];
  let done=0;

  for(const sym of TOP50){
    done++;
    document.getElementById('bar').style.width=(done/TOP50.length*100)+'%';
    document.getElementById('ptext').innerText=`${done}/${TOP50.length}  ${sym}`;

    const h4=await fetchK(sym,'4H',60);
    const h1=await fetchK(sym,'1H',200);
    if(!h4||!h1||h4.length<50||h1.length<150)continue;

    const c4=h4.map(d=>d.c), c1=h1.map(d=>d.c);
    const e20=ema(c4,20), e55=ema(c4,55);
    const adxR=adxCalc(h4.map(d=>d.h),h4.map(d=>d.l),c4);
    const last4=h4[h4.length-1], last1=h1[h1.length-1], prev1=h1[h1.length-2];
    const r1=rsi(c1,14);

    // 近12根1H区间
    const win=h1.slice(-13,-1);
    const hh=Math.max(...win.map(d=>d.h)), ll=Math.min(...win.map(d=>d.l));

    // 插针检测（近10根4H）
    let spikes=0;
    for(const k of h4.slice(-10)){const body=Math.abs(k.c-k.o);if(body>0&&(k.h-k.l)/body>2)spikes++}

    // ===== 多头打分 =====
    let L=0;
    if(e20[e20.length-1]>e55[e55.length-1])L+=15;              // 均线多头排列
    if(e20[e20.length-1]>e20[e20.length-3])L+=10;              // EMA20向上
    if(last4.c>e55[e55.length-1])L+=10;                        // 价格在EMA55上
    L+=clamp((adxR.adx-15)*1.2,0,20);                          // 趋势强度
    if(adxR.pdi>adxR.mdi)L+=clamp((adxR.pdi-adxR.mdi)*1.5,0,20); // DI方向
    const pos1=(last1.c-ll)/(hh-ll||1);
    L+=clamp(pos1*20,0,20);                                    // 1H收盘在区间位置
    const volUp=h1.slice(-3).reduce((s,d)=>s+d.v,0)/3 > h1.slice(-20,-3).reduce((s,d)=>s+d.v,0)/17;
    if(volUp&&last1.c>prev1.c)L+=15;                           // 放量上涨

    // 多头扣分（不接飞刀）
    const devL=(last4.c-e55[e55.length-1])/e55[e55.length-1];
    if(devL>0.08)L-=25; else if(devL>0.05)L-=10;
    if(r1>70)L-=15; else if(r1>65)L-=8;
    if(spikes>=3)L-=20; else if(spikes===2)L-=10;

    const slL=Math.min(prev1.l,last1.l)*0.997;
    const riskL=(last1.c-slL)/last1.c;
    const rrL=riskL>0?(hh-last1.c)/(last1.c-slL):0;
    if(rrL<1.5)L-=100;

    // ===== 空头打分（镜像）=====
    let S=0;
    if(e20[e20.length-1]<e55[e55.length-1])S+=15;
    if(e20[e20.length-1]<e20[e20.length-3])S+=10;
    if(last4.c<e55[e55.length-1])S+=10;
    S+=clamp((adxR.adx-15)*1.2,0,20);
    if(adxR.mdi>adxR.pdi)S+=clamp((adxR.mdi-adxR.pdi)*1.5,0,20);
    S+=clamp((1-pos1)*20,0,20);
    if(volUp&&last1.c<prev1.c)S+=15;

    const devS=(e55[e55.length-1]-last4.c)/e55[e55.length-1];
    if(devS>0.08)S-=25; else if(devS>0.05)S-=10;
    if(r1<30)S-=15; else if(r1<35)S-=8;
    if(spikes>=3)S-=20; else if(spikes===2)S-=10;

    const slS=Math.max(prev1.h,last1.h)*1.003;
    const riskS=(slS-last1.c)/last1.c;
    const rrS=riskS>0?(last1.c-ll)/(slS-last1.c):0;
    if(rrS<1.5)S-=100;

    scored.push({
      sym, L:Math.round(clamp(L,0,100)), S:Math.round(clamp(S,0,100)),
      price:last1.c, slL,tpL:hh,rrL, slS,tpS:ll,rrS,
      riskL, riskS, adx:adxR.adx, rsi:r1, spikes, devL, devS
    });
  }

  // 排序取TOP1
  const valid=scored.filter(s=>s.L>-50||s.S>-50);
  const bestL=[...valid].sort((a,b)=>b.L-a.L)[0];
  const bestS=[...valid].sort((a,b)=>b.S-a.S)[0];
  const p=v=>v<0.01?v.toFixed(6):v.toFixed(2);

  let html='';
  if(bestL&&bestL.L>30){
    const s=bestL, lev=Math.min(20,2/(s.riskL*100)*100);
    html+=`<div class="big long">
      <div class="bhead"><span class="bsym">${s.sym}</span><span class="bdir bl">做多</span></div>
      <div class="score"><div class="num" style="color:var(--green)">${s.L}</div><div class="lbl">多头强度分 / 100</div></div>
      <div class="row rr"><span>盈亏比</span><b>${s.rrL.toFixed(2)} : 1</b></div>
      <div class="row"><span>进场价</span><b>${p(s.price)}</b></div>
      <div class="row"><span>止损</span><b>${p(s.slL)} (${(s.riskL*100).toFixed(2)}%)</b></div>
      <div class="row"><span>止盈（近12根前高）</span><b>${p(s.tpL)}</b></div>
      <div class="row"><span>建议杠杆</span><b>${lev.toFixed(1)}x</b></div>
      <div class="row"><span>ADX / RSI</span><b>${s.adx.toFixed(0)} / ${s.rsi.toFixed(0)}</b></div>
      <div class="warn">偏离EMA55 ${(s.devL*100).toFixed(1)}% · 近10根插针${s.spikes}根${s.spikes>=2?' ⚠️偏多':''}<br>仓位按账户2%风险反推，别满仓</div>
    </div>`;
  }else{
    html+=`<div class="big"><div class="empty">当前无合格多头标的<br>前50里多头分都低于30，市场偏空</div></div>`;
  }

  if(bestS&&bestS.S>30){
    const s=bestS, lev=Math.min(20,2/(s.riskS*100)*100);
    html+=`<div class="big short">
      <div class="bhead"><span class="bsym">${s.sym}</span><span class="bdir bs">做空</span></div>
      <div class="score"><div class="num" style="color:var(--red)">${s.S}</div><div class="lbl">空头强度分 / 100</div></div>
      <div class="row rr"><span>盈亏比</span><b>${s.rrS.toFixed(2)} : 1</b></div>
      <div class="row"><span>进场价</span><b>${p(s.price)}</b></div>
      <div class="row"><span>止损</span><b>${p(s.slS)} (${(s.riskS*100).toFixed(2)}%)</b></div>
      <div class="row"><span>止盈（近12根前低）</span><b>${p(s.tpS)}</b></div>
      <div class="row"><span>建议杠杆</span><b>${lev.toFixed(1)}x</b></div>
      <div class="row"><span>ADX / RSI</span><b>${s.adx.toFixed(0)} / ${s.rsi.toFixed(0)}</b></div>
      <div class="warn">偏离EMA55 ${(s.devS*100).toFixed(1)}% · 近10根插针${s.spikes}根${s.spikes>=2?' ⚠️偏多':''}<br>仓位按账户2%风险反推，别满仓</div>
    </div>`;
  }else{
    html+=`<div class="big"><div class="empty">当前无合格空头标的<br>前50里空头分都低于30，市场偏多</div></div>`;
  }

  // 附带前5名参考
  const top5=[...valid].sort((a,b)=>Math.max(b.L,b.S)-Math.max(a.L,a.S)).slice(0,5);
  html+=`<div class="rank">📊 综合前5：${top5.map(s=>`${s.sym}(多${s.L}/空${s.S})`).join('  ')}</div>`;

  document.getElementById('results').innerHTML=html;
  document.getElementById('ptext').innerText=`扫完 ${scored.length} 个有效标的`;
  btn.disabled=false;btn.innerText='🚀 重新扫描';
}
</script>
</body>
</html>
