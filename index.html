<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100币 5M结构(高低点) + EMA + 斐波那契 双向扫描</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        #top-bar { background: var(--panel); padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; align-items: center; gap: 15px; }

        .btn-container { width: 100%; max-width: 400px; }
        .scan-btn {
            background: linear-gradient(135deg, #0ecb81, #2962ff); color: #fff; border: none;
            padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(41,98,255,0.4); width: 100%; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .scan-btn:active { transform: scale(0.98); }
        .scan-btn:disabled { background: #363a45; color: #848e9c; box-shadow: none; cursor: not-allowed; }

        .progress-text { font-size: 13px; color: var(--yellow); height: 20px; text-align: center; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 4px; background: #2a2e39; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }

        #result-area { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 15px; }

        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .section-title.long { color: var(--up); }
        .section-title.short { color: var(--down); }

        /* 折叠面板样式 */
        details { background: var(--panel); border-radius: 10px; margin-bottom: 10px; overflow: hidden; border-left: 4px solid #fff; transition: all 0.3s; }
        details.long-item { border-left-color: var(--up); }
        details.short-item { border-left-color: var(--down); }
        
        summary { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none; font-weight: bold; }
        summary::-webkit-details-marker { display: none; }
        
        .summary-left { display: flex; align-items: center; gap: 10px; }
        .coin-name { font-size: 18px; color: #fff; }
        .summary-right { display: flex; align-items: center; gap: 10px; }
        
        .score-badge { font-size: 13px; padding: 4px 8px; border-radius: 6px; }
        .long-item .score-badge { background: rgba(14,203,129,0.15); color: var(--up); }
        .short-item .score-badge { background: rgba(246,70,93,0.15); color: var(--down); }
        
        .arrow-icon { font-size: 12px; color: var(--sub); transition: transform 0.2s; }
        details[open] .arrow-icon { transform: rotate(180deg); }

        .detail-content { padding: 0 15px 15px 15px; border-top: 1px solid #2a2e39; margin-top: 5px; }
        
        .reason-box { font-size: 13px; line-height: 1.7; color: #b2b5be; text-align: justify; background: #12161f; padding: 12px; border-radius: 8px; margin-bottom: 15px; margin-top: 15px; }
        
        .trade-plan { display: flex; justify-content: space-between; background: #1a1f2b; border: 1px solid #2a2e39; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: bold; }
        .trade-plan .tp { color: var(--up); }
        .trade-plan .sl { color: var(--down); }

        .highlight { color: var(--yellow); font-weight: bold; }
        .empty-tip { color: #848e9c; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="btn-container">
            <button class="scan-btn" id="startBtn" onclick="runScanner()">
                <span id="btnText">🎯 启动 5M结构+EMA+斐波那契 扫描</span>
            </button>
        </div>
        <div class="progress-text" id="progressText">准备就绪，点击上方按钮开始</div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="result-area"></div>

<script>
    let isRunning = false;

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        if (percent !== undefined) {
            document.getElementById('progressBarBg').style.display = 'block';
            document.getElementById('progressBar').style.width = Math.min(100, percent) + '%';
        }
    }

    function endScanner() {
        isRunning = false;
        const btn = document.getElementById('startBtn');
        btn.disabled = false;
        document.getElementById('btnText').innerText = "🎯 重新扫描";
    }

    async function fetchTop100Swaps() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const [instRes, tickerRes] = await Promise.all([
                fetch('https://www.okx.com/api/v5/public/instruments?instType=SWAP', { signal: ctrl.signal }).then(r => r.json()),
                fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP', { signal: ctrl.signal }).then(r => r.json())
            ]);
            
            if (instRes.code !== '0' || tickerRes.code !== '0') return [];
            const validInsts = new Set(instRes.data.filter(i => i.instId.endsWith('-USDT-SWAP')).map(i => i.instId));
            const validTickers = tickerRes.data
                .filter(t => validInsts.has(t.instId))
                .map(t => ({ instId: t.instId, vol: +t.volCcy24h || 0 }))
                .sort((a, b) => b.vol - a.vol);

            return validTickers.slice(0, 100).map(t => t.instId);
        } finally {
            clearTimeout(timer);
        }
    }

    async function fetchCandles(instId, bar, limit) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const res = await fetch(
                `https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`,
                { signal: ctrl.signal }
            ).then(r => r.json());
            if (res.code !== '0' || !res.data || !res.data.length) throw new Error('no data');
            return res.data.map(d => ({
                t: +d[0], o: +d[1], h: +d[2], l: +d[3], c: +d[4], v: +d[5],
                confirm: d[8] === '1'
            })).reverse();
        } finally {
            clearTimeout(timer);
        }
    }

    function calcEMA(prices, period) {
        if (prices.length < period) return prices[prices.length - 1] || 0;
        let k = 2 / (period + 1);
        let ema = prices[0];
        for (let i = 1; i < prices.length; i++) {
            ema = prices[i] * k + ema * (1 - k);
        }
        return ema;
    }

    window.runScanner = async function() {
        if (isRunning) return;
        isRunning = true;

        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        document.getElementById('btnText').innerText = "⏳ 正在扫描5m结构...";
        const area = document.getElementById('result-area');
        area.style.display = 'none';
        area.innerHTML = '';

        const longResults = [];
        const shortResults = [];

        try {
            const targetCoins = await fetchTop100Swaps();
            if (targetCoins.length === 0) {
                updateProgress("获取合约列表失败。", 100);
                endScanner();
                return;
            }

            updateProgress(`已锁定前100活跃币，开始计算结构...`, 5);
            const chunkSize = 20; 
            let done = 0;

            for (let i = 0; i < targetCoins.length; i += chunkSize) {
                const chunk = targetCoins.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (instId) => {
                    try {
                        // 拉取 50 根 5m K 线
                        const k5 = await fetchCandles(instId, '5m', 50);
                        if (k5.length < 25) return;
                        
                        const cur5m = k5[k5.length - 1]; // 当前正在走
                        const closedK = k5.slice(0, k5.length - 1); // 所有已收盘
                        
                        // 取最近 20 根已收盘的 5m K 线，用于找高低点结构
                        const recent20 = closedK.slice(-20);
                        
                        // ================= 寻找局部高低点（分型） =================
                        let highs = [];
                        let lows = [];
                        for(let j=1; j<recent20.length-1; j++) {
                            if(recent20[j].h > recent20[j-1].h && recent20[j].h > recent20[j+1].h) {
                                highs.push(recent20[j].h);
                            }
                            if(recent20[j].l < recent20[j-1].l && recent20[j].l < recent20[j+1].l) {
                                lows.push(recent20[j].l);
                            }
                        }
                        
                        // 至少需要两个高点和两个低点才能判断趋势
                        if (highs.length < 2 || lows.length < 2) return;
                        
                        const H1 = highs[highs.length - 1]; // 最近的高点
                        const H2 = highs[highs.length - 2]; // 前一个高点
                        const L1 = lows[lows.length - 1];   // 最近的低点
                        const L2 = lows[lows.length - 2];   // 前一个低点

                        // 结构判定
                        const isBullStruct = (H1 > H2 && L1 > L2);
                        const isBearStruct = (H1 < H2 && L1 < L2);
                        if (!isBullStruct && !isBearStruct) return;

                        // ================= 均线计算 =================
                        const closes = closedK.map(k => k.c);
                        const ema5 = calcEMA(closes, 5);
                        const ema10 = calcEMA(closes, 10);
                        const ema20 = calcEMA(closes, 20);

                        // EMA 趋势共振
                        const isBullEma = (cur5m.c > ema20 && ema5 > ema10 && ema10 > ema20);
                        const isBearEma = (cur5m.c < ema20 && ema5 < ema10 && ema10 < ema20);

                        let isBull = isBullStruct && isBullEma;
                        let isBear = isBearStruct && isBearEma;
                        if (!isBull && !isBear) return;

                        // ================= 斐波那契回撤 =================
                        // 取这 20 根里的绝对最高和最低
                        let swingHigh = -Infinity;
                        let swingLow = Infinity;
                        for (const k of recent20) {
                            if (k.h > swingHigh) swingHigh = k.h;
                            if (k.l < swingLow) swingLow = k.l;
                        }
                        const range = swingHigh - swingLow;
                        if (range <= 0) return;

                        let retracePct = 0;
                        if (isBull) {
                            retracePct = (swingHigh - cur5m.c) / range;
                        } else {
                            retracePct = (cur5m.c - swingLow) / range;
                        }
                        
                        // 必须在黄金区间
                        if (retracePct < 0.382 || retracePct > 0.618) return;

                        // ================= 打分系统 =================
                        let score = 0;
                        let reasonDetails = [];

                        // 1. 结构分 (最高 40 分) - 高低点成立给满分
                        score += 40;
                        reasonDetails.push(`5m结构确立(${isBull ? '高低点抬高' : '高低点降低'})得 40分`);

                        // 2. 斐波那契精准度 (最高 40 分)
                        let fibScore = 40 - Math.round(Math.abs(retracePct - 0.5) * 200);
                        fibScore = Math.max(0, fibScore);
                        score += fibScore;
                        reasonDetails.push(`斐波那契回撤 <b>${(retracePct * 100).toFixed(1)}%</b> 得 ${fibScore}分`);

                        // 3. EMA 贴合度 (最高 20 分)
                        let touchScore = 0;
                        const distToEma20 = Math.abs(cur5m.c - ema20) / ema20 * 100;
                        if (distToEma20 < 0.2) { touchScore = 20; reasonDetails.push(`精准贴合EMA20(20分)`); }
                        else if (distToEma20 < 0.5) { touchScore = 15; reasonDetails.push(`靠近EMA20(15分)`); }
                        else { touchScore = 5; }
                        score += touchScore;

                        const currentPrice = cur5m.c;
                        const reason = `5m 级别形成<b>${isBull ? '多头' : '空头'}结构</b>（两个${isBull ? '高点抬高、低点抬高' : '高点降低、低点降低'}），且EMA5、10、20呈完美${isBull ? '多头' : '空头'}排列。<br>当前价格正好回调至斐波那契 <span class="highlight">${(retracePct * 100).toFixed(1)}%</span> 的黄金区间。<br>打分细节：${reasonDetails.join('，')}。`;

                        if (isBull) {
                            longResults.push({ instId: instId.replace('-USDT-SWAP', ''), score, price: currentPrice, reason });
                        } else {
                            shortResults.push({ instId: instId.replace('-USDT-SWAP', ''), score, price: currentPrice, reason });
                        }

                    } catch (e) { /* ignore */ }
                    
                    done++;
                    updateProgress(`正在扫描... (${done}/${targetCoins.length})`,
                        5 + (done / targetCoins.length) * 90);
                }));
            }

            updateProgress("正在整理最终榜单...", 98);
            longResults.sort((a, b) => b.score - a.score);
            shortResults.sort((a, b) => b.score - a.score);

            renderResults(longResults.slice(0, 3), shortResults.slice(0, 3));

        } catch (err) {
            updateProgress("推算发生错误，请检查网络后再试。", 100);
            endScanner();
        }
    };

    function formatPrice(p) {
        if (p >= 1000) return p.toFixed(2);
        if (p >= 10) return p.toFixed(3);
        if (p >= 0.1) return p.toFixed(4);
        if (p >= 0.001) return p.toFixed(5);
        return p.toFixed(6);
    }

    function renderResults(longs, shorts) {
        updateProgress("✅ 扫描完成！", 100);
        endScanner();

        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        let html = '';

        html += `<div class="section-title long">🟢 做多 Top 3（5m多头结构 + EMA多头 + 斐波那契回调）</div>`;
        if (longs.length === 0) html += `<div class="empty-tip">当前无符合结构的做多标的。</div>`;
        longs.forEach((item, index) => {
            const sl = item.price * (1 - 0.01); // 5m 级别止损收窄至 1%
            const tp = item.price * (1 + 0.02); // 止盈 2%
            html += `
                <details class="long-item">
                    <summary>
                        <div class="summary-left">
                            <span class="coin-name">${index + 1}. ${item.instId}</span>
                        </div>
                        <div class="summary-right">
                            <span class="score-badge">综合分: ${item.score}</span>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </summary>
                    <div class="detail-content">
                        <div class="reason-box">${item.reason}</div>
                        <div class="trade-plan">
                            <span class="sl">止损: ${formatPrice(sl)}</span>
                            <span style="color:#fff;">参考价: ${formatPrice(item.price)}</span>
                            <span class="tp">止盈: ${formatPrice(tp)}</span>
                        </div>
                    </div>
                </details>`;
        });

        html += `<div class="section-title short" style="margin-top:15px;">🔴 做空 Top 3（5m空头结构 + EMA空头 + 斐波那契反弹）</div>`;
        if (shorts.length === 0) html += `<div class="empty-tip">当前无符合结构的做空标的。</div>`;
        shorts.forEach((item, index) => {
            const sl = item.price * (1 + 0.01);
            const tp = item.price * (1 - 0.02);
            html += `
                <details class="short-item">
                    <summary>
                        <div class="summary-left">
                            <span class="coin-name">${index + 1}. ${item.instId}</span>
                        </div>
                        <div class="summary-right">
                            <span class="score-badge">综合分: ${item.score}</span>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </summary>
                    <div class="detail-content">
                        <div class="reason-box">${item.reason}</div>
                        <div class="trade-plan">
                            <span class="tp">止盈: ${formatPrice(tp)}</span>
                            <span style="color:#fff;">参考价: ${formatPrice(item.price)}</span>
                            <span class="sl">止损: ${formatPrice(sl)}</span>
                        </div>
                    </div>
                </details>`;
        });

        area.innerHTML = html;
    }
</script>
</body>
</html>
