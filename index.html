<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前100币 15M(20根)定势 + 5M形态 (过滤插针/横盘)</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        #top-bar { background: var(--panel); padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }

        .btn-container { width: 100%; max-width: 400px; display: flex; gap: 10px; }
        .scan-btn {
            background: linear-gradient(135deg, #0ecb81, #2962ff); color: #fff; border: none;
            padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(41,98,255,0.4); flex: 1; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .scan-btn:active { transform: scale(0.98); }
        .scan-btn:disabled { background: #363a45; color: #848e9c; box-shadow: none; cursor: not-allowed; }
        
        .auto-btn { background: linear-gradient(135deg, #fcd535, #f6465d); box-shadow: 0 6px 20px rgba(246,70,93,0.4); display: none; }
        .auto-btn.active { background: #2a2e39; color: var(--yellow); box-shadow: none; border: 1px solid var(--yellow); }

        .progress-text { font-size: 13px; color: var(--yellow); height: 20px; text-align: center; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 4px; background: #2a2e39; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }

        #result-area { flex: 1; overflow-y: auto; padding: 15px; display: none; flex-direction: column; gap: 15px; }

        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .section-title.long { color: var(--up); }
        .section-title.short { color: var(--down); }

        details { background: var(--panel); border-radius: 10px; margin-bottom: 10px; overflow: hidden; border-left: 4px solid #fff; transition: all 0.3s; }
        details.long-item { border-left-color: var(--up); }
        details.short-item { border-left-color: var(--down); }
        
        summary { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none; font-weight: bold; }
        summary::-webkit-details-marker { display: none; }
        
        .summary-left { display: flex; align-items: center; gap: 10px; }
        .coin-name { font-size: 18px; color: #fff; }
        .summary-right { display: flex; align-items: center; gap: 10px; }
        
        .score-badge { font-size: 13px; padding: 4px 8px; border-radius: 6px; }
        .long-item .score-badge { background: rgba(14,203,129,0.15); color: var(--up); }
        .short-item .score-badge { background: rgba(246,70,93,0.15); color: var(--down); }
        
        .arrow-icon { font-size: 12px; color: var(--sub); transition: transform 0.2s; }
        details[open] .arrow-icon { transform: rotate(180deg); }

        .detail-content { padding: 0 15px 15px 15px; border-top: 1px solid #2a2e39; margin-top: 5px; }
        .reason-box { font-size: 13px; line-height: 1.7; color: #b2b5be; text-align: justify; background: #12161f; padding: 12px; border-radius: 8px; margin-bottom: 15px; margin-top: 15px; }
        .trade-plan { display: flex; justify-content: space-between; background: #1a1f2b; border: 1px solid #2a2e39; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: bold; }
        .trade-plan .tp { color: var(--up); }
        .trade-plan .sl { color: var(--down); }

        .highlight { color: var(--yellow); font-weight: bold; }
        .empty-tip { color: #848e9c; font-size: 13px; margin-bottom: 20px; }

        #toast-banner {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--up); color: #fff; padding: 15px 30px; border-radius: 30px;
            font-weight: bold; font-size: 16px; box-shadow: 0 10px 30px rgba(14,203,129,0.5);
            transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 999;
            cursor: pointer;
        }
        #toast-banner.show { top: 20px; }
        #toast-banner.short { background: var(--down); box-shadow: 0 10px 30px rgba(246,70,93,0.5); }
    </style>
</head>
<body>

    <div id="toast-banner" onclick="window.scrollTo(0, 0); this.classList.remove('show');"></div>

    <div id="top-bar">
        <div class="btn-container">
            <button class="scan-btn" id="startBtn" onclick="runScanner()">
                <span id="btnText">🎯 启动 前100币 扫描</span>
            </button>
            <button class="scan-btn auto-btn" id="autoBtn" onclick="toggleAutoScan()" style="flex: 0.6;">
                <span id="autoBtnText">⏱️ 5分定时</span>
            </button>
        </div>
        <div class="progress-text" id="progressText">准备就绪，点击上方按钮开始</div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="result-area"></div>

<script>
    let isRunning = false;
    
    let autoScanInterval = null;
    let countdownInterval = null;
    let nextScanTime = 0;
    let isAutoScanning = false;
    
    const SCAN_INTERVAL = 5 * 60 * 1000; 

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        if (percent !== undefined) {
            document.getElementById('progressBarBg').style.display = 'block';
            document.getElementById('progressBar').style.width = Math.min(100, percent) + '%';
        }
    }

    function endScanner() {
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('btnText').innerText = "🎯 立即扫描";
        
        if (isAutoScanning) {
            nextScanTime = Date.now() + SCAN_INTERVAL;
        }
    }

    function toggleAutoScan() {
        const autoBtn = document.getElementById('autoBtn');
        const autoBtnText = document.getElementById('autoBtnText');

        if (isAutoScanning) {
            isAutoScanning = false;
            clearInterval(autoScanInterval);
            clearInterval(countdownInterval);
            autoBtn.classList.remove('active');
            autoBtnText.innerText = "⏱️ 5分定时";
            updateProgress("已停止自动扫描", 0);
        } else {
            isAutoScanning = true;
            autoBtn.classList.add('active');
            autoBtnText.innerText = "🛑 停止";
            
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                ctx.resume();
            } catch(e) {}
            
            runScanner();
            
            autoScanInterval = setInterval(() => {
                if (!isRunning) runScanner();
            }, SCAN_INTERVAL);

            countdownInterval = setInterval(() => {
                if (!isRunning && nextScanTime > 0) {
                    const left = Math.max(0, nextScanTime - Date.now());
                    const m = Math.floor(left / 60000);
                    const s = Math.floor((left % 60000) / 1000);
                    if (left > 0) {
                        updateProgress(`等待下次扫描: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`, ((SCAN_INTERVAL - left) / SCAN_INTERVAL) * 100);
                    }
                }
            }, 1000);
        }
    }

    function playAlert() {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            setTimeout(() => { osc.stop(); }, 200);
        } catch (e) {}
    }

    function sendNotification(title, body, type) {
        const banner = document.getElementById('toast-banner');
        banner.innerText = `🎯 ${title}`;
        banner.className = type === 'LONG' ? 'show' : 'show short';
        setTimeout(() => { banner.classList.remove('show'); }, 8000);

        playAlert();

        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body: body });
        }
    }

    async function fetchTop100Swaps() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const [instRes, tickerRes] = await Promise.all([
                fetch('https://www.okx.com/api/v5/public/instruments?instType=SWAP', { signal: ctrl.signal }).then(r => r.json()),
                fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP', { signal: ctrl.signal }).then(r => r.json())
            ]);
            
            if (instRes.code !== '0' || tickerRes.code !== '0') return [];
            const validInsts = new Set(instRes.data.filter(i => i.instId.endsWith('-USDT-SWAP')).map(i => i.instId));
            const validTickers = tickerRes.data
                .filter(t => validInsts.has(t.instId))
                .map(t => ({ instId: t.instId, vol: +t.volCcy24h || 0 }))
                .sort((a, b) => b.vol - a.vol);

            return validTickers.slice(0, 100).map(t => t.instId);
        } finally {
            clearTimeout(timer);
        }
    }

    async function fetchCandles(instId, bar, limit) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const res = await fetch(
                `https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`,
                { signal: ctrl.signal }
            ).then(r => r.json());
            if (res.code !== '0' || !res.data || !res.data.length) throw new Error('no data');
            return res.data.map(d => ({
                t: +d[0], o: +d[1], h: +d[2], l: +d[3], c: +d[4], v: +d[5],
                confirm: d[8] === '1'
            })).reverse();
        } finally {
            clearTimeout(timer);
        }
    }

    function isHammer(k) {
        const body = Math.abs(k.c - k.o);
        const lowerWick = Math.min(k.c, k.o) - k.l;
        const upperWick = k.h - Math.max(k.c, k.o);
        return (lowerWick >= body * 2) && (upperWick <= body);
    }

    function isShootingStar(k) {
        const body = Math.abs(k.c - k.o);
        const lowerWick = Math.min(k.c, k.o) - k.l;
        const upperWick = k.h - Math.max(k.c, k.o);
        return (upperWick >= body * 2) && (lowerWick <= body);
    }

    window.runScanner = async function() {
        if (isRunning) return;
        isRunning = true;

        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        document.getElementById('btnText').innerText = "⏳ 扫描中...";
        const area = document.getElementById('result-area');
        
        area.style.display = 'none';
        area.innerHTML = '';

        const longResults = [];
        const shortResults = [];

        try {
            const targetCoins = await fetchTop100Swaps();
            if (targetCoins.length === 0) {
                updateProgress("获取合约列表失败。", 100);
                endScanner();
                return;
            }

            updateProgress(`已锁定前100活跃币，正在计算...`, 5);
            const chunkSize = 15; 
            let done = 0;

            for (let i = 0; i < targetCoins.length; i += chunkSize) {
                const chunk = targetCoins.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (instId) => {
                    try {
                        // 1. 拉取 15m 和 5m 数据
                        const [k15, k5] = await Promise.all([
                            fetchCandles(instId, '15m', 40), // 拉 40 根足够过滤
                            fetchCandles(instId, '5m', 30)
                        ]);
                        
                        if (k15.length < 25 || k5.length < 10) return;

                        const closed15m = k15.slice(0, k15.length - 1);
                        
                        // ================= 改为 20 根 =================
                        const recent20 = closed15m.slice(-20);
                        
                        // ================= 过滤 1：防插针 & 防横盘 =================
                        let maxH = -Infinity;
                        let minL = Infinity;
                        let hasExtremeSpike = false;

                        for (const k of recent20) {
                            if (k.h > maxH) maxH = k.h;
                            if (k.l < minL) minL = k.l;

                            // 单根 15m 振幅若超过 8%，视为剧烈插针妖币，淘汰
                            const candleAmp = (k.h - k.l) / k.l * 100;
                            if (candleAmp > 8) {
                                hasExtremeSpike = true;
                                break;
                            }
                        }
                        
                        if (hasExtremeSpike) return;

                        // 最近 20 根 15m（约5小时）的总振幅若小于 2%，视为横盘死水，淘汰 (因为根数少了，阈值可略降)
                        const totalAmp = (maxH - minL) / minL * 100;
                        if (totalAmp < 2) return;

                        // ================= 2. 15m 结构判定 (20根) =================
                        let highs = [], lows = [];
                        for(let j=1; j<recent20.length-1; j++) {
                            if(recent20[j].h > recent20[j-1].h && recent20[j].h > recent20[j+1].h) highs.push(recent20[j].h);
                            if(recent20[j].l < recent20[j-1].l && recent20[j].l < recent20[j+1].l) lows.push(recent20[j].l);
                        }
                        if (highs.length < 2 || lows.length < 2) return;
                        
                        const H1 = highs[highs.length - 1], H2 = highs[highs.length - 2];
                        const L1 = lows[lows.length - 1], L2 = lows[lows.length - 2];
                        
                        const isBullTrend = (H1 > H2 && L1 > L2);
                        const isBearTrend = (H1 < H2 && L1 < L2);
                        if (!isBullTrend && !isBearTrend) return;

                        // ================= 3. 5m 形态与成交量判定 =================
                        const closed5m = k5.slice(0, k5.length - 1);
                        const lastClosed = closed5m[closed5m.length - 1];
                        
                        // 5m 信号线本身的振幅必须 ≥ 0.5%
                        const signalAmp = (lastClosed.h - lastClosed.l) / lastClosed.l * 100;
                        if (signalAmp < 0.5) return;

                        const prev5 = closed5m.slice(-6, -1);
                        const avgVol = prev5.reduce((sum, k) => sum + k.v, 0) / 5;
                        if (avgVol === 0) return;
                        const volRatio = lastClosed.v / avgVol;
                        if (volRatio < 1.2) return; // 必须放量 1.2 倍

                        const hammer = isHammer(lastClosed);
                        const star = isShootingStar(lastClosed);

                        // ================= 打分系统 =================
                        let score = 0;
                        let reasonDetails = [];
                        let type = null;

                        const body = Math.abs(lastClosed.c - lastClosed.o);
                        const range = lastClosed.h - lastClosed.l;
                        const wickRatio = range > 0 ? (range - body) / range : 0;

                        if (isBullTrend && hammer) {
                            type = 'LONG';
                            score += 40; reasonDetails.push(`15m多头结构(40分)`);
                            
                            let volScore = Math.min(Math.round((volRatio - 1) * 15), 30); score += volScore;
                            let shapeScore = Math.round(wickRatio * 30); score += shapeScore;
                            
                            reasonDetails.push(`5m锤子线(${shapeScore}分)`);
                            reasonDetails.push(`放量${volRatio.toFixed(1)}倍(${volScore}分)`);

                        } else if (isBearTrend && star) {
                            type = 'SHORT';
                            score += 40; reasonDetails.push(`15m空头结构(40分)`);
                            
                            let volScore = Math.min(Math.round((volRatio - 1) * 15), 30); score += volScore;
                            let shapeScore = Math.round(wickRatio * 30); score += shapeScore;
                            
                            reasonDetails.push(`5m流星线(${shapeScore}分)`);
                            reasonDetails.push(`放量${volRatio.toFixed(1)}倍(${volScore}分)`);
                        }

                        if (!type) return;

                        const reason = `15m 级别形成${type === 'LONG' ? '多头' : '空头'}结构。<br>5m 最新收盘出现 <span class="highlight">${type === 'LONG' ? '锤子线' : '流星线'}</span>，且放量。<br>打分细节：${reasonDetails.join('，')}。`;

                        if (type === 'LONG') {
                            longResults.push({ instId: instId.replace('-USDT-SWAP', ''), score, price: lastClosed.c, reason });
                        } else {
                            shortResults.push({ instId: instId.replace('-USDT-SWAP', ''), score, price: lastClosed.c, reason });
                        }

                    } catch (e) { /* ignore */ }
                    
                    done++;
                    if (!isAutoScanning) updateProgress(`正在扫描... (${done}/${targetCoins.length})`, 5 + (done / targetCoins.length) * 90);
                }));
            }

            longResults.sort((a, b) => b.score - a.score);
            shortResults.sort((a, b) => b.score - a.score);
            
            if (isAutoScanning && (longResults.length > 0 || shortResults.length > 0)) {
                const hasLong = longResults.length > 0;
                const title = hasLong ? `发现 ${longResults.length} 个做多信号` : `发现 ${shortResults.length} 个做空信号`;
                const topCoin = hasLong ? longResults[0].instId : shortResults[0].instId;
                sendNotification(title, `首选币种: ${topCoin}`, hasLong ? 'LONG' : 'SHORT');
            }

            renderResults(longResults.slice(0, 3), shortResults.slice(0, 3), isAutoScanning);

        } catch (err) {
            updateProgress("推算发生错误，请稍后再试。", 100);
            endScanner();
        }
    };

    function formatPrice(p) {
        if (p >= 1000) return p.toFixed(2);
        if (p >= 10) return p.toFixed(3);
        if (p >= 0.1) return p.toFixed(4);
        if (p >= 0.001) return p.toFixed(5);
        return p.toFixed(6);
    }

    function renderResults(longs, shorts, isAuto) {
        if (!isAuto) updateProgress("✅ 扫描完成！", 100);
        endScanner();

        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        let html = '';

        html += `<div class="section-title long">🟢 做多 Top 3（15m多头结构 + 5m放量锤子线）</div>`;
        if (longs.length === 0) html += `<div class="empty-tip">当前无符合结构的做多标的。</div>`;
        longs.forEach((item, index) => {
            const sl = item.price * (1 - 0.01);
            const tp = item.price * (1 + 0.02);
            html += `
                <details class="long-item">
                    <summary>
                        <div class="summary-left"><span class="coin-name">${index + 1}. ${item.instId}</span></div>
                        <div class="summary-right"><span class="score-badge">分: ${item.score}</span><span class="arrow-icon">▼</span></div>
                    </summary>
                    <div class="detail-content">
                        <div class="reason-box">${item.reason}</div>
                        <div class="trade-plan">
                            <span class="sl">止损: ${formatPrice(sl)}</span>
                            <span style="color:#fff;">参考价: ${formatPrice(item.price)}</span>
                            <span class="tp">止盈: ${formatPrice(tp)}</span>
                        </div>
                    </div>
                </details>`;
        });

        html += `<div class="section-title short" style="margin-top:15px;">🔴 做空 Top 3（15m空头结构 + 5m放量流星线）</div>`;
        if (shorts.length === 0) html += `<div class="empty-tip">当前无符合结构的做空标的。</div>`;
        shorts.forEach((item, index) => {
            const sl = item.price * (1 + 0.01);
            const tp = item.price * (1 - 0.02);
            html += `
                <details class="short-item">
                    <summary>
                        <div class="summary-left"><span class="coin-name">${index + 1}. ${item.instId}</span></div>
                        <div class="summary-right"><span class="score-badge">分: ${item.score}</span><span class="arrow-icon">▼</span></div>
                    </summary>
                    <div class="detail-content">
                        <div class="reason-box">${item.reason}</div>
                        <div class="trade-plan">
                            <span class="tp">止盈: ${formatPrice(tp)}</span>
                            <span style="color:#fff;">参考价: ${formatPrice(item.price)}</span>
                            <span class="sl">止损: ${formatPrice(sl)}</span>
                        </div>
                    </div>
                </details>`;
        });

        area.innerHTML = html;
    }
</script>
</body>
</html>
