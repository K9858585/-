<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前200币 4H趋势预测 (放宽入场版)</title>
    <style>
        :root { --bg: #12161f; --panel: #1a1f2b; --text: #d1d4dc; --sub: #848e9c; --up: #0ecb81; --down: #f6465d; --yellow: #fcd535; --blue: #2962ff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; -webkit-overflow-scrolling: touch; }

        #top-bar { background: var(--panel); padding: 20px; border-bottom: 1px solid #2a2e39; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10; }

        .btn-container { width: 100%; max-width: 400px; display: flex; gap: 10px; }
        .scan-btn {
            background: linear-gradient(135deg, #0ecb81, #2962ff); color: #fff; border: none;
            padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(41,98,255,0.4); flex: 1; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .scan-btn:active { transform: scale(0.98); }
        .scan-btn:disabled { background: #363a45; color: #848e9c; box-shadow: none; cursor: not-allowed; }
        
        .auto-btn { background: linear-gradient(135deg, #fcd535, #f6465d); box-shadow: 0 6px 20px rgba(246,70,93,0.4); }
        .auto-btn.active { background: #2a2e39; color: var(--yellow); box-shadow: none; border: 1px solid var(--yellow); }

        .progress-text { font-size: 13px; color: var(--yellow); height: 20px; text-align: center; font-weight: bold; }
        .progress-bar-bg { width: 100%; height: 4px; background: #2a2e39; border-radius: 2px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s; }

        #result-area { flex: 1; padding: 15px; padding-bottom: 100px; display: none; flex-direction: column; gap: 15px; }

        /* 黄金推荐卡片 */
        .best-pick-card {
            background: linear-gradient(145deg, #1a2333, #12161f);
            border: 2px solid var(--yellow);
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(252,213,53,0.15); position: relative; overflow: hidden;
        }
        .best-pick-card.long { border-color: var(--up); box-shadow: 0 10px 30px rgba(14,203,129,0.15); }
        .best-pick-card.short { border-color: var(--down); box-shadow: 0 10px 30px rgba(246,70,93,0.15); }
        
        .best-title { font-size: 16px; font-weight: bold; color: var(--yellow); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .best-title .badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: rgba(252,213,53,0.2); }
        .best-coin { font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;}
        .best-coin .dir { font-size: 16px; padding: 4px 12px; border-radius: 20px; font-weight: bold;}
        .best-coin .dir.long { background: rgba(14,203,129,0.2); color: var(--up); }
        .best-coin .dir.short { background: rgba(246,70,93,0.2); color: var(--down); }

        .trade-box { display: flex; justify-content: space-between; background: #12161f; padding: 12px; border-radius: 8px; border: 1px solid #2a2e39; margin-bottom: 15px;}
        .trade-item { display: flex; flex-direction: column; align-items: center; gap: 4px;}
        .trade-item .label { font-size: 12px; color: var(--sub); }
        .trade-item .val { font-size: 15px; font-weight: bold; color: #fff;}
        .trade-item .val.tp { color: var(--up); }
        .trade-item .val.sl { color: var(--down); }
        
        .best-reasons { font-size: 13px; color: #b2b5be; line-height: 1.6; background: rgba(18,22,31,0.5); padding: 10px; border-radius: 8px;}
        .best-reasons b { color: #fff; }

        /* 备选清单区 */
        .section-title { font-size: 16px; font-weight: bold; margin-top: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .section-title.long { color: var(--up); }
        .section-title.short { color: var(--down); }

        details { 
            background: var(--panel); 
            border-radius: 10px; 
            margin-bottom: 12px; 
            overflow: hidden; 
            border: 1px solid #2a2e39; 
            border-left-width: 4px;
            transition: all 0.3s; 
        }
        details.long-item { border-left-color: var(--up); }
        details.short-item { border-left-color: var(--down); }
        
        summary { 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            list-style: none; 
            font-weight: bold;
            background: rgba(42, 46, 57, 0.4);
        }
        summary::-webkit-details-marker { display: none; }
        
        .summary-left { display: flex; align-items: center; gap: 10px; }
        .coin-name { font-size: 18px; color: #fff; }
        .summary-right { display: flex; align-items: center; gap: 10px; }
        
        .score-badge { font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
        .long-item .score-badge { background: rgba(14,203,129,0.15); color: var(--up); }
        .short-item .score-badge { background: rgba(246,70,93,0.15); color: var(--down); }
        
        .arrow-icon { font-size: 12px; color: var(--sub); transition: transform 0.2s; }
        details[open] .arrow-icon { transform: rotate(180deg); }

        .detail-content { padding: 15px; border-top: 1px solid #2a2e39; }
        
        .reason-tag { 
            display: inline-block; 
            padding: 6px 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            margin: 4px 4px 4px 0; 
            background: #12161f; 
            border: 1px solid #2a2e39; 
        }
        .tag-long { color: var(--up); border-color: rgba(14,203,129,0.3); }
        .tag-short { color: var(--down); border-color: rgba(246,70,93,0.3); }
        
        .analysis-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2a2e39; font-size: 13px; margin-bottom: 10px; }
        .analysis-row:last-child { border-bottom: none; margin-bottom: 0;}
        .analysis-label { color: var(--sub); }
        .analysis-value { font-weight: bold; color: #fff; text-align: right;}

        .empty-tip { color: #848e9c; font-size: 14px; margin: 20px 0; text-align: center; padding: 20px; border: 1px dashed #2a2e39; border-radius: 10px;}
        
        .warning-box { background: rgba(246,70,93,0.1); border: 1px solid var(--down); padding: 15px; border-radius: 8px; font-size: 13px; color: var(--down); margin-bottom: 15px; line-height: 1.5;}
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="btn-container">
            <button class="scan-btn" id="startBtn" onclick="runScanner()">
                <span id="btnText">🎯 预测4H趋势 (前200币)</span>
            </button>
            <button class="scan-btn auto-btn" id="autoBtn" onclick="toggleAutoScan()" style="flex: 0.6;">
                <span id="autoBtnText">⏱️ 5分定时</span>
            </button>
        </div>
        <div class="progress-text" id="progressText">准备就绪</div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <div id="result-area"></div>

<script>
    let isRunning = false;
    let autoScanInterval = null;
    let countdownInterval = null;
    let nextScanTime = 0;
    let isAutoScanning = false;
    const SCAN_INTERVAL = 5 * 60 * 1000; 

    function updateProgress(text, percent) {
        document.getElementById('progressText').innerText = text;
        if (percent !== undefined) {
            document.getElementById('progressBarBg').style.display = 'block';
            document.getElementById('progressBar').style.width = Math.min(100, percent) + '%';
        }
    }

    function endScanner() {
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('btnText').innerText = "🎯 预测4H趋势 (前200币)";
        if (isAutoScanning) nextScanTime = Date.now() + SCAN_INTERVAL;
    }

    function toggleAutoScan() {
        const autoBtn = document.getElementById('autoBtn');
        const autoBtnText = document.getElementById('autoBtnText');
        if (isAutoScanning) {
            isAutoScanning = false;
            clearInterval(autoScanInterval); clearInterval(countdownInterval);
            autoBtn.classList.remove('active');
            autoBtnText.innerText = "⏱️ 5分定时";
            updateProgress("已停止自动扫描", 0);
        } else {
            isAutoScanning = true;
            autoBtn.classList.add('active');
            autoBtnText.innerText = "🛑 停止";
            runScanner();
            autoScanInterval = setInterval(() => { if (!isRunning) runScanner(); }, SCAN_INTERVAL);
            countdownInterval = setInterval(() => {
                if (!isRunning && nextScanTime > 0) {
                    const left = Math.max(0, nextScanTime - Date.now());
                    const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
                    if (left > 0) updateProgress(`⏱️ 自动运行中... 下次倒计时: ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`, ((SCAN_INTERVAL - left) / SCAN_INTERVAL) * 100);
                }
            }, 1000);
        }
    }

    // ================= 指标计算函数区 =================
    function getEMAArray(prices, period) {
        if (prices.length === 0) return [];
        let k = 2 / (period + 1);
        let ema = prices[0];
        let result = [ema];
        for (let i = 1; i < prices.length; i++) {
            ema = prices[i] * k + ema * (1 - k);
            result.push(ema);
        }
        return result;
    }

    function calcMACD(closes) {
        if (closes.length < 26) return 0;
        const ema12 = getEMAArray(closes, 12);
        const ema26 = getEMAArray(closes, 26);
        return ema12[ema12.length-1] - ema26[ema26.length-1];
    }

    function calcRSI(closes, period = 14) {
        if (closes.length <= period) return 50;
        let gains = 0, losses = 0;
        for (let i = 1; i <= period; i++) {
            const diff = closes[i] - closes[i - 1];
            if (diff >= 0) gains += diff; else losses -= diff;
        }
        let avgGain = gains / period, avgLoss = losses / period;
        for (let i = period + 1; i < closes.length; i++) {
            const diff = closes[i] - closes[i - 1];
            let gain = diff > 0 ? diff : 0, loss = diff < 0 ? -diff : 0;
            avgGain = (avgGain * (period - 1) + gain) / period;
            avgLoss = (avgLoss * (period - 1) + loss) / period;
        }
        if (avgLoss === 0) return 100;
        return 100 - (100 / (1 + (avgGain / avgLoss)));
    }

    // ================= 核心打分引擎 (放宽版) =================
    function evaluateCoin(k4h, k1h, chgToday) {
        const closed4h = k4h.slice(0, -1);
        const closes4h = closed4h.map(k => k.c);
        
        const closed1h = k1h.slice(0, -1);
        const closes1h = closed1h.map(k => k.c);
        const last1h = closed1h[closed1h.length - 1];

        // ================= 🚨 剔除横盘 & 妖币过滤 =================
        const recent20_4h = closed4h.slice(-20);
        const maxH = Math.max(...recent20_4h.map(k => k.h));
        const minL = Math.min(...recent20_4h.map(k => k.l));
        const totalAmp = (maxH - minL) / minL * 100;
        
        if (totalAmp < 5) return null; // 横盘
        if (totalAmp > 40) return null; // 妖币

        const ema20_4h = getEMAArray(closes4h, 20);
        const macd4h = calcMACD(closes4h);
        const rsi4h = calcRSI(closes4h, 14);
        const rsi1h = calcRSI(closes1h, 14);

        const curPrice = k4h[k4h.length - 1].c;
        const ema20Val = ema20_4h[ema20_4h.length - 1];
        
        const ema20_up = ema20Val > ema20_4h[ema20_4h.length - 2];
        const ema20_down = ema20Val < ema20_4h[ema20_4h.length - 2];

        let longScore = 0;
        let longReasons = [];
        let shortScore = 0;
        let shortReasons = [];

        // 做多
        if (curPrice > ema20Val && ema20_up) {
            longScore += 30; longReasons.push("4H价格在EMA20上且均线向上");
            if (macd4h > 0) { longScore += 20; longReasons.push("4H MACD零轴上"); }
            if (rsi4h > 50 && rsi4h < 75) { longScore += 10; longReasons.push(`4H RSI强势(${rsi4h.toFixed(1)})`); }
            
            // 放宽1H入场条件：只要RSI不超买，且有收阴迹象
            if (rsi1h < 50 || last1h.c < last1h.o) { longScore += 20; longReasons.push("1H级别动能放缓(买点)"); }
            if (chgToday > 0) { longScore += 10; longReasons.push("今日趋势为正"); }
        }

        // 做空
        if (curPrice < ema20Val && ema20_down) {
            shortScore += 30; shortReasons.push("4H价格在EMA20下且均线向下");
            if (macd4h < 0) { shortScore += 20; shortReasons.push("4H MACD零轴下"); }
            if (rsi4h < 50 && rsi4h > 25) { shortScore += 10; shortReasons.push(`4H RSI弱势(${rsi4h.toFixed(1)})`); }
            
            // 放宽1H入场条件：只要RSI不超卖，且有收阳迹象
            if (rsi1h > 50 || last1h.c > last1h.o) { shortScore += 20; shortReasons.push("1H级别动能放缓(空点)"); }
            if (chgToday < 0) { shortScore += 10; shortReasons.push("今日趋势为负"); }
        }

        return { 
            longScore: Math.min(100, longScore), longReasons,
            shortScore: Math.min(100, shortScore), shortReasons,
            rsi4h, totalAmp, cur4hK, last1h
        };
    }


    // ================= 主流程 =================
    async function fetchTop200Swaps() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 15000);
        try {
            const [instRes, tickerRes] = await Promise.all([
                fetch('https://www.okx.com/api/v5/public/instruments?instType=SWAP', { signal: ctrl.signal }).then(r => r.json()),
                fetch('https://www.okx.com/api/v5/market/tickers?instType=SWAP', { signal: ctrl.signal }).then(r => r.json())
            ]);
            if (instRes.code !== '0' || tickerRes.code !== '0') return [];
            const validInsts = new Set(instRes.data.filter(i => i.instId.endsWith('-USDT-SWAP')).map(i => i.instId));
            
            return tickerRes.data
                .filter(t => validInsts.has(t.instId))
                .map(t => {
                    const last = +t.last;
                    const todayOpen = +t.sodUtc8 || +t.open24h; 
                    return { instId: t.instId, vol: +t.volCcy24h || 0, chgToday: todayOpen > 0 ? (last - todayOpen) / todayOpen * 100 : 0 };
                })
                .sort((a, b) => b.vol - a.vol).slice(0, 200); // 改回 200 个币
        } finally { clearTimeout(timer); }
    }

    async function fetchCandles(instId, bar, limit) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        try {
            const res = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`, { signal: ctrl.signal }).then(r => r.json());
            if (res.code !== '0' || !res.data || !res.data.length) throw new Error('no data');
            return res.data.map(d => ({ t: +d[0], o: +d[1], h: +d[2], l: +d[3], c: +d[4], v: +d[5], confirm: d[8] === '1' })).reverse();
        } finally { clearTimeout(timer); }
    }

    window.runScanner = async function() {
        if (isRunning) return;
        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('btnText').innerText = "⏳ 4H趋势推演中...";
        const area = document.getElementById('result-area');
        area.style.display = 'none';
        area.innerHTML = '';
        
        let longResults = [], shortResults = [];

        try {
            const targetCoins = await fetchTop200Swaps();
            if (targetCoins.length === 0) { updateProgress("获取合约失败。", 100); endScanner(); return; }

            updateProgress(`正在过滤横盘及妖币，推演200个币的4H趋势...`, 5);
            let done = 0;
            const chunkSize = 8; // 200个币，降低并发防限流

            for (let i = 0; i < targetCoins.length; i += chunkSize) {
                const chunk = targetCoins.slice(i, i + chunkSize);
                await Promise.all(chunk.map(async (coin) => {
                    try {
                        const [k4h, k1h] = await Promise.all([
                            fetchCandles(coin.instId, '4H', 30), 
                            fetchCandles(coin.instId, '1H', 30)
                        ]);
                        
                        if (k4h.length < 25 || k1h.length < 25) return;

                        const result = evaluateCoin(k4h, k1h, coin.chgToday);
                        if (!result) return; 

                        const entryPrice = result.cur4hK.c;
                        let sl = 0, tp = 0, risk = 0;

                        // 门槛 60 分
                        if (result.longScore >= 60) {
                            const recent1h = k1h.slice(-5, -1);
                            const minL1h = Math.min(...recent1h.map(k => k.l));
                            sl = minL1h * (1 - 0.005); 
                            risk = (entryPrice - sl) / entryPrice;
                            if (risk > 0.06) return; 
                            tp = entryPrice + (entryPrice - sl) * 3; 
                            longResults.push({ ...coin, ...result, price: entryPrice, sl, tp, risk: (risk*100).toFixed(2) });
                        }

                        if (result.shortScore >= 60) {
                            const recent1h = k1h.slice(-5, -1);
                            const maxH1h = Math.max(...recent1h.map(k => k.h));
                            sl = maxH1h * (1 + 0.005);
                            risk = (sl - entryPrice) / entryPrice;
                            if (risk > 0.06) return;
                            tp = entryPrice - (sl - entryPrice) * 3;
                            shortResults.push({ ...coin, ...result, price: entryPrice, sl, tp, risk: (risk*100).toFixed(2) });
                        }

                    } catch (e) {}
                    done++;
                    updateProgress(`推演中... (${done}/${targetCoins.length})`, 5 + (done / targetCoins.length) * 90);
                }));
            }

            longResults.sort((a, b) => b.longScore - a.longScore);
            shortResults.sort((a, b) => b.shortScore - a.shortScore);

            renderResults(longResults, shortResults);

        } catch (err) {
            updateProgress("推算发生错误，请稍后再试。", 100);
            endScanner();
        }
    };

    function formatPrice(p) {
        if (p >= 1000) return p.toFixed(2); if (p >= 10) return p.toFixed(3);
        if (p >= 0.1) return p.toFixed(4); if (p >= 0.001) return p.toFixed(5);
        return p.toFixed(6);
    }

    function renderResults(longs, shorts) {
        updateProgress("✅ 200币 4H趋势推演完成", 100);
        endScanner();
        const area = document.getElementById('result-area');
        area.style.display = 'flex';
        let html = '';

        html += `
            <div class="warning-box">
                ⚠️ <b>4H级别交易纪律：</b><br>
                请将杠杆降至 <b>3x - 5x</b>！此策略止损空间较大，必须严格挂好止损单，切勿扛单！
            </div>
        `;

        let bestPick = null;
        let bestType = '';
        if (longs.length > 0 && shorts.length > 0) {
            if (longs[0].longScore >= shorts[0].shortScore) { bestPick = longs[0]; bestType = 'LONG'; } 
            else { bestPick = shorts[0]; bestType = 'SHORT'; }
        } else if (longs.length > 0) { bestPick = longs[0]; bestType = 'LONG'; } 
        else if (shorts.length > 0) { bestPick = shorts[0]; bestType = 'SHORT'; }

        if (bestPick) {
            const dirText = bestType === 'LONG' ? '做多' : '做空';
            const cardClass = bestType === 'LONG' ? 'long' : 'short';
            const dirClass = bestType === 'LONG' ? 'long' : 'short';
            const reasons = bestType === 'LONG' ? bestPick.longReasons : bestPick.shortReasons;
            const score = bestType === 'LONG' ? bestPick.longScore : bestPick.shortScore;

            html += `
                <div class="best-pick-card ${cardClass}">
                    <div class="best-title">
                        <span>🏆 4H 最佳趋势推荐</span>
                        <span class="badge">综合评分 ${score} 分</span>
                    </div>
                    <div class="best-coin">
                        ${bestPick.instId.replace('-USDT-SWAP', '')} 
                        <span class="dir ${dirClass}">${dirText}</span>
                    </div>
                    
                    <div class="trade-box">
                        <div class="trade-item">
                            <span class="label">参考进场价</span>
                            <span class="val">${formatPrice(bestPick.price)}</span>
                        </div>
                        <div class="trade-item">
                            <span class="label">波段止损</span>
                            <span class="val sl">${formatPrice(bestPick.sl)} (-${bestPick.risk}%)</span>
                        </div>
                        <div class="trade-item">
                            <span class="label">目标止盈</span>
                            <span class="val tp">${formatPrice(bestPick.tp)} (1:3)</span>
                        </div>
                    </div>
                    
                    <div class="best-reasons">
                        <b>趋势触发逻辑：</b><br>
                        ${reasons.map(r => `✔ ${r}`).join('<br>')}
                        <br><br>
                        <span style="color:var(--sub); font-size:12px;">4H振幅：${bestPick.totalAmp.toFixed(1)}% (已确认非横盘/非妖币)</span>
                    </div>
                </div>
            `;
        } else {
            html += `
                <div class="empty-tip">
                    ⚠️ 当前无完美 4H 趋势机会<br>
                    全市场都在横盘震荡，或指标未形成共振。<br>
                    <b>建议：空仓等待大行情启动！</b>
                </div>
            `;
        }

        html += `<div class="section-title long">🟢 4H 多头备选 (Top 3)</div>`;
        if (longs.length === 0) html += `<div class="empty-tip">当前无符合的做多标的。</div>`;
        longs.slice(0, 3).forEach((item, index) => {
            html += `
                <details class="long-item">
                    <summary>
                        <div class="summary-left"><span class="coin-name">${index + 1}. ${item.instId.replace('-USDT-SWAP', '')}</span></div>
                        <div class="summary-right"><span class="score-badge">多分: ${item.longScore}</span><span class="arrow-icon">▼</span></div>
                    </summary>
                    <div class="detail-content">
                        <div class="analysis-row">
                            <span class="analysis-label">4H RSI / 振幅</span>
                            <span class="analysis-value" style="color:var(--yellow)">${item.rsi4h.toFixed(1)} / ${item.totalAmp.toFixed(1)}%</span>
                        </div>
                        <div>
                            <div class="analysis-label" style="margin-bottom: 5px;">核心得分点：</div>
                            ${item.longReasons.map(r => `<span class="reason-tag tag-long">✔ ${r}</span>`).join('')}
                        </div>
                    </div>
                </details>`;
        });

        html += `<div class="section-title short" style="margin-top:20px;">🔴 4H 空头备选 (Top 3)</div>`;
        if (shorts.length === 0) html += `<div class="empty-tip">当前无符合的做空标的。</div>`;
        shorts.slice(0, 3).forEach((item, index) => {
            html += `
                <details class="short-item">
                    <summary>
                        <div class="summary-left"><span class="coin-name">${index + 1}. ${item.instId.replace('-USDT-SWAP', '')}</span></div>
                        <div class="summary-right"><span class="score-badge">空分: ${item.shortScore}</span><span class="arrow-icon">▼</span></div>
                    </summary>
                    <div class="detail-content">
                        <div class="analysis-row">
                            <span class="analysis-label">4H RSI / 振幅</span>
                            <span class="analysis-value" style="color:var(--yellow)">${item.rsi4h.toFixed(1)} / ${item.totalAmp.toFixed(1)}%</span>
                        </div>
                        <div>
                            <div class="analysis-label" style="margin-bottom: 5px;">核心得分点：</div>
                            ${item.shortReasons.map(r => `<span class="reason-tag tag-short">✔ ${r}</span>`).join('')}
                        </div>
                    </div>
                </details>`;
        });

        area.innerHTML = html;
    }
</script>
</body>
</html>
